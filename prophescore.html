          var ids = res.meta.weekIds || [];
          if(!ids.length){ body.innerHTML = '<div class="pe-empty">No weeks set up yet.</div>'; return; }

          peLoadWeekStates(gid, res.year, res.meta, function(weeks){
            // Open-and-unpicked weeks first — those are the ones worth running
            // the board on. Everything else falls below, newest first.
            var open = weeks.filter(function(w){ return w.open; });
            var rest = weeks.filter(function(w){ return !w.open; }).reverse();

            function weekRow(w){
              var bits = [];
              if(!w.filled)            bits.push("no games set");
              else                     bits.push(w.filled + " games");
              if(w.filled && !w.spreads) bits.push("no spreads yet");
              if(w.myPicks)            bits.push(w.myPicks + " picks in");
              var badge = w.locked ? '<span class="pe-wtag lock">Locked</span>'
                        : w.open   ? '<span class="pe-wtag open">Open</span>'
                        : '';
              return '<button class="pe-opt" data-wid="' + x(w.id) + '"' + (w.filled ? '' : ' disabled style="opacity:.45"') + '>' +
                     '<div style="display:flex;align-items:center;gap:6px">' +
                       '<div style="font-size:12px;font-weight:900;color:var(--text);flex:1">' + x(w.label) + '</div>' + badge +
                     '</div>' +
                     '<div style="font-size:9px;font-weight:700;color:var(--muted);margin-top:1px">' + x(bits.join(" \u00b7 ")) + '</div>' +
                     '</button>';
            }

            var html = "";
            if(open.length){
              html += '<div class="pe-wsec">Ready to evaluate</div>' + open.map(weekRow).join("");
            }
            if(rest.length){
              html += '<div class="pe-wsec">Other weeks</div>' + rest.map(weekRow).join("");
            }
            body.innerHTML = html || '<div class="pe-empty">No weeks set up yet.</div>';

          Array.prototype.forEach.call(body.querySelectorAll("[data-wid]"), function(wb){
            wb.addEventListener("click", function(){
              var wid = this.getAttribute("data-wid");
              body.innerHTML = '<div class="pe-empty">Importing…</div>';
              peImportWeek(gid, res.year, wid, function(out){
                if(!out || !out.games.length){
                  body.innerHTML = '<div class="pe-empty">That week has no games filled in.</div>';
                  return;
                }
                PE.games = out.games;
                PE.meta = {
                  groupId: gid, weekId: wid,
                  label: (res.meta.weekLabels||{})[wid] || wid,
                  espnYear: res.year || new Date().getFullYear(),
                  espnWeek: (((res.meta.weekMeta||{})[wid]||{}).espnWeek) ||
                            (parseInt(String((res.meta.weekLabels||{})[wid]||wid).replace(/\D/g,""),10) || null)
                };
                peSave();
                el.remove();
                renderPoolEdge();
                var msg = "Imported " + out.games.length + " game" + (out.games.length===1?"":"s");
                if(out.pickem) msg += " · " + out.pickem + " pick'em";
                toast(msg, "ok");
              });
            });
          });
          });
        });
      });
    });
  });
}

// ── POOL EDGE: SCORE MODEL (experimental, unweighted) ────────────────────────
// Additive ratings: points = league average + offence(team) + defence(opponent)
// ± half the home edge, fitted to completed FBS-vs-FBS results.
//
// Two things are deliberately NOT fitted:
//   • Home edge is a SETTING, not a parameter. In September, home teams are
//     systematically stronger (P5 programmes buy home games), so a fitted home
//     edge absorbs their quality and rails at whatever ceiling it is given.
//     Confirmed: identical true edge of 2.4 fits to 3.4 on a balanced schedule
//     and rails at 5.0 when home teams are better.
//   • Everything else is exposed as a knob, because with this little data the
//     right settings are an empirical question, not something to hardcode.
//
// Kept OUT of the pick score. A rating model is what the market already prices.
var PEM = {
  ratings:null, prior:null, priorNames:null, avg:0, n:0, mae:null, holdout:null, cv:null,
  busy:false, weeks:0, dropped:0, priorSrc:"none", priorN:0, fbsSrc:"", nameMap:null, toStats:null,
  opts: {
    hfa:      2.5,   // points, fixed
    scale:    1.0,   // expands ratings back out after shrinkage
    oppW:     1.0,   // how hard to adjust for who the opponent was
    toAdj:    0.0,   // share of the turnover swing to regress away
    priorW:   0.55,  // 0 = results only, 1 = prior only
    lambda:   0.020, // shrinkage toward prior
    cap:      28,    // blowout margin cap
    recency:  0.0,   // 0 = all games equal, 1 = heavy tilt to recent
    lr: 0.035, epochs: 300
  }
};

var PEM_DEFAULTS = { hfa:2.5, scale:1.0, oppW:1.0, toAdj:0.0, priorW:0.55, lambda:0.020, cap:28, recency:0.0 };

function pemCapped(a, b, cap){
  var m = a - b;
  if(m >  cap) return [b + cap, b];
  if(m < -cap) return [a, a + cap];
  return [a, b];
}


// ── STORED PRIORS ───────────────────────────────────────────────────────────
// SP+ has no public API, so the paste is the supply line. Keeping it per week
// means it survives reloads and you only re-paste when new numbers publish.
// Slider positions are worth keeping — retuning from scratch every visit is
// exactly the friction that makes a tool annoying. Debounced so dragging does
// not write on every frame.
var _pemOptsTimer = null;
function pemSaveOpts(){
  PE.settings = {};
  for(var k in PEM.opts) PE.settings[k] = PEM.opts[k];
  if(_pemOptsTimer) clearTimeout(_pemOptsTimer);
  _pemOptsTimer = setTimeout(function(){ _pemOptsTimer = null; peSave(); }, 700);
}

function pemApplySavedOpts(){
  var s = PE.settings;
  if(!s) return false;
  // Only keys the model actually has, so a stale save cannot inject junk.
  for(var k in PEM.opts){
    if(typeof s[k] === "number" && isFinite(s[k])) PEM.opts[k] = s[k];
  }
  return true;
}

function pePriorKey(){
  var y = (PE.meta && PE.meta.espnYear) || new Date().getFullYear();
  var w = (PE.meta && PE.meta.espnWeek) || 0;
  return y + "-w" + w;
}

function pePriorLatest(preferKey){
  var st = PE.priors || {};
  if(preferKey && st[preferKey]) return { key: preferKey, e: st[preferKey] };
  var best = null;
  Object.keys(st).forEach(function(k){
    var e = st[k];
    if(!e) return;
    if(!best || (e.at||0) > (best.e.at||0)) best = { key:k, e:e };
  });
  return best;
}

function pePriorSave(text, ratingsById, matched, label){
  PE.priors = PE.priors || {};
  PE.priors[pePriorKey()] = {
    text: String(text||"").slice(0, 20000),
    r: ratingsById, at: Date.now(), n: matched, label: label || "SP+"
  };
  // Keep the last 8 weeks so the record does not grow without bound.
  var keys = Object.keys(PE.priors).sort(function(a,b){
    return (PE.priors[b].at||0) - (PE.priors[a].at||0);
  });
  keys.slice(8).forEach(function(k){ delete PE.priors[k]; });
  peSave();
}

function pePriorToModel(r){
  var out = {}, n = 0;
  for(var id in r){
    var v = Number(r[id]);
    if(isNaN(v)) continue;
    out[id] = { off: v/2, def: -v/2, fpi: v };
    n++;
  }
  return n ? out : null;
}

// Runs once the model has a name map, so re-parsing can pick up teams that
// could not be matched before that map existed.
function pemRestorePrior(){
  var hit = pePriorLatest(pePriorKey());
  if(!hit) return false;
  var e = hit.e, ratings = e.r;
  if(e.text && PEM.nameMap){
    var re = pemParsePaste(e.text, PEM.nameMap);
    if(re && re.matched >= (e.n || 0)){
      ratings = {};
      for(var id in re.prior) ratings[id] = re.prior[id].fpi;
      e.r = ratings; e.n = re.matched;
    }
  }
  var model = pePriorToModel(ratings || {});
  if(!model) return false;
  PEM.prior = model;
  PEM.priorN = Object.keys(model).length;
  PEM.priorSrc = (e.label || "SP+") + " \u00b7 " + hit.key;
  PEM.priorAt = e.at || null;
  PEM.priorStale = (hit.key !== pePriorKey());
  return true;
}

function pemFetchWeek(year, week, cb){
  var url = "https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard" +
            "?groups=80&limit=400&seasontype=2&year=" + year + "&week=" + week;
  fetch(url).then(function(r){ return r.json(); }).then(function(d){
    var out = [];
    ((d && d.events) || []).forEach(function(ev){
      var c = (ev.competitions||[])[0];
      if(!c) return;
      if(!(((c.status||{}).type||{}).completed)) return;
      var away=null, home=null;
      (c.competitors||[]).forEach(function(t){
        if(t.homeAway==="away") away=t; else if(t.homeAway==="home") home=t;
      });
      if(!away || !home) return;
      var as = parseInt(away.score,10), hs = parseInt(home.score,10);
      if(isNaN(as) || isNaN(hs)) return;
      out.push({
        eventId: String(ev.id||""),
        week: week,
        awayId: String((away.team||{}).id||""), homeId: String((home.team||{}).id||""),
        awayName: (away.team||{}).displayName || "", homeName: (home.team||{}).displayName || "",
        as: as, hs: hs, neutral: !!c.neutralSite
      });
    });
    cb(null, out);
  }).catch(function(e){ cb(e); });
}


// ── TURNOVER ADJUSTMENT ──────────────────────────────────────────────────────
// Turnovers are worth roughly 4.5 points of margin each, and turnover margin
// barely correlates from week to week — so it is luck baked into every final
// score the model learns from. Removing it lets the ratings reflect how teams
// actually played. Measured worth ~1 point of margin error at three games per
// team, and progressively less as the season fills in.
var PEM_TO_PTS = 4.5;

// Small concurrency pool — one box score per game is ~180 requests.
function pemPool(items, limit, worker, done){
  if(!items.length){ done(); return; }
  var i = 0, active = 0, finished = 0;
  function pump(){
    while(active < limit && i < items.length){
      active++;
      worker(items[i++], function(){
        active--; finished++;
        if(finished === items.length) done(); else pump();
      });
    }
  }
  pump();
}

// Pulls each side's giveaways out of a summary response. Prefers an explicit
// "turnovers" stat, falls back to fumbles lost + interceptions thrown.
function pemParseTurnovers(d){
  var teams = (((d||{}).boxscore||{}).teams) || [];
  var out = {};
  teams.forEach(function(t){
    var id = String(((t||{}).team||{}).id||"");
    if(!id) return;
    var stats = t.statistics || [];
    var tov = null, fum = null, ints = null;
    stats.forEach(function(s){
      var nm = String((s||{}).name || (s||{}).label || "").toLowerCase().replace(/[^a-z]/g,"");
      var v = parseFloat((s||{}).displayValue);
      if(isNaN(v)) return;
      if(nm === "turnovers" || nm === "totalturnovers") tov = v;
      else if(nm === "fumbleslost") fum = v;
      else if(nm === "interceptions" || nm === "interceptionsthrown") ints = v;
    });
    if(tov === null && (fum !== null || ints !== null)) tov = (fum||0) + (ints||0);
    if(tov !== null) out[id] = tov;
  });
  return Object.keys(out).length === 2 ? out : null;
}

// Paint cached turnovers onto a freshly fetched season before deciding what
// still needs downloading.
function pemApplyCachedTurnovers(games){
  var cache = PE.turnovers || {}, n = 0;
  games.forEach(function(g){
    if(!g.eventId) return;
    var v = cache[g.eventId];
    if(typeof v === "number"){ g.toMargin = v; n++; }
  });
  return n;
}

function pemCacheTurnovers(games){
  PE.turnovers = PE.turnovers || {};
  var n = 0;
  games.forEach(function(g){
    if(g.eventId && typeof g.toMargin === "number"){ PE.turnovers[g.eventId] = g.toMargin; n++; }
  });
  peSave();
  return n;
}

function pemFetchBoxScores(games, progress, cb){
  pemApplyCachedTurnovers(games);
  var todo = games.filter(function(g){ return g.eventId && g.toMargin === undefined; });
  var got = 0, tried = 0;
  pemPool(todo, 8, function(g, next){
    fetch("https://site.api.espn.com/apis/site/v2/sports/football/college-football/summary?event=" + g.eventId)
      .then(function(r){ return r.json(); })
      .then(function(d){
        var t = pemParseTurnovers(d);
        if(t && t[g.awayId] !== undefined && t[g.homeId] !== undefined){
          // Positive means the HOME side won the turnover battle.
          g.toMargin = t[g.awayId] - t[g.homeId];
          got++;
        } else {
          g.toMargin = null;
        }
        tried++;
        if(progress && (tried % 20 === 0)) progress(tried, todo.length);
        next();
      })
      .catch(function(){ g.toMargin = null; tried++; next(); });
  }, function(){
    var saved = pemCacheTurnovers(games);
    cb(null, { got: got, of: todo.length, cached: saved });
  });
}

// How much turnover luck is present, and how repeatable it is. Week-to-week
// correlation near zero is the evidence that it should be regressed away.
function pemTurnoverStats(games){
  var have = games.filter(function(g){ return typeof g.toMargin === "number"; });
  if(have.length < 10) return null;
  var byTeam = {};
  have.forEach(function(g){
    (byTeam[g.homeId] = byTeam[g.homeId] || []).push({ w:g.week, m: g.toMargin });
    (byTeam[g.awayId] = byTeam[g.awayId] || []).push({ w:g.week, m: -g.toMargin });
  });
  // Correlate each team's earlier games against its later ones.
  var xs = [], ys = [];
  for(var id in byTeam){
    var s = byTeam[id].slice().sort(function(a,b){ return a.w-b.w; });
    if(s.length < 2) continue;
    var half = Math.floor(s.length/2), a = 0, b = 0;
    for(var i=0;i<half;i++) a += s[i].m;
    for(var j=half;j<s.length;j++) b += s[j].m;
    xs.push(a/half); ys.push(b/(s.length-half));
  }
  var r = null;
  if(xs.length > 5){
    var n = xs.length, mx=0, my=0;
    xs.forEach(function(v){ mx+=v; }); mx/=n;
    ys.forEach(function(v){ my+=v; }); my/=n;
    var sxy=0,sxx=0,syy=0;
    for(var k=0;k<n;k++){ var dx=xs[k]-mx, dy=ys[k]-my; sxy+=dx*dy; sxx+=dx*dx; syy+=dy*dy; }
    if(sxx && syy) r = sxy/Math.sqrt(sxx*syy);
  }
  return { n: have.length, of: games.length, repeatability: r };
}

function pemFetchSeason(year, maxWeek, cb){
  var all = [], pending = maxWeek, failed = 0;
  for(var w=1; w<=maxWeek; w++){
    (function(wk){
      pemFetchWeek(year, wk, function(err, games){
        if(err) failed++; else all = all.concat(games);
        if(--pending === 0) cb(failed === maxWeek ? new Error("no data") : null, all);
      });
    })(w);
  }
}

// FBS whitelist — FCS visitors appear once, get shrunk toward average, and
// their blowout road losses get blamed on home field instead of class.
// Pull team id + display name out of whatever shape ESPN returns.
function pemReadTeams(d){
  var out = {};
  var leagues = (((d||{}).sports||[])[0]||{}).leagues || [];
  var lists = [];
  leagues.forEach(function(lg){ if(lg && lg.teams) lists.push(lg.teams); });
  if((d||{}).teams) lists.push(d.teams);
  if((d||{}).items) lists.push(d.items);
  lists.forEach(function(arr){
    (arr||[]).forEach(function(t){
      var tm = ((t||{}).team) || t || {};
      var id = String(tm.id||"");
      var nm = tm.displayName || tm.location || tm.name || tm.shortDisplayName || "";
      if(id && nm) out[id] = nm;
    });
  });
  return out;
}

// Names the board already knows. No network, always available after an import,
// and enough to match the teams actually on the slate.
function pemBoardNames(){
  var out = {};
  (PE.games||[]).forEach(function(g){
    if(!g.awayId || !g.homeId) return;
    if(g.favIsHome === true){ out[g.homeId] = g.fav; out[g.awayId] = g.dog; }
    else if(g.favIsHome === false){ out[g.awayId] = g.fav; out[g.homeId] = g.dog; }
  });
  return out;
}

// groups=80 gives the FBS whitelist. If that comes back thin the unfiltered
// list is tried for NAMES only — the whitelist stays null so the caller falls
// back to its appearance heuristic rather than treating FCS teams as FBS.
function pemFetchFbs(cb){
  var base = "https://site.api.espn.com/apis/site/v2/sports/football/college-football/teams";
  function absorb(names){
    if(!names) return 0;
    var k = Object.keys(names);
    if(!k.length) return 0;
    PEM.nameMap = PEM.nameMap || {};
    k.forEach(function(id){ PEM.nameMap[id] = names[id]; });
    return k.length;
  }
  // Seed from the board first so something is always there.
  absorb(pemBoardNames());

  fetch(base + "?groups=80&limit=900")
    .then(function(r){ return r.json(); })
    .then(function(d){
      var names = pemReadTeams(d);
      var n = absorb(names);
      if(n >= 100){
        var set = {}; Object.keys(names).forEach(function(id){ set[id] = 1; });
        cb(null, set); return;
      }
      // Thin or unexpected shape — try unfiltered, names only.
      fetch(base + "?limit=900")
        .then(function(r2){ return r2.json(); })
        .then(function(d2){ absorb(pemReadTeams(d2)); cb(null, null); })
        .catch(function(){ cb(null, null); });
    })
    .catch(function(){
      fetch(base + "?limit=900")
        .then(function(r2){ return r2.json(); })
        .then(function(d2){ absorb(pemReadTeams(d2)); cb(null, null); })
        .catch(function(){ cb(null, null); });
    });
}

// Team names are needed to match a ratings paste. Fetching the FBS list is one
// request, so pasting never has to wait on a full model build.
function pemNameCount(){ return PEM.nameMap ? Object.keys(PEM.nameMap).length : 0; }

function pemEnsureNameMap(cb){
  if(pemNameCount() >= 100){ cb(true); return; }
  // The board alone covers the teams on this week's slate.
  var seeded = pemBoardNames();
  if(Object.keys(seeded).length){
    PEM.nameMap = PEM.nameMap || {};
    for(var id in seeded) PEM.nameMap[id] = seeded[id];
  }
  pemFetchFbs(function(){ cb(pemNameCount() > 0); });
}

// ESPN's FPI. The core API usually hands back $ref stubs rather than values,
// so several response shapes are tried and the result is reported honestly
// rather than silently falling back to nothing.
function pemFetchFpi(year, cb){
  var urls = [
    "https://site.web.api.espn.com/apis/fitt/v3/sports/football/college-football/powerindex?region=us&lang=en&contentorigin=espn&limit=400&season=" + year,
    "https://sports.core.api.espn.com/v2/sports/football/leagues/college-football/seasons/" + year + "/powerindex?limit=400"
  ];
  var i = 0;
  function attempt(){
    if(i >= urls.length){ cb(null, null, "no endpoint returned inline values"); return; }
    var url = urls[i++];
    fetch(url).then(function(r){ return r.json(); }).then(function(d){
      var prior = pemParseFpi(d);
      if(prior && Object.keys(prior).length >= 50) cb(null, prior, url.indexOf("fitt") > 0 ? "ESPN FPI" : "ESPN FPI (core)");
      else attempt();
    }).catch(function(){ attempt(); });
  }
  attempt();
}

// Walks whatever shape came back looking for a team id paired with an FPI value.
function pemParseFpi(d){
  var prior = {};
  function teamIdFrom(o){
    if(!o) return "";
    if(o.team && o.team.id) return String(o.team.id);
    if(o.teamId) return String(o.teamId);
    var ref = (o.team && o.team.$ref) || o.$ref || "";
    var m = String(ref).match(/teams\/(\d+)/);
    return m ? m[1] : "";
  }
  function fpiFrom(o){
    var found = null;
    (o.categories||[]).forEach(function(cat){
      var names = cat.names || [];
      (cat.values||[]).forEach(function(v, idx){
        if(String(names[idx]||"").toLowerCase() === "fpi" && typeof v === "number") found = v;
      });
      (cat.stats||[]).forEach(function(s){
        if(String((s||{}).name||"").toLowerCase() === "fpi" && typeof s.value === "number") found = s.value;
      });
    });
    if(found === null && o.stats){
      (o.stats||[]).forEach(function(s){
        if(String((s||{}).name||"").toLowerCase() === "fpi" && typeof s.value === "number") found = s.value;
      });
    }
    return found;
  }
  var items = (d && (d.items || d.teams || d.powerindex)) || [];
  if(!items.length && d && d.entries) items = d.entries;
  items.forEach(function(it){
    var id = teamIdFrom(it);
    var f  = fpiFrom(it);
    if(id && f !== null) prior[id] = { off: f/2, def: -f/2, fpi: f };
  });
  return Object.keys(prior).length ? prior : null;
}

// Manual ratings paste. SP+ has no public API at all, so pasting is the only
// route to it — and it works when every endpoint fails.
// Accepts lines like "Georgia 22.5", "1. Georgia  22.5", "Georgia,22.5".
function pemParsePaste(text, nameMap){
  if(!nameMap) return null;
  var norm = function(s){ return String(s||"").toUpperCase().replace(/[^A-Z0-9]/g,""); };
  // Index every leading prefix, not just the full name: SP+ tables say
  // "Alabama", ESPN says "Alabama Crimson Tide". Short prefixes collide though
  // ("Texas" matches Texas, Texas A&M and Texas Tech), so a colliding key goes
  // to the team with the fewest words, which is reliably the base programme.
  var cand = {};
  for(var id in nameMap){
    var parts = String(nameMap[id]).split(/\s+/).filter(Boolean);
    for(var w = parts.length; w >= 1; w--){
      var key = norm(parts.slice(0, w).join(""));
      if(!key) continue;
      (cand[key] = cand[key] || []).push({ id: id, words: parts.length, exact: (w === parts.length) });
    }
  }
  var lookup = {};
  Object.keys(cand).forEach(function(key){
    var list = cand[key];
    // An exact full-name hit always wins its own key.
    var exact = list.filter(function(c){ return c.exact; });
    if(exact.length === 1){ lookup[key] = exact[0].id; return; }
    if(list.length === 1){ lookup[key] = list[0].id; return; }
    list.sort(function(a,b){ return a.words - b.words; });
    // Genuinely tied on length is ambiguous; leave it unmatched rather than guess.
    if(list[0].words < list[1].words) lookup[key] = list[0].id;
  });
  var prior = {}, matched = 0, missed = [];
  String(text||"").split(/\n/).forEach(function(line){
    if(!line.trim()) return;
    var m = line.match(/^\s*(?:\d+[.)]\s*)?(.+?)[\s,\t]+(-?\d+(?:\.\d+)?)\s*$/);
    if(!m) return;
    var name = m[1], val = parseFloat(m[2]);
    if(isNaN(val)) return;
    var key = norm(name), id = lookup[key];
    if(!id){
      // Try progressively shorter prefixes for "Georgia Bulldogs" style rows.
      var words = name.trim().split(/\s+/);
      for(var w = words.length; w > 0 && !id; w--) id = lookup[norm(words.slice(0,w).join(""))];
    }
    if(id){ prior[id] = { off: val/2, def: -val/2, fpi: val }; matched++; }
    else missed.push(name.trim());
  });
  return { prior: matched ? prior : null, matched: matched, missed: missed };
}

function pemFit(games, prior, o){
  o = o || PEM.opts;
  prior = prior || {};
  var lr = o.lr, lambda = o.lambda, epochs = o.epochs, cap = o.cap;
  var hfa = o.hfa;                         // fixed, never fitted
  var maxWeek = 1;
  games.forEach(function(g){ if(g.week > maxWeek) maxWeek = g.week; });

  var teams = {}, total = 0, n = 0;
  games.forEach(function(g){
    [g.awayId, g.homeId].forEach(function(id){
      if(!teams[id]){
        var p = prior[id];
        teams[id] = {
          off:  p ? p.off * o.priorW : 0,
          def:  p ? p.def * o.priorW : 0,
          pOff: p ? p.off * o.priorW : 0,
          pDef: p ? p.def * o.priorW : 0,
          hasPrior: !!p, games: 0
        };
      }
    });
    teams[g.awayId].games++; teams[g.homeId].games++;
    total += g.as + g.hs; n += 2;
    // Recency: 0 leaves every game equal, 1 roughly doubles the newest week
    // against the oldest.
    g._w = 1 + o.recency * ((g.week - 1) / Math.max(1, maxWeek - 1));
  });
  var avg = n ? total/n : 24;

  for(var ep=0; ep<epochs; ep++){
    games.forEach(function(g){
      // Strip the turnover swing before capping, so the cap applies to how the
      // teams actually played rather than to the luck on top of it.
      var rawA = g.as, rawH = g.hs;
      if(o.toAdj && typeof g.toMargin === "number" && g.toMargin !== 0){
        var swing = g.toMargin * PEM_TO_PTS * o.toAdj / 2;
        rawA = g.as + swing; rawH = g.hs - swing;
      }
      var sc = pemCapped(rawA, rawH, cap);
      var A = teams[g.awayId], H = teams[g.homeId];
      var edge = g.neutral ? 0 : hfa/2;
      var step = lr * g._w;
      // oppW scales how much the OPPONENT's rating shapes the expectation.
      // At 0 a rating is just raw points, and who you played is irrelevant.
      // At 1 it is a full opponent adjustment. Above 1, beating a good team
      // counts for extra.
      var ow = o.oppW;
      var aErr = sc[0] - (avg + A.off + ow * H.def - edge);
      var hErr = sc[1] - (avg + H.off + ow * A.def + edge);
      A.off += step * aErr;       H.def += step * aErr * ow;
      H.off += step * hErr;       A.def += step * hErr * ow;
    });
    for(var id in teams){
      var t = teams[id];
      var pull = lambda * (1 / Math.max(1, t.games)) * 4;
      t.off -= (t.off - t.pOff) * pull;
      t.def -= (t.def - t.pDef) * pull;
    }
  }

  // Shrinkage pulls every rating toward the prior, which systematically
  // COMPRESSES the gap between good and bad teams. Scaling back out is a
  // standard correction, not a fudge — but it is a knob, so it can be checked.
  if(o.scale && o.scale !== 1){
    for(var sid in teams){ teams[sid].off *= o.scale; teams[sid].def *= o.scale; }
  }

  var errSum = 0, cnt = 0;
  games.forEach(function(g){
    var p = pemPredictRaw(teams, avg, hfa, g.awayId, g.homeId, g.neutral, o.oppW);
    if(!p) return;
    errSum += Math.abs((p.home - p.away) - (g.hs - g.as)); cnt++;
  });
  var wks = {}; games.forEach(function(g){ wks[g.week] = 1; });
  return { ratings:teams, avg:avg, hfa:hfa, n:games.length,
           weeks:Object.keys(wks).length, mae: cnt ? errSum/cnt : null };
}

function pemPredictRaw(teams, avg, hfa, awayId, homeId, neutral, oppW){
  var A = teams[awayId], H = teams[homeId];
  if(!A || !H) return null;
  var ow = (oppW === undefined) ? 1 : oppW;
  var edge = neutral ? 0 : hfa/2;
  return { away: avg + A.off + ow * H.def - edge,
           home: avg + H.off + ow * A.def + edge };
}

function pemPredict(awayId, homeId, neutral){
  if(!PEM.ratings) return null;
  var p = pemPredictRaw(PEM.ratings, PEM.avg, PEM.opts.hfa, awayId, homeId, neutral, PEM.opts.oppW);
  if(!p) return null;
  return {
    away: Math.round(p.away*10)/10, home: Math.round(p.home*10)/10,
    margin: Math.round((p.home - p.away)*10)/10,
    total: Math.round((p.home + p.away)*10)/10
  };
}

// Fit on everything BEFORE the last week, predict that week cold. In-sample
// error always flatters a model. Baselines included because a model that can't
// beat "home team by 2.5" has earned nothing.
function pemHoldout(games, prior, o){
  var weeks = games.map(function(g){ return g.week; });
  if(!weeks.length) return null;
  var last = Math.max.apply(null, weeks);
  var train = games.filter(function(g){ return g.week < last; });
  var test  = games.filter(function(g){ return g.week === last; });
  if(train.length < 30 || !test.length) return null;

  var fit = pemFit(train, prior, o);
  var errs = [], flat = [], priErrs = [];
  test.forEach(function(g){
    var actual = g.hs - g.as;
    var p = pemPredictRaw(fit.ratings, fit.avg, o.hfa, g.awayId, g.homeId, g.neutral, o.oppW);
    if(p) errs.push(Math.abs((p.home - p.away) - actual));
    flat.push(Math.abs((g.neutral ? 0 : o.hfa) - actual));
    if(prior && prior[g.homeId] && prior[g.awayId]){
      var pm = (prior[g.homeId].fpi - prior[g.awayId].fpi) + (g.neutral ? 0 : o.hfa);
      priErrs.push(Math.abs(pm - actual));
    }
  });
  if(!errs.length) return null;
  var mean = function(a){ var s=0; a.forEach(function(v){ s+=v; }); return s/a.length; };
  var sorted = errs.slice().sort(function(a,b){ return a-b; });
  return {
    week: last, n: errs.length, trainN: train.length,
    mae: mean(errs), median: sorted[Math.floor(sorted.length/2)],
    within7: errs.filter(function(e){ return e<=7; }).length / errs.length,
    within14: errs.filter(function(e){ return e<=14; }).length / errs.length,
    baseFlat: flat.length ? mean(flat) : null,
    basePrior: priErrs.length ? mean(priErrs) : null
  };
}


// Rolling-origin cross-validation. A single holdout week is ~35 games, far too
// few to tune five knobs against — auto-tune on one week reliably picks grid
// edges, which is noise-fitting. This trains on everything before week w and
// tests on week w, for every w it can, then averages.
var PEM_CV_MAXFOLDS = 8;

// The weeks used as test folds. Bounded so cost stays linear in the season and
// so the score is not dominated by folds trained on one or two weeks of games.
function pemCVWeeks(games){
  var weeks = {};
  games.forEach(function(g){ weeks[g.week] = 1; });
  var ws = Object.keys(weeks).map(Number).sort(function(a,b){ return a-b; });
  return ws.length > PEM_CV_MAXFOLDS ? ws.slice(ws.length - PEM_CV_MAXFOLDS) : ws;
}

function pemCV(games, prior, o){
  var ws = pemCVWeeks(games);
  var errs = [], folds = 0;
  ws.forEach(function(w){
    var train = games.filter(function(g){ return g.week < w; });
    var test  = games.filter(function(g){ return g.week === w; });
    if(train.length < 30 || !test.length) return;
    var fit = pemFit(train, prior, o);
    var any = false;
    test.forEach(function(g){
      var p = pemPredictRaw(fit.ratings, fit.avg, o.hfa, g.awayId, g.homeId, g.neutral, o.oppW);
      if(!p) return;
      errs.push(Math.abs((p.home - p.away) - (g.hs - g.as)));
      any = true;
    });
    if(any) folds++;
  });
  if(!errs.length) return null;
  var s = 0; errs.forEach(function(e){ s += e; });
  var m = s/errs.length;
  // Standard error of the mean absolute error. Without this the panel invites
  // people to chase differences that are smaller than the measurement itself.
  var ss = 0; errs.forEach(function(e){ ss += (e-m)*(e-m); });
  var se = errs.length > 1 ? Math.sqrt(ss/(errs.length-1))/Math.sqrt(errs.length) : null;
  return { mae: m, n: errs.length, folds: folds, se: se };
}

// Same folds as pemCV, but keeps each game's error so two settings can be
// compared game by game. Paired beats unpaired here: both configs see the
// identical games, so the shared week-to-week luck cancels instead of drowning
// the difference.
function pemCVErrMap(games, prior, o){
  var ws = pemCVWeeks(games);
  var out = {};
  ws.forEach(function(w){
    var train = games.filter(function(g){ return g.week < w; });
    var test  = games.filter(function(g){ return g.week === w; });
    if(train.length < 30 || !test.length) return;
    var fit = pemFit(train, prior, o);
    test.forEach(function(g){
      var p = pemPredictRaw(fit.ratings, fit.avg, o.hfa, g.awayId, g.homeId, g.neutral, o.oppW);
      if(p) out[g.eventId] = Math.abs((p.home - p.away) - (g.hs - g.as));
    });
  });
  return out;
}

// Paired difference between two sets of per-game errors. This is the error bar
// that matters when comparing two settings: both saw the same games, so the
// week-to-week luck cancels. It runs roughly 8x tighter than the spread of the
// absolute score, and using the wrong one of the two is the difference between
// a tuner that chases noise and one that never moves at all.
function pemPairedDiff(ea, eb){
  var d = [];
  for(var id in ea){ if(eb[id] !== undefined) d.push(ea[id] - eb[id]); }
  if(d.length < 2) return null;
  var s = 0; d.forEach(function(v){ s += v; });
  var m = s/d.length;
  var ss = 0; d.forEach(function(v){ ss += (v-m)*(v-m); });
  var se = Math.sqrt(ss/(d.length-1))/Math.sqrt(d.length);
  return { d: m, se: se, n: d.length, t: se > 0 ? m/se : 0 };
}

// Negative d means `a` is better. Returns null when there is nothing to compare.
function pemCompare(a, b){
  if(!PEM._games || !PEM._games.length) return null;
  return pemPairedDiff(pemCVErrMap(PEM._games, PEM.prior, a),
                       pemCVErrMap(PEM._games, PEM.prior, b));
}

// One word for whether a difference is real. Two standard errors is the
// ordinary bar; below it, the honest answer is "cannot tell".
function pemVerdict(cmp){
  if(!cmp || !cmp.se) return { word:"\u2014", cls:"same", real:false };
  if(Math.abs(cmp.t) < 2) return { word:"within noise", cls:"same", real:false };
  return cmp.d < 0 ? { word:"better", cls:"good", real:true }
                   : { word:"worse",  cls:"bad",  real:true };
}

function pemBuild(cb){
  if(PEM.busy) return;
  PEM.busy = true;
  var year = (PE.meta && PE.meta.espnYear) || new Date().getFullYear();
  var upto = (PE.meta && PE.meta.espnWeek) ? Math.max(1, PE.meta.espnWeek - 1) : 4;

  pemFetchFbs(function(_e, fbsSet){
    pemFetchFpi(year, function(_e2, prior, why){
      pemFetchSeason(year, upto, function(err, games){
        PEM.busy = false;
        if(err || !games || !games.length){ cb && cb(err || new Error("no games")); return; }

        var before = games.length;
        if(fbsSet){
          games = games.filter(function(g){ return fbsSet[g.awayId] && fbsSet[g.homeId]; });
          PEM.fbsSrc = "ESPN team list";
        } else {
          var seen = {};
          games.forEach(function(g){ seen[g.awayId]=(seen[g.awayId]||0)+1; seen[g.homeId]=(seen[g.homeId]||0)+1; });
          games = games.filter(function(g){ return seen[g.awayId] >= 2 && seen[g.homeId] >= 2; });
          PEM.fbsSrc = "appearance heuristic";
        }
        PEM.dropped = before - games.length;

        // Name map powers the manual ratings paste.
        var nm = {};
        games.forEach(function(g){ nm[g.awayId] = g.awayName; nm[g.homeId] = g.homeName; });
        PEM.nameMap = nm;

        PEM.prior = prior || null;
        PEM.priorN = prior ? Object.keys(prior).length : 0;
        PEM.priorSrc = prior ? "ESPN FPI" : ("unavailable — " + (why || "fetch failed"));
        PEM.priorAt = null; PEM.priorStale = false;
        PEM._fpi = prior || null;
        PEM._games = games;
        // Turnovers already downloaded are reused; only new games cost anything.
        pemApplySavedOpts();
        if(pemApplyCachedTurnovers(games)) PEM.toStats = pemTurnoverStats(games);
        // A pasted prior is the deliberate choice, so it wins over a live fetch.
        pemRestorePrior();
        if(PEM.prior && !PEM.opts.priorW) PEM.opts.priorW = 0.55;

        if(!games.length){ cb && cb(new Error("no FBS games")); return; }
        pemRefit();
        pemCacheSeason(year, upto);
        cb && cb(null, PEM);
      });
    });
  });
}

// Refit from cached games — what every slider calls. No network.
function pemRefit(){
  if(!PEM._games || !PEM._games.length) return false;
  var fit = pemFit(PEM._games, PEM.prior, PEM.opts);
  PEM.ratings = fit.ratings; PEM.avg = fit.avg;
  PEM.n = fit.n; PEM.mae = fit.mae; PEM.weeks = fit.weeks;
  PEM.holdout = pemHoldout(PEM._games, PEM.prior, PEM.opts);
  PEM.cv = pemCV(PEM._games, PEM.prior, PEM.opts);
  return true;
}

// ── SEASON CACHE ────────────────────────────────────────────────────────────
// pemBuild costs a team list, an FPI pull and one scoreboard request per week,
// which is why the model used to vanish on every reload. The fit itself is
// local and fast, so the thing worth storing is its input. Games go out as
// fixed-position arrays rather than objects — same data, roughly a third of
// the bytes, which matters for a single Firebase node.
var PE_SEASON_V = 1;

function pemCacheSeason(year, upto){
  var games = PEM._games;
  if(!games || !games.length) return false;
  var g = new Array(games.length);
  for(var i=0;i<games.length;i++){
    var q = games[i];
    g[i] = [ String(q.eventId||""), q.week|0, String(q.awayId||""), String(q.homeId||""),
             q.as|0, q.hs|0, q.neutral ? 1 : 0 ];
  }
  PE.season = {
    v: PE_SEASON_V,
    year: year|0,
    upto: upto|0,
    g: g,
    names: PEM.nameMap || null,
    // One number per team is all pePriorToModel needs, so the whole FPI table
    // costs about 2 KB and the restore does not have to go back to ESPN.
    fpi: (function(){
      var f = PEM._fpi; if(!f) return null;
      var o = {}, k = 0;
      for(var id in f){ var v = f[id] && f[id].fpi; if(typeof v === "number" && isFinite(v)){ o[id] = v; k++; } }
      return k ? o : null;
    })(),
    dropped: PEM.dropped|0,
    fbsSrc: PEM.fbsSrc || "",
    at: Date.now()
  };
  peSave();
  return true;
}

// Rebuilds PEM from the cache with no network at all. Turnovers and the pasted
// prior are re-applied from their own stores, so a refit here is identical to
// the one pemBuild would produce.
function pemRestoreSeason(){
  var s = PE.season;
  if(!s || s.v !== PE_SEASON_V || !s.g || !s.g.length) return false;
  var nm = s.names || {};
  var games = new Array(s.g.length);
  for(var i=0;i<s.g.length;i++){
    var r = s.g[i];
    if(!r || r.length < 7) return false;
    var aid = String(r[2]), hid = String(r[3]);
    games[i] = {
      eventId: String(r[0]), week: r[1]|0,
      awayId: aid, homeId: hid,
      awayName: nm[aid] || aid, homeName: nm[hid] || hid,
      as: r[4]|0, hs: r[5]|0, neutral: !!r[6]
    };
  }
  PEM._games  = games;
  PEM.nameMap = s.names || null;
  PEM.dropped = s.dropped|0;
  PEM.fbsSrc  = s.fbsSrc || "";
  PEM.priorSrc = "none"; PEM.priorN = 0; PEM.prior = null; PEM._fpi = null;
  if(s.fpi){
    var fm = pePriorToModel(s.fpi);
    if(fm){
      PEM._fpi = fm; PEM.prior = fm;
      PEM.priorN = Object.keys(fm).length;
      PEM.priorSrc = "ESPN FPI \u00b7 saved";
    }
  }
  if(pemApplyCachedTurnovers(games)) PEM.toStats = pemTurnoverStats(games);
  // A pasted rating sheet is the deliberate choice, so it still wins.
  pemRestorePrior();
  if(PEM.prior && !PEM.opts.priorW) PEM.opts.priorW = 0.55;
  return pemRefit();
}

// True once the season has moved past what the cache holds. The model still
// works, it is just missing a week.
function pemSeasonStale(){
  var s = PE.season;
  if(!s || !s.upto) return false;
  var wk = PE.meta && PE.meta.espnWeek;
  var yr = PE.meta && PE.meta.espnYear;
  if(yr && s.year && yr !== s.year) return true;
  if(!wk) return false;
  return (wk - 1) > s.upto;
}

// Sweep one knob across its range and report holdout MAE at each stop, so the
// best setting can be read off rather than guessed at by dragging.
function pemSweep(key, values, wantErrs){
  if(!PEM._games) return null;
  var saved = PEM.opts[key], out = [];
  values.forEach(function(v){
    PEM.opts[key] = v;
    if(wantErrs){
      // Derive the mean from the same pass rather than fitting twice.
      var em = pemCVErrMap(PEM._games, PEM.prior, PEM.opts);
      var ks = Object.keys(em), s = 0;
      for(var i=0;i<ks.length;i++) s += em[ks[i]];
      out.push({ v:v, mae: ks.length ? s/ks.length : null, errs: em });
    } else {
      var cvr = pemCV(PEM._games, PEM.prior, PEM.opts);
      out.push({ v:v, mae: cvr ? cvr.mae : null });
    }
  });
  PEM.opts[key] = saved;
  return out;
}

function pemLogHtml(){
  if(!PEM.cv) return "";
  var h = '<div class="pem-hd">Tuning log</div>';

  // Baseline first \u2014 it is the thing everything else is measured against.
  if(PE.baseline){
    var sameData = (PE.baseline.n === PEM.cv.n);
    var cmp = pemCompare(pemOptsSnapshot(), PE.baseline.opts);
    var vd  = pemVerdict(cmp);
    var chg = pemOptsDiff(pemOptsSnapshot(), PE.baseline.opts);
    h += '<div class="pem-base">';
    h += '<div class="pem-baserow"><span>Baseline</span><b>' + PE.baseline.mae.toFixed(1) +
         (PE.baseline.se ? ' \u00b1 ' + PE.baseline.se.toFixed(1) : '') + '</b></div>';
    h += '<div class="pem-baserow"><span>Right now</span><b>' + PEM.cv.mae.toFixed(1) +
         (PEM.cv.se ? ' \u00b1 ' + PEM.cv.se.toFixed(1) : '') + '</b></div>';
    if(cmp){
      h += '<div class="pem-baserow"><span>Difference</span><b class="' + vd.cls + '">' +
           (cmp.d > 0 ? '+' : '') + cmp.d.toFixed(2) + ' \u00b1 ' + cmp.se.toFixed(2) +
           ' \u00b7 ' + vd.word + '</b></div>';
      h += '<div class="pe-note" style="margin-top:4px">' + (vd.real
        ? ('Measured game by game on the same ' + cmp.n + ' games, so this one is real.')
        : ('Compared game by game on the same ' + cmp.n + ' games. The gap is smaller than its own error bar \u2014 these two settings are not distinguishable with the data on hand.')) + '</div>';
    }
    if(!sameData){
      h += '<div class="pem-stale">The baseline was set on <b>' + PE.baseline.n +
           '</b> games; the model now scores on <b>' + PEM.cv.n + '</b>. ' +
           'Its stored number is not comparable to today\u2019s \u2014 the season moved, not the settings. ' +
           'The difference above is still valid, because it refits the baseline settings on the current games.' +
           '<button class="btn btn-ghost btn-sm" id="pem-rebase" style="margin-top:6px">Re-score baseline on today\u2019s games</button></div>';
    }
    h += '<div class="pem-basechg">' + (chg.length
      ? ('Changed since baseline: <b>' + x(chg.join(", ")) + '</b>')
      : 'Identical to baseline.') + '</div>';
    h += '<button class="btn btn-ghost btn-sm" id="pem-tobase" style="margin-top:6px">Back to baseline</button>';
    h += '</div>';
  } else {
    h += '<div class="pe-note" style="margin-top:0">No baseline pinned. Set one and every later change gets measured against the same fixed reference instead of against whatever was loaded last.</div>';
  }

  var runs = PE.runs || [];
  if(!runs.length){
    h += '<div class="pe-note">Nothing logged yet. <b>Log this run</b> writes the current settings and score down so the next change has something to beat.</div>';
    return h;
  }

  h += '<div class="pem-runs">';
  runs.forEach(function(r, i){
    var chg = pemOptsDiff(r.opts);
    var d = new Date(r.at);
    h += '<div class="pem-run" data-pem-run="' + i + '">';
    h += '<div class="pem-runtop"><b>' + x(r.label) + '</b>' +
         '<span>' + r.mae.toFixed(1) + (r.se ? ' \u00b1 ' + r.se.toFixed(1) : '') + '</span></div>';
    h += '<div class="pem-runsub">' + d.toLocaleDateString(undefined,{month:"short",day:"numeric"}) +
         ' \u00b7 ' + r.n + ' games' + (r.upto ? ' \u00b7 thru wk ' + r.upto : '');
    if(r.vsBase){
      var real = Math.abs(r.vsBase.t) >= 2;
      h += ' \u00b7 <b class="' + (real ? (r.vsBase.d < 0 ? "good" : "bad") : "same") + '">' +
           (r.vsBase.d > 0 ? '+' : '') + r.vsBase.d.toFixed(2) + ' vs base' +
           (real ? '' : ' (noise)') + '</b>';
    }
    // Two runs from different weeks are two different measurements.
    if(PEM.cv && r.n !== PEM.cv.n) h += ' \u00b7 <span class="pem-otherdata">other data</span>';
    h += '</div>';
    h += '<div class="pem-runchg">' + (chg.length ? x(chg.join(", ")) : "all defaults") + '</div>';
    h += '<button class="btn btn-ghost btn-sm pem-restore" data-pem-run="' + i + '">Load these</button>';
    h += '</div>';
  });
  h += '</div>';
  h += '<div class="pe-note">Kept on this account, so the log survives a reload and follows you between devices.</div>';
  return h;
}

// ── TUNING LOG ──────────────────────────────────────────────────────────────
// A settings change is only an improvement if it survives being written down
// and compared against a fixed reference. Both live in PE so they persist.
var PE_RUNS_MAX = 24;

function pemOptsSnapshot(){
  var o = {};
  for(var k in PEM_DEFAULTS) if(typeof PEM.opts[k] === "number") o[k] = PEM.opts[k];
  return o;
}

// Only the knobs that were actually moved, so a row reads at a glance.
function pemOptsDiff(o, ref){
  ref = ref || PEM_DEFAULTS;
  var out = [];
  for(var k in PEM_DEFAULTS){
    var a = o[k], b = ref[k];
    if(typeof a !== "number" || typeof b !== "number") continue;
    if(Math.abs(a-b) > 1e-9) out.push(k + " " + (Math.round(a*100)/100));
  }
  return out;
}

function pemApplyOpts(o){
  if(!o) return false;
  for(var k in PEM_DEFAULTS) if(typeof o[k] === "number" && isFinite(o[k])) PEM.opts[k] = o[k];
  pemSaveOpts();
  return pemRefit();
}

function pemLogRun(label){
  if(!PEM._games || !PEM.cv) return false;
  PE.runs = PE.runs || [];
  var snap = pemOptsSnapshot();
  var cmp  = PE.baseline ? pemCompare(snap, PE.baseline.opts) : null;
  PE.runs.unshift({
    at: Date.now(),
    label: String(label || "manual").slice(0, 40),
    opts: snap,
    mae: Math.round(PEM.cv.mae*100)/100,
    se:  PEM.cv.se ? Math.round(PEM.cv.se*100)/100 : null,
    n: PEM.cv.n, folds: PEM.cv.folds,
    upto: (PE.season && PE.season.upto) || null,
    vsBase: cmp ? { d: Math.round(cmp.d*100)/100, se: Math.round(cmp.se*100)/100, t: Math.round(cmp.t*100)/100 } : null
  });
  if(PE.runs.length > PE_RUNS_MAX) PE.runs.length = PE_RUNS_MAX;
  peSave();
  return true;
}

function pemSetBaseline(){
  if(!PEM.cv) return false;
  PE.baseline = {
    at: Date.now(), opts: pemOptsSnapshot(),
    mae: Math.round(PEM.cv.mae*100)/100,
    se: PEM.cv.se ? Math.round(PEM.cv.se*100)/100 : null,
    n: PEM.cv.n, upto: (PE.season && PE.season.upto) || null
  };
  peSave();
  return true;
}

// ── POOL EDGE: SCORE MODEL PANEL ─────────────────────────────────────────────
// Knob definitions live in one place so adding another is a single entry.
var PEM_KNOBS = [
  { key:"hfa",     label:"Home edge",      min:0,   max:6,    step:0.25, fmt:function(v){ return v.toFixed(2) + " pts"; },
    lo:"none", hi:"6 pts",
    help:"A setting, not a fitted value — in September home teams are genuinely stronger, so fitting this absorbs their quality." },
  { key:"scale",   label:"Rating spread",   min:0.5, max:2.5,  step:0.05, fmt:function(v){ return v.toFixed(2) + "x"; },
    lo:"compressed", hi:"expanded",
    help:"Shrinkage squashes good and bad teams toward each other. Above 1 pushes them back apart. If the model calls every game close, raise this." },
  { key:"oppW",    label:"Opponent weight", min:0,   max:2,    step:0.05, fmt:function(v){ return v.toFixed(2) + "x"; },
    lo:"raw points", hi:"who you played matters most",
    help:"How much the opponent's quality shapes a rating. At 0 a 40-point game counts the same against anyone. At 1 it is a full opponent adjustment. Above 1, beating a good team counts extra." },
  { key:"toAdj",   label:"Turnover regression", min:0, max:1, step:0.05, fmt:function(v){ return Math.round(v*100) + "%"; },
    lo:"keep as played", hi:"strip it out",
    help:"Turnovers swing about 4.5 pts of margin each and barely repeat week to week. This removes that luck from the scores the ratings are fitted to. Needs box scores \u2014 use Load turnovers." },
  { key:"priorW",  label:"Trust in prior", min:0,   max:1,    step:0.05, fmt:function(v){ return Math.round(v*100) + "%"; },
    lo:"results only", hi:"prior only",
    help:"How far each team starts from, and is pulled back toward, its external rating." },
  { key:"lambda",  label:"Shrinkage",      min:0,   max:0.08, step:0.005, fmt:function(v){ return (v*100).toFixed(1) + "%"; },
    lo:"trust results", hi:"heavy pull",
    help:"How hard thin samples get pulled back. Higher means a 2-game team stays near its prior." },
  { key:"cap",     label:"Blowout cap",    min:10,  max:45,   step:1,    fmt:function(v){ return v + " pts"; },
    lo:"10", hi:"45",
    help:"Margins above this are trimmed, so a 63-7 counts as a big win rather than a freak one." },
  { key:"recency", label:"Recency tilt",   min:0,   max:1,    step:0.05, fmt:function(v){ return Math.round(v*100) + "%"; },
    lo:"all equal", hi:"recent games count double",
    help:"Weights later weeks more heavily than week 1." }
];

// How closely the model's scale matches the market's. A slope well under 1
// means the model squashes everything toward a pick'em, which reads as
// "backwards" whenever a short line flips sign.
function pemScaleCheck(){
  var xs = [], ys = [];
  PE.games.forEach(function(g){
    if(!g.awayId || !g.homeId) return;
    var p = pemPredict(g.awayId, g.homeId, false);
    if(!p) return;
    var fm = (g.favIsHome === false) ? (p.away - p.home) : (p.home - p.away);
    xs.push(g.mkt); ys.push(fm);
  });
  if(xs.length < 4) return null;
  var n = xs.length, mx = 0, my = 0;
  xs.forEach(function(v){ mx += v; }); mx /= n;
  ys.forEach(function(v){ my += v; }); my /= n;
  var sxy = 0, sxx = 0;
  for(var i=0;i<n;i++){ sxy += (xs[i]-mx)*(ys[i]-my); sxx += (xs[i]-mx)*(xs[i]-mx); }
  if(!sxx) return null;
  return { slope: sxy/sxx, n: n };
}

// Strength of schedule faced, per team, in points. This is what "who was it
// against" looks like once the model has been fitted: the average quality of
// the opponents a team has already played.
function pemSOS(){
  if(!PEM.ratings || !PEM._games) return null;
  var rate = function(t){ return t ? (t.off - t.def) : null; };
  var faced = {};
  PEM._games.forEach(function(g){
    var A = PEM.ratings[g.awayId], H = PEM.ratings[g.homeId];
    if(!A || !H) return;
    (faced[g.awayId] = faced[g.awayId] || []).push(rate(H));
    (faced[g.homeId] = faced[g.homeId] || []).push(rate(A));
  });
  var out = [], seen = {};
  PE.games.forEach(function(g){
    [[g.fav, g.favIsHome === false ? g.awayId : g.homeId],
     [g.dog, g.favIsHome === false ? g.homeId : g.awayId]].forEach(function(pair){
      var name = pair[0], id = pair[1];
      if(!id || seen[id]) return;
      seen[id] = 1;
      var t = PEM.ratings[id]; if(!t) return;
      var f = faced[id] || [];
      var s = 0; f.forEach(function(v){ s += v; });
      out.push({ name:name, rating: rate(t), sos: f.length ? s/f.length : 0, n: f.length });
    });
  });
  if(!out.length) return null;
  out.sort(function(a,b){ return b.sos - a.sos; });
  return out;
}

function pemPanelHtml(){
