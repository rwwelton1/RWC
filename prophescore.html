// The box score request was already being made for one number. Everything else
// in the response was thrown away. Yardage and efficiency are measured far more
// precisely than the final score \u2014 a team can outgain an opponent by 200 yards
// and lose on two returned fumbles \u2014 so a season log built on them says more
// about how a team is playing than the scoreboard does.
//
// ESPN is not consistent about stat names across seasons, so every field tries
// several spellings and falls back to deriving the value. pemStatCoverage then
// reports what actually parsed, because a stat that silently fails to land is
// worse than one that is missing outright.
var PEM_STAT_KEYS = ["yards","plays","ypp","first","td3m","td3a","pen","penYds","poss","to"];

function pemNum(v){
  var n = parseFloat(String(v === undefined || v === null ? "" : v).replace(/[^0-9.\-]/g, ""));
  return isFinite(n) ? n : null;
}
// "5-14" -> [5,14];  "7-65" -> [7,65]
function pemPair(v){
  var m = String(v||"").match(/(-?\d+)\s*[-\/]\s*(-?\d+)/);
  return m ? [parseFloat(m[1]), parseFloat(m[2])] : null;
}
// "31:24" -> 1884 seconds
function pemClock(v){
  var m = String(v||"").match(/(\d+):(\d+)/);
  return m ? (parseInt(m[1],10)*60 + parseInt(m[2],10)) : null;
}

function pemParseTeamStats(d){
  var teams = (((d||{}).boxscore||{}).teams) || [];
  var out = {}, seen = 0;
  teams.forEach(function(t){
    var id = String(((t||{}).team||{}).id||"");
    if(!id) return;
    var by = {};
    ((t||{}).statistics||[]).forEach(function(s){
      var nm = String((s||{}).name || (s||{}).label || "").toLowerCase().replace(/[^a-z0-9]/g,"");
      if(nm) by[nm] = (s||{}).displayValue;
    });
    function pick(){
      for(var i=0;i<arguments.length;i++){
        var k = arguments[i];
        if(by[k] !== undefined && by[k] !== null && by[k] !== "") return by[k];
      }
      return null;
    }
    var r = {};
    r.yards = pemNum(pick("totalyards","totalnetyards","netyards"));
    r.plays = pemNum(pick("totaloffensiveplays","offensiveplays","totalplays","plays"));
    r.ypp   = pemNum(pick("yardsperplay","avgyardsperplay","yardspergame"));
    if(r.ypp === null && r.yards !== null && r.plays) r.ypp = Math.round((r.yards/r.plays)*100)/100;
    r.first = pemNum(pick("firstdowns","totalfirstdowns"));
    var th = pemPair(pick("thirddowneff","thirddownefficiency","thirddowns"));
    r.td3m = th ? th[0] : null;
    r.td3a = th ? th[1] : null;
    var pn = pemPair(pick("totalpenaltiesyards","penaltiesyards","penalties"));
    r.pen    = pn ? pn[0] : pemNum(pick("penalties"));
    r.penYds = pn ? pn[1] : pemNum(pick("penaltyyards"));
    r.poss = pemClock(pick("possessiontime","timeofpossession"));
    var tov = pemNum(pick("turnovers","totalturnovers"));
    if(tov === null){
      var f = pemNum(pick("fumbleslost")), i2 = pemNum(pick("interceptions","interceptionsthrown"));
      if(f !== null || i2 !== null) tov = (f||0) + (i2||0);
    }
    r.to = tov;
    var any = false;
    PEM_STAT_KEYS.forEach(function(k){ if(r[k] !== null && r[k] !== undefined) any = true; });
    if(any){ out[id] = r; seen++; }
  });
  return seen === 2 ? out : null;
}

// Fixed-position arrays: a third of the bytes of named keys, and this node sits
// next to the season cache in one Firebase record.
function pemStatsPack(r){
  return PEM_STAT_KEYS.map(function(k){
    var v = r[k];
    return (typeof v === "number" && isFinite(v)) ? v : null;
  });
}
function pemStatsUnpack(a){
  if(!a || !a.length) return null;
  var r = {};
  PEM_STAT_KEYS.forEach(function(k,i){ r[k] = (typeof a[i] === "number") ? a[i] : null; });
  return r;
}

// Hang the stored line on each game so everything downstream reads one shape.
function pemApplyCachedStats(games){
  var cache = PE.teamstats || {}, n = 0;
  games.forEach(function(g){
    if(!g.eventId) return;
    var e = cache[g.eventId];
    if(!e) return;
    var a = pemStatsUnpack(e.a), h = pemStatsUnpack(e.h);
    if(a || h){ g.statAway = a; g.statHome = h; n++; }
  });
  return n;
}

function pemCacheStats(games){
  PE.teamstats = PE.teamstats || {};
  var n = 0;
  games.forEach(function(g){
    if(!g.eventId || (!g.statAway && !g.statHome)) return;
    PE.teamstats[g.eventId] = { a: pemStatsPack(g.statAway||{}), h: pemStatsPack(g.statHome||{}) };
    n++;
  });
  return n;
}

// What actually parsed, field by field. A zero here is the signal that ESPN
// renamed something \u2014 without it the failure is invisible.
function pemStatCoverage(games){
  var have = {}, total = 0;
  PEM_STAT_KEYS.forEach(function(k){ have[k] = 0; });
  games.forEach(function(g){
    if(!g.statAway && !g.statHome) return;
    total++;
    PEM_STAT_KEYS.forEach(function(k){
      var a = g.statAway && g.statAway[k], h = g.statHome && g.statHome[k];
      if(typeof a === "number" || typeof h === "number") have[k]++;
    });
  });
  return { total: total, have: have };
}

// Paint cached turnovers onto a freshly fetched season before deciding what
// still needs downloading.
function pemApplyCachedTurnovers(games){
  var cache = PE.turnovers || {}, n = 0;
  games.forEach(function(g){
    if(!g.eventId) return;
    var v = cache[g.eventId];
    if(typeof v === "number"){ g.toMargin = v; n++; }
  });
  return n;
}

function pemCacheTurnovers(games){
  PE.turnovers = PE.turnovers || {};
  var n = 0;
  games.forEach(function(g){
    if(g.eventId && typeof g.toMargin === "number"){ PE.turnovers[g.eventId] = g.toMargin; n++; }
  });
  peSave();
  return n;
}

function pemFetchBoxScores(games, progress, cb){
  pemApplyCachedTurnovers(games);
  pemApplyCachedStats(games);
  // One request per game already covered turnovers. A game needs fetching if
  // either piece is missing, so a season logged before stat lines existed fills
  // itself in on the next run instead of starting over.
  var todo = games.filter(function(g){
    return g.eventId && (g.toMargin === undefined || (!g.statAway && !g.statHome));
  });
  var got = 0, gotStats = 0, tried = 0;
  pemPool(todo, 8, function(g, next){
    fetch("https://site.api.espn.com/apis/site/v2/sports/football/college-football/summary?event=" + g.eventId)
      .then(function(r){ return r.json(); })
      .then(function(d){
        var t = pemParseTurnovers(d);
        if(t && t[g.awayId] !== undefined && t[g.homeId] !== undefined){
          // Positive means the HOME side won the turnover battle.
          g.toMargin = t[g.awayId] - t[g.homeId];
          got++;
        } else if(g.toMargin === undefined){
          g.toMargin = null;
        }
        // The rest of the same response \u2014 free.
        PE.lines = PE.lines || {};
        if(PE.lines[g.eventId] === undefined) PE.lines[g.eventId] = pemParseLine(d);
        var st = pemParseTeamStats(d);
        if(st && st[g.awayId] && st[g.homeId]){
          g.statAway = st[g.awayId];
          g.statHome = st[g.homeId];
          gotStats++;
        }
        tried++;
        if(progress && (tried % 20 === 0)) progress(tried, todo.length);
        next();
      })
      .catch(function(){ if(g.toMargin === undefined) g.toMargin = null; tried++; next(); });
  }, function(){
    var saved = pemCacheTurnovers(games);
    var savedStats = pemCacheStats(games);
    peSave();
    cb(null, { got: got, of: todo.length, cached: saved, stats: gotStats, statsCached: savedStats });
  });
}

// How much turnover luck is present, and how repeatable it is. Week-to-week
// correlation near zero is the evidence that it should be regressed away.
function pemTurnoverStats(games){
  var have = games.filter(function(g){ return typeof g.toMargin === "number"; });
  if(have.length < 10) return null;
  var byTeam = {};
  have.forEach(function(g){
    (byTeam[g.homeId] = byTeam[g.homeId] || []).push({ w:g.week, m: g.toMargin });
    (byTeam[g.awayId] = byTeam[g.awayId] || []).push({ w:g.week, m: -g.toMargin });
  });
  // Correlate each team's earlier games against its later ones.
  var xs = [], ys = [];
  for(var id in byTeam){
    var s = byTeam[id].slice().sort(function(a,b){ return a.w-b.w; });
    if(s.length < 2) continue;
    var half = Math.floor(s.length/2), a = 0, b = 0;
    for(var i=0;i<half;i++) a += s[i].m;
    for(var j=half;j<s.length;j++) b += s[j].m;
    xs.push(a/half); ys.push(b/(s.length-half));
  }
  var r = null;
  if(xs.length > 5){
    var n = xs.length, mx=0, my=0;
    xs.forEach(function(v){ mx+=v; }); mx/=n;
    ys.forEach(function(v){ my+=v; }); my/=n;
    var sxy=0,sxx=0,syy=0;
    for(var k=0;k<n;k++){ var dx=xs[k]-mx, dy=ys[k]-my; sxy+=dx*dy; sxx+=dx*dx; syy+=dy*dy; }
    if(sxx && syy) r = sxy/Math.sqrt(sxx*syy);
  }
  return { n: have.length, of: games.length, repeatability: r };
}

function pemFetchSeason(year, maxWeek, cb){
  var all = [], pending = maxWeek, failed = 0;
  for(var w=1; w<=maxWeek; w++){
    (function(wk){
      pemFetchWeek(year, wk, function(err, games){
        if(err) failed++; else all = all.concat(games);
        if(--pending === 0) cb(failed === maxWeek ? new Error("no data") : null, all);
      });
    })(w);
  }
}

// FBS whitelist — FCS visitors appear once, get shrunk toward average, and
// their blowout road losses get blamed on home field instead of class.
// Pull team id + display name out of whatever shape ESPN returns.
function pemReadTeams(d){
  var out = {};
  var leagues = (((d||{}).sports||[])[0]||{}).leagues || [];
  var lists = [];
  leagues.forEach(function(lg){ if(lg && lg.teams) lists.push(lg.teams); });
  if((d||{}).teams) lists.push(d.teams);
  if((d||{}).items) lists.push(d.items);
  lists.forEach(function(arr){
    (arr||[]).forEach(function(t){
      var tm = ((t||{}).team) || t || {};
      var id = String(tm.id||"");
      var nm = tm.displayName || tm.location || tm.name || tm.shortDisplayName || "";
      if(id && nm) out[id] = nm;
    });
  });
  return out;
}

// Names the board already knows. No network, always available after an import,
// and enough to match the teams actually on the slate.
function pemBoardNames(){
  var out = {};
  (PE.games||[]).forEach(function(g){
    if(!g.awayId || !g.homeId) return;
    if(g.favIsHome === true){ out[g.homeId] = g.fav; out[g.awayId] = g.dog; }
    else if(g.favIsHome === false){ out[g.awayId] = g.fav; out[g.homeId] = g.dog; }
  });
  return out;
}

// groups=80 gives the FBS whitelist. If that comes back thin the unfiltered
// list is tried for NAMES only — the whitelist stays null so the caller falls
// back to its appearance heuristic rather than treating FCS teams as FBS.
function pemFetchFbs(cb){
  var base = "https://site.api.espn.com/apis/site/v2/sports/football/college-football/teams";
  function absorb(names){
    if(!names) return 0;
    var k = Object.keys(names);
    if(!k.length) return 0;
    PEM.nameMap = PEM.nameMap || {};
    k.forEach(function(id){ PEM.nameMap[id] = names[id]; });
    return k.length;
  }
  // Seed from the board first so something is always there.
  absorb(pemBoardNames());

  fetch(base + "?groups=80&limit=900")
    .then(function(r){ return r.json(); })
    .then(function(d){
      var names = pemReadTeams(d);
      var n = absorb(names);
      if(n >= 100 && n <= 145){
        var set = {}; Object.keys(names).forEach(function(id){ set[id] = 1; });
        cb(null, set); return;
      }
      // Thin or unexpected shape — try unfiltered, names only.
      fetch(base + "?limit=900")
        .then(function(r2){ return r2.json(); })
        .then(function(d2){ absorb(pemReadTeams(d2)); cb(null, null); })
        .catch(function(){ cb(null, null); });
    })
    .catch(function(){
      fetch(base + "?limit=900")
        .then(function(r2){ return r2.json(); })
        .then(function(d2){ absorb(pemReadTeams(d2)); cb(null, null); })
        .catch(function(){ cb(null, null); });
    });
}

// Team names are needed to match a ratings paste. Fetching the FBS list is one
// request, so pasting never has to wait on a full model build.
function pemNameCount(){ return PEM.nameMap ? Object.keys(PEM.nameMap).length : 0; }

function pemEnsureNameMap(cb){
  if(pemNameCount() >= 100){ cb(true); return; }
  // The board alone covers the teams on this week's slate.
  var seeded = pemBoardNames();
  if(Object.keys(seeded).length){
    PEM.nameMap = PEM.nameMap || {};
    for(var id in seeded) PEM.nameMap[id] = seeded[id];
  }
  pemFetchFbs(function(){ cb(pemNameCount() > 0); });
}

// ESPN's FPI. The core API usually hands back $ref stubs rather than values,
// so several response shapes are tried and the result is reported honestly
// rather than silently falling back to nothing.
function pemFetchFpi(year, cb){
  var urls = [
    "https://site.web.api.espn.com/apis/fitt/v3/sports/football/college-football/powerindex?region=us&lang=en&contentorigin=espn&limit=400&season=" + year,
    "https://sports.core.api.espn.com/v2/sports/football/leagues/college-football/seasons/" + year + "/powerindex?limit=400"
  ];
  var i = 0;
  function attempt(){
    if(i >= urls.length){ cb(null, null, "no endpoint returned inline values"); return; }
    var url = urls[i++];
    fetch(url).then(function(r){ return r.json(); }).then(function(d){
      var prior = pemParseFpi(d);
      if(prior && Object.keys(prior).length >= 50) cb(null, prior, url.indexOf("fitt") > 0 ? "ESPN FPI" : "ESPN FPI (core)");
      else attempt();
    }).catch(function(){ attempt(); });
  }
  attempt();
}

// Walks whatever shape came back looking for a team id paired with an FPI value.
function pemParseFpi(d){
  var prior = {};
  function teamIdFrom(o){
    if(!o) return "";
    if(o.team && o.team.id) return String(o.team.id);
    if(o.teamId) return String(o.teamId);
    var ref = (o.team && o.team.$ref) || o.$ref || "";
    var m = String(ref).match(/teams\/(\d+)/);
    return m ? m[1] : "";
  }
  function fpiFrom(o){
    var found = null;
    (o.categories||[]).forEach(function(cat){
      var names = cat.names || [];
      (cat.values||[]).forEach(function(v, idx){
        if(String(names[idx]||"").toLowerCase() === "fpi" && typeof v === "number") found = v;
      });
      (cat.stats||[]).forEach(function(s){
        if(String((s||{}).name||"").toLowerCase() === "fpi" && typeof s.value === "number") found = s.value;
      });
    });
    if(found === null && o.stats){
      (o.stats||[]).forEach(function(s){
        if(String((s||{}).name||"").toLowerCase() === "fpi" && typeof s.value === "number") found = s.value;
      });
    }
    return found;
  }
  var items = (d && (d.items || d.teams || d.powerindex)) || [];
  if(!items.length && d && d.entries) items = d.entries;
  items.forEach(function(it){
    var id = teamIdFrom(it);
    var f  = fpiFrom(it);
    if(id && f !== null) prior[id] = { off: f/2, def: -f/2, fpi: f };
  });
  return Object.keys(prior).length ? prior : null;
}

// Manual ratings paste. SP+ has no public API at all, so pasting is the only
// route to it — and it works when every endpoint fails.
// Accepts lines like "Georgia 22.5", "1. Georgia  22.5", "Georgia,22.5".
function pemParsePaste(text, nameMap){
  if(!nameMap) return null;
  var norm = function(s){ return String(s||"").toUpperCase().replace(/[^A-Z0-9]/g,""); };
  // Index every leading prefix, not just the full name: SP+ tables say
  // "Alabama", ESPN says "Alabama Crimson Tide". Short prefixes collide though
  // ("Texas" matches Texas, Texas A&M and Texas Tech), so a colliding key goes
  // to the team with the fewest words, which is reliably the base programme.
  var cand = {};
  for(var id in nameMap){
    var parts = String(nameMap[id]).split(/\s+/).filter(Boolean);
    for(var w = parts.length; w >= 1; w--){
      var key = norm(parts.slice(0, w).join(""));
      if(!key) continue;
      (cand[key] = cand[key] || []).push({ id: id, words: parts.length, exact: (w === parts.length) });
    }
  }
  var lookup = {};
  Object.keys(cand).forEach(function(key){
    var list = cand[key];
    // An exact full-name hit always wins its own key.
    var exact = list.filter(function(c){ return c.exact; });
    if(exact.length === 1){ lookup[key] = exact[0].id; return; }
    if(list.length === 1){ lookup[key] = list[0].id; return; }
    list.sort(function(a,b){ return a.words - b.words; });
    // Genuinely tied on length is ambiguous; leave it unmatched rather than guess.
    if(list[0].words < list[1].words) lookup[key] = list[0].id;
  });
  var prior = {}, matched = 0, missed = [];
  String(text||"").split(/\n/).forEach(function(line){
    if(!line.trim()) return;
    var m = line.match(/^\s*(?:\d+[.)]\s*)?(.+?)[\s,\t]+(-?\d+(?:\.\d+)?)\s*$/);
    if(!m) return;
    var name = m[1], val = parseFloat(m[2]);
    if(isNaN(val)) return;
    var key = norm(name), id = lookup[key];
    if(!id){
      // Try progressively shorter prefixes for "Georgia Bulldogs" style rows.
      var words = name.trim().split(/\s+/);
      for(var w = words.length; w > 0 && !id; w--) id = lookup[norm(words.slice(0,w).join(""))];
    }
    if(id){ prior[id] = { off: val/2, def: -val/2, fpi: val }; matched++; }
    else missed.push(name.trim());
  });
  return { prior: matched ? prior : null, matched: matched, missed: missed };
}

function pemFit(games, prior, o){
  o = o || PEM.opts;
  prior = prior || {};
  // A start point built from last season is weighted by its own knob; a pasted sheet by Trust in prior.
  var pw = prior._kind === "auto" ? (typeof o.carry === "number" ? o.carry : 0.5) : o.priorW;
  var lr = o.lr, lambda = o.lambda, epochs = o.epochs, cap = o.cap, hfa = o.hfa, ow = o.oppW;
  var G = games.length, maxWeek = 1, i, e;
  for(i = 0; i < G; i++) if(games[i].week > maxWeek) maxWeek = games[i].week;

  // Teams go into flat arrays so the inner loop does no lookups or allocation.
  var teams = {}, ids = [], idx = {}, total = 0, n = 0;
  function add(id){
    if(idx[id] !== undefined) return idx[id];
    var p = prior[id];
    teams[id] = { off: p ? p.off * pw : 0, def: p ? p.def * pw : 0,
                  pOff: p ? p.off * pw : 0, pDef: p ? p.def * pw : 0, hasPrior: !!p, games: 0 };
    idx[id] = ids.length; ids.push(id); return idx[id];
  }
  var ga = new Int32Array(G), gh = new Int32Array(G), sa = new Float64Array(G), sh = new Float64Array(G),
      ed = new Float64Array(G), st = new Float64Array(G);
  for(i = 0; i < G; i++){
    var g = games[i];
    ga[i] = add(g.awayId); gh[i] = add(g.homeId);
    teams[g.awayId].games++; teams[g.homeId].games++;
    total += g.as + g.hs; n += 2;
    // Recency: 0 leaves every game equal, 1 roughly doubles the newest week against the oldest.
    g._w = 1 + o.recency * ((g.week - 1) / Math.max(1, maxWeek - 1));
    // The fitted score never changes between passes, so strip turnovers and cap once.
    var rawA = g.as, rawH = g.hs;
    if(o.toAdj && typeof g.toMargin === "number" && g.toMargin !== 0){
      var swing = g.toMargin * PEM_TO_PTS * o.toAdj / 2;
      rawA = g.as + swing; rawH = g.hs - swing;
    }
    var sc = pemCapped(rawA, rawH, cap, o.capSlope);
    sa[i] = sc[0]; sh[i] = sc[1];
    ed[i] = g.neutral ? 0 : hfa/2;
    st[i] = lr * g._w;
  }
  var avg = n ? total/n : 24, T = ids.length;
  var off = new Float64Array(T), def = new Float64Array(T), pOff = new Float64Array(T), pDef = new Float64Array(T), pull = new Float64Array(T);
  for(i = 0; i < T; i++){ var t0 = teams[ids[i]]; off[i] = t0.off; def[i] = t0.def; pOff[i] = t0.pOff; pDef[i] = t0.pDef; pull[i] = lambda * (1 / Math.max(1, t0.games)) * 4; }

  for(var ep = 0; ep < epochs; ep++){
    for(i = 0; i < G; i++){
      var A = ga[i], H = gh[i], step = st[i], edge = ed[i];
      // oppW scales how much the OPPONENT's rating shapes the expectation.
      var aErr = sa[i] - (avg + off[A] + ow * def[H] - edge);
      var hErr = sh[i] - (avg + off[H] + ow * def[A] + edge);
      off[A] += step * aErr;       def[H] += step * aErr * ow;
      off[H] += step * hErr;       def[A] += step * hErr * ow;
    }
    for(i = 0; i < T; i++){
      off[i] -= (off[i] - pOff[i]) * pull[i];
      def[i] -= (def[i] - pDef[i]) * pull[i];
    }
  }
  for(i = 0; i < T; i++){ var tt = teams[ids[i]]; tt.off = off[i]; tt.def = def[i]; }

  // Shrinkage pulls every rating toward the prior, which systematically
  // COMPRESSES the gap between good and bad teams. Scaling back out is a
  // standard correction, not a fudge — but it is a knob, so it can be checked.
  if(o.scale && o.scale !== 1){
    for(var sid in teams){ teams[sid].off *= o.scale; teams[sid].def *= o.scale; }
  }

  var errSum = 0, cnt = 0;
  games.forEach(function(g){
    var p = pemPredictRaw(teams, avg, hfa, g.awayId, g.homeId, g.neutral, o.oppW);
    if(!p) return;
    errSum += Math.abs((p.home - p.away) - (g.hs - g.as)); cnt++;
  });
  var wks = {}; games.forEach(function(g){ wks[g.week] = 1; });
  return { ratings:teams, avg:avg, hfa:hfa, n:games.length,
           weeks:Object.keys(wks).length, mae: cnt ? errSum/cnt : null };
}

function pemPredictRaw(teams, avg, hfa, awayId, homeId, neutral, oppW){
  var A = teams[awayId], H = teams[homeId];
  if(!A || !H) return null;
  var ow = (oppW === undefined) ? 1 : oppW;
  var edge = neutral ? 0 : hfa/2;
  return { away: avg + A.off + ow * H.def - edge,
           home: avg + H.off + ow * A.def + edge };
}

function pemPredict(awayId, homeId, neutral){
  if(!PEM.ratings) return null;
  var p = pemPredictRaw(PEM.ratings, PEM.avg, PEM.opts.hfa, awayId, homeId, neutral, PEM.opts.oppW);
  if(!p) return null;
  return {
    away: Math.round(p.away*10)/10, home: Math.round(p.home*10)/10,
    margin: Math.round((p.home - p.away)*10)/10,
    total: Math.round((p.home + p.away)*10)/10
  };
}

// Fit on everything BEFORE the last week, predict that week cold. In-sample
// error always flatters a model. Baselines included because a model that can't
// beat "home team by 2.5" has earned nothing.
function pemHoldout(games, prior, o){
  var weeks = games.map(function(g){ return g.week; });
  if(!weeks.length) return null;
  var last = Math.max.apply(null, weeks);
  var train = games.filter(function(g){ return g.week < last; });
  var test  = games.filter(function(g){ return g.week === last; });
  if(train.length < 30 || !test.length) return null;

  var fit = pemFit(train, pemFoldPrior(prior, last, o), o);
  var errs = [], flat = [], priErrs = [];
  test.forEach(function(g){
    var actual = g.hs - g.as;
    var p = pemPredictRaw(fit.ratings, fit.avg, o.hfa, g.awayId, g.homeId, g.neutral, o.oppW);
    if(p) errs.push(Math.abs((p.home - p.away) - actual));
    flat.push(Math.abs((g.neutral ? 0 : o.hfa) - actual));
    if(prior && prior[g.homeId] && prior[g.awayId]){
      var pm = (prior[g.homeId].fpi - prior[g.awayId].fpi) + (g.neutral ? 0 : o.hfa);
      priErrs.push(Math.abs(pm - actual));
    }
  });
  if(!errs.length) return null;
  var mean = function(a){ var s=0; a.forEach(function(v){ s+=v; }); return s/a.length; };
  var sorted = errs.slice().sort(function(a,b){ return a-b; });
  return {
    week: last, n: errs.length, trainN: train.length,
    mae: mean(errs), median: sorted[Math.floor(sorted.length/2)],
    within7: errs.filter(function(e){ return e<=7; }).length / errs.length,
    within14: errs.filter(function(e){ return e<=14; }).length / errs.length,
    baseFlat: flat.length ? mean(flat) : null,
    basePrior: priErrs.length ? mean(priErrs) : null
  };
}


// Rolling-origin cross-validation. A single holdout week is ~35 games, far too
// few to tune five knobs against — auto-tune on one week reliably picks grid
// edges, which is noise-fitting. This trains on everything before week w and
// tests on week w, for every w it can, then averages.
var PEM_CV_MAXFOLDS = 8;

// The weeks used as test folds. Bounded so cost stays linear in the season and
// so the score is not dominated by folds trained on one or two weeks of games.
function pemCVWeeks(games){
  var weeks = {};
  games.forEach(function(g){ weeks[g.week] = 1; });
  var ws = Object.keys(weeks).map(Number).sort(function(a,b){ return a-b; });
  return ws.length > PEM_CV_MAXFOLDS ? ws.slice(ws.length - PEM_CV_MAXFOLDS) : ws;
}

function pemCV(games, prior, o){
  var ws = pemCVWeeks(games);
  var errs = [], folds = 0;
  ws.forEach(function(w){
    var train = games.filter(function(g){ return g.week < w; });
    var test  = games.filter(function(g){ return g.week === w; });
    if(train.length < 30 || !test.length) return;
    var fit = pemFit(train, pemFoldPrior(prior, w, o), o);
    var any = false;
    test.forEach(function(g){
      var p = pemPredictRaw(fit.ratings, fit.avg, o.hfa, g.awayId, g.homeId, g.neutral, o.oppW);
      if(!p) return;
      errs.push(Math.abs((p.home - p.away) - (g.hs - g.as)));
      any = true;
    });
    if(any) folds++;
  });
  if(!errs.length) return null;
  var s = 0; errs.forEach(function(e){ s += e; });
  var m = s/errs.length;
  // Standard error of the mean absolute error. Without this the panel invites
  // people to chase differences that are smaller than the measurement itself.
  var ss = 0; errs.forEach(function(e){ ss += (e-m)*(e-m); });
  var se = errs.length > 1 ? Math.sqrt(ss/(errs.length-1))/Math.sqrt(errs.length) : null;
  return { mae: m, n: errs.length, folds: folds, se: se };
}

// Same folds as pemCV, but keeps each game's error so two settings can be
// compared game by game. Paired beats unpaired here: both configs see the
// identical games, so the shared week-to-week luck cancels instead of drowning
// the difference.
function pemCVErrMap(games, prior, o){
  var ws = pemCVWeeks(games);
  var out = {};
  ws.forEach(function(w){
    var train = games.filter(function(g){ return g.week < w; });
    var test  = games.filter(function(g){ return g.week === w; });
    if(train.length < 30 || !test.length) return;
    var fit = pemFit(train, pemFoldPrior(prior, w, o), o);
    test.forEach(function(g){
      var p = pemPredictRaw(fit.ratings, fit.avg, o.hfa, g.awayId, g.homeId, g.neutral, o.oppW);
      if(p) out[g.eventId] = Math.abs((p.home - p.away) - (g.hs - g.as));
    });
  });
  return out;
}

// Paired difference between two sets of per-game errors. This is the error bar
// that matters when comparing two settings: both saw the same games, so the
// week-to-week luck cancels. It runs roughly 8x tighter than the spread of the
// absolute score, and using the wrong one of the two is the difference between
// a tuner that chases noise and one that never moves at all.
function pemPairedDiff(ea, eb){
  var d = [];
  for(var id in ea){ if(eb[id] !== undefined) d.push(ea[id] - eb[id]); }
  if(d.length < 2) return null;
  var s = 0; d.forEach(function(v){ s += v; });
  var m = s/d.length;
  var ss = 0; d.forEach(function(v){ ss += (v-m)*(v-m); });
  var se = Math.sqrt(ss/(d.length-1))/Math.sqrt(d.length);
  return { d: m, se: se, n: d.length, t: se > 0 ? m/se : 0 };
}

// Negative d means `a` is better. Returns null when there is nothing to compare.
function pemCompare(a, b){
  if(!PEM._games || !PEM._games.length) return null;
  return pemPairedDiff(pemCVErrMap(PEM._games, PEM.prior, a),
                       pemCVErrMap(PEM._games, PEM.prior, b));
}

// One word for whether a difference is real. Two standard errors is the
// ordinary bar; below it, the honest answer is "cannot tell".
function pemVerdict(cmp){
  if(!cmp || !cmp.se) return { word:"\u2014", cls:"same", real:false };
  if(Math.abs(cmp.t) < 2) return { word:"within noise", cls:"same", real:false };
  return cmp.d < 0 ? { word:"better", cls:"good", real:true }
                   : { word:"worse",  cls:"bad",  real:true };
}

function pemBuild(cb){
  if(PEM.busy) return;
  PEM.busy = true;
  var year = (PE.meta && PE.meta.espnYear) || new Date().getFullYear();
  var upto = (PE.meta && PE.meta.espnWeek) ? Math.max(1, PE.meta.espnWeek - 1) : 4;

  pemFetchFbs(function(_e, fbsSet){
    pemFetchFpi(year, function(_e2, prior, why){
      pemFetchSeason(year, upto, function(err, games){
        PEM.busy = false;
        if(err || !games || !games.length){ cb && cb(err || new Error("no games")); return; }

        var before = games.length;
        if(fbsSet){
          games = games.filter(function(g){ return fbsSet[g.awayId] && fbsSet[g.homeId]; });
          PEM.fbsSrc = "ESPN team list";
        } else {
          var seen = {};
          games.forEach(function(g){ seen[g.awayId]=(seen[g.awayId]||0)+1; seen[g.homeId]=(seen[g.homeId]||0)+1; });
          games = games.filter(function(g){ return seen[g.awayId] >= 2 && seen[g.homeId] >= 2; });
          PEM.fbsSrc = "appearance heuristic";
        }
        PEM.dropped = before - games.length;

        // Name map powers the manual ratings paste.
        var nm = {};
        games.forEach(function(g){ nm[g.awayId] = g.awayName; nm[g.homeId] = g.homeName; });
        PEM.nameMap = nm;

        PEM.prior = prior || null;
        PEM.priorN = prior ? Object.keys(prior).length : 0;
        PEM.priorSrc = prior ? "ESPN FPI" : ("unavailable — " + (why || "fetch failed"));
        PEM.priorAt = null; PEM.priorStale = false;
        PEM._fpi = prior || null;
        PEM._games = games;
        // Turnovers already downloaded are reused; only new games cost anything.
        pemApplySavedOpts();
        if(pemApplyCachedTurnovers(games)) PEM.toStats = pemTurnoverStats(games);
        pemApplyCachedStats(games);
        // A pasted prior is the deliberate choice, so it wins over a live fetch.
        pemRestorePrior();
        if(PEM.prior && !PEM.opts.priorW) PEM.opts.priorW = 0.55;

        if(PEAR.fbs){
          var _b2 = games.length;
          games = games.filter(function(g){ return PEAR.fbs[String(g.awayId)] && PEAR.fbs[String(g.homeId)]; });
          if(games.length !== _b2){ PEM.dropped += _b2 - games.length; PEM._games = games; PEM.fbsSrc = "ESPN FBS list"; }
        }
        if(!games.length){ cb && cb(new Error("no FBS games")); return; }
        pemRefit();
        pemCacheSeason(year, upto);
        cb && cb(null, PEM);
      });
    });
  });
}

// Refit from cached games — what every slider calls. No network.
function pemRefit(){
  if(!PEM._games || !PEM._games.length) return false;
  pemAutoPriorSync();
  var fit = pemFit(PEM._games, PEM.prior, PEM.opts);
  PEM.ratings = fit.ratings; PEM.avg = fit.avg;
  PEM.n = fit.n; PEM.mae = fit.mae; PEM.weeks = fit.weeks;
  PEM.holdout = pemHoldout(PEM._games, PEM.prior, PEM.opts);
  PEM.cv = pemCV(PEM._games, PEM.prior, PEM.opts);
  return true;
}

// ── SEASON CACHE ────────────────────────────────────────────────────────────
// pemBuild costs a team list, an FPI pull and one scoreboard request per week,
// which is why the model used to vanish on every reload. The fit itself is
// local and fast, so the thing worth storing is its input. Games go out as
// fixed-position arrays rather than objects — same data, roughly a third of
// the bytes, which matters for a single Firebase node.
var PE_SEASON_V = 1;

function pemCacheSeason(year, upto){
  var games = PEM._games;
  if(!games || !games.length) return false;
  var g = new Array(games.length);
  for(var i=0;i<games.length;i++){
    var q = games[i];
    g[i] = [ String(q.eventId||""), q.week|0, String(q.awayId||""), String(q.homeId||""),
             q.as|0, q.hs|0, q.neutral ? 1 : 0 ];
  }
  PE.season = {
    v: PE_SEASON_V,
    year: year|0,
    upto: upto|0,
    g: g,
    names: PEM.nameMap || null,
    // One number per team is all pePriorToModel needs, so the whole FPI table
    // costs about 2 KB and the restore does not have to go back to ESPN.
    fpi: (function(){
      var f = PEM._fpi; if(!f) return null;
      var o = {}, k = 0;
      for(var id in f){ var v = f[id] && f[id].fpi; if(typeof v === "number" && isFinite(v)){ o[id] = v; k++; } }
      return k ? o : null;
    })(),
    dropped: PEM.dropped|0,
    fbsSrc: PEM.fbsSrc || "",
    at: Date.now()
  };
  peSave();
  return true;
}

// Rebuilds PEM from the cache with no network at all. Turnovers and the pasted
// prior are re-applied from their own stores, so a refit here is identical to
// the one pemBuild would produce.
function pemRestoreSeason(){
  var s = PE.season;
  if(!s || s.v !== PE_SEASON_V || !s.g || !s.g.length) return false;
  var nm = s.names || {};
  var games = new Array(s.g.length);
  for(var i=0;i<s.g.length;i++){
    var r = s.g[i];
    if(!r || r.length < 7) return false;
    var aid = String(r[2]), hid = String(r[3]);
    games[i] = {
      eventId: String(r[0]), week: r[1]|0,
      awayId: aid, homeId: hid,
      awayName: nm[aid] || aid, homeName: nm[hid] || hid,
      as: r[4]|0, hs: r[5]|0, neutral: !!r[6]
    };
  }
  PEM._games  = games;
  PEM.nameMap = s.names || null;
  PEM.dropped = s.dropped|0;
  PEM.fbsSrc  = s.fbsSrc || "";
  PEM.priorSrc = "none"; PEM.priorN = 0; PEM.prior = null; PEM._fpi = null;
  if(s.fpi){
    var fm = pePriorToModel(s.fpi);
    if(fm){
      PEM._fpi = fm; PEM.prior = fm;
      PEM.priorN = Object.keys(fm).length;
      PEM.priorSrc = "ESPN FPI \u00b7 saved";
    }
  }
  if(pemApplyCachedTurnovers(games)) PEM.toStats = pemTurnoverStats(games);
  pemApplyCachedStats(games);
  // A pasted rating sheet is the deliberate choice, so it still wins.
  pemRestorePrior();
  if(PEM.prior && !PEM.opts.priorW) PEM.opts.priorW = 0.55;
  return pemRefit();
}

// True once the season has moved past what the cache holds. The model still
// works, it is just missing a week.
function pemSeasonStale(){
  var s = PE.season;
  if(!s || !s.upto) return false;
  var wk = PE.meta && PE.meta.espnWeek;
  var yr = PE.meta && PE.meta.espnYear;
  if(yr && s.year && yr !== s.year) return true;
  if(!wk) return false;
  return (wk - 1) > s.upto;
}

// Sweep one knob across its range and report holdout MAE at each stop, so the
// best setting can be read off rather than guessed at by dragging.
function pemSweep(key, values, wantErrs){
  if(!PEM._games) return null;
  var saved = PEM.opts[key], out = [];
  values.forEach(function(v){
    PEM.opts[key] = v;
    // Past seasons + this season, scored the same way (see pemObjErrs).
    var r = pemObjMae(PEM.opts);
    out.push(wantErrs ? { v:v, mae: r ? r.mae : null, errs: r ? r.errs : null } : { v:v, mae: r ? r.mae : null });
  });
  PEM.opts[key] = saved;
  return out;
}

function pemLogHtml(){
  if(!PEM.cv) return "";
  var h = '<div class="pem-hd">Tuning log</div>';

  // Baseline first \u2014 it is the thing everything else is measured against.
  if(PE.baseline){
    var sameData = (PE.baseline.n === PEM.cv.n);
    var cmp = pemCompare(pemOptsSnapshot(), PE.baseline.opts);
    var vd  = pemVerdict(cmp);
    var chg = pemOptsDiff(pemOptsSnapshot(), PE.baseline.opts);
    h += '<div class="pem-base">';
    h += '<div class="pem-baserow"><span>Baseline</span><b>' + PE.baseline.mae.toFixed(1) +
         (PE.baseline.se ? ' \u00b1 ' + PE.baseline.se.toFixed(1) : '') + '</b></div>';
    h += '<div class="pem-baserow"><span>Right now</span><b>' + PEM.cv.mae.toFixed(1) +
         (PEM.cv.se ? ' \u00b1 ' + PEM.cv.se.toFixed(1) : '') + '</b></div>';
    if(cmp){
      h += '<div class="pem-baserow"><span>Difference</span><b class="' + vd.cls + '">' +
           (cmp.d > 0 ? '+' : '') + cmp.d.toFixed(2) + ' \u00b1 ' + cmp.se.toFixed(2) +
           ' \u00b7 ' + vd.word + '</b></div>';
      h += '<div class="pe-note" style="margin-top:4px">' + (vd.real
        ? ('Measured game by game on the same ' + cmp.n + ' games, so this one is real.')
        : ('Compared game by game on the same ' + cmp.n + ' games. The gap is smaller than its own error bar \u2014 these two settings are not distinguishable with the data on hand.')) + '</div>';
    }
    if(!sameData){
      h += '<div class="pem-stale">The baseline was set on <b>' + PE.baseline.n +
           '</b> games; the model now scores on <b>' + PEM.cv.n + '</b>. ' +
           'Its stored number is not comparable to today\u2019s \u2014 the season moved, not the settings. ' +
           'The difference above is still valid, because it refits the baseline settings on the current games.' +
           '<button class="btn btn-ghost btn-sm" id="pem-rebase" style="margin-top:6px">Re-score baseline on today\u2019s games</button></div>';
    }
    h += '<div class="pem-basechg">' + (chg.length
      ? ('Changed since baseline: <b>' + x(chg.join(", ")) + '</b>')
      : 'Identical to baseline.') + '</div>';
    h += '<button class="btn btn-ghost btn-sm" id="pem-tobase" style="margin-top:6px">Back to baseline</button>';
    h += '</div>';
  } else {
    h += '<div class="pe-note" style="margin-top:0">No baseline pinned. Set one and every later change gets measured against the same fixed reference instead of against whatever was loaded last.</div>';
  }

  var runs = PE.runs || [];
  if(!runs.length){
    h += '<div class="pe-note">Nothing logged yet. <b>Log this run</b> writes the current settings and score down so the next change has something to beat.</div>';
    return h;
  }

  h += '<div class="pem-runs">';
  runs.forEach(function(r, i){
    var chg = pemOptsDiff(r.opts);
    var d = new Date(r.at);
    h += '<div class="pem-run" data-pem-run="' + i + '">';
    h += '<div class="pem-runtop"><b>' + x(r.label) + '</b>' +
         '<span>' + r.mae.toFixed(1) + (r.se ? ' \u00b1 ' + r.se.toFixed(1) : '') + '</span></div>';
    h += '<div class="pem-runsub">' + d.toLocaleDateString(undefined,{month:"short",day:"numeric"}) +
         ' \u00b7 ' + r.n + ' games' + (r.upto ? ' \u00b7 thru wk ' + r.upto : '');
    if(r.vsBase){
      var real = Math.abs(r.vsBase.t) >= 2;
      h += ' \u00b7 <b class="' + (real ? (r.vsBase.d < 0 ? "good" : "bad") : "same") + '">' +
           (r.vsBase.d > 0 ? '+' : '') + r.vsBase.d.toFixed(2) + ' vs base' +
           (real ? '' : ' (noise)') + '</b>';
    }
    // Two runs from different weeks are two different measurements.
    if(PEM.cv && r.n !== PEM.cv.n) h += ' \u00b7 <span class="pem-otherdata">other data</span>';
    h += '</div>';
    h += '<div class="pem-runchg">' + (chg.length ? x(chg.join(", ")) : "all defaults") + '</div>';
    h += '<button class="btn btn-ghost btn-sm pem-restore" data-pem-run="' + i + '">Load these</button>';
    h += '</div>';
  });
  h += '</div>';
  h += '<div class="pe-note">Kept on this account, so the log survives a reload and follows you between devices.</div>';
  return h;
}

// ── TEAM SEASON LOG ──────────────────────────────────────────
// Every game a team has played, in order, with what the box score said rather
// than only what the scoreboard said. The point of the yardage columns is that
// they disagree with the result often enough to be worth seeing: a team that
// keeps outgaining opponents and losing is a different proposition from one
// that keeps getting outgained and winning.

// One team's overall strength, in points against an average opponent.
//
// The model predicts  home - away = (H.off - H.def) - (A.off - A.def),  so a
// team's quality is off MINUS def: a good side both scores (high off) and
// suppresses (negative def), and adding those two cancels the halves out
// instead of combining them. Fitted on ten synthetic weeks, off+def correlated
// 0.10 with the planted strengths and spanned 1.4 points; off-def correlated
// 0.86 and spanned 8.4, against a true spread of 9.1. Everything that ranks or
// displays a team goes through here so the two can never drift apart again.
function pemRatingOf(id){
  var r = PEM.ratings && PEM.ratings[id];
  return r ? (r.off - r.def) : null;
}

// Team -> its games, built once per season load. The stored shape stays keyed
// by game because a game belongs to two teams and writing it under both would
// double the record and leave two copies to keep in step. Indexing by team is
// the cheap half of that idea: one pass over the season, then every team lookup
// is free, and nothing can fall out of sync because there is still one copy.
function pemTeamIndex(){
  if(!PEM._games) return null;
  if(PEM._tidx && PEM._tidxFor === PEM._games) return PEM._tidx;
  var idx = {};
  PEM._games.forEach(function(g){
    if(g.awayId) (idx[g.awayId] = idx[g.awayId] || []).push(g);
    if(g.homeId) (idx[g.homeId] = idx[g.homeId] || []).push(g);
  });
  PEM._tidx = idx;
  PEM._tidxFor = PEM._games;
  return idx;
}

// Season history for one team, oldest first.
function pemTeamLog(teamId){
  if(!PEM._games || !teamId) return null;
  var rows = [];
  var idx = pemTeamIndex();
  var mine = (idx && idx[teamId]) ? idx[teamId] : PEM._games;
  mine.forEach(function(g){
    var home = (String(g.homeId) === String(teamId));
    var away = (String(g.awayId) === String(teamId));
    if(!home && !away) return;
    var me  = home ? g.statHome : g.statAway;
    var opp = home ? g.statAway : g.statHome;
    var myPts  = home ? g.hs : g.as;
    var oppPts = home ? g.as : g.hs;
    rows.push({
      week: g.week, eventId: g.eventId,
      oppId: home ? g.awayId : g.homeId,
      oppName: home ? g.awayName : g.homeName,
      home: home, neutral: !!g.neutral,
      pts: myPts, oppPts: oppPts,
      margin: myPts - oppPts,
      won: myPts > oppPts,
      // toMargin is stored from the home side's view.
      toMargin: (typeof g.toMargin === "number") ? (home ? g.toMargin : -g.toMargin) : null,
      me: me || null, opp: opp || null,
      yards:    me ? me.yards : null,
      oppYards: opp ? opp.yards : null,
      ypp:      me ? me.ypp : null,
      oppYpp:   opp ? opp.ypp : null,
      third:   (me && me.td3a) ? (me.td3m / me.td3a) : null,
      oppThird:(opp && opp.td3a) ? (opp.td3m / opp.td3a) : null
    });
  });
  rows.sort(function(a,b){ return a.week - b.week; });
  return rows.length ? rows : null;
}

// Season totals, plus the opponent-quality context that makes them readable.
function pemTeamSummary(teamId){
  var rows = pemTeamLog(teamId);
  if(!rows) return null;
  var w = 0, l = 0, mg = 0, yd = 0, ydA = 0, ydN = 0, ypN = 0, yp = 0, ypA = 0, to = 0, toN = 0;
  var sos = 0, sosN = 0;
  var pf = 0, pa = 0;                       // points for / against
  var pl = 0, plA = 0, plN = 0;             // plays run / faced
  var t3m = 0, t3a = 0, t3mA = 0, t3aA = 0; // third downs, both sides
  rows.forEach(function(r){
    if(r.won) w++; else l++;
    mg += r.margin;
    pf += r.pts; pa += r.oppPts;
    if(r.yards !== null && r.oppYards !== null){ yd += r.yards; ydA += r.oppYards; ydN++; }
    if(r.ypp !== null && r.oppYpp !== null){ yp += r.ypp; ypA += r.oppYpp; ypN++; }
    if(r.me && r.me.plays !== null && r.opp && r.opp.plays !== null){
      pl += r.me.plays; plA += r.opp.plays; plN++;
    }
    if(r.me && r.me.td3a){ t3m += r.me.td3m; t3a += r.me.td3a; }
    if(r.opp && r.opp.td3a){ t3mA += r.opp.td3m; t3aA += r.opp.td3a; }
    if(r.toMargin !== null){ to += r.toMargin; toN++; }
    if(PEM.ratings && PEM.ratings[r.oppId]){
      var o = PEM.ratings[r.oppId];
      sos += (o.off - o.def); sosN++;
    }
  });
  var n = rows.length;
  return {
    n: n, w: w, l: l,
    margin: mg / n,
    // Per-game rates. These are the numbers everyone quotes, and they are also
    // the ones most contaminated by schedule — see pemAdjRates for versions
    // that account for who the yards came against.
    ppg:  pf / n,
    papg: pa / n,
    ypg:      ydN ? (yd/ydN)  : null,
    yapg:     ydN ? (ydA/ydN) : null,
    yards:    ydN ? (yd/ydN)  : null,
    oppYards: ydN ? (ydA/ydN) : null,
    yardMargin: ydN ? ((yd - ydA)/ydN) : null,
    ypp:    ypN ? (yp/ypN)  : null,
    oppYpp: ypN ? (ypA/ypN) : null,
    yppMargin: ypN ? ((yp - ypA)/ypN) : null,
    plays:    plN ? (pl/plN)  : null,
    oppPlays: plN ? (plA/plN) : null,
    third:    t3a  ? (t3m/t3a)   : null,
    oppThird: t3aA ? (t3mA/t3aA) : null,
    toMargin: toN ? (to/toN) : null,
    sos: sosN ? (sos/sosN) : null,
    rows: rows
  };
}

// ── OPPONENT-ADJUSTED RATES ──────────────────────────────────
// 480 yards a game means one thing behind a soft schedule and another behind a
// hard one, and in September the schedules are not remotely alike. This asks a
// narrower question: against each opponent, how did this team do compared with
// what that opponent normally gives up?
//
// The opponent's own average excludes the game in question, or a team that hung
// 600 on someone would be partly measured against its own performance and every
// number would drift toward the mean.
function pemAdjRates(){
  if(!PEM._games || !PEM._games.length) return null;
  if(PEM._adj && PEM._adjFor === PEM._games) return PEM._adj;

  var idx = pemTeamIndex();
  if(!idx) return null;

  // Raw totals per team, one pass.
  var tot = {};
  function slot(id){
    if(!tot[id]) tot[id] = { n:0, pf:0, pa:0, yf:0, ya:0, yn:0 };
    return tot[id];
  }
  PEM._games.forEach(function(g){
    var a = slot(g.awayId), h = slot(g.homeId);
    a.n++; h.n++;
    a.pf += g.as; a.pa += g.hs;
    h.pf += g.hs; h.pa += g.as;
    var ay = g.statAway && g.statAway.yards, hy = g.statHome && g.statHome.yards;
    if(typeof ay === "number" && typeof hy === "number"){
      a.yf += ay; a.ya += hy; a.yn++;
      h.yf += hy; h.ya += ay; h.yn++;
    }
  });

  // League baselines, so an adjusted figure lands on the same scale as a raw one.
  var lgP = 0, lgPn = 0, lgY = 0, lgYn = 0;
  for(var id in tot){
    lgP += tot[id].pf; lgPn += tot[id].n;
    lgY += tot[id].yf; lgYn += tot[id].yn;
  }
  var avgP = lgPn ? (lgP/lgPn) : 0;
  var avgY = lgYn ? (lgY/lgYn) : 0;

  // Leave-one-out: what this opponent allows in its OTHER games.
  function exclAllowed(oppId, minusVal, key, nKey){
    var o = tot[oppId];
    if(!o) return null;
    var n = o[nKey || "n"];
    if(n <= 1) return null;                       // nothing left after removing this game
    return (o[key] - minusVal) / (n - 1);
  }

  var out = {};
  Object.keys(idx).forEach(function(tid){
    var games = idx[tid];
    var dP = 0, dPn = 0, dPd = 0, dPdn = 0;
    var dY = 0, dYn = 0, dYd = 0, dYdn = 0;
    games.forEach(function(g){
      var home = (String(g.homeId) === String(tid));
      var oppId = home ? g.awayId : g.homeId;
      var myPts = home ? g.hs : g.as, oppPts = home ? g.as : g.hs;

      // Offence: my points vs what this opponent usually allows.
      var expAllow = exclAllowed(oppId, myPts, "pa");
      if(expAllow !== null){ dP += (myPts - expAllow); dPn++; }
      // Defence: points I gave up vs what this opponent usually scores.
      var expScore = exclAllowed(oppId, oppPts, "pf");
      if(expScore !== null){ dPd += (oppPts - expScore); dPdn++; }

      var me  = home ? g.statHome : g.statAway;
      var opp = home ? g.statAway : g.statHome;
      if(me && opp && typeof me.yards === "number" && typeof opp.yards === "number"){
        var eyA = exclAllowed(oppId, me.yards, "ya", "yn");
        if(eyA !== null){ dY += (me.yards - eyA); dYn++; }
        var eyF = exclAllowed(oppId, opp.yards, "yf", "yn");
        if(eyF !== null){ dYd += (opp.yards - eyF); dYdn++; }
      }
    });
    out[tid] = {
      // Above/below what a typical opponent of theirs concedes, re-centred on
      // the league average so it reads like an ordinary per-game figure.
      appg:  dPn  ? (avgP + dP/dPn)   : null,
      apapg: dPdn ? (avgP + dPd/dPdn) : null,
      aypg:  dYn  ? (avgY + dY/dYn)   : null,
      ayapg: dYdn ? (avgY + dYd/dYdn) : null,
      // The raw-to-adjusted move, which is the schedule talking.
      ppgShift: dPn  ? (dP/dPn)   : null,
      ypgShift: dYn  ? (dY/dYn)   : null
    };
  });

  out._league = { ppg: avgP, ypg: avgY };
  PEM._adj = out;
  PEM._adjFor = PEM._games;
  return out;
}

// Teams that have played, strongest first, so the picker is ordered usefully.
function pemTeamList(){
  if(!PEM._games) return [];
  var seen = {};
  PEM._games.forEach(function(g){
    if(g.awayId) seen[g.awayId] = g.awayName || g.awayId;
    if(g.homeId) seen[g.homeId] = g.homeName || g.homeId;
  });
  var out = Object.keys(seen).map(function(id){
    var r = PEM.ratings && PEM.ratings[id];
    return { id: id, name: seen[id], rating: r ? (r.off - r.def) : null };
  });
  out.sort(function(a, b){
    if(a.rating === null && b.rating === null) return a.name.localeCompare(b.name);
    if(a.rating === null) return 1;
    if(b.rating === null) return -1;
    return b.rating - a.rating;
  });
  return out;
}

function pemFmtSigned(v, dp){
  if(v === null || v === undefined || !isFinite(v)) return "\u2014";
  var s = (Math.round(v * Math.pow(10, dp||1)) / Math.pow(10, dp||1));
  return (s > 0 ? "+" : "") + s.toFixed(dp||1);
}

// Every team on one sortable table. This is what a per-team view is actually
// for \u2014 the single-team log answers "how has this team played", and only a
// table answers "how do these two compare".
// Six or seven columns is all that fits on a phone, so the table has sets
// rather than one endless row. "signed" marks a margin, where a leading + or -
// is the point; a rate like 421 yards a game is not signed.
var PEM_NAME = { key:"name", lab:"Team", fmt:function(t){ return x(t.name); } };
var PEM_REC  = { key:"rec",  lab:"W-L",  fmt:function(t){ return t.w + "-" + t.l; },
                 sort:function(t){ return t.n ? t.w/t.n : -1; } };

var PEM_COLSETS = {
  overview: { lab:"Overview", note:"Margins and rating. The quickest read on who is actually good.", cols:[
    PEM_NAME,
    { key:"rating", lab:"Rtg", dp:1, signed:true, hint:"Model rating: points better than an average FBS team." },
    PEM_REC,
    { key:"margin", lab:"Pts", dp:1, signed:true, hint:"Average points margin." },
    { key:"yppMargin", lab:"Y/P", dp:2, signed:true, hint:"Average yards-per-play margin. Steadier week to week than points." },
    { key:"to",  lab:"TO",  dp:2, signed:true, hint:"Average turnover margin. Mostly luck \u2014 expect it to regress." },
    { key:"sos", lab:"Opp", dp:1, signed:true, hint:"Average opponent rating faced so far." }
  ]},
  offense: { lab:"Offense", note:"What this team does with the ball. Raw totals, not adjusted for who they played.", cols:[
    PEM_NAME,
    { key:"ppg",   lab:"PPG",   dp:1, hint:"Points scored per game." },
    { key:"ypg",   lab:"YPG",   dp:0, hint:"Yards gained per game." },
    { key:"ypp",   lab:"Y/P",   dp:2, hint:"Yards per play gained." },
    { key:"plays", lab:"Plays", dp:1, hint:"Offensive plays run per game \u2014 tempo." },
    { key:"third", lab:"3rd%",  dp:0, pct:true, hint:"Third downs converted." }
  ]},
  defense: { lab:"Defense", note:"What opponents do against them. Raw totals, not adjusted for who they played.", cols:[
    PEM_NAME,
    { key:"papg",     lab:"PA/G",  dp:1, hint:"Points allowed per game." },
    { key:"yapg",     lab:"YA/G",  dp:0, hint:"Yards allowed per game." },
    { key:"oppYpp",   lab:"Y/P",   dp:2, hint:"Yards per play allowed." },
    { key:"oppPlays", lab:"Plays", dp:1, hint:"Plays faced per game." },
    { key:"oppThird", lab:"3rd%",  dp:0, pct:true, hint:"Third downs allowed to convert." }
  ]},
  adjusted: { lab:"Adjusted", note:"Same figures, but measured against what each opponent normally gives up. This is the set to compare teams on before the schedules even out.", cols:[
    PEM_NAME,
    { key:"appg",     lab:"aPPG", dp:1, hint:"Points per game, adjusted for opponent defences faced." },
    { key:"apapg",    lab:"aPA/G", dp:1, hint:"Points allowed per game, adjusted for opponent offences faced." },
    { key:"aypg",     lab:"aYPG", dp:0, hint:"Yards per game, adjusted for opponent defences faced." },
    { key:"ayapg",    lab:"aYA/G", dp:0, hint:"Yards allowed per game, adjusted for opponent offences faced." },
    { key:"ypgShift", lab:"Sched", dp:0, signed:true, hint:"How far the schedule moved the raw yardage figure. Large positive means they have been gaining more than their opponents usually allow." }
  ]}
};

function pemCompareRows(){
  var teams = pemTeamList();
  var adj = pemAdjRates() || {};
  var out = [];
  teams.forEach(function(t){
    var s = pemTeamSummary(t.id);
    if(!s) return;
    var a = adj[t.id] || {};
    var mr = PEM.ratings && PEM.ratings[t.id];
    var pr = PEM.prior && PEM.prior[t.id];
    out.push({
      id: t.id, name: t.name, rating: t.rating,
      // Split the rating into its halves. The model's defence term is negative
      // when a team is good at defence (it subtracts from what opponents
      // score), so it is flipped here \u2014 on screen, higher must mean better on
      // every row or the colouring lies.
      off: mr ? mr.off : null,
      def: mr ? -mr.def : null,
      spPlus: (pr && typeof pr.fpi === "number") ? pr.fpi : null,
      n: s.n, w: s.w, l: s.l,
      margin: s.margin, yppMargin: s.yppMargin, to: s.toMargin, sos: s.sos,
      ppg: s.ppg, papg: s.papg, ypg: s.ypg, yapg: s.yapg,
      ypp: s.ypp, oppYpp: s.oppYpp, plays: s.plays, oppPlays: s.oppPlays,
      third: s.third, oppThird: s.oppThird,
      appg: a.appg, apapg: a.apapg, aypg: a.aypg, ayapg: a.ayapg,
      ypgShift: a.ypgShift, ppgShift: a.ppgShift
    });
  });
  return out;
}

// ── SIMULATION ──────────────────────────────────────────────────────────────
// Running a matchup a thousand times does NOT sharpen the predicted spread: the
// average of (prediction + noise) is the prediction, so the mean comes back to
// where it started, give or take sampling error. What the runs buy is the shape
// around it — how often each side actually wins, how often the number covers,
// and how much of the distribution sits on the key numbers.
//
// The spread of that distribution is not invented. It is measured from how far
// wrong this model has actually been, week to week, on games it had not seen.

// The margins that decide the most games. A spread sitting on one of them is
// worth more than the half point either side of it.
var PE_SIM_KEYS = [3, 7, 10, 14];
// Asked for a thousand; the sampling error on a probability at that count is
// about 1.6 points, which is fine for a number read to one decimal.
var PE_SIM_N = 1000;

// Residual spread, from rolling-origin predictions. Margin and total get their
// own figure because they miss by different amounts.
function pemSimParams(){
  var spKey = JSON.stringify(pemOptsSnapshot()) + "|" + pemHistCount();
  if(PEM._simP && PEM._simPFor === PEM._games && PEM._simPKey === spKey) return PEM._simP;
  if(!PEM._games || !PEM._games.length) return null;
  // Thousands of past-season residuals beat a few hundred from this season.
  if(pemHistReady()){
    var acc = null; try{ acc = pemAccuracy(); }catch(e){}
    if(acc && acc.hist && acc.hist.n >= 300){
      PEM._simP = { sdMargin: acc.hist.sd, sdTotal: acc.hist.sdT || 13.0, n: acc.hist.n, past: true };
      PEM._simPFor = PEM._games; PEM._simPKey = spKey;
      return PEM._simP;
    }
  }
  var ws = pemCVWeeks(PEM._games);
  var mR = [], tR = [];
  ws.forEach(function(w){
    var train = PEM._games.filter(function(g){ return g.week < w; });
    var test  = PEM._games.filter(function(g){ return g.week === w; });
    if(train.length < 30 || !test.length) return;
    var fit = pemFit(train, pemPriorAt(w, PEM.opts), PEM.opts);
    test.forEach(function(g){
      var p = pemPredictRaw(fit.ratings, fit.avg, PEM.opts.hfa, g.awayId, g.homeId, g.neutral, PEM.opts.oppW);
      if(!p) return;
      mR.push((g.hs - g.as) - (p.home - p.away));
      tR.push((g.hs + g.as) - (p.home + p.away));
    });
  });
  function sd(a){
    if(a.length < 3) return null;
    var m = 0; a.forEach(function(v){ m += v; }); m /= a.length;
    var s = 0; a.forEach(function(v){ s += (v-m)*(v-m); });
    return Math.sqrt(s/(a.length-1));
  }
  var out = { sdMargin: sd(mR), sdTotal: sd(tR), n: mR.length };
  // A standard deviation from a handful of games is itself mostly noise, and an
  // understated one makes every probability below look far more confident than
  // the evidence allows. Under 40 residuals the measured figure is blended
  // toward the long-run spread of college football margins in proportion to how
  // much evidence there is; under 8 it is ignored entirely.
  var PRIOR_M = 17.5, PRIOR_T = 13.0, FULL = 40, MIN = 8;
  if(!out.sdMargin || out.n < MIN){
    out.sdMargin = PRIOR_M; out.sdTotal = PRIOR_T; out.assumed = true;
  } else if(out.n < FULL){
    var wgt = (out.n - MIN) / (FULL - MIN);
    out.sdMargin = wgt * out.sdMargin + (1 - wgt) * PRIOR_M;
    out.sdTotal  = (out.sdTotal !== null)
      ? (wgt * out.sdTotal + (1 - wgt) * PRIOR_T) : PRIOR_T;
    out.blended = Math.round((1 - wgt) * 100);
  }
  if(out.sdTotal === null || !isFinite(out.sdTotal)) out.sdTotal = PRIOR_T;
  PEM._simP = out; PEM._simPFor = PEM._games; PEM._simPKey = spKey;
  return out;
}

// Seeded generator, so the same matchup gives the same answer twice running.
// A number that jitters every time the panel repaints reads as noise even when
// the underlying estimate has not moved.
function pemRng(seed){
  var s = (seed >>> 0) || 1;
  return function(){
    s ^= s << 13; s >>>= 0;
    s ^= s >> 17;
    s ^= s << 5;  s >>>= 0;
    return s / 4294967296;
  };
}
function pemSeedOf(a, b){
  var str = String(a) + "|" + String(b), h = 2166136261;
  for(var i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = (h * 16777619) >>> 0; }
  return h;
}

function pemSimulate(awayId, homeId, opts){
  opts = opts || {};
  var n = opts.n || 1000;
  var p = pemPredict(awayId, homeId, !!opts.neutral);
  var sp = pemSimParams();
  if(!p || !sp) return null;

  var rnd = pemRng(opts.seed || pemSeedOf(awayId, homeId));
  // Box-Muller, two normals per turn of the crank.
  var spare = null;
  function gauss(){
    if(spare !== null){ var v = spare; spare = null; return v; }
    var u = 0, v2 = 0;
    while(!u) u = rnd();
    while(!v2) v2 = rnd();
    var r = Math.sqrt(-2*Math.log(u)), th = 2*Math.PI*v2;
    spare = r*Math.sin(th);
    return r*Math.cos(th);
  }

  var margins = new Array(n);
  var homeWin = 0, push = 0;
  var sumM = 0, sumT = 0, sumA = 0, sumH = 0;
  var keyHits = {};  PE_SIM_KEYS.forEach(function(k){ keyHits[k] = 0; });
  var coverHome = 0, coverPush = 0;
  var line = (typeof opts.line === "number") ? opts.line : null;   // home-side spread

  for(var i=0;i<n;i++){
    var m = p.margin + gauss()*sp.sdMargin;
    var t = p.total  + gauss()*sp.sdTotal;
    // Football scores are integers; rounding here is what makes ties, and key
    // numbers, appear at anything like their real frequency.
    var hs = Math.round((t + m)/2), as = Math.round((t - m)/2);
    if(hs < 0) hs = 0;
    if(as < 0) as = 0;
    var mi = hs - as;
    margins[i] = mi;
    sumM += mi; sumT += (hs + as); sumA += as; sumH += hs;
    if(mi > 0) homeWin++; else if(mi === 0) push++;
    var am = Math.abs(mi);
    if(keyHits[am] !== undefined) keyHits[am]++;
    if(line !== null){
      // line is the home team's number: negative means home is favoured.
      var v = mi + line;
      if(v > 0) coverHome++; else if(v === 0) coverPush++;
    }
  }

  margins.sort(function(a,b){ return a-b; });
  function pct(q){ return margins[Math.min(n-1, Math.max(0, Math.floor(q*n)))]; }

  return {
    n: n,
    predMargin: p.margin, predTotal: p.total,
    meanMargin: sumM/n, meanTotal: sumT/n,
    meanAway: sumA/n, meanHome: sumH/n,
    sdMargin: sp.sdMargin, sdTotal: sp.sdTotal, assumed: !!sp.assumed,
    blended: sp.blended || 0, residN: sp.n,
    homeWinPct: homeWin/n, awayWinPct: (n - homeWin - push)/n, tiePct: push/n,
    p10: pct(0.10), p25: pct(0.25), median: pct(0.50), p75: pct(0.75), p90: pct(0.90),
    keyHits: keyHits,
    line: line,
    coverHome: line === null ? null : coverHome/n,
    coverAway: line === null ? null : (n - coverHome - coverPush)/n,
    coverPush: line === null ? null : coverPush/n,
    margins: margins
  };
}

// ── HEAD TO HEAD ────────────────────────────────────────────────────────────
// A number on its own does not say much: 421 yards a game is excellent in one
// season and ordinary in another. A rank does, so every figure here carries
// where it sits among the teams that have played.

// Which way is good for each stat. Getting this backwards would quietly praise
// the worse team on half the rows, so it is declared once, next to the label.
var PEM_STATS = {
  rating:    { lab:"Rating",   dir:"high", dp:1, signed:true },
  spPlus:    { lab:"SP+",      dir:"high", dp:1, signed:true },
  off:       { lab:"Offense",  dir:"high", dp:1, signed:true },
  def:       { lab:"Defense",  dir:"high", dp:1, signed:true },
  margin:    { lab:"Pts margin", dir:"high", dp:1, signed:true },
  yppMargin: { lab:"Y/P margin", dir:"high", dp:2, signed:true },
  to:        { lab:"TO margin",  dir:"high", dp:2, signed:true },
  sos:       { lab:"Sched faced", dir:"high", dp:1, signed:true },
  ppg:       { lab:"Points/gm",  dir:"high", dp:1 },
  ypg:       { lab:"Yards/gm",   dir:"high", dp:0 },
  ypp:       { lab:"Yards/play", dir:"high", dp:2 },
  plays:     { lab:"Plays/gm",   dir:"none", dp:1 },
  third:     { lab:"3rd down",   dir:"high", dp:0, pct:true },
  papg:      { lab:"Points all.", dir:"low", dp:1 },
  yapg:      { lab:"Yards all.",  dir:"low", dp:0 },
  oppYpp:    { lab:"Y/P allowed", dir:"low", dp:2 },
  oppPlays:  { lab:"Plays faced", dir:"none", dp:1 },
  oppThird:  { lab:"3rd down def", dir:"low", dp:0, pct:true },
  appg:      { lab:"Adj pts/gm",   dir:"high", dp:1 },
  apapg:     { lab:"Adj pts all.", dir:"low",  dp:1 },
  aypg:      { lab:"Adj yds/gm",   dir:"high", dp:0 },
  ayapg:     { lab:"Adj yds all.", dir:"low",  dp:0 }
};

// Rank every team on every stat, once per season load.
function pemRanks(){
  if(PEM._ranks && PEM._ranksFor === PEM._games) return PEM._ranks;
  var rows = pemCompareRows();
  var ranks = {}, n = {};
  Object.keys(PEM_STATS).forEach(function(k){
    var d = PEM_STATS[k];
    if(d.dir === "none") return;
    var have = rows.filter(function(r){
      return typeof r[k] === "number" && isFinite(r[k]);
    });
    have.sort(function(a, b){ return d.dir === "low" ? (a[k] - b[k]) : (b[k] - a[k]); });
    n[k] = have.length;
    have.forEach(function(r, i){
      (ranks[r.id] = ranks[r.id] || {})[k] = i + 1;
    });
  });
  PEM._ranks = { rank: ranks, n: n };
  PEM._ranksFor = PEM._games;
  return PEM._ranks;
}

// A rank badge's colour, by where it falls in the field rather than by a fixed
// cutoff — in a 60-team week, 40th is not what 40th means in a 136-team one.
function pemRankCls(rank, total){
  if(!rank || !total) return "";
  var q = rank / total;
  if(q <= 0.25) return "good";
  if(q <= 0.50) return "ok";
  if(q <= 0.75) return "mid";
  return "bad";
}

// The one honest win and loss on the résumé: best team beaten, worst team lost to.
function pemResume(teamId){
  var rows = pemTeamLog(teamId);
  if(!rows) return null;
  var best = null, worst = null;
  rows.forEach(function(r){
    var o = PEM.ratings && PEM.ratings[r.oppId];
    if(!o) return;
    var rt = o.off - o.def;
    if(r.won){ if(!best || rt > best.rt) best = { rt: rt, r: r }; }
    else { if(!worst || rt < worst.rt) worst = { rt: rt, r: r }; }
  });
  return { best: best, worst: worst };
}

function pemVsRow(k, A, B, ranks){
  var d = PEM_STATS[k];
  var va = A ? A[k] : null, vb = B ? B[k] : null;
  function fmt(v){
    if(v === null || v === undefined || !isFinite(v)) return "\u2014";
    if(d.pct) return Math.round(v * 100) + "%";
    if(d.signed) return pemFmtSigned(v, d.dp === 0 ? 0 : (d.dp || 1));
    return (d.dp === 0) ? String(Math.round(v)) : v.toFixed(d.dp || 1);
  }
  // Which side is better, when the stat has a direction and both have a number.
  var lead = 0;
  if(d.dir !== "none" && typeof va === "number" && typeof vb === "number" && va !== vb){
    lead = (d.dir === "low") ? (va < vb ? -1 : 1) : (va > vb ? -1 : 1);
  }
  function side(v, id, which){
    var rk = (id && ranks.rank[id]) ? ranks.rank[id][k] : null;
    var tot = ranks.n[k] || 0;
    var win = (lead === which);
    return '<div class="pe-vsv' + (win ? " win" : "") + '">' +
           '<span class="pe-vsnum">' + fmt(v) + '</span>' +
           (rk ? ('<span class="pe-vsrk ' + pemRankCls(rk, tot) + '">#' + rk + '</span>') : '') +
           '</div>';
  }
  return '<div class="pe-vsrow">' + side(va, A && A.id, -1) +
         '<div class="pe-vslab">' + d.lab + '</div>' +
         side(vb, B && B.id, 1) + '</div>';
}

function pemSimHtml(A, B){
  if(!PEM.ratings) return "";
  // A on the left is the visiting side, to match the board's convention.
  var line = null, neutral = false, meet = null;
  (PE.games || []).forEach(function(g){
    var ids = [String(g.awayId), String(g.homeId)];
    if(ids.indexOf(String(A.id)) >= 0 && ids.indexOf(String(B.id)) >= 0) meet = g;
  });
  if(meet){
    // g.pool is the favourite's number; convert to the home side's.
    var homeIsFav = (meet.favIsHome === true);
    if(meet.favIsHome === true || meet.favIsHome === false){
      line = homeIsFav ? -meet.pool : meet.pool;
      // Simulate in the direction the board has it.
      if(String(meet.homeId) !== String(B.id)) line = -line;
    }
  }

  var sim = pemSimulate(A.id, B.id, { n: PE_SIM_N, line: line, neutral: neutral });
  if(!sim) return "";

  var h = '<div class="pe-vssec">Simulation <span class="pe-simn">' + sim.n + ' runs</span></div>';

  // Average scoreline and the spread that falls out of it.
  var favIsB = sim.meanMargin > 0;
  var favName = favIsB ? B.name : A.name;
  var spread  = -Math.abs(Math.round(sim.meanMargin*10)/10);
  h += '<div class="pe-simtop">';
  h += '<div class="pe-simscore">' + x(A.name) + ' <b>' + sim.meanAway.toFixed(1) + '</b>' +
       ' &ndash; <b>' + sim.meanHome.toFixed(1) + '</b> ' + x(B.name) + '</div>';
  h += '<div class="pe-simline">' + x(favName) + ' ' + spread.toFixed(1) + '</div>';
  h += '</div>';

  // Win probability, the thing the runs actually add.
  var ap = Math.round(sim.awayWinPct*1000)/10, bp = Math.round(sim.homeWinPct*1000)/10;
  h += '<div class="pe-simbar"><div class="pe-simfill" style="width:' + Math.max(2, Math.min(98, ap)) + '%"></div></div>';
  h += '<div class="pe-simlab"><span>' + x(A.name) + ' <b>' + ap.toFixed(1) + '%</b></span>' +
       '<span><b>' + bp.toFixed(1) + '%</b> ' + x(B.name) + '</span></div>';
  if(sim.tiePct > 0.001){
    h += '<div class="pe-note" style="margin-top:2px">Ties in ' + (sim.tiePct*100).toFixed(1) +
         '% of runs, which college football settles in overtime.</div>';
  }

  // Against the board's own number, if these two are on it.
  if(sim.line !== null){
    var lineTxt = (sim.line > 0 ? "+" : "") + sim.line;
    h += '<div class="pe-vsrow" style="margin-top:8px">' +
         '<div class="pe-vsv"><span class="pe-vsnum">' + (sim.coverAway*100).toFixed(1) + '%</span></div>' +
         '<div class="pe-vslab">covers ' + x(B.name) + ' ' + lineTxt + '</div>' +
         '<div class="pe-vsv"><span class="pe-vsnum">' + (sim.coverHome*100).toFixed(1) + '%</span></div></div>';
    var edge = Math.max(sim.coverAway, sim.coverHome);
    h += '<div class="pe-note" style="margin-top:2px">Your locked number is <b>' + lineTxt +
         '</b> on ' + x(B.name) + '. Break-even against a standard price is 52.4%; this side simulates at <b>' +
         (edge*100).toFixed(1) + '%</b>' +
         (edge >= 0.524 ? '.' : ', which does not clear it.') + '</div>';
  }

  // Where the outcomes land.
  h += '<div class="pe-simhist">';
  var buckets = [], BW = 7, LO = -35;
  for(var b = LO; b < -LO; b += BW) buckets.push({ lo: b, hi: b + BW, n: 0 });
  sim.margins.forEach(function(m){
    var i = Math.floor((m - LO) / BW);
    if(i < 0) i = 0;
    if(i >= buckets.length) i = buckets.length - 1;
    buckets[i].n++;
  });
  var peak = 1;
  buckets.forEach(function(b){ if(b.n > peak) peak = b.n; });
  buckets.forEach(function(b){
    var mid = (b.lo + b.hi) / 2;
    var pctv = 100 * b.n / sim.n;
    h += '<div class="pe-simrow">' +
         '<span class="pe-simk">' + (mid > 0 ? "+" : "") + Math.round(mid) + '</span>' +
         '<span class="pe-simtrack"><i class="' + (mid > 0 ? "hi" : "lo") + '" style="width:' +
         Math.round(100 * b.n / peak) + '%"></i></span>' +
         '<span class="pe-simpct">' + pctv.toFixed(0) + '%</span></div>';
  });
  h += '</div>';
  h += '<div class="pe-note" style="margin-top:2px">Margin from ' + x(B.name) + '\u2019s side. ' +
       'Middle half of outcomes: <b>' + (sim.p25 > 0 ? "+" : "") + sim.p25 + '</b> to <b>' +
       (sim.p75 > 0 ? "+" : "") + sim.p75 + '</b>.</div>';

  // Key numbers.
  var kn = [];
  PE_SIM_KEYS.forEach(function(k){
    kn.push('<b>' + k + '</b> ' + (100 * sim.keyHits[k] / sim.n).toFixed(1) + '%');
  });
  h += '<div class="pem-prov" style="margin-top:8px">Lands exactly on ' + kn.join(' \u00b7 ') + '</div>';

  // The honest caveat, in the panel rather than only in a chat message.
  h += '<div class="pe-note">The average above is the model\u2019s own prediction \u2014 running it ' +
       sim.n + ' times cannot move it, only describe the spread around it. That spread uses a standard ' +
       'deviation of <b>' + sim.sdMargin.toFixed(1) + '</b> pts on the margin' +
       (sim.assumed
         ? ', a long-run figure for college football, because there are not enough weeks yet to measure this model\u2019s own.'
         : (sim.blended
             ? (', part measured from this model\u2019s misses on ' + sim.residN +
                ' unseen games and ' + sim.blended + '% the long-run college football figure, because ' +
                sim.residN + ' games is not yet enough to pin it down alone.')
             : ', measured from this model\u2019s own misses on ' + sim.residN + ' games it had not seen.')) +
       '</div>';
  return h;
}

function pemVsHtml(){
  var teams = pemTeamList();
  var rows = pemCompareRows();
  var byId = {}; rows.forEach(function(r){ byId[r.id] = r; });

  // Default to the first game on this week's board — the matchup most likely
  // being looked up.
  if(!PE.ui.vsA && !PE.ui.vsB){
    var g0 = (PE.games || [])[0];
    if(g0 && g0.awayId && g0.homeId){ PE.ui.vsA = g0.awayId; PE.ui.vsB = g0.homeId; }
    else if(teams.length > 1){ PE.ui.vsA = teams[0].id; PE.ui.vsB = teams[1].id; }
  }
  var A = byId[PE.ui.vsA] || null, B = byId[PE.ui.vsB] || null;

  var h = '';
  // Two searches, one per side, so it is always clear which slot is changing.
  h += '<div class="pe-vspick">';
  [["a", A, PE.ui.vsA], ["b", B, PE.ui.vsB]].forEach(function(p){
    var slot = p[0], team = p[1];
    h += '<div class="pe-vsslot">' +
         '<input class="pe-vsin" id="pe-vs-' + slot + '" data-pe-vsslot="' + slot + '" ' +
         'placeholder="Search team\u2026" autocomplete="off" autocorrect="off" ' +
         'value="' + x(team ? team.name : "") + '">' +
         '<div class="pe-vsdrop" id="pe-vsdrop-' + slot + '"></div>' +
         '</div>';
  });
  h += '</div>';

  if(!A || !B){
    return h + '<div class="pe-note">Pick a team on each side to compare them.</div>';
  }

  var ranks = pemRanks();

  h += '<div class="pe-vshead"><div class="pe-vsname">' + x(A.name) + '</div>' +
       '<div class="pe-vsvs">vs</div>' +
       '<div class="pe-vsname">' + x(B.name) + '</div></div>';

  // If these two actually play this week, say so.
  var meet = null;
  (PE.games || []).forEach(function(g){
    var ids = [String(g.awayId), String(g.homeId)];
    if(ids.indexOf(String(A.id)) >= 0 && ids.indexOf(String(B.id)) >= 0) meet = g;
  });
  if(meet){
    h += '<div class="pem-slope">On this week\u2019s board: <b>' + x(meet.fav) + ' -' + meet.pool +
         '</b> at your locked number.</div>';
  }

  function section(title, keys){
    var s = '<div class="pe-vssec">' + title + '</div>';
    keys.forEach(function(k){ s += pemVsRow(k, A, B, ranks); });
    return s;
  }

  h += section("Ratings", ["rating", "spPlus", "off", "def", "margin", "yppMargin", "to", "sos"]);

  // Schedule summary, in the same two-sided shape.
  var ra = pemResume(A.id), rb = pemResume(B.id);
  h += '<div class="pe-vssec">Schedule</div>';
  h += '<div class="pe-vsrow"><div class="pe-vsv"><span class="pe-vsnum">' + A.w + '-' + A.l +
       '</span></div><div class="pe-vslab">Record</div>' +
       '<div class="pe-vsv"><span class="pe-vsnum">' + B.w + '-' + B.l + '</span></div></div>';
  function resLine(r, key){
    if(!r || !r[key]) return '<div class="pe-vsv"><span class="pe-vstxt">\u2014</span></div>';
    var g = r[key].r;
    return '<div class="pe-vsv"><span class="pe-vstxt">' + x(g.oppName) + '</span>' +
           '<span class="pe-vssub">' + g.pts + '\u2013' + g.oppPts + '</span></div>';
  }
  h += '<div class="pe-vsrow">' + resLine(ra, "best") +
       '<div class="pe-vslab">Best win</div>' + resLine(rb, "best") + '</div>';
  h += '<div class="pe-vsrow">' + resLine(ra, "worst") +
       '<div class="pe-vslab">Worst loss</div>' + resLine(rb, "worst") + '</div>';

  h += pemSimHtml(A, B);

  h += section("Offense", ["ppg", "ypg", "ypp", "plays", "third"]);
  h += section("Defense", ["papg", "yapg", "oppYpp", "oppPlays", "oppThird"]);
  h += section("Adjusted for schedule", ["appg", "apapg", "aypg", "ayapg"]);

  h += '<div class="pe-note">Ranks are out of the teams with a figure for that stat. ' +
       'Green is the better of the two. <b>Adjusted</b> rows account for who each team played; ' +
       'the plain ones do not.</div>';
  return h;
}

function pemCompareHtml(){
  var rows = pemCompareRows();
  if(!rows.length) return '<div class="pe-note">No teams yet.</div>';

  var setKey = PEM_COLSETS[PE.ui.cols] ? PE.ui.cols : "overview";
  var set = PEM_COLSETS[setKey];
  var COLS = set.cols;

  var sk = PE.ui.sortKey || "rating";
  var asc = (PE.ui.sortDir === "asc");
  var col = null;
  COLS.forEach(function(c){ if(c.key === sk) col = c; });
  // Switching sets can strand the sort on a column that is no longer shown.
  if(!col) { col = COLS[1]; sk = col.key; PE.ui.sortKey = sk; }
  var val = col.sort || function(t){ var v = t[sk]; return (v === null || v === undefined) ? null : v; };
  rows.sort(function(a, b){
    var x1 = val(a), x2 = val(b);
    // Teams missing a number sort last whichever way the column is pointing:
    // a blank is not "worst", it is unknown, and it should not lead the table.
    if(x1 === null && x2 === null) return a.name.localeCompare(b.name);
    if(x1 === null) return 1;
    if(x2 === null) return -1;
    // Descending means best first for a number, A-Z first for a name.
    if(typeof x1 === "string") return asc ? x1.localeCompare(x2) : x2.localeCompare(x1);
    return asc ? (x1 - x2) : (x2 - x1);
  });

  // Teams playing on this week's board, so they are easy to find in 136 rows.
  var onBoard = {};
  (PE.games||[]).forEach(function(g){
    if(g.awayId) onBoard[g.awayId] = 1;
    if(g.homeId) onBoard[g.homeId] = 1;
  });

  var h = '<div class="pe-seg pe-seg2">';
  ["overview","offense","defense","adjusted"].forEach(function(k){
    h += '<button class="pe-segb' + (k === setKey ? " on" : "") + '" data-pe-cols="' + k + '">' +
         PEM_COLSETS[k].lab + '</button>';
  });
  h += '</div>';
  h += '<div class="pe-note" style="margin-top:0">' + set.note + '</div>';
  h += '<div class="pe-tscroll"><table class="pe-tbl pe-cmp"><thead><tr>';
  COLS.forEach(function(c){
    var on = (c.key === sk);
    h += '<th class="pe-sortable' + (on ? " on" : "") + '" data-pe-sort="' + c.key + '"' +
         (c.hint ? (' title="' + x(c.hint) + '"') : '') + '>' +
         c.lab + (on ? ('<span class="pe-caret">' + (asc ? "\u25b4" : "\u25be") + '</span>') : '') + '</th>';
  });
  h += '</tr></thead><tbody>';
  rows.forEach(function(t){
    h += '<tr class="pe-cmprow' + (onBoard[t.id] ? " on" : "") + '" data-pe-team="' + x(t.id) + '">';
    COLS.forEach(function(c){
      if(c.fmt){ h += '<td>' + c.fmt(t) + '</td>'; return; }
      var v = t[c.key];
      var txt;
      if(v === null || v === undefined) txt = "\u2014";
      else if(c.pct) txt = Math.round(v * 100) + "%";
      else if(c.signed) txt = pemFmtSigned(v, c.dp === 0 ? 0 : (c.dp || 1));
      else txt = (c.dp === 0) ? String(Math.round(v)) : v.toFixed(c.dp || 1);
      h += '<td class="pe-num">' + txt + '</td>';
    });
    h += '</tr>';
  });
  h += '</tbody></table></div>';
  h += '<div class="pe-note">' + rows.length + ' teams.';
  if(setKey === "overview"){
    h += ' <b>Y/P</b> is the column to trust when it disagrees with <b>Pts</b> \u2014 yards per play is measured over ~140 snaps a game, points over a dozen possessions.';
  } else if(setKey === "adjusted"){
    var lg = (pemAdjRates() || {})._league;
    if(lg) h += ' League average is ' + lg.ppg.toFixed(1) + ' points and ' + Math.round(lg.ypg) +
                ' yards a game, so these are centred there.';
    h += ' <b>Sched</b> is the gap between the raw and adjusted yardage \u2014 how much of the raw number is the schedule.';
  } else {
    h += ' Raw per-game figures. Early in the season these say as much about the schedule as the team \u2014 <b>Adjusted</b> accounts for that.';
  }
  h += '</div>';
  return h;
}

function pemTeamLogHtml(){
  if(!PEM._games || !PEM._games.length){
    return '<div class="pe-note" style="margin-top:0">Build the score model first \u2014 the log is drawn from the season it downloads.</div>';
  }

    '<button class="pe-segb' + (mode === "all" ? " on" : "") + '" data-pe-tmode="all">All teams</button>' +
    '<button class="pe-segb' + (mode === "vs"  ? " on" : "") + '" data-pe-tmode="vs">Head to head</button>' +
    '<button class="pe-segb' + (mode === "one" ? " on" : "") + '" data-pe-tmode="one">One team</button>' +
    '</div>';
  if(mode === "all") return hh + pemCompareHtml();
  if(mode === "vs")  return hh + pemVsHtml();

    (PE.games||[]).forEach(function(g){ if(!first && g.homeId) first = g.homeId; });
    PE.ui.team = first || teams[0].id;
  }
  var sel = String(PE.ui.team);
  if(!teams.some(function(t){ return String(t.id) === sel; })) { sel = String(teams[0].id); PE.ui.team = sel; }

  var cov = pemStatCoverage(PEM._games);
  var h = hh;

  h += '<select class="pe-in" id="pe-teamsel" style="width:100%;margin-bottom:10px">';
  teams.forEach(function(t){
    h += '<option value="' + x(t.id) + '"' + (String(t.id) === sel ? " selected" : "") + '>' +

  var s = pemTeamSummary(sel);

  h += '<div class="pe-stat"><div class="pe-stat-val">' + pemFmtSigned(s.margin, 1) + '</div><div class="pe-stat-lab">Pts margin</div></div>';
  h += '<div class="pe-stat"><div class="pe-stat-val">' + (s.yppMargin !== null ? pemFmtSigned(s.yppMargin, 2) : "\u2014") +
       '</div><div class="pe-stat-lab">Yds/play margin</div></div>';
  h += '</div>';

  h += '<div class="pe-stats" style="margin-bottom:10px">';
  h += '<div class="pe-stat"><div class="pe-stat-val">' + (s.yardMargin !== null ? pemFmtSigned(s.yardMargin, 0) : "\u2014") +
       '</div><div class="pe-stat-lab">Yds margin/gm</div></div>';
  h += '<div class="pe-stat"><div class="pe-stat-val">' + (s.toMargin !== null ? pemFmtSigned(s.toMargin, 2) : "\u2014") +
       '</div><div class="pe-stat-lab">TO margin</div></div>';
  h += '<div class="pe-stat"><div class="pe-stat-val">' + (s.sos !== null ? pemFmtSigned(s.sos, 1) : "\u2014") +
       '</div><div class="pe-stat-lab">Avg opponent</div></div>';
  h += '</div>';

  // The line worth reading: where the scoreboard and the box score disagree.
  if(s.yppMargin !== null){
    var ptsPos = s.margin > 0, effPos = s.yppMargin > 0;
    if(ptsPos !== effPos){
      h += '<div class="pem-slope bad">Record and box score disagree. This team is ' +

           '. Points margin ' + pemFmtSigned(s.margin,1) + ', yards per play ' + pemFmtSigned(s.yppMargin,2) +
           '. The second number is the more repeatable of the two.</div>';
    }

  h += '<div class="pe-tscroll"><table class="pe-tbl pe-log"><thead><tr>' +

       '</tr></thead><tbody>';
  s.rows.forEach(function(r){
    var oppR = PEM.ratings && PEM.ratings[r.oppId];
    var oppRating = oppR ? (oppR.off - oppR.def) : null;
