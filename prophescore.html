    mae: Math.round(PEM.cv.mae*100)/100,
    se: PEM.cv.se ? Math.round(PEM.cv.se*100)/100 : null,
    n: PEM.cv.n, upto: (PE.season && PE.season.upto) || null
  };
  peSave();
  return true;
}

// ── POOL EDGE: SCORE MODEL PANEL ─────────────────────────────────────────────
// Knob definitions live in one place so adding another is a single entry.
var PEM_KNOBS = [
  { key:"hfa",     label:"Home edge",      min:0,   max:6,    step:0.25, fmt:function(v){ return v.toFixed(2) + " pts"; },
    lo:"none", hi:"6 pts",
    help:"A setting, not a fitted value — in September home teams are genuinely stronger, so fitting this absorbs their quality." },
  { key:"scale",   label:"Rating spread",   min:0.5, max:2.5,  step:0.05, fmt:function(v){ return v.toFixed(2) + "x"; },
    lo:"compressed", hi:"expanded",
    help:"Shrinkage squashes good and bad teams toward each other. Above 1 pushes them back apart. If the model calls every game close, raise this." },
  { key:"oppW",    label:"Opponent weight", min:0,   max:2,    step:0.05, fmt:function(v){ return v.toFixed(2) + "x"; },
    lo:"raw points", hi:"who you played matters most",
    help:"How much the opponent's quality shapes a rating. At 0 a 40-point game counts the same against anyone. At 1 it is a full opponent adjustment. Above 1, beating a good team counts extra." },
  { key:"toAdj",   label:"Turnover regression", min:0, max:1, step:0.05, fmt:function(v){ return Math.round(v*100) + "%"; },
    lo:"keep as played", hi:"strip it out",
    help:"Turnovers swing about 4.5 pts of margin each and barely repeat week to week. This removes that luck from the scores the ratings are fitted to. Needs box scores \u2014 use Load box scores." },
  { key:"priorW",  label:"Trust in SP+", min:0,   max:1,    step:0.05, fmt:function(v){ return Math.round(v*100) + "%"; },
    lo:"results only", hi:"SP+ only",

  { key:"carry",   label:"Last season carryover", min:0, max:1, step:0.05, fmt:function(v){ return Math.round(v*100) + "%"; },
    lo:"fresh start", hi:"same as last year",
    help:"When there's no SP+ sheet, each team starts from last season's final rating times this. The portal era makes it lower than it used to be; past seasons measure how much." },
  { key:"lambda",  label:"Shrinkage",      min:0,   max:0.08, step:0.005, fmt:function(v){ return (v*100).toFixed(1) + "%"; },
    lo:"trust results", hi:"heavy pull",

  { key:"cap",     label:"Blowout cap",    min:10,  max:45,   step:1,    fmt:function(v){ return v + " pts"; },

    lo:"hard cap", hi:"no cap",

// How closely the model's scale matches the market's. A slope well under 1
// means the model squashes everything toward a pick'em, which reads as
// "backwards" whenever a short line flips sign.
function pemScaleCheck(){
  var xs = [], ys = [];
  PE.games.forEach(function(g){
    if(!g.awayId || !g.homeId) return;
    var p = pemPredict(g.awayId, g.homeId, false);
    if(!p) return;
    var fm = (g.favIsHome === false) ? (p.away - p.home) : (p.home - p.away);
    xs.push(g.mkt); ys.push(fm);
  });
  if(xs.length < 4) return null;
  var n = xs.length, mx = 0, my = 0;
  xs.forEach(function(v){ mx += v; }); mx /= n;
  ys.forEach(function(v){ my += v; }); my /= n;
  var sxy = 0, sxx = 0;
  for(var i=0;i<n;i++){ sxy += (xs[i]-mx)*(ys[i]-my); sxx += (xs[i]-mx)*(xs[i]-mx); }
  if(!sxx) return null;
  return { slope: sxy/sxx, n: n };
}

// Strength of schedule faced, per team, in points. This is what "who was it
// against" looks like once the model has been fitted: the average quality of
// the opponents a team has already played.
function pemSOS(){
  if(!PEM.ratings || !PEM._games) return null;
  var rate = function(t){ return t ? (t.off - t.def) : null; };
  var faced = {};
  PEM._games.forEach(function(g){
    var A = PEM.ratings[g.awayId], H = PEM.ratings[g.homeId];
    if(!A || !H) return;
    (faced[g.awayId] = faced[g.awayId] || []).push(rate(H));
    (faced[g.homeId] = faced[g.homeId] || []).push(rate(A));
  });
  var out = [], seen = {};
  PE.games.forEach(function(g){
    [[g.fav, g.favIsHome === false ? g.awayId : g.homeId],
     [g.dog, g.favIsHome === false ? g.homeId : g.awayId]].forEach(function(pair){
      var name = pair[0], id = pair[1];
      if(!id || seen[id]) return;
      seen[id] = 1;
      var t = PEM.ratings[id]; if(!t) return;
      var f = faced[id] || [];
      var s = 0; f.forEach(function(v){ s += v; });
      out.push({ name:name, rating: rate(t), sos: f.length ? s/f.length : 0, n: f.length });
    });
  });
  if(!out.length) return null;
  out.sort(function(a,b){ return b.sos - a.sos; });
  return out;
}

// Coordinate descent over the knobs. One pass per knob, repeated twice.
// Runs one knob per tick so the page keeps painting. onStep gets
// (done, total, knobLabel); done gets the same shape pemAutoTune returned.
function pemAutoTuneAsync(onStep, done){
  if(!PEM._games){ done && done(null); return; }
  // Two passes is worth it while the sweeps are cheap. Once the season fills in
  // the second pass costs seconds and almost never changes an answer.
  var passes = PEM._games.length > 350 ? 1 : 2;
  var keys = [];
  for(var p=0; p<passes; p++){
    PEM_KNOBS.forEach(function(k){
      if(!pemKnobTunable(k.key)) return;
      keys.push(k);
    });
  }
  var i = 0, best = null;
  function step(){
    if(i >= keys.length){
      pemRefit();
      if(best && PEM.cv) best.n = PEM.cv.n;
      done && done(best);
      return;
    }
    var k = keys[i++];
    var r = pemTuneOne(k.key);
    if(r) best = r;
    onStep && onStep(i, keys.length, k.label || k.key);
    setTimeout(step, 0);
  }
  setTimeout(step, 0);
}

var PEM_GRID = {
    hfa:     [0,0.5,1,1.5,2,2.5,3,3.5,4],
    scale:   [0.6,0.8,1,1.2,1.4,1.6,1.9,2.2],
    oppW:    [0,0.35,0.6,0.85,1,1.2,1.45,1.75],
    toAdj:   [0,0.25,0.5,0.75,1],
    priorW:  [0,0.2,0.35,0.5,0.65,0.8,1],
    lambda:  [0,0.005,0.01,0.02,0.035,0.05,0.07],
    cap:     [14,17,21,24,28,35,45],
    recency: [0,0.25,0.5,0.75,1],
    carry:   [0,0.2,0.35,0.5,0.65,0.8,1],
    capSlope:[0,0.1,0.2,0.35,0.5,0.75,1]
};

function pemAutoTune(){
  if(!PEM._games) return null;
  var best = null;
  for(var pass=0; pass<2; pass++){
    PEM_KNOBS.forEach(function(k){
      var r = pemTuneOne(k.key);
      if(r) best = r;
    });
  }
  pemRefit();
  if(best && PEM.cv) best.n = PEM.cv.n;
  return best;
}

// One knob, swept and settled. Shared by the blocking and async tuners so they
// cannot disagree about what "best" means.
function pemTuneOne(key){
  var grid = PEM_GRID;
  if(!PEM._games) return null;
  if(!pemKnobTunable(key)) return null;
  var vals = grid[key]; if(!vals) return null;
  var best = null;
  (function(k){
      var res = pemSweep(k.key, vals, true);
      var bv = null, bm = Infinity, bErr = null;
      res.forEach(function(r){
        if(r.mae !== null && r.mae < bm){ bm = r.mae; bv = r.v; bErr = r.errs; }
      });
      if(bv === null) return;
      // One-standard-error rule. The lowest score on a sweep is usually the
      // luckiest one, not the best one \u2014 taking it verbatim is what pins every
      // knob to a grid edge. So among the values that are within one PAIRED
      // standard error of the winner \u2014 statistically tied with it \u2014 keep the
      // one nearest the default. A real effect still wins; a lucky one does not.
      var home = (PEM_DEFAULTS && typeof PEM_DEFAULTS[k.key] === "number") ? PEM_DEFAULTS[k.key] : bv;

}

// ── RECORD VS VEGAS ──────────────────────────────────────────────────────────
// Closing lines for finished games come from the same ESPN summary the box
// scores use, cached by event id in PE.lines as [homeSpread, total] (homeSpread
// negative = home favoured; null = no line posted).
function pemParseLine(d){
  var pcs = (d && d.pickcenter) || [];
  var comps = ((((d||{}).header||{}).competitions||[])[0]||{}).competitors || [];
  var abbr = {};
  comps.forEach(function(c){ var t = c.team || {}; if(t.abbreviation) abbr[String(t.abbreviation).toUpperCase()] = c.homeAway; });
  for(var i = 0; i < pcs.length; i++){
    var pc = pcs[i] || {}, sp = parseFloat(pc.spread), ou = parseFloat(pc.overUnder), det = String(pc.details || "");
    var total = isFinite(ou) ? ou : null;
    if(/^(EVEN|PK|PICK)/i.test(det)) return [0, total];
    var hf = pc.homeTeamOdds && pc.homeTeamOdds.favorite, af = pc.awayTeamOdds && pc.awayTeamOdds.favorite;
    if(isFinite(sp)){
      var a = Math.abs(sp);
      if(hf) return [-a, total];
      if(af) return [a, total];
    }
    var m = det.match(/^\s*([A-Za-z&.'-]+)\s+(-?\d+(?:\.\d+)?)/);
    if(m){
      var side = abbr[m[1].toUpperCase()], v = Math.abs(parseFloat(m[2]));
      if(side === "home") return [-v, total];
      if(side === "away") return [v, total];
    }
    if(isFinite(sp)) return [sp, total];      // ESPN's own sign: the home team's number
  }
  return null;
}
var PEM_LINES = { busy: false, tried: false };

}
// Fetch any missing lines in the background (once per session unless asked).
function pemEnsureLines(force){
  if(PEM_LINES.busy || (!force && PEM_LINES.tried) || !PEM._games) return;
  var todo = pemLinesMissing();
  PEM_LINES.tried = true;
  if(!todo.length) return;
  PEM_LINES.busy = true; PEM_LINES.done = 0; PEM_LINES.total = todo.length;
  PE.lines = PE.lines || {};
  pemPool(todo, 8, function(g, next){
    function fin(){ PEM_LINES.done++; if(PEM_LINES.done % 25 === 0){ PEM._ats = null; pemAtsRefresh(); } next(); }
    fetch("https://site.api.espn.com/apis/site/v2/sports/football/college-football/summary?event=" + g.eventId)
      .then(function(r){ return r.json(); })
      .then(function(d){ PE.lines[g.eventId] = pemParseLine(d); fin(); })
      .catch(function(){ fin(); });                   // leave undefined: retried next session
  }, function(){

}
// Each week's games predicted by a fit on the weeks before it, with the current
// settings, then graded against the closing line.
function pemAts(){
  if(!PEM._games || !PEM._games.length) return null;
  var L = PE.lines || {};
  var key = PEM._games.length + "|" + JSON.stringify(pemOptsSnapshot()) + "|" + Object.keys(L).length + "|" + (PEM.priorN||0);
  if(PEM._ats && PEM._ats.key === key && PEM._ats.games === PEM._games) return PEM._ats.v;
  var weeks = {}; PEM._games.forEach(function(g){ weeks[g.week] = 1; });
  var ws = Object.keys(weeks).map(Number).sort(function(a, b){ return a - b; });
  var r = { w:0, l:0, p:0, sw:0, sl:0, sp:0, lined:0, weeks:0, su:0, suN:0, noplay:0,
            total: PEM._games.length, early:0, earlyWeeks:[], noLine:0, pending:0 };
  PEM._games.forEach(function(g){ var v = L[g.eventId]; if(v === null) r.noLine++; else if(v === undefined) r.pending++; });
  ws.forEach(function(w){
    var train = PEM._games.filter(function(g){ return g.week < w; });
    var test  = PEM._games.filter(function(g){ return g.week === w && L[g.eventId]; });
    if(train.length < 30){ r.early += test.length; if(test.length) r.earlyWeeks.push(w); return; }
    if(!test.length) return;
    var fit = pemFit(train, pemPriorAt(w, PEM.opts), PEM.opts), any = false;
    test.forEach(function(g){
      var p = pemPredictRaw(fit.ratings, fit.avg, PEM.opts.hfa, g.awayId, g.homeId, g.neutral, PEM.opts.oppW);
      if(!p) return;
      var vHome = -L[g.eventId][0];                 // Vegas' expected home margin
      var pred = p.home - p.away, act = g.hs - g.as;
      r.lined++; any = true;
      if(pred !== 0){ r.suN++; if((pred > 0) === (act > 0)) r.su++; }
      if(Math.abs(pred - vHome) < 0.05){ r.noplay++; return; }   // model agrees with the line: no play
      var pickHome = pred > vHome, cover = act - vHome, strong = Math.abs(pred - vHome) >= 3;
      if(cover === 0){ r.p++; if(strong) r.sp++; return; }
      var won = (cover > 0) === pickHome;
      if(won){ r.w++; if(strong) r.sw++; } else { r.l++; if(strong) r.sl++; }
    });

  r.pct = (r.w + r.l) ? r.w / (r.w + r.l) : null;

}

// ── AUTO-FIT ─────────────────────────────────────────────────────────────────
// Finds the settings with the lowest honest error over every result pulled so
// far. "Honest" = the same rolling test as the CV score: fit on the weeks before,
// predict the next week's games cold. Each input is swept over its range, then
// the search zooms in around the winner; passes repeat over all inputs until
// nothing improves. Runs by itself whenever the data changes.
function pemKnob(key){ var r = null; PEM_KNOBS.forEach(function(k){ if(k.key === key) r = k; }); return r; }
function pemSnap(v, kd){
  v = Math.round(v / kd.step) * kd.step;
  return +Math.max(kd.min, Math.min(kd.max, v)).toFixed(4);
}
// One input, swept then zoomed in. Each setting is scored in its own tick so a
// phone stays responsive while thousands of past games are replayed.
function pemTuneBest(key, cb){
  var kd = pemKnob(key), grid = PEM_GRID[key];
  if(!kd || !grid || !PEM._games || !pemKnobTunable(key)){ cb(null); return; }
  var cur = PEM.opts[key];
  var vals = grid.slice(); if(vals.indexOf(cur) < 0) vals.push(cur);
  function run(list, done){
    var out = [], k = 0;
    (function next(){
      if(k >= list.length){ done(out); return; }
      var r = (pemSweep(key, [list[k++]], false) || [])[0]; if(r) out.push(r);
      setTimeout(next, 0);
    })();
  }
  run(vals, function(res){
    var bestV = cur, bestM = Infinity;
    res.forEach(function(r){ if(r.v === cur && r.mae !== null) bestM = r.mae; });
    // Only move off the current value for a real (if small) improvement.
    res.forEach(function(r){ if(r.mae !== null && r.mae < bestM - 1e-4){ bestM = r.mae; bestV = r.v; } });
    // Zoom in between the winner's neighbours on the grid.
    var sorted = vals.slice().sort(function(a, b){ return a - b; }), i = sorted.indexOf(bestV);
    var lo = i > 0 ? sorted[i-1] : bestV, hi = i < sorted.length - 1 ? sorted[i+1] : bestV, fine = [];
    for(var f = 1; f <= 4; f++){
      [pemSnap(bestV + (lo - bestV) * f / 5, kd), pemSnap(bestV + (hi - bestV) * f / 5, kd)].forEach(function(v){
        if(v !== bestV && vals.indexOf(v) < 0 && fine.indexOf(v) < 0) fine.push(v);
      });
    }
    run(fine, function(res2){
      res2.forEach(function(r){ if(r.mae !== null && r.mae < bestM - 1e-4){ bestM = r.mae; bestV = r.v; } });
      PEM.opts[key] = bestV;
      cb({ v: bestV, mae: bestM === Infinity ? null : bestM, changed: bestV !== cur });
    });
  });
}
function pemAutoFit(onStep, done){
  if(!PEM._games || !PEM._games.length){ done && done(null); return; }
  var keys = PEM_KNOBS.filter(function(k){ return pemKnobTunable(k.key); }).map(function(k){ return k.key; });
  var start = pemObjMae(PEM.opts), startM = start ? start.mae : null;
  var MAXP = 4, pass = 0, i = 0, passStart = startM, cur = startM;
  function step(){
    if(i >= keys.length){
      pass++; i = 0;
      var gain = (passStart != null && cur != null) ? passStart - cur : 0;
      passStart = cur;
      if(pass >= MAXP || gain < 0.002){
        pemRefit();
        var fin = pemObjMae(PEM.opts);
        done && done({ before: startM, after: fin ? fin.mae : cur, n: fin ? fin.n : 0, passes: pass });
        return;
      }
    }
    var key = keys[i++];
    onStep && onStep(pass * keys.length + i, keys.length * MAXP, (pemKnob(key) || {}).label || key, pass + 1);
    pemTuneBest(key, function(r){
      if(r && r.mae != null) cur = r.mae;

    });

}

        PEM.priorSrc = "SP+ \u00b7 " + pePriorKey();
        PEM.priorAt = Date.now(); PEM.priorStale = false;
        if(!PEM.opts.priorW) PEM.opts.priorW = 0.55;
        pemSaveOpts();
        pemRefit();
        el.remove();
        if(typeof pemRepaint === "function" && document.getElementById("pem-panel")) pemRepaint();
        else renderPoolEdge();
        var extra = (res.matched < lines * 0.6)
          ? " \u00b7 more will match once the model is built"
          : (res.missed.length ? (" \u00b7 " + res.missed.length + " unmatched") : "");
        toast(res.matched + " of " + lines + " teams matched" + extra, "ok");
      } else {
        // Saved but unmatched: say so plainly rather than losing the paste.
        if(st) st.innerHTML = "<b>Saved, but no names matched yet.</b> " +
          (pemNameCount()
            ? "Team names are matched against ESPN\u2019s \u2014 try \u201cOhio State\u201d rather than an abbreviation."
            : "Team names aren\u2019t loaded. Build the score model and these will be matched automatically.");
      }
    }

    if(pemNameCount() < 100){
      if(st) st.textContent = "Loading team names\u2026";
      goBtn.disabled = true;
      pemEnsureNameMap(function(){
        goBtn.disabled = false;
        finish();                 // proceed regardless; finish() copes with a thin map
      });
      return;
    }
    finish();
  });
}

// The weekly pick board (imports, market lines, W/L grading, calibration) is

           '<pre>"prophescore": {\n  "$uid": {\n    ".read":  "auth != null &amp;&amp; auth.uid === $uid",\n    ".write": "auth != null &amp;&amp; auth.uid === $uid"\n  }\n}</pre>' +
           '<div class="pe-rulenote">Same level as "users" and "groups". Until it is there, everything here lives only on this device.</div></div>';
    }
  }

  // ── Setup bar. Four things the week needs, each one tap, status on the right.
  //    Ratings sits first because it is the input that is pasted every week.
  var pr = pePriorLatest(pePriorKey());

  var priorStale = priorReady && pr.key !== pePriorKey();
  var linesAt = null;
  PE.games.forEach(function(g){
    if(g.hist && g.hist.length > 1){
      var t = g.hist[g.hist.length-1].t;

  function setupRow(id, icon, label, status, state){

      var toward = (e.reason === "delta") ? (e.side === "fav" ? g.fav : g.dog) : null;
      var up = (e.side === "fav");
      var pct2 = Math.max(6, Math.round((e.score / (maxScore||1)) * 100));

      var openCard = !!(PE.ui.open && PE.ui.open[g.id]);
      var mp = null, favM = null, mDiff = null, mPickTeam = null, mPickLine = null, mAgrees = true;
      if(PEM.ratings && g.awayId && g.homeId){
        mp = pemPredict(g.awayId, g.homeId, false);
        if(mp){
          favM = Math.round(((g.favIsHome === false) ? (mp.away - mp.home) : (mp.home - mp.away))*10)/10;
          mDiff = Math.round((favM - g.mkt)*10)/10;
          // Which side would the model take AT the market number?
          if(favM > g.mkt){ mPickTeam = g.fav; mPickLine = -favM; }
          else            { mPickTeam = g.dog; mPickLine =  favM; }

        }
      }
      function peFmtLine(v){ return (v >= 0 ? "+" : "") + (Math.round(v*10)/10); }

      // Collapsed by default so the whole board reads at a glance; the detail
      // is one tap away rather than always on screen.
      h += '<details class="pe-card ' + tier + (g.result ? " done" : "") + '" data-pe-card="' + x(g.id) + '"' + (openCard ? " open" : "") + '>';
      var _vs = (g.favIsHome === true)  ? (x(g.dog) + ' at ' + x(g.fav))
              : (g.favIsHome === false) ? (x(g.fav) + ' at ' + x(g.dog))
              : (x(g.fav) + ' vs ' + x(g.dog));

      h += '<summary class="pe-sum">';
      h += '<span class="pe-rank">' + conf + '</span>';
      h += '<span class="pe-smain">';
      h +=   '<span class="pe-sr1">';
      if(mPickTeam){
        // Model leads. Without a model there is nothing to promote, so the

        h +=   '<span class="pe-tagsm">Model</span>';
        h +=   '<span class="pe-team' + (mAgrees ? "" : " dis") + '">' + x(mPickTeam) + '</span>';
        h +=   '<span class="pe-num' + (mAgrees ? "" : " dis") + '">' + peFmtLine(mPickLine) + '</span>';
      } else {
        h +=   '<span class="pe-team">' + x(e.team) + '</span>';

      }
      h +=   '</span>';
      h +=   '<span class="pe-sr2">';
      h +=     '<span class="pe-vs">' + _vs + '</span>';
      h +=     '<span class="pe-minibar"><i style="width:' + pct2 + '%"></i></span>';
      if(mPickTeam){
        var hTeam = (g.favIsHome === true) ? g.fav : ((g.favIsHome === false) ? g.dog : null);
        var hLine = (g.favIsHome === true) ? -g.pool : ((g.favIsHome === false) ? g.pool : null);
        if(hTeam !== null){
          var edgeOnHome = (e.team === hTeam);
          h += '<span class="pe-mpick">' +
               '<span class="pe-edgelab">Line</span> ' +
               '<b class="' + (edgeOnHome ? "pe-edgeon" : "") + '">' + x(hTeam) + '</b> ' +
               peFmtLine(hLine) + '</span>';
        } else {
          h += '<span class="pe-mpick">' +
               '<span class="pe-edgelab">Line</span> <b>' + x(e.team) + '</b> ' + e.number + '</span>';
        }
      }
      h +=   '</span>';
      h += '</span>';
      if(g.result){

        h += '<span class="pe-mini" data-pe-res="L" data-pe-id="' + x(g.id) + '">L</span>';
      }
      h += '<span class="pe-carrow">&rsaquo;</span>';
      h += '</summary>';

      h += '<div class="pe-cbody">';
      h += '<div class="pe-move">';
      h += peSpark(g, up);
      if(e.reason === "delta"){
        h += '<span class="pe-delta ' + (up?"up":"dn") + '">' + e.mag + ' pt &rarr; ' + x(toward) + '</span>';
      } else {

      h += '</div>';

      if(sigs.length){
        h += '<div class="pe-sigs">' + sigs.map(function(s){
          return '<span class="pe-tag ' + s.tone + '">' + x(s.label) + '</span>';

      }

      if(mp){
        h += '<div class="pe-model' + (mAgrees ? "" : " big") + '">';
        h += '<span class="pe-mlab">Model picks</span>';
        h += '<span class="pe-mpickbig">' + x(mPickTeam) + ' ' + peFmtLine(mPickLine) + '</span>';
        h += '<span class="pe-sp"></span>';
        h += '<span class="pe-mscore">' + Math.round(mp.away) + '&ndash;' + Math.round(mp.home) + '</span>';
        h += '</div>';
        if(!mAgrees){
          h += '<div class="pe-mnote">The model and your line edge disagree. <b>W/L grades your pool pick, ' +
               x(e.team) + ' ' + e.number + '</b> \u2014 the board ranking is still line edge, not the model.</div>';
        }
      }

      h += '<div class="pe-ft">';

      h += '<input class="pe-mkt" type="number" step="0.25" inputmode="decimal" value="' + g.mkt + '" data-pe-mkt="' + x(g.id) + '">';
      h += '<span class="pe-sp"></span>';
      h += '<button class="pe-mini ghost" data-pe-del="' + x(g.id) + '" title="Remove">&minus;</button>';
      h += '</div>';
      h += '</div>';

      h += '</details>';
    });
    h += '<div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:4px">';
    h += '<button class="btn btn-ghost btn-sm" id="pe-bank">Bank week &amp; clear</button>';
    h += '<button class="btn btn-ghost btn-sm" id="pe-clear">Clear</button>';
    h += '</div>';
  }

  }   // PE_SHOW_BOARD

  // ── Everything else folds away ───────────────────────────────────────────
  function fold(id, title, sub, open, body){
    return '<details class="pe-fold" id="' + id + '"' + (open ? " open" : "") + '>' +
           '<summary><span class="pe-fname">' + title + '</span>' +
           '<span class="pe-fsub">' + sub + '</span>' +
           '<span class="pe-farrow">&rsaquo;</span></summary>' +
           '<div class="pe-fbody">' + body + '</div></details>';
  }

  var adjSub = PEM.ratings
      ? ((PEM.cv ? PEM.cv.mae.toFixed(1) + " err" : "") + " · " + PEM_KNOBS.length + " inputs")
      : "build the model first";
  h += pemPanelHtml();

  if(PE_SHOW_BOARD){

  var _tl = PEM._games ? pemStatCoverage(PEM._games) : null;
  var logSub = !PEM._games ? "build the model first"
      : ((_tl && _tl.total) ? (_tl.total + " games with box scores")
                            : (PEM._games.length + " games \u00b7 no box scores yet"));
  h += fold("pe-fold-log", "Team season logs", logSub, PE.ui.log, pemTeamLogHtml());

  var n = graded.length;
  var cal = '<table class="pe-tbl"><thead><tr><th>Confidence tier</th><th>Record</th><th>Hit %</th></tr></thead><tbody>';
  [ {name:"High (top third)",   test:function(v){ return v.conf >  v.max*2/3; }},
    {name:"Middle",             test:function(v){ return v.conf <= v.max*2/3 && v.conf > v.max/3; }},
    {name:"Low (bottom third)", test:function(v){ return v.conf <= v.max/3; }} ].forEach(function(t){
    var set = graded.filter(t.test);
    var tw = set.filter(function(v){ return v.result==="W"; }).length;
    var tl = set.filter(function(v){ return v.result==="L"; }).length;
    cal += '<tr><td>' + t.name + '</td><td>' + tw + '-' + tl + '</td><td>' + ((tw+tl)?(100*tw/(tw+tl)).toFixed(1)+"%":"—") + '</td></tr>';
  });
  cal += '</tbody></table>';
  cal += '<div class="pe-note">' + (n < 200
      ? (n + ' graded picks. Roughly ' + (200-n) + ' more before this table means much — high should beat low if the delta is doing any work.')
      : (n + ' graded picks. Large enough to read. If high does not beat low, the edge ranking is not working.')) + '</div>';
  cal += '<div class="pe-note">Breakeven against a standard spread is 52.4%. Telling a 57% system from a coin flip takes roughly 200 graded picks — about two seasons at ten a week.</div>';
  h += fold("pe-fold-calib", "Calibration", (n ? n + " graded" : "no picks graded yet"), PE.ui.calib, cal);

  var addBody = '<div class="pe-form">' +
    '<div><label class="pe-lab" for="pe-fav">Favourite</label><input class="pe-in" id="pe-fav" placeholder="Michigan" autocorrect="off"></div>' +
    '<div><label class="pe-lab" for="pe-dog">Underdog</label><input class="pe-in" id="pe-dog" placeholder="Iowa" autocorrect="off"></div>' +
    '<div><label class="pe-lab" for="pe-pool">Your locked #</label><input class="pe-in" id="pe-pool" type="number" step="0.5" inputmode="decimal" placeholder="4.5"></div>' +
    '<div><label class="pe-lab" for="pe-mkt">Current market</label><input class="pe-in" id="pe-mkt" type="number" step="0.5" inputmode="decimal" placeholder="5.5"></div>' +
    '</div>' +
    '<div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:10px">' +
    '<button class="btn btn-gold btn-sm" id="pe-add">Add to board</button>' +
    '<button class="btn btn-ghost btn-sm" id="pe-example">Load sample week</button></div>';
  h += fold("pe-fold-add", "Add a game by hand", "rarely needed", PE.ui.add, addBody);
  }   // PE_SHOW_BOARD

  h += '</div>';
  render(h);

  // Remember which sections are open, without re-rendering and losing scroll.
  [["pe-fold-adj","adj"],["pe-fold-log","log"],["pe-fold-calib","calib"],["pe-fold-add","add"]].forEach(function(p){

    if(el) el.addEventListener("toggle", function(){ PE.ui[p[1]] = el.open; });
  });

  document.getElementById("pe-back").addEventListener("click", function(){
    SC.screen = "profile"; draw();
  });

  var topPaste = document.getElementById("pe-paste-top");
  if(topPaste) topPaste.addEventListener("click", function(){ pemShowPasteModal(); });

  var addBtn = document.getElementById("pe-add");
  if(addBtn) addBtn.addEventListener("click", function(){
    var fav = (document.getElementById("pe-fav").value||"").trim();
    var dog = (document.getElementById("pe-dog").value||"").trim();
    var pool = parseFloat(document.getElementById("pe-pool").value);
    var mkt  = parseFloat(document.getElementById("pe-mkt").value);
    if(!fav || !dog || isNaN(pool) || isNaN(mkt)){
      toast("Need both teams, your number, and the market number","warn"); return;
    }
    PE.games.push({
      id: "g" + Date.now() + Math.random().toString(36).slice(2,6),
      fav: fav, dog: dog, pool: Math.abs(pool), mkt: Math.abs(mkt),
      model: null, result: null
    });
    PE.ui.add = true;
    peSave(); renderPoolEdge();
    var f = document.getElementById("pe-fav"); if(f) f.focus();
  });

  // Everything inside the team fold repaints just that fold. A full re-render
  // collapses the page to the top and loses the scroll position, which makes
  // sorting a 136-row table unusable.
  function peRepaintTeams(){
    var box = document.querySelector("#pe-fold-log .pe-fbody");
    if(box){ box.innerHTML = pemTeamLogHtml(); peBindTeams(); }
    else renderPoolEdge();
  }
  function peBindTeams(){
    var t = document.getElementById("pe-teamsel");
    if(t) t.addEventListener("change", function(){
      PE.ui.team = this.value;
      peRepaintTeams();
    });

    Array.prototype.forEach.call(document.querySelectorAll("[data-pe-tmode]"), function(b){
      b.addEventListener("click", function(){
        PE.ui.tmode = this.getAttribute("data-pe-tmode");
        peRepaintTeams();
      });
    });

    // The search must not repaint the fold while someone is typing, or the
    // input is torn out from under the caret on every keystroke. Only the
    // dropdown beneath it is rewritten; the whole view repaints once a team is
    // actually chosen.
    Array.prototype.forEach.call(document.querySelectorAll("[data-pe-vsslot]"), function(inp){
      var slot = inp.getAttribute("data-pe-vsslot");
      var drop = document.getElementById("pe-vsdrop-" + slot);
      if(!drop) return;

      function close(){ drop.innerHTML = ""; drop.classList.remove("open"); }

      function show(){
        var q = String(inp.value || "").trim().toLowerCase();
        var teams = pemTeamList();
        var hits = teams.filter(function(t){
          if(!q) return true;
          var n = String(t.name || "").toLowerCase();
          // Prefix first, then anywhere: typing "mia" should reach Miami before
          // anything that merely contains those letters.
          return n.indexOf(q) >= 0;
        });
        hits.sort(function(a, b){
          var an = String(a.name||"").toLowerCase(), bn = String(b.name||"").toLowerCase();
          var ap = an.indexOf(q) === 0 ? 0 : 1, bp = bn.indexOf(q) === 0 ? 0 : 1;
          if(ap !== bp) return ap - bp;
          if(a.rating === null && b.rating === null) return an.localeCompare(bn);
          if(a.rating === null) return 1;
          if(b.rating === null) return -1;
          return b.rating - a.rating;
        });
        if(!hits.length){ drop.innerHTML = '<div class="pe-vsno">No team matches</div>'; drop.classList.add("open"); return; }
        var html = "";
        hits.slice(0, 40).forEach(function(t){
          html += '<button class="pe-vsopt" data-pe-pick="' + x(t.id) + '" data-pe-slot="' + slot + '">' +
                  '<span>' + x(t.name) + '</span>' +
                  (t.rating !== null ? '<b>' + pemFmtSigned(t.rating, 1) + '</b>' : '') + '</button>';
        });
        drop.innerHTML = html;
        drop.classList.add("open");
        Array.prototype.forEach.call(drop.querySelectorAll("[data-pe-pick]"), function(b){
          b.addEventListener("mousedown", function(e){ e.preventDefault(); });   // keep focus off blur
          b.addEventListener("click", function(){
            if(slot === "a") PE.ui.vsA = this.getAttribute("data-pe-pick");
            else PE.ui.vsB = this.getAttribute("data-pe-pick");
            close();
            peRepaintTeams();
          });
        });
      }

      inp.addEventListener("input", show);
      inp.addEventListener("focus", function(){ this.select(); show(); });
      // A blur that is not a pick should restore the name, not leave a half-typed
      // query sitting in a box that no longer matches what is shown.
      inp.addEventListener("blur", function(){
        var self = this;
        setTimeout(function(){
          close();
          var id = (slot === "a") ? PE.ui.vsA : PE.ui.vsB;
          var t = null;
          pemTeamList().forEach(function(q){ if(String(q.id) === String(id)) t = q; });
          self.value = t ? t.name : "";
        }, 150);
      });
    });

    Array.prototype.forEach.call(document.querySelectorAll("[data-pe-cols]"), function(b){
      b.addEventListener("click", function(){
        PE.ui.cols = this.getAttribute("data-pe-cols");
        peRepaintTeams();
      });
    });

    Array.prototype.forEach.call(document.querySelectorAll("[data-pe-sort]"), function(th){
      th.addEventListener("click", function(){
        var k = this.getAttribute("data-pe-sort");
        // Same column again flips direction; a new column starts descending,

// ── GAMES & MATCHUP CARD (PEAR-style) ────────────────────────────────────────
// Every FBS game for a week comes straight from ESPN's scoreboard, so any game

var PEAR = { year:null, week:null, curWeek:null, curYear:null, weeks:null, games:null,

var PEAR_SCORE = "https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard";

}
function pearName(id){
  var i = PEAR.info[id];

// ESPN's full name carries the mascot ("Utah Utes"). The short-name list is the

var PEAR_MASCOT2 = ["Fighting Irish","Tar Heels","Nittany Lions","Crimson Tide","Blue Devils","Yellow Jackets",

function pearAbbr(id){ var i = PEAR.info[id]; return (i && i.abbr) || pearName(id).slice(0,4).toUpperCase(); }

function pearAbsorbTeam(t){

  var id = String(t.id), cur = PEAR.info[id] || {};

    loc: t.location || cur.loc || t.shortDisplayName || "",
    abbr: t.abbreviation || cur.abbr || "",

// Short names and logos for every FBS team, cached for a week.
// ── FBS only ─
// The FBS set comes only from ESPN's FBS team list (groups=80). Schedules can't
// be used for this: an FBS schedule includes its FCS opponents.
PEAR.fbs = null;
function pearLoadFbs(cb, retry){
  if(PEAR.fbs){ if(cb) cb(); return; }
  if(PEAR._fbsFailed && !retry){ if(cb) cb(); return; }   // don't hammer ESPN; "Try again" retries
  PEAR._fbsFailed = false;
  try{
    var c = JSON.parse(localStorage.getItem("pear_fbs4") || "null");
    if(c && c.ts && Date.now() - c.ts < 7*864e5 && c.ids && c.ids.length >= 125 && c.ids.length <= 145){
      PEAR.fbs = {}; c.ids.forEach(function(id){ PEAR.fbs[id] = 1; }); PEAR.fbsSrc = c.src || ""; PEAR.conf = c.conf || {}; PEAR.confTop = c.confTop || {}; PEAR.div = c.div || {}; if(cb) cb(); return;
    }
  }catch(e){}
  try{ localStorage.removeItem("pear_fbs"); }catch(e){}
  if(PEAR._fbsLoading){ if(cb) (PEAR._fbsWait = PEAR._fbsWait || []).push(cb); return; }
  PEAR._fbsLoading = true; PEAR.fbsErr = "";
  function finish(){ PEAR._fbsLoading = false; var w = PEAR._fbsWait || []; PEAR._fbsWait = []; if(cb) cb(); w.forEach(function(f){ f(); }); }
  var BASE = "https://site.api.espn.com/apis/v2/sports/football/college-football/standings";

    var out = {};

    var DIV = /(?:^|[\s-])(East|West|North|South|Mountain|Pacific|Coastal|Atlantic)(?: Division)?$/i;
    (function walk(n, parent){
      if(!n) return;

      ((n.standings && n.standings.entries) || []).forEach(function(e){ var t = e.team || {}; if(t.id){ var id = String(t.id); out[id] = 1; pearAbsorbTeam(t);
        if(n.name){

          var isDiv = DIV.test(n.name) && parent && parent.name;
          (PEAR.confTop = PEAR.confTop || {})[id] = isDiv ? parent.name : n.name;
          if(isDiv) (PEAR.div = PEAR.div || {})[id] = n.name;

    })(d, null);

  function ok(ids){ return ids.length >= 125 && ids.length <= 145; }   // FBS is ~136–138; anything else is the wrong list
  function accept(ids, src){
    PEAR.fbs = {}; ids.forEach(function(id){ PEAR.fbs[id] = 1; }); PEAR.fbsSrc = src;
    try{ localStorage.setItem("pear_fbs4", JSON.stringify({ ts: Date.now(), ids: ids, src: src, conf: PEAR.conf || {}, confTop: PEAR.confTop || {}, div: PEAR.div || {} })); localStorage.removeItem("pear_fbs2"); localStorage.removeItem("pear_fbs3"); }catch(e){}
    try{ localStorage.removeItem("pear_fbs"); }catch(e){}                  // the old, unfiltered list

    Promise.all(CONF.map(function(gid){
      return fetch(BASE + "?group=" + gid).then(function(r){ return r.json(); }).then(idsOf).catch(function(){ return []; });
    })).then(function(lists){
      var set = {}; lists.forEach(function(l){ l.forEach(function(id){ set[id] = 1; }); });
      var all = Object.keys(set);
      if(ok(all)) accept(all, "ESPN FBS conference standings");
      else { PEAR.fbsErr = "FBS team list came back with " + all.length + " teams"; PEAR._fbsFailed = true; }
      finish();
    });
  }).catch(function(){ PEAR.fbsErr = "couldn\u2019t reach ESPN for the FBS list"; PEAR._fbsFailed = true; finish(); });
}
function pearIsFbs(id){ return PEAR.fbs ? !!PEAR.fbs[String(id)] : true; }
function pearFbsGame(g){ return pearIsFbs(g.away.id) && pearIsFbs(g.home.id); }
// Drop any game with a non-FBS team from the model's data, refit, and re-save
// the season so it stays dropped. Games already cached from an older build
// (or one where ESPN's FBS list didn't load) are cleaned up the same way.
function pemFbsOnly(){
  if(!PEAR.fbs || !PEM._games || !PEM._games.length) return false;
  var before = PEM._games.length;
  var kept = PEM._games.filter(function(g){ return PEAR.fbs[String(g.awayId)] && PEAR.fbs[String(g.homeId)]; });
  if(kept.length === before) return false;
  if(kept.length < before * 0.5) return false;      // a wrong list would gut the season \u2014 don't trust it
  PEM._games = kept;
  PEM.dropped = (PEM.dropped | 0) + (before - kept.length);
  PEM.fbsSrc = "ESPN FBS list";
  PEM._ats = null;
  pemRefit();
  if(PE.season) pemCacheSeason(PE.season.year, PE.season.upto);
  return true;
}
function pemEnsureFbs(){
  if(PEM._fbsChecked === PEM._games) return;
  pearLoadFbs(function(){
    if(!PEM._games) return;
    var changed = pemFbsOnly();
    PEM._fbsChecked = PEM._games;
    if(changed) toast("Dropped FCS games \u2014 model refit on " + PEM._games.length + " FBS games", "ok");
    if((changed || PE.ui.view === "rank") && SC.screen === "prophescore") renderPoolEdge();
  });
}

function pearLoadInfo(cb){
  try{
    var c = JSON.parse(localStorage.getItem("pear_teams") || "null");
    if(c && c.ts && Date.now() - c.ts < 7*864e5 && c.info){
      for(var k in c.info) if(!PEAR.info[k]) PEAR.info[k] = c.info[k];

    .then(function(r){ return r.json(); })

      var lg = ((((d||{}).sports||[])[0]||{}).leagues||[])[0] || {};
      (lg.teams||[]).forEach(function(w){ pearAbsorbTeam(w.team || w); });
      try{ localStorage.setItem("pear_teams", JSON.stringify({ ts: Date.now(), info: PEAR.info })); }catch(e){}

function pearParseEvent(ev){
  var c = (ev.competitions||[])[0]; if(!c) return null;
  var st = (c.status||ev.status||{}).type || {};
  var side = {};
  (c.competitors||[]).forEach(function(t){
    var tm = t.team || {};
    pearAbsorbTeam(tm);
    var recs = t.records || [], tot = "", conf = "";
    recs.forEach(function(r){
      if(!tot && (r.type === "total" || r.name === "overall" || r.name === "All Splits")) tot = r.summary || "";
      if(r.type === "vsconf" || /conf/i.test(r.name||"")) conf = r.summary || "";
    });
    var rk = t.curatedRank && t.curatedRank.current;
    side[t.homeAway] = { id: String(tm.id||""), rec: tot, conf: conf,
      rank: (rk && rk <= 25) ? rk : 0, score: (t.score != null && t.score !== "") ? Number(t.score) : null };
  });
  if(!side.away || !side.home || !side.away.id || !side.home.id) return null;
  var tv = [];
  (c.broadcasts||[]).forEach(function(b){ (b.names||[]).forEach(function(n){ if(tv.indexOf(n) < 0) tv.push(n); }); });
  if(!tv.length) (c.geoBroadcasts||[]).forEach(function(b){ var n = b.media && b.media.shortName; if(n && tv.indexOf(n) < 0) tv.push(n); });
  var od = (c.odds||[])[0] || {};
  return { id: String(ev.id||""), date: ev.date || c.date, state: st.state || "pre", detail: st.shortDetail || "",

           away: side.away, home: side.home,
           vegas: od.details || "", vegasOU: (typeof od.overUnder === "number") ? od.overUnder : null,
           vegasSpread: (typeof od.spread === "number") ? od.spread : null,
           vegasFav: (od.homeTeamOdds && od.homeTeamOdds.favorite) ? "home" : ((od.awayTeamOdds && od.awayTeamOdds.favorite) ? "away" : null) };

function pearLoadWeek(year, week){
  var key = (year && week) ? (year + "-" + week) : "current";
  if(PEAR.cache[key]){ var c = PEAR.cache[key]; PEAR.year = c.year; PEAR.week = c.week; PEAR.games = c.games; pearRepaint(); return; }
  PEAR.loading = true; PEAR.err = ""; pearRepaint();
  var url = PEAR_SCORE + "?groups=80&limit=400" + ((year && week) ? ("&seasontype=2&year=" + year + "&week=" + week) : "");
  fetch(url).then(function(r){ return r.json(); }).then(function(d){
    var yr = (d.season && d.season.year) || year, wk = (d.week && d.week.number) || week;
    var games = ((d && d.events) || []).map(pearParseEvent).filter(Boolean);
    games.sort(function(a, b){ return new Date(a.date) - new Date(b.date); });
    // Regular-season week list from ESPN's calendar, falling back to 1–15.
    if(!PEAR.weeks){
      var cal = (((d.leagues||[])[0]||{}).calendar||[]), reg = null;
      cal.forEach(function(s){ if(s && s.entries && /regular/i.test(s.label||"")) reg = s.entries; });

    PEAR.cache[yr + "-" + wk] = PEAR.cache[key] = { year: yr, week: wk, games: games };

// ── The numbers ──────────────────────────────────────────────────────────────
function pearNormCdf(z){
  var t = 1/(1 + 0.2316419*Math.abs(z)), d = 0.3989423*Math.exp(-z*z/2);
  var p = d*t*(0.3193815 + t*(-0.3565638 + t*(1.781478 + t*(-1.821256 + t*1.330274))));
  return z > 0 ? 1 - p : p;
}
// Projection for away@home (or neutral). Win chance comes from the same spread
// the simulation uses, so the list and the card always agree.
// For a week the model already has results for, the honest projection is the
// one it would have made before kickoff: fitted only on the weeks before it.
// That is the same fit the record vs Vegas is graded with. Returns null for a
// current/future week (use the live fit) and false when there is too little
// earlier data (week 1).
var _pearFitCache = { key: null, fit: null };
function pearFitFor(week){
  if(!PEM._games || !PEM.ratings || !week) return null;
  if(!PEM._games.some(function(g){ return g.week >= week; })) return null;
  var key = week + "|" + PEM._games.length + "|" + JSON.stringify(pemOptsSnapshot()) + "|" + (PEM.priorN || 0);
  if(_pearFitCache.key === key) return _pearFitCache.fit;
  var train = PEM._games.filter(function(g){ return g.week < week; });
  var fit = train.length < 30 ? false : pemFit(train, pemPriorAt(week, PEM.opts), PEM.opts);
  _pearFitCache = { key: key, fit: fit };
  return fit;
}
function pearProject(awayId, homeId, neutral, fit){
  if(!PEM.ratings) return null;
  var p;
  if(fit){
    var r = pemPredictRaw(fit.ratings, fit.avg, PEM.opts.hfa, awayId, homeId, !!neutral, PEM.opts.oppW);
    if(!r) return null;
    p = { away: Math.round(r.away*10)/10, home: Math.round(r.home*10)/10, total: Math.round((r.home + r.away)*10)/10 };
  } else p = pemPredict(awayId, homeId, !!neutral);
  if(!p) return null;
  var sp = pemSimParams();
  var sd = (sp && sp.sdMargin) || 17.5;
  var homeWin = pearNormCdf((p.home - p.away) / sd);
  return { away: p.away, home: p.home, total: p.total, margin: p.home - p.away,
           awayWin: 1 - homeWin, homeWin: homeWin, gqi: pearGqi(awayId, homeId, homeWin) };
}
// Game Quality Index, 1–10: how good both teams are (60%) and how close the
// game projects to be (40%). A matchup of two top-10 teams at a coin flip is a 10.
function pearGqi(aId, hId, homeWin){
  var R = pemRanks(), n = R.n.rating || 0;
  function q(id){ var rk = R.rank[id] && R.rank[id].rating; return (rk && n > 1) ? 1 - (rk - 1)/(n - 1) : 0.3; }
  var quality = (q(aId) + q(hId)) / 2;
  var close = 1 - Math.abs(homeWin - 0.5) * 2;

function pearLineTxt(awayId, homeId, margin){
  var m = Math.round(Math.abs(margin) * 10) / 10;

// Rank colour on a blue (best) → sand → red (worst) scale, like a heat map.
function pearHeat(rank, total){
  if(!rank || !total) return { bg: "transparent", fg: "inherit" };

// Resolve the signed-in identity first: the owner gate and every DB write need
// it. Same pattern as cfbpool — onAuthStateChanged fires once with the restored
// session, with a timeout so a slow or missing auth never hangs the page.
function psGate(msg, sub){
  document.getElementById("root").innerHTML =
    '<div class="ps-gate"><h1>' + msg + '</h1><p>' + sub + '</p>' +
    '<a class="btn btn-gold" href="' + HUB + '">Back to Scorecery</a></div>';
}

function psStart(){
  var uid = ME();
  if(!uid){
    psGate("Not signed in", "Prophescore runs on your Scorecery account. Sign in on the hub and come back.");
    return;
  }
  if(!isRootMaster(uid)){
    psGate("Owner only", "This tool is not part of your account.");
    return;
  }
  // Load the user record so the topbar and the group import have what they need.
  function go(){
    // Groups the account can import a week from.
    if(DB){
      DB.ref("groups").once("value", function(sn){
        var v = sn.val() || {};
        _allGroupsCache = Object.keys(v).map(function(k){
          var g = v[k] || {}; g.id = g.id || k; return g;
        });
      }, function(){});
    }
    renderPoolEdge();
  }
  if(DB){
    DB.ref("users/" + uid).once("value", function(sn){
      SC.currentUser = sn.val() || { uid: uid };
      SC.currentUser.uid = SC.currentUser.uid || uid;
      go();
    }, function(){ SC.currentUser = { uid: uid }; go(); });
  } else {
    SC.currentUser = { uid: uid };
    go();
  }
}

(function boot(){
  document.getElementById("root").innerHTML =
    '<div class="ps-boot">Loading Prophescore\u2026</div>';
  if(!AUTH){ psStart(); return; }
  var started = false;
  function once(){ if(started) return; started = true; psStart(); }
  AUTH.onAuthStateChanged(function(){ once(); });
  setTimeout(once, 2500);
})();
</script>
