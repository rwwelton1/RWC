<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<link rel="apple-touch-icon" sizes="512x512" href="/poolplay-icon.png">
<link rel="icon" type="image/png" href="/poolplay-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>Scorecery – Prophescore</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<style>

*{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#f5f0e8;--card:#ffffff;--card2:#f8f5f0;--border:#111111;--border2:#dddddd;
  --text:#111111;--muted:#777777;--dim:#aaaaaa;
  --gold:#e8c840;--gold-bg:#fffbe8;--gold-dark:#b89a00;
  --green:#5dba4a;--green-bg:#edfae8;
  --blue:#5590e8;--blue-bg:#e8f0ff;
  --red:#e85555;--red-bg:#ffe8e8;--red2:#dc2626;
  --purple:#9955e8;--purple-bg:#f5e8ff;
  --cream:#fdf8ee;--shadow:#111111
}

html{background:var(--bg)}

body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;font-size:14px;min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}

.topbar{position:sticky;top:0;z-index:50;background:#ffffff;border-bottom:3px solid var(--border);padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;box-shadow:0 3px 0 var(--border);overflow:hidden}

.logo{font-size:17px;font-weight:900;color:var(--text);letter-spacing:-.02em;flex-shrink:0;white-space:nowrap}

.logo span{color:var(--gold-dark)}



.topbar-right{display:flex;gap:5px;align-items:center;flex-shrink:0}









.btn{border-radius:8px;padding:6px 14px;font-size:11px;font-weight:800;border:2px solid var(--border);cursor:pointer;box-shadow:2px 2px 0 var(--border);font-family:'Nunito',sans-serif;transition:transform .1s,box-shadow .1s}

.btn:active{transform:translate(2px,2px);box-shadow:none}

.btn-ghost{background:#ffffff;color:var(--text)}



.btn-gold{background:var(--gold);color:var(--text)}








/* ADMIN PANEL */
.admin-panel{background:#ffffff;border:2px solid var(--border);border-radius:12px;padding:14px;box-shadow:4px 4px 0 var(--border)}

.btn-sm{padding:0 9px;font-size:10px;height:26px;line-height:26px;display:inline-flex;align-items:center;justify-content:center}

.main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:20px 14px 60px}

.auth-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:600;display:flex;align-items:center;justify-content:center;padding:20px}

.auth-modal-box{background:#ffffff;border:3px solid var(--border);border-radius:16px;width:100%;max-width:360px;padding:24px 20px;position:relative;box-shadow:5px 5px 0 var(--border)}

.auth-modal-close{position:absolute;top:12px;right:14px;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;line-height:1;padding:0;font-weight:800}

/* SECTION LABEL */
.section-label{font-size:10px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px;margin-top:20px}

.section-label:first-child{margin-top:0}

/* AUTH MODAL */
.auth-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:600;display:flex;align-items:center;justify-content:center;padding:20px}

.auth-modal-box{background:#ffffff;border:3px solid var(--border);border-radius:16px;width:100%;max-width:360px;padding:24px 20px;position:relative;box-shadow:5px 5px 0 var(--border)}

.auth-modal-close{position:absolute;top:12px;right:14px;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;line-height:1;padding:0;font-weight:800}

@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}


/* ── SCORECERY logo ── */
.scorecery-logo{
  font-family:'Nunito',sans-serif;
  font-weight:900;
  font-size:inherit;
  color:#ffffff;
  text-transform:uppercase;
  letter-spacing:.04em;
  display:inline-block;
  white-space:nowrap;
  -webkit-text-stroke:2.5px #111111;
  text-shadow:
    1px 1px 0 #111111,
    2px 2px 0 #111111,
    3px 3px 0 #111111,
    4px 4px 0 #1a4fd6,
    6px 6px 0 #0a2088,
    7px 7px 0 #060e44;
  paint-order:stroke fill;
}

.topbar .logo{font-size:17px;flex-shrink:0;white-space:nowrap}

@keyframes oracle-pulse{0%,100%{box-shadow:0 0 6px #818cf8,0 0 12px #6366f1}50%{box-shadow:0 0 12px #a5b4fc,0 0 24px #818cf8}}

@keyframes scorecerer-pulse{0%,100%{box-shadow:0 0 6px #a855f7,0 0 12px #7c3aed}50%{box-shadow:0 0 14px #e879f9,0 0 28px #a855f7}}

@keyframes celestial-pulse{0%,100%{box-shadow:0 0 6px #f43f5e,0 0 12px #9f1239}50%{box-shadow:0 0 14px #fda4af,0 0 28px #f43f5e}}

/* TOAST */
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);background:#111111;color:#ffffff;font-size:12px;font-weight:800;font-family:'Nunito',sans-serif;padding:10px 18px;border-radius:40px;border:2px solid #333;box-shadow:4px 4px 0 rgba(0,0,0,.4);z-index:9999;pointer-events:none;opacity:0;transition:opacity .2s,transform .2s;white-space:nowrap;max-width:320px;text-align:center}

#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

#toast.toast-ok{background:#1a3a1a;border-color:#5dba4a;color:#7dd66c}

#toast.toast-err{background:#3a1a1a;border-color:#e85555;color:#f08080}

#toast.toast-info{background:#1a253a;border-color:#5590e8;color:#7aabf0}

@keyframes bootPulse{0%,80%,100%{opacity:.25;transform:scale(.85)}40%{opacity:1;transform:scale(1)}}

/* ── POOL EDGE (owner-only stale-line tracker) ─────────────────────────────── */







































































.pe-note{font-size:9px;font-weight:700;color:var(--muted);line-height:1.5;margin-top:9px}



.pe-err{background:var(--red-bg);border:2px solid var(--red);border-radius:8px;padding:7px 10px;font-size:9px;font-weight:800;color:var(--red);margin-bottom:10px}































/* Prophescore board cards — signal strength first, matchup second. */















































































.pem-hd{font-size:8px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;margin:14px 0 7px;padding-top:10px;border-top:2px dashed var(--border2)}
























.pem-wk{border:1.5px solid var(--border2);border-radius:9px;overflow:hidden;font-size:11px;font-weight:800}
.pem-wkhd,.pem-wkrow{display:grid;grid-template-columns:.8fr 1.2fr 1.1fr 1fr .9fr;gap:4px;padding:5px 8px;text-align:center;align-items:center}
.pem-wkhd{background:var(--cream);font-size:8.5px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.pem-wkrow{border-top:1px solid var(--border2)}
.pem-wkrow>span{display:flex;flex-direction:column;align-items:center;line-height:1.15}
.pem-wkhd>:first-child,.pem-wkrow>:first-child{text-align:left;align-items:flex-start}
.pem-wkrow small{font-size:9px;font-weight:700;color:var(--muted)}
.pem-wkrow i{font-style:normal;font-size:7.5px;font-weight:900;background:var(--gold-bg);border:1px solid var(--border2);border-radius:4px;padding:0 3px;margin-top:1px}
.pem-wkrow b.up{color:#15803d}.pem-wkrow b.dn{color:var(--red2)}
.pem-ang{margin-top:8px;border:1.5px solid var(--border2);border-radius:9px;overflow:hidden;font-size:11px;font-weight:800}
.pem-anghd,.pem-angrow{display:grid;grid-template-columns:2.2fr .7fr 1.2fr 1.2fr;gap:4px;padding:5px 8px;align-items:center;text-align:center}
.pem-anghd{background:var(--cream);font-size:8.5px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.pem-angrow{border-top:1px solid var(--border2)}
.pem-anghd>:first-child,.pem-angrow>:first-child{text-align:left;line-height:1.25}
.pem-angrow small{font-size:9px;font-weight:700;color:var(--muted)}
.pem-angrow b.up{color:#15803d}.pem-angrow b.dn{color:var(--red2)}.pem-angrow .few{color:var(--dim)}
.px-knob{border-top:1px dashed var(--border2);padding:7px 0}
.px-pick{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;font-weight:900}
.px-pick select{flex:1;padding:7px 8px;border:2px solid var(--border);border-radius:9px;font:800 13px 'Nunito',sans-serif;background:var(--cream);color:var(--text)}
.pem-bkrow.px-cur{background:var(--cream)}
.px-knob div{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px}
.px-knob span{font-weight:900}
.px-knob small{display:block;font-size:10px;font-weight:700;color:var(--muted);line-height:1.35;margin-top:2px}
.pem-bk{margin-top:8px;border:1.5px solid var(--border2);border-radius:9px;overflow:hidden;font-size:11px;font-weight:800}
.pem-bkhd,.pem-bkrow{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:4px;padding:4px 8px;text-align:center}
.pem-bkhd{background:var(--cream);font-size:8.5px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.pem-bkrow{border-top:1px solid var(--border2)}
.pem-bkhd>:first-child,.pem-bkrow>:first-child{text-align:left}
.pem-bkrow b.up{color:#15803d}.pem-bkrow b.dn{color:var(--red2)}




.pem-sheets{border:2px solid var(--border);border-radius:12px;padding:10px 12px;margin:8px 0;background:#fff;box-shadow:2px 2px 0 var(--border)}
.pem-sheetshd{font-size:9px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.pem-sheetsel{width:100%;padding:8px 10px;border:2px solid var(--border);border-radius:9px;background:var(--cream);font:800 13px 'Nunito',sans-serif;color:var(--text)}
.pem-sheetinfo{font-size:11px;font-weight:700;color:var(--muted);margin:6px 0;line-height:1.4}
.pem-sheetbtns{display:flex;gap:6px;flex-wrap:wrap}




.pem-sheetlab{display:flex;align-items:center;font-size:11px;font-weight:900;color:var(--text);margin-top:8px}

































































































.pem-stale{font-size:9px;font-weight:700;color:var(--gold-dark);background:var(--gold-bg);border:2px solid var(--gold-dark);border-radius:8px;padding:6px 9px;margin-top:6px;line-height:1.45}

.pem-stale b{color:var(--gold-dark)}



























/* Head to head */




























/* Simulation */


































.pe-rule{background:var(--card2);border:2px solid var(--border);border-radius:8px;padding:9px 10px;margin-bottom:10px;box-shadow:3px 3px 0 var(--border2)}

.pe-rulehd{font-size:8px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}

.pe-rule pre{margin:0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;line-height:1.5;color:var(--text);white-space:pre;overflow-x:auto}

.pe-rulenote{font-size:9px;font-weight:700;color:var(--muted);line-height:1.5;margin-top:7px}



/* Prophescore layout: setup first, board big, everything else folded. */
.pe-hdr{display:flex;align-items:center;gap:9px;margin-bottom:14px}

.pe-title{font-size:18px;font-weight:900;color:var(--text);flex:1;letter-spacing:-.02em}





































































/* Compact board cards: one scannable row, tap to open. */


















































































/* This page owns nothing but Prophescore, so the shell is minimal. */
.ps-gate{max-width:420px;margin:60px auto;padding:0 16px;text-align:center}
.ps-gate h1{font-size:18px;font-weight:900;margin-bottom:8px}
.ps-gate p{font-size:12px;font-weight:700;color:var(--muted);line-height:1.6;margin-bottom:14px}
.ps-boot{max-width:420px;margin:80px auto;text-align:center;font-size:11px;font-weight:800;color:var(--muted)}

/* ── Games & matchup card (Scorecery style) ───────────────────────────── */
.pe-nav{display:grid;grid-template-columns:1fr 1fr;margin:-4px 0 16px;background:#fff;border:2px solid var(--border);border-radius:12px;box-shadow:3px 3px 0 var(--border);overflow:hidden}
.pe-nav button{padding:10px 8px;border:none;background:#fff;color:var(--muted);font:900 13px 'Nunito',sans-serif;cursor:pointer}
.pe-nav button+button{border-left:2px solid var(--border)}
.pe-nav button.on{background:var(--gold);color:var(--text)}
.pear{font-family:'Nunito',sans-serif;color:var(--text)}
.pr-h1{font-size:22px;font-weight:900;letter-spacing:-.02em;line-height:1.1}
.pr-h2{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:4px 0 12px}
.pr-weeks{display:flex;gap:5px;overflow-x:auto;padding:0 4px 8px 0;margin-bottom:10px;-webkit-overflow-scrolling:touch}
.pr-weeks::-webkit-scrollbar{display:none}
.pr-wk{flex:none;min-width:34px;height:32px;padding:0 8px;border:2px solid var(--border);background:#fff;font:900 12px 'Nunito',sans-serif;color:var(--muted);border-radius:8px;box-shadow:2px 2px 0 var(--border);cursor:pointer;position:relative}
.pr-wk:active{transform:translate(2px,2px);box-shadow:none}
.pr-wk.now{color:var(--text)}
.pr-wk.now:after{content:"";position:absolute;top:-4px;right:-4px;width:8px;height:8px;border-radius:50%;background:var(--red2);border:1.5px solid #fff}
.pr-wk.on{background:var(--gold);color:var(--text)}
.pr-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.pr-seg{display:flex;background:#fff;border:2px solid var(--border);border-radius:10px;padding:3px;gap:3px;box-shadow:2px 2px 0 var(--border)}
.pr-seg button{border:none;background:none;padding:6px 10px;border-radius:7px;font:900 11px 'Nunito',sans-serif;color:var(--muted);cursor:pointer}
.pr-seg button.on{background:#111;color:#fff}
.pr-btn{border:2px solid var(--border);background:var(--gold);color:var(--text);border-radius:9px;padding:8px 12px;font:900 11px 'Nunito',sans-serif;box-shadow:2px 2px 0 var(--border);cursor:pointer}
.pr-btn:active{transform:translate(2px,2px);box-shadow:none}
.pr-btn.ghost{background:#fff;margin-left:auto}
.pr-note{background:var(--gold-bg);border:2px solid var(--border);border-radius:12px;padding:12px;font-size:12px;font-weight:700;line-height:1.5;margin-bottom:12px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;box-shadow:3px 3px 0 var(--border)}
.pr-empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:12px;font-weight:800}
.pr-link{border:none;background:none;color:var(--text);text-decoration:underline;font:inherit;font-weight:900;cursor:pointer}
.pr-day{font-size:10px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin:18px 2px 8px}
.pr-game{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--border);border-radius:12px;box-shadow:3px 3px 0 var(--border);margin-bottom:10px;padding:0;overflow:hidden;cursor:pointer;font-family:'Nunito',sans-serif;color:var(--text)}
.pr-game:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--border)}
.pr-gtop{display:flex;justify-content:space-between;padding:6px 11px;font-size:10px;font-weight:800;color:var(--muted);background:var(--cream);border-bottom:2px solid var(--border)}
.pr-gtop span:last-child{color:var(--text);background:var(--gold);border:1.5px solid var(--border);border-radius:20px;padding:0 7px;font-weight:900}
.pr-live{color:var(--red2);font-weight:900}
.pr-trow{display:flex;align-items:center;gap:10px;padding:8px 11px;border-bottom:1.5px solid var(--border2)}
.pr-tlogo{width:30px;height:30px;object-fit:contain;flex:none}
.pr-tname{flex:1;min-width:0;display:flex;flex-direction:column}
.pr-tname b{font-weight:900;font-size:15px;overflow-wrap:break-word;line-height:1.2}
.pr-tname b i{font-style:normal;font-size:10px;font-weight:900;color:#fff;background:#111;border-radius:5px;padding:0 4px;margin-right:3px;vertical-align:2px}
.pr-tname span{font-size:10px;font-weight:800;color:var(--muted)}
.pr-tproj{text-align:right;display:flex;flex-direction:column;align-items:flex-end}
.pr-tproj b{font-weight:900;font-size:19px;line-height:1.1}
.pr-tproj b.fav{color:#2f5fd0}
.pr-tproj b.dog{color:var(--red2)}
.pr-tproj span{font-size:10px;font-weight:800;color:var(--muted)}
.pr-gfoot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 8px;padding:7px 11px;font-size:11px;font-weight:900}
.pr-gfoot span:last-child{margin-left:auto;color:var(--muted);font-weight:800;text-align:right}
.pr-foot{font-size:10px;font-weight:700;color:var(--muted);text-align:center;margin:14px 0 6px;line-height:1.5}

/* matchup card */
#pear-host{font-family:'Nunito',sans-serif}
.pc-back{position:fixed;inset:0;z-index:9000;background:rgba(0,0,0,.45);touch-action:none}
.pc{position:fixed;z-index:9001;left:50%;top:50%;top:var(--pc-mid,50%);transform:translate(-50%,-50%);width:min(760px,calc(100vw - 20px));max-height:calc(100vh - 28px);max-height:calc(var(--pc-h,100vh) - 28px);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  background:var(--bg);color:var(--text);border:3px solid var(--border);border-radius:16px;padding:12px 10px 10px;box-shadow:6px 6px 0 var(--border);font-family:'Nunito',sans-serif}
.pc-x{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:9px;border:2px solid var(--border);background:#fff;color:var(--text);font-size:15px;font-weight:900;box-shadow:2px 2px 0 var(--border);cursor:pointer;z-index:2}
.pc-x:active{transform:translate(2px,2px);box-shadow:none}
.pc-title{text-align:center;font-weight:900;font-size:clamp(16px,4.8vw,26px);line-height:1.15;padding:0 42px;letter-spacing:-.02em}
.pc-sub{text-align:center;font-size:clamp(9px,2.6vw,11px);font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:3px}
.pc-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,1fr);align-items:center;gap:6px;margin-top:8px;background:#fff;border:2px solid var(--border);border-radius:14px;box-shadow:3px 3px 0 var(--border);padding:10px 6px}
.pc-logo{min-width:0;border:none;background:none;padding:2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}
.pc-logo img{width:100%;max-width:130px;aspect-ratio:1;object-fit:contain}
.pc-logo span{font-size:8.5px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;border:1.5px solid var(--border);border-radius:20px;padding:2px 8px;background:var(--gold-bg);box-shadow:1.5px 1.5px 0 var(--border);text-align:center;line-height:1.25;max-width:100%}
.pc-lcol{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.pc-info{border:2px solid var(--border);background:#fff;color:var(--text);border-radius:20px;padding:3px 10px;font:900 10px 'Nunito',sans-serif;box-shadow:2px 2px 0 var(--border);cursor:pointer;max-width:100%;line-height:1.25}
.pc-info:active{transform:translate(2px,2px);box-shadow:none}
.pc-backrow{margin:-2px 44px 6px 0}
.pc-bk{border:2px solid var(--border);background:#fff;color:var(--text);border-radius:9px;padding:5px 10px;font:900 11px 'Nunito',sans-serif;box-shadow:2px 2px 0 var(--border);cursor:pointer;max-width:100%;text-align:left;line-height:1.25}
.pc-bk:active{transform:translate(2px,2px);box-shadow:none}
.pc-logo:active span{transform:translate(1.5px,1.5px);box-shadow:none}
.pc-mid{min-width:0;overflow-wrap:break-word;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.pc-pair{display:flex;justify-content:center;align-items:flex-end;gap:clamp(8px,5vw,34px);width:100%}
.pc-pair div{display:flex;flex-direction:column;align-items:center}
.pc-pair small{font-size:clamp(7px,2vw,9px);font-weight:900;color:var(--muted);letter-spacing:.04em}
.pc-pair b{white-space:nowrap;font-weight:900;font-size:clamp(20px,6.4vw,32px);line-height:1}
.pc-pair.pts{margin-top:6px}
.pc-pair em{font-style:normal;font-size:clamp(16px,4.5vw,26px);font-weight:900;padding-bottom:2px;color:var(--muted)}

// Owner-only. Gated on isRootMaster() — the single root UID. NOTE: this gate is
// cosmetic; the real protection is the Firebase rule on prophescore/{uid}.
var PE = { games: [], history: [], meta: null, priors: {}, lines: {}, opens: {}, px: null, ready: false, err: "" };

function peOwner(){ return isRootMaster(ME()); }

function peLocalKey(){ return "prophescore_" + (ME() || "anon"); }
// Pre-rename key. Read-only fallback so data saved as "Pool Edge" survives.
function peLegacyLocalKey(){ return "pe_data_" + (ME() || "anon"); }

var PE_KEYS = ["games", "history", "meta", "priors", "lines", "opens", "px"];
function peTake(o, keepOld){
  PE_KEYS.forEach(function(k){
    var v = o[k];
    if(v === undefined || v === null){ if(keepOld) return; v = (k === "games" || k === "history") ? [] : (k === "meta" || k === "px") ? null : {}; }
    PE[k] = v;
  });
}
function peLoad(cb){
  if(PE.ready){ if(cb) cb(); return; }
  // Local first so the screen paints instantly, then reconcile with the server.
  try{
    var raw = localStorage.getItem(peLocalKey()) || localStorage.getItem(peLegacyLocalKey());
    if(raw) peTake(JSON.parse(raw), false);
  }catch(e){}
  var uid = ME();
  if(!DB || !uid){ peAfterLoad(); PE.ready = true; if(cb) cb(); return; }
  // One read per piece, not the whole record: past seasons (hist) and daily line
  // snapshots (snaps) live under the same path and would otherwise download every visit.
  Promise.all(PE_KEYS.map(function(k){ return DB.ref("prophescore/" + uid + "/" + k).once("value").then(function(sn){ return [k, sn.val()]; }); })).then(function(pairs){
    var v = {}, any = false;
    pairs.forEach(function(q){ if(q[1] !== null && q[1] !== undefined){ v[q[0]] = q[1]; any = true; } });
    if(any) peTake(v, true);
    peAfterLoad();
    PE.ready = true; PE.err = "";
    if(cb) cb();
  }, function(err){
    // Read denied or offline — keep the local copy and name the reason.
    peAfterLoad();
    PE.ready = true;
    var code = (err && (err.code || err.message)) ? String(err.code || err.message) : "unknown";
    PE.err = /permission|denied/i.test(code)
      ? "PERMISSION_DENIED \u2014 Firebase is refusing to read prophescore/$uid. Add the rule below. Using this device\u2019s copy."
      : ("Cloud read failed (" + code + ") \u2014 using this device\u2019s copy.");
    if(cb) cb();
  });
}

// Everything derived from what was just loaded. Called from all three exits of
// peLoad so no path can quietly skip it.
function peAfterLoad(){
  try{ localStorage.removeItem("ps_hist_v1"); }catch(e){}
  // One write drops the old model's caches from the saved record for good.
  if(PE._hadOld){ PE._hadOld = false; setTimeout(function(){ try{ peSave(); }catch(e){} }, 0); }
  PEM.restoreErr = "";
  try{ pemRefit(); }
  catch(e){ PEM.restoreErr = (e && (e.message || e.name)) ? String(e.message || e.name) : "unknown error"; }
}

// Firebase rejects any `undefined` outright, which is a common silent cause of
// a failed write. Round-tripping through JSON drops those keys.
function peClean(o){
  try{ return JSON.parse(JSON.stringify(o === undefined ? null : o)); }
  catch(e){ return null; }
}

var PE_LEGACY_NULLS = { settings: null, turnovers: null, season: null, runs: null, baseline: null, teamstats: null, tune: null, gmeta: null };
function peSave(){
  var payload = peClean({
    // The old weekly pick board, kept as it was saved.
    games:   PE.games   || [],
    history: PE.history || [],
    meta:    PE.meta    || null,
    // SP+ sheets by week ("2026-w5"): the benchmark, and the model when there is no CFBD key.
    priors:  PE.priors  || null,
    // Closing and opening lines by game id (record vs Vegas, line movement).
    lines:   PE.lines   || null,
    opens:   PE.opens   || null,
    // Play-by-play model: CFBD key, cached weeks (aggregated plays), roster prior, settings.
    px:      PE.px      || null
  });
  try{ localStorage.setItem(peLocalKey(), JSON.stringify(payload)); }catch(e){}
  var uid = ME();
  if(!DB || !uid) return;
  var was = PE.err;
  function fail(err){
    var code = (err && (err.code || err.message)) ? String(err.code || err.message) : "unknown";
    PE.err = /permission|denied/i.test(code)
      ? "PERMISSION_DENIED \u2014 Firebase is refusing the write. Add a rule for prophescore/$uid (see below). Saving to this device only."
      : ("Cloud sync failed (" + code + ") \u2014 saving to this device only.");
    if(was !== PE.err && SC.screen === "prophescore") renderPoolEdge();
  }
  try{
    // update(), not set(): set() replaced the whole record and would wipe the past
    // seasons and line snapshots saved beside it. The old model's leftover keys go too.
    DB.ref("prophescore/"+uid).update(Object.assign({}, payload, PE_LEGACY_NULLS), function(err){
      if(err){ fail(err); return; }
      PE.err = "";
      if(was !== PE.err && SC.screen === "prophescore") renderPoolEdge();
    });
  }catch(e){ fail(e); }
}

  var keys = Object.keys(PE.priors).sort(function(a,b){
    var qa = pePriorWeek(a) || { y: 0, w: 0 }, qb = pePriorWeek(b) || { y: 0, w: 0 };

    var v = Number(r[id]);

        if(isNaN(val)) for(var hq = H.team + 1; hq < hc.length; hq++) if(isNum(hc[hq])){ val = parseFloat(hc[hq]); break; }
        var so = parseFloat(hc[H.off]), sd = parseFloat(hc[H.def]);
        if(name && !isNaN(val) && !isNaN(so) && !isNaN(sd)) line = null, split[pemNormName(name)] = [so, sd];
      }
    }
    if(line === null){ /* parsed from the header layout above */ }
    else if(/[,\t]/.test(line)){
      // Spreadsheet/CSV rows: team in the first column, rating in the first
      // numeric column after it ("Ohio State,29.7" or "1\tOhio State\t29.7\t...").
      var cols = line.split(/\t|,/).map(function(c){ return c.trim(); });
      if(/^\d+[.)]?$/.test(cols[0]) && cols.length > 2) cols.shift();          // leading rank column
      name = cols[0];
      for(var ci = 1; ci < cols.length; ci++){ if(/^[-+]?\d+(\.\d+)?$/.test(cols[ci])){ val = parseFloat(cols[ci]); break; } }
    } else {
      var m = line.match(/^\s*(?:\d+[.)]\s*)?(.+?)\s+([-+]?\d+(?:\.\d+)?)\s*$/);
      if(m){ name = m[1]; val = parseFloat(m[2]); }
    }
    if(!name || isNaN(val)) return;                                         // header rows, notes
    name = name.replace(/^\s*\d+[.)]\s*/, "").replace(/\s*\(\d+-\d+\)\s*$/, "");  // "1. Georgia", "Georgia (4-0)"
    var key = norm(name), id = PEM_SHEET_IDS[key] || lookup[key];
    // If ESPN's own names are loaded and disagree with the table, trust ESPN.
    // (Only toward an id the table doesn't already use for another team.)
    if(id && PEM_SHEET_IDS[key] && lookup[key] && !nameMap[id] && nameMap[lookup[key]] && !pemSheetIdSet()[lookup[key]]) id = lookup[key];
    if(!id){
      // Try progressively shorter prefixes for "Georgia Bulldogs" style rows.
      var words = name.trim().split(/\s+/);
      for(var w = words.length; w > 0 && !id; w--) id = lookup[norm(words.slice(0,w).join(""))];
    }
    if(id){ prior[id] = { off: val/2, def: -val/2, fpi: val }; if(split[key]) prior[id]._sd = split[key]; matched++; }
    else missed.push(name.trim());
  });
  // Offense/defense split: each side measured against the sheet's average, with
  // whatever is left (special teams, rounding) shared so off - def still equals
  // the overall rating. Model convention: def > 0 means allowing more points.
  var sIds = Object.keys(prior).filter(function(id){ return prior[id]._sd; }), nSplit = 0;
  if(sIds.length >= 20){
    var mo = 0, md = 0; sIds.forEach(function(id){ mo += prior[id]._sd[0]; md += prior[id]._sd[1]; }); mo /= sIds.length; md /= sIds.length;
    sIds.forEach(function(id){
      var P = prior[id], oS = P._sd[0] - mo, dS = -(P._sd[1] - md), r = P.fpi - (oS + dS);
      P.off = oS + r/2; P.def = -(dS + r/2); nSplit++;
    });
  }
  Object.keys(prior).forEach(function(id){ delete prior[id]._sd; });
  return { prior: matched ? prior : null, matched: matched, missed: missed, split: nSplit };
}

function pemPredictRaw(teams, avg, hfa, awayId, homeId, neutral, oppW){
  var A = teams[awayId], H = teams[homeId];
  if(!A || !H) return null;
  var ow = (oppW === undefined) ? 1 : oppW;
  var edge = neutral ? 0 : hfa/2;
  return { away: avg + A.off + ow * H.def - edge, home: avg + H.off + ow * A.def + edge };
}

function pemPredict(awayId, homeId, neutral){
  if(PX.active && PX.live){
    var q = pxPredict(PX.live, awayId, homeId, !!neutral);
    return { away: Math.round(q.away*10)/10, home: Math.round(q.home*10)/10, margin: Math.round((q.home - q.away)*10)/10, total: Math.round((q.home + q.away)*10)/10 };
  }
  if(!PEM.ratings) return null;
  var p = pemPredictRaw(PEM.ratings, PEM.avg, PEM.opts.hfa, awayId, homeId, neutral, PEM.opts.oppW);
  if(!p) return null;
  return {
    away: Math.round(p.away*10)/10, home: Math.round(p.home*10)/10,
    margin: Math.round((p.home - p.away)*10)/10,
    total: Math.round((p.home + p.away)*10)/10
  };
}

// Paired difference between two sets of per-game errors. This is the error bar
// that matters when comparing two settings: both saw the same games, so the
// week-to-week luck cancels. It runs roughly 8x tighter than the spread of the
// absolute score, and using the wrong one of the two is the difference between
// a tuner that chases noise and one that never moves at all.
function pemPairedDiff(ea, eb){
  var d = [];
  for(var id in ea){ if(eb[id] !== undefined) d.push(ea[id] - eb[id]); }
  if(d.length < 2) return null;
  var s = 0; d.forEach(function(v){ s += v; });
  var m = s/d.length;
  var ss = 0; d.forEach(function(v){ ss += (v-m)*(v-m); });
  var se = Math.sqrt(ss/(d.length-1))/Math.sqrt(d.length);
  return { d: m, se: se, n: d.length, t: se > 0 ? m/se : 0 };
}

function pemRefit(){
  pemRestorePrior();                                   // newest SP+ sheet: benchmark, and fallback model
  PEM._ranks = null; PEM._ats = null;
  if(pxKey() && pxRebuild()) return true;
  PX.active = false;
  PEM.ratings = PEM.prior || null; PEM.avg = PEM_SHEET_AVG; PEM.n = 0; PEM.opts.hfa = 2.5; PEM.opts.oppW = 1;
  return !!PEM.ratings;
}

// Team -> its games, built once per season load. The stored shape stays keyed
// by game because a game belongs to two teams and writing it under both would
// double the record and leave two copies to keep in step. Indexing by team is
// the cheap half of that idea: one pass over the season, then every team lookup
// is free, and nothing can fall out of sync because there is still one copy.
function pemTeamIndex(){
  if(!PEM._games) return null;
  if(PEM._tidx && PEM._tidxFor === PEM._games) return PEM._tidx;
  var idx = {};
  PEM._games.forEach(function(g){
    if(g.awayId) (idx[g.awayId] = idx[g.awayId] || []).push(g);
    if(g.homeId) (idx[g.homeId] = idx[g.homeId] || []).push(g);
  });
  PEM._tidx = idx;
  PEM._tidxFor = PEM._games;
  return idx;
}

// Teams that have played, strongest first, so the picker is ordered usefully.
function pemTeamList(){
  var seen = {}, nm = PEM.nameMap || {};
  (PEM._games || []).forEach(function(g){
    if(g.awayId) seen[g.awayId] = g.awayName || g.awayId;
    if(g.homeId) seen[g.homeId] = g.homeName || g.homeId;
  });
  if(!Object.keys(seen).length && PEM.ratings) Object.keys(PEM.ratings).forEach(function(id){ if(id !== "__avg__") seen[id] = nm[id] || pearName(id); });
  var out = Object.keys(seen).map(function(id){
    var r = PEM.ratings && PEM.ratings[id];
    return { id: id, name: seen[id], rating: r ? (r.off - r.def) : null };
  });
  out.sort(function(a, b){
    if(a.rating === null && b.rating === null) return a.name.localeCompare(b.name);
    if(a.rating === null) return 1;
    if(b.rating === null) return -1;
    return b.rating - a.rating;
  });
  return out;
}

function pemFmtSigned(v, dp){
  if(v === null || v === undefined || !isFinite(v)) return "\u2014";
  var s = (Math.round(v * Math.pow(10, dp||1)) / Math.pow(10, dp||1));
  return (s > 0 ? "+" : "") + s.toFixed(dp||1);
}

// One row per team: record, scoring, rating split and (with play-by-play data)
// the opponent-adjusted facets. Higher is better on every rating row, so the
// defence term (negative = good) is flipped for display.
function pemCompareRows(){
  var idx = pemTeamIndex() || {}, R = PEM.ratings || {}, out = [];
  var ids = Object.keys(idx);
  if(!ids.length) ids = Object.keys(R).filter(function(id){ return id !== "__avg__"; });
  var live = PX.active && PX.live;
  ids.forEach(function(id){
    var mr = R[id], games = idx[id] || [], w = 0, l = 0, pf = 0, pa = 0, sos = 0, sn = 0;
    games.forEach(function(g){
      var home = String(g.homeId) === String(id), my = home ? g.hs : g.as, th = home ? g.as : g.hs;
      if(my > th) w++; else if(my < th) l++;
      pf += my; pa += th;
      var o = R[home ? g.awayId : g.homeId]; if(o){ sos += o.off - o.def; sn++; }
    });
    var n = games.length, pr = PEM.prior && PEM.prior[id];
    var o = { id: id, name: (PEM.nameMap || {})[id] || id, n: n, w: w, l: l,
      rating: mr ? mr.off - mr.def : null, off: mr ? mr.off : null, def: mr ? -mr.def : null,
      spPlus: (pr && typeof pr.fpi === "number") ? pr.fpi : null,
      margin: n ? (pf - pa) / n : null, ppg: n ? pf / n : null, papg: n ? pa / n : null, sos: sn ? sos / sn : null,
      appg: mr ? PEM.avg + mr.off : null, apapg: mr ? PEM.avg + mr.def : null, runRate: null };
    if(live && mr && mr.px){
      var F = PX.live.F, g2 = function(f, sd){ var v = F[f][sd][id]; return F[f].mu + (v || 0); };
      o.xRush = g2("rush", "O"); o.xRushD = g2("rush", "D"); o.xPass = g2("pass", "O"); o.xPassD = g2("pass", "D");
      o.xSucc = g2("succ", "O"); o.xSuccD = g2("succ", "D"); o.xHav = g2("hav", "O"); o.xHavC = g2("hav", "D");
      o.xFin = g2("fin", "O"); o.xFinD = g2("fin", "D");
      var rrT = pxRunRate(PX.live, id), rrL = PX.live.mRR;
      o.xIso = rrT * g2("isoR", "O") + (1 - rrT) * g2("isoP", "O"); o.xIsoD = rrL * g2("isoR", "D") + (1 - rrL) * g2("isoP", "D");
      o.xSR = g2("succR", "O"); o.xSP = g2("succP", "O"); o.xSRD = g2("succR", "D"); o.xSPD = g2("succP", "D");
      o.xIsoR = g2("isoR", "O"); o.xIsoRD = g2("isoR", "D"); o.xIsoP = g2("isoP", "O"); o.xIsoPD = g2("isoP", "D");
      if(F.exR.n){ o.xExR = g2("exR", "O"); o.xExRD = g2("exR", "D"); }
      if(F.exP.n){ o.xExP = g2("exP", "O"); o.xExPD = g2("exP", "D"); }
      o.xFp = g2("fp", "O"); o.xFpD = g2("fp", "D");
      var stt = PX.st && PX.st[id];
      if(stt){ o.xKoR = stt.kN >= 3 ? 100 - stt.kY / stt.kN : null; o.xKoC = stt.cN >= 3 ? 100 - stt.cY / stt.cN : null;
               o.xPuntN = stt.pN >= 3 ? stt.pY / stt.pN : null; o.xPuntNA = stt.aN >= 3 ? stt.aY / stt.aN : null;
               o.xTbR = stt.kN >= 3 ? stt.kTB / stt.kN : null; o.xTbF = stt.cN >= 3 ? stt.cTB / stt.cN : null;
               if(stt.dr){ o.xDrv = stt.dr / stt.g; o.xPpd = stt.pts / stt.dr; o.xTrip = stt.op / stt.dr; }
               if(stt.op) o.xPpt = stt.opPts / stt.op;
               if(stt.oDr){ o.xPpdD = stt.oPts / stt.oDr; o.xTripD = stt.oOp / stt.oDr; }
               if(stt.oOp) o.xPptD = stt.oOpPts / stt.oOp;
               if(stt.ds) o.xStart = 100 - stt.dY / stt.ds; if(stt.oDs) o.xStartD = 100 - stt.oDY / stt.oDs; }
      o.runRate = PX.live.tm[id] ? pxRunRate(PX.live, id) : null;
    }
    out.push(o);
  });
  return out;
}

// Spread of real results around the model's number, for win chances.
function pemSimParams(){
  if(PX.active){ var ra = pxAts(); return { sdMargin: (ra && ra.sdObs) || 15, sdTotal: 13, n: ra ? ra.lined : 0, px: true }; }
  return { sdMargin: 17.5, sdTotal: 13, n: 0, assumed: true };
}

// Rank every team on every stat, once per season load.
function pemRanks(){
  if(PEM._ranks && PEM._ranksFor === PEM._games) return PEM._ranks;
  var rows = pemCompareRows();
  var ranks = {}, n = {};
  Object.keys(PEM_STATS).forEach(function(k){
    var d = PEM_STATS[k];
    if(d.dir === "none") return;
    var have = rows.filter(function(r){
      return typeof r[k] === "number" && isFinite(r[k]);
    });
    have.sort(function(a, b){ return d.dir === "low" ? (a[k] - b[k]) : (b[k] - a[k]); });
    n[k] = have.length;
    have.forEach(function(r, i){
      (ranks[r.id] = ranks[r.id] || {})[k] = i + 1;
    });
  });
  PEM._ranks = { rank: ranks, n: n };
  PEM._ranksFor = PEM._games;
  return PEM._ranks;
}

// PROPHESCORE PX — play-by-play efficiency model (CFBD data)
// ════════════════════════════════════════════════════════════════════════════
// 1. Ingest: every FBS play from CollegeFootballData, with its EPA (CFBD "ppa").
// 2. Noise out: fumble recoveries set to a 50% baseline, interceptions pulled
//    25% toward average, special teams left out, and every play weighted by how
//    much the game was still in doubt (win-probability leverage) instead of a
//    hard garbage-time cutoff.
// 3. Opponent adjustment: ridge regression per facet — rushing, passing,
//    success rate, havoc, finishing drives — with older games decayed.
// 4. Priors: a roster composite (last season's SP+, returning production,
//    recruiting talent, net transfer portal) that fades to nothing by the fade
//    week (tuned; default week 6) — the anchoring it provides fades with it.
// 5. Matchups: facets meet facet-for-facet (rush O vs rush D, pass O vs pass D,
//    havoc allowed vs created, finishing), become drive outcomes, and 10,000
//    drive-by-drive simulations give the spread, total and win probability.
// Graded out of sample against the closing line, week by week.
//
// Model fixes (data v4, tune m15):
//  - a side with no FBS plays is projected from its prior alone (was ≥20% league average)
//  - lost fumbles counted (they were dropped: CFBD types them "Fumble Recovery (Opponent)")
//  - havoc keeps its tier anchoring (a negative slope was being clamped to zero)
//  - leverage uses garbage-time cut-offs instead of a curve that faded 3-score 1st-half leads
//  - tier anchoring capped at 100%; the new-coach / returning-production discount removed
//    (already in the prior's regression, it was being applied two more times)
//  - turnovers follow havoc by a fitted slope, not in full proportion (sacks were counted twice)
//  - totals get a walk-forward bias correction; win odds get per-game noise
//  - priors fade by week 6 by default (tuner tries 4–8)
//  - week 1 is data only: its games feed every later fit, but its prior-only
//    projections are never graded, tuned on, or used to calibrate stretch, totals or odds
//  - SP+ sheet moves the spread only (totals stay with the drive model); default weight 75%
//  - defaults tuned on 2023–25 history; totals use their own fit (alphaT/levT); SP+ weight by week
//  - roster priors that failed to fit (CFBD history calls rate-limited) are detected and retried
//  - tried and dropped: a home-field term inside the opponent adjustment (see pxRidge)

// First week whose projections count for grading, tuning and calibration. Week 1 has no
// in-season data behind it (the roster prior alone, and a guessed league scoring level), so
// judging the play-by-play model on it would tune and calibrate the wrong predictor.
var PX_FIRST_GRADED = 2;
var PX_BASE = "https://api.collegefootballdata.com";
var PX = { active: false, busy: false, msg: "", err: "", fits: {}, sims: {}, live: null };

// 2025, which they never saw: spread error 12.99 -> 12.75 a game there, totals 12.91 -> 12.74.
// alphaT / levT: the totals fit's own shrink and leverage (totals want more shrink, every play equal).
// sp / spLate: SP+ weight in weeks 1–3 and from week 6 (linear in between), from 2024's weekly SP+.
var PX_DEFAULTS = { alpha: 25, half: 10, prior: 1, hfa: 3, lev: 1, tier: 1, stretch: 0, fade: 10, sp: 1, spLate: 0.5, sit: 1, alphaT: 75, levT: 0 };
var PX_KNOBS = [
  { key: "alpha", label: "Opponent-adjustment shrink", min: 10, max: 400, step: 5, fmt: function(v){ return Math.round(v) + " plays"; }, lo: "trust small samples", hi: "heavy shrink",
    help: "Ridge penalty: how many plays of league-average performance each team starts with before its own plays count. Found by cross-validation." },
  { key: "half", label: "Time decay (half-life)", min: 1, max: 20, step: 1, fmt: function(v){ return v >= 20 ? "none" : v + " wk"; }, lo: "recent only", hi: "all games equal",
    help: "A game this many weeks old counts half as much as this week's. Lets teams change through the season (injuries, QB changes, development)." },

    help: "How much the roster composite counts in week 1. It fades to 0% by the fade week below." },
  { key: "fade", label: "Priors gone by", min: 2, max: 10, step: 1, fmt: function(v){ return "week " + v; }, lo: "plays only, fast", hi: "lean on last season longer",
    help: "The week from which only this season\u2019s plays count: both the roster prior\u2019s share of the projection and its pull on small samples (tier anchoring) fade to nothing by then. On 2023\u20132025 later was better at every step tested (week 4 worst, week 10 best), so the default is week 10; the tuner tries 4 to 10." },
  { key: "sp", label: "SP+ sheet weight, weeks 1\u20133", min: 0, max: 1, step: 0.25, fmt: function(v){ return Math.round(v * 100) + "%"; }, lo: "play-by-play only", hi: "SP+ only",
    help: "Share of each spread taken from the SP+ sheet you pasted for that week, early in the season. It eases to the week-6 weight below by week 6. On 2023\u20132025 history the play-by-play side needs about five weeks of games before it adds anything to SP+, so the default is 100%. Spreads only: totals always come from the play-by-play model, which ran better on totals. Teams missing from the sheet use the play-by-play model alone." },

function pearFitPicker(){
  var vv = window.visualViewport, h = vv ? vv.height : window.innerHeight;
  document.documentElement.style.setProperty("--pp-h", Math.max(220, Math.round(h - 24)) + "px");
  var pp = document.querySelector(".pp");
  if(pp && vv) pp.style.top = "calc(env(safe-area-inset-top,0px) + " + Math.round(10 + vv.offsetTop) + "px)";
  // Cards and team sheets fit the part of the screen you can actually see —
  // on iPhone, 100vh runs under Safari's toolbars, which cut off the top and bottom.
  document.documentElement.style.setProperty("--pc-h", Math.round(h) + "px");
  document.documentElement.style.setProperty("--pc-mid", Math.round((vv ? vv.offsetTop : 0) + h / 2) + "px");
}
pearFitPicker();
window.addEventListener("resize", pearFitPicker);
window.addEventListener("orientationchange", function(){ setTimeout(pearFitPicker, 300); });
if(window.visualViewport){
  window.visualViewport.addEventListener("resize", pearFitPicker);
  window.visualViewport.addEventListener("scroll", pearFitPicker);
}
function pearRenderCard(){
  var host = pearHost();
  if(!PEAR.card){ host.innerHTML = ""; return; }
  if(!_pearInfoAsked && Object.keys(PEAR.info).length < 100){
    _pearInfoAsked = true;
    pearLoadInfo(function(){ if(PEAR.card) pearRenderCard(); });
  }
  document.body.style.overflow = "hidden"; document.documentElement.style.overflow = "hidden"; pearFitPicker();
  host.innerHTML = pearCardHtml();
  var s = document.getElementById("pear-search");
  if(s) pearFitPicker();
  if(s){
    if(!("ontouchstart" in window)) s.focus();
    s.addEventListener("input", function(){
      var q = this.value.trim().toLowerCase(), any = false;
      host.querySelectorAll("[data-pear-pickid]").forEach(function(b){
        var ok = !q || b.getAttribute("data-q").indexOf(q) >= 0;
        b.style.display = ok ? "" : "none"; if(ok) any = true;
      });
      var none = document.getElementById("pear-none"); if(none) none.style.display = any ? "none" : "";
    });
  }
}
function pearRepaint(){ if(PE.ui && PE.ui.view === "games" && SC.screen === "prophescore") renderPoolEdge(); }

// One delegated handler for the list and the card.
document.addEventListener("click", function(e){
  var t = e.target.closest("[data-pear-week],[data-pear-filter],[data-pear-game],#pear-custom,#pear-build,[data-pear-close],[data-pear-swap],[data-pear-flip],[data-pear-neutral],[data-pear-pickclose],[data-pear-pickid],[data-pe-view],[data-pear-team],[data-pear-teamvs],[data-pear-rankall],#pear-fbsretry,[data-pear-sgame],[data-pear-cardteam],[data-pear-backteam],[data-pear-backcard]");
  if(!t) return;
  if(t.id === "pear-fbsretry"){
    PEAR.fbs = null; PEM._fbsChecked = null; t.textContent = "Checking\u2026";
    pearLoadFbs(function(){ pemEnsureFbs(); if(SC.screen === "prophescore") renderPoolEdge(); }, true); return;
  }
  if(t.hasAttribute("data-pear-cardteam")){ var bc = PEAR.card; pearOpenTeam(t.getAttribute("data-pear-cardteam")); PEAR.backCard = bc; pearRedrawTeam(); return; }
  if(t.hasAttribute("data-pear-backcard")){ var cc = PEAR.backCard; PEAR.backCard = null; if(cc){ PEAR.team = null; PEAR.card = cc; PEAR.pick = null; pearRenderCard(); } return; }
  if(t.hasAttribute("data-pear-backteam")){ var bt = PEAR.backTeam; PEAR.backTeam = null; if(bt){ var keep = PEAR.backCard; pearOpenTeam(bt); PEAR.backCard = keep; pearRedrawTeam(); } return; }
  if(t.hasAttribute("data-pear-team")){ PEAR.backCard = null; pearOpenTeam(t.getAttribute("data-pear-team")); return; }
  if(t.hasAttribute("data-pear-sgame")){ var sp = t.getAttribute("data-pear-sgame").split("|"); pearOpenSchedGame(sp[0], sp[1]); return; }
  if(t.hasAttribute("data-pear-rankall")){ PEAR.rankAll = t.getAttribute("data-pear-rankall") === "1"; renderPoolEdge(); return; }
  if(t.hasAttribute("data-pear-teamvs")){
    var tid = t.getAttribute("data-pear-teamvs"), order = pearRankOrder(PEM.ratings).order;
    var opp = order[0] === tid ? order[1] : order[0];
    PEAR.backTeam = tid; PEAR.backCard = null;
    PEAR.card = { a: tid, h: opp, neutral: true, game: null }; PEAR.pick = null; pearRenderCard(); return;
  }
  if(t.hasAttribute("data-pe-view")){
    PE.ui.view = t.getAttribute("data-pe-view");
    try{ localStorage.setItem("ps_view", PE.ui.view); }catch(_){}
    renderPoolEdge(); window.scrollTo(0, 0); return;
  }
  if(t.hasAttribute("data-pear-week")){ var w = parseInt(t.getAttribute("data-pear-week"), 10); if(w) pearLoadWeek(PEAR.year || PEAR.curYear, w); return; }
  if(t.hasAttribute("data-pear-filter")){ PEAR.filter = t.getAttribute("data-pear-filter"); pearRepaint(); return; }
  if(t.hasAttribute("data-pear-game")){
    var gid = t.getAttribute("data-pear-game");
    if(!(PEAR.games || []).some(function(z){ return z.id === gid; })) return;
    pearOpenGame(gid); return;
  }
  if(t.id === "pear-custom"){ pearOpenCustom(); return; }
  if(t.id === "pear-build"){
    PE.ui.view = "model";
    try{ localStorage.setItem("ps_view", "model"); }catch(_){}
    renderPoolEdge(); window.scrollTo(0, 0); return;
  }
  if(t.hasAttribute("data-pear-close")){ pearClose(); return; }
  if(t.hasAttribute("data-pear-swap")){ PEAR.pick = t.getAttribute("data-pear-swap"); pearRenderCard(); return; }
  if(t.hasAttribute("data-pear-pickclose")){ PEAR.pick = null; pearRenderCard(); return; }
  if(t.hasAttribute("data-pear-pickid")){
    var id = t.getAttribute("data-pear-pickid"), c = PEAR.card;
    if(PEAR.pick === "a"){ if(id === c.h) c.h = c.a; c.a = id; } else { if(id === c.a) c.a = c.h; c.h = id; }
    PEAR.pick = null; pearRenderCard(); return;
  }
  if(t.hasAttribute("data-pear-flip")){ var cc = PEAR.card, tmp = cc.a; cc.a = cc.h; cc.h = tmp; pearRenderCard(); return; }
  if(t.hasAttribute("data-pear-neutral")){ PEAR.card.neutral = !PEAR.card.neutral; pearRenderCard(); return; }
});
document.addEventListener("keydown", function(e){
  if(e.key !== "Escape" || !PEAR.card) return;
  if(PEAR.pick){ PEAR.pick = null; pearRenderCard(); } else pearClose();
});

// ── BOOT ─────────────────────────────────────────────────────
// Resolve the signed-in identity first: the owner gate and every DB write need
// it. Same pattern as cfbpool — onAuthStateChanged fires once with the restored
// session, with a timeout so a slow or missing auth never hangs the page.
function psGate(msg, sub){
  document.getElementById("root").innerHTML =
    '<div class="ps-gate"><h1>' + msg + '</h1><p>' + sub + '</p>' +
    '<a class="btn btn-gold" href="' + HUB + '">Back to Scorecery</a></div>';
}

function psStart(){
  var uid = ME();
  if(!uid){
    psGate("Not signed in", "Prophescore runs on your Scorecery account. Sign in on the hub and come back.");
    return;
  }
  if(!isRootMaster(uid)){
    psGate("Owner only", "This tool is not part of your account.");
    return;
  }
  // Load the user record so the topbar has what it needs.
  function go(){ renderPoolEdge(); }
  if(DB){
    DB.ref("users/" + uid).once("value", function(sn){
      SC.currentUser = sn.val() || { uid: uid };
      SC.currentUser.uid = SC.currentUser.uid || uid;
      go();
    }, function(){ SC.currentUser = { uid: uid }; go(); });
  } else {
    SC.currentUser = { uid: uid };
    go();
  }
}

(function boot(){
  document.getElementById("root").innerHTML =
    '<div class="ps-boot">Loading Prophescore\u2026</div>';
  if(!AUTH){ psStart(); return; }
  var started = false;
  function once(){ if(started) return; started = true; psStart(); }
  AUTH.onAuthStateChanged(function(){ once(); });
  setTimeout(once, 2500);
})();
</script>
