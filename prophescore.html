<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<link rel="apple-touch-icon" sizes="512x512" href="/poolplay-icon.png">
<link rel="icon" type="image/png" href="/poolplay-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>Scorecery – Prophescore</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<style>

*{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#f5f0e8;--card:#ffffff;--card2:#f8f5f0;--border:#111111;--border2:#dddddd;
  --text:#111111;--muted:#777777;--dim:#aaaaaa;
  --gold:#e8c840;--gold-bg:#fffbe8;--gold-dark:#b89a00;
  --green:#5dba4a;--green-bg:#edfae8;
  --blue:#5590e8;--blue-bg:#e8f0ff;
  --red:#e85555;--red-bg:#ffe8e8;--red2:#dc2626;
  --purple:#9955e8;--purple-bg:#f5e8ff;
  --cream:#fdf8ee;--shadow:#111111
}

html{background:var(--bg)}

body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;font-size:14px;min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}

.topbar{position:sticky;top:0;z-index:50;background:#ffffff;border-bottom:3px solid var(--border);padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;box-shadow:0 3px 0 var(--border);overflow:hidden}

.logo{font-size:17px;font-weight:900;color:var(--text);letter-spacing:-.02em;flex-shrink:0;white-space:nowrap}

.logo span{color:var(--gold-dark)}

.logo-sub{font-size:9px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-top:-1px;font-weight:700}

.topbar-right{display:flex;gap:5px;align-items:center;flex-shrink:0}

.btn-topbar-login{font-size:9px;font-weight:800;padding:4px 10px;border-radius:8px;border:2px solid var(--border);background:#ffffff;color:var(--text);cursor:pointer;box-shadow:2px 2px 0 var(--border);white-space:nowrap}

.btn-topbar-login:active{transform:translate(2px,2px);box-shadow:none}

.btn-topbar-signup{font-size:9px;font-weight:800;padding:4px 10px;border-radius:8px;border:2px solid var(--border);background:var(--gold);color:var(--text);cursor:pointer;box-shadow:2px 2px 0 var(--border);white-space:nowrap}

.btn-topbar-signup:active{transform:translate(2px,2px);box-shadow:none}

.btn{border-radius:8px;padding:6px 14px;font-size:11px;font-weight:800;border:2px solid var(--border);cursor:pointer;box-shadow:2px 2px 0 var(--border);font-family:'Nunito',sans-serif;transition:transform .1s,box-shadow .1s}

.btn:active{transform:translate(2px,2px);box-shadow:none}

.btn-ghost{background:#ffffff;color:var(--text)}

.btn-primary{background:var(--blue-bg);color:var(--blue)}

.btn-gold{background:var(--gold);color:var(--text)}

.btn-green{background:var(--green-bg);color:var(--green)}

.btn-red{background:var(--red-bg);color:var(--red)}

.btn-purple{background:var(--purple-bg);color:var(--purple)}


/* ADMIN PANEL */
.admin-panel{background:#ffffff;border:2px solid var(--border);border-radius:12px;padding:14px;box-shadow:4px 4px 0 var(--border)}

.btn-sm{padding:0 9px;font-size:10px;height:26px;line-height:26px;display:inline-flex;align-items:center;justify-content:center}

.main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:20px 14px 60px}

.auth-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:600;display:flex;align-items:center;justify-content:center;padding:20px}

.auth-modal-box{background:#ffffff;border:3px solid var(--border);border-radius:16px;width:100%;max-width:360px;padding:24px 20px;position:relative;box-shadow:5px 5px 0 var(--border)}

.auth-modal-close{position:absolute;top:12px;right:14px;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;line-height:1;padding:0;font-weight:800}

/* SECTION LABEL */
.section-label{font-size:10px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px;margin-top:20px}

.section-label:first-child{margin-top:0}

/* AUTH MODAL */
.auth-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:600;display:flex;align-items:center;justify-content:center;padding:20px}

.auth-modal-box{background:#ffffff;border:3px solid var(--border);border-radius:16px;width:100%;max-width:360px;padding:24px 20px;position:relative;box-shadow:5px 5px 0 var(--border)}

.auth-modal-close{position:absolute;top:12px;right:14px;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;line-height:1;padding:0;font-weight:800}

@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}


/* ── SCORECERY logo ── */
.scorecery-logo{
  font-family:'Nunito',sans-serif;
  font-weight:900;
  font-size:inherit;
  color:#ffffff;
  text-transform:uppercase;
  letter-spacing:.04em;
  display:inline-block;
  white-space:nowrap;
  -webkit-text-stroke:2.5px #111111;
  text-shadow:
    1px 1px 0 #111111,
    2px 2px 0 #111111,
    3px 3px 0 #111111,
    4px 4px 0 #1a4fd6,
    6px 6px 0 #0a2088,
    7px 7px 0 #060e44;
  paint-order:stroke fill;
}

.topbar .logo{font-size:17px;flex-shrink:0;white-space:nowrap}

@keyframes oracle-pulse{0%,100%{box-shadow:0 0 6px #818cf8,0 0 12px #6366f1}50%{box-shadow:0 0 12px #a5b4fc,0 0 24px #818cf8}}

@keyframes scorecerer-pulse{0%,100%{box-shadow:0 0 6px #a855f7,0 0 12px #7c3aed}50%{box-shadow:0 0 14px #e879f9,0 0 28px #a855f7}}

@keyframes celestial-pulse{0%,100%{box-shadow:0 0 6px #f43f5e,0 0 12px #9f1239}50%{box-shadow:0 0 14px #fda4af,0 0 28px #f43f5e}}

/* TOAST */
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);background:#111111;color:#ffffff;font-size:12px;font-weight:800;font-family:'Nunito',sans-serif;padding:10px 18px;border-radius:40px;border:2px solid #333;box-shadow:4px 4px 0 rgba(0,0,0,.4);z-index:9999;pointer-events:none;opacity:0;transition:opacity .2s,transform .2s;white-space:nowrap;max-width:320px;text-align:center}

#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

#toast.toast-ok{background:#1a3a1a;border-color:#5dba4a;color:#7dd66c}

#toast.toast-err{background:#3a1a1a;border-color:#e85555;color:#f08080}

#toast.toast-info{background:#1a253a;border-color:#5590e8;color:#7aabf0}

@keyframes bootPulse{0%,80%,100%{opacity:.25;transform:scale(.85)}40%{opacity:1;transform:scale(1)}}

/* ── POOL EDGE (owner-only stale-line tracker) ─────────────────────────────── */
.pe-stats{display:flex;gap:8px;margin-bottom:16px}

.pe-stat{flex:1;background:#ffffff;border:2px solid var(--border);border-radius:10px;padding:9px 10px;box-shadow:3px 3px 0 var(--border);text-align:center}

.pe-stat-val{font-size:19px;font-weight:900;letter-spacing:-.03em;color:var(--text)}

.pe-stat-val.pos{color:var(--green)}

.pe-stat-val.neg{color:var(--red)}

.pe-stat-lab{font-size:8px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:1px}

.pe-form{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.pe-form .pe-full{grid-column:1/-1}

.pe-lab{display:block;font-size:8px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px}

.pe-in{width:100%;padding:8px 9px;font-size:16px;font-weight:700;background:var(--cream);color:var(--text);border:2px solid var(--border);border-radius:8px;box-shadow:2px 2px 0 var(--border2)}

.pe-in:focus{outline:none;border-color:var(--blue)}

.pe-hint{font-size:9px;font-weight:700;color:var(--muted);margin-top:4px;line-height:1.4}

.pe-row{display:flex;align-items:flex-start;gap:9px;padding:9px 0;border-bottom:2px dashed var(--border2)}

.pe-row:last-child{border-bottom:none}

.pe-conf{flex:0 0 30px;height:30px;border-radius:8px;border:2px solid var(--border);background:var(--card2);color:var(--muted);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px}

.pe-conf.hi{background:var(--gold);color:var(--text)}

.pe-conf.lo{opacity:.5}

.pe-body{flex:1;min-width:0}

.pe-pick{font-size:13px;font-weight:900;color:var(--text);letter-spacing:-.01em}

.pe-meta{font-size:9px;font-weight:700;color:var(--muted);margin-top:2px;line-height:1.45}

.pe-tag{display:inline-block;font-size:7px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;padding:2px 5px;border-radius:4px;margin-right:4px;border:1px solid var(--border)}

.pe-tag.key{background:var(--gold-bg);color:var(--gold-dark)}

.pe-tag.flat{background:var(--card2);color:var(--muted)}

.pe-tag.dog{background:var(--green-bg);color:var(--green)}

.pe-acts{flex:0 0 auto;display:flex;gap:4px;align-items:center}

.pe-mini{font-size:10px;font-weight:900;padding:4px 7px;border-radius:6px;border:2px solid var(--border);background:#ffffff;color:var(--text);cursor:pointer;box-shadow:2px 2px 0 var(--border2)}

.pe-mini:active{transform:translate(2px,2px);box-shadow:none}

.pe-res{font-size:11px;font-weight:900}

.pe-res.w{color:var(--green)}

.pe-res.l{color:var(--red)}

.pe-empty{text-align:center;color:var(--muted);font-size:11px;font-weight:700;padding:16px 0}

.pe-tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
.pe-tbl{width:100%;border-collapse:collapse;font-size:11px;font-weight:700}

.pe-tbl th{text-align:left;font-size:8px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;padding-bottom:5px}

.pe-tbl td{padding:6px 0;border-top:2px dashed var(--border2)}

.pe-tbl td:last-child,.pe-tbl th:last-child{text-align:right}

.pe-note{font-size:9px;font-weight:700;color:var(--muted);line-height:1.5;margin-top:9px}

.pe-warn{background:var(--gold-bg);border:2px solid var(--border);border-radius:10px;padding:9px 11px;font-size:9px;font-weight:800;color:var(--gold-dark);line-height:1.5;margin-top:12px;box-shadow:3px 3px 0 var(--border)}

.pe-err{background:var(--red-bg);border:2px solid var(--red);border-radius:8px;padding:7px 10px;font-size:9px;font-weight:800;color:var(--red);margin-bottom:10px}

.pe-opt{display:block;width:100%;text-align:left;padding:10px 12px;margin-bottom:7px;border:2px solid var(--border);border-radius:9px;background:#ffffff;cursor:pointer;font-family:'Nunito',sans-serif;box-shadow:3px 3px 0 var(--border2)}

.pe-opt:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--border2)}

.pe-tag.steam{background:var(--purple-bg);color:var(--purple)}

.pe-tag.disp{background:var(--blue-bg);color:var(--blue)}

.pe-wsec{font-size:8px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;margin:12px 0 6px}

.pe-wsec:first-child{margin-top:0}

.pe-wtag{font-size:7px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;padding:2px 6px;border-radius:4px;border:1px solid var(--border)}

.pe-wtag.open{background:var(--green-bg);color:var(--green)}

.pe-wtag.lock{background:var(--card2);color:var(--muted)}

.pe-opt[disabled]{cursor:default;box-shadow:none}

.pe-mktrow{display:flex;align-items:center;gap:6px;margin-top:5px}

.pe-mktlab{font-size:8px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}

.pe-mkt{width:66px;padding:3px 6px;font-size:16px;font-weight:800;background:var(--cream);color:var(--text);border:2px solid var(--border2);border-radius:6px}

.pe-mkt:focus{outline:none;border-color:var(--blue)}
@media(max-width:400px){
.pe-form{grid-template-columns:1fr}
}


/* Prophescore board cards — signal strength first, matchup second. */
.pe-card{position:relative;background:#fff;border:2px solid var(--border);border-radius:11px;padding:9px 11px 8px;margin-bottom:9px;box-shadow:3px 3px 0 var(--border)}

.pe-card::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 3px 3px 0}

.pe-card.strong::before{background:var(--gold-dark)}

.pe-card.mid::before{background:var(--blue)}

.pe-card.weak::before{background:var(--muted)}

.pe-card.weak{box-shadow:2px 2px 0 var(--border2);border-color:var(--border2)}

.pe-card.done{background:var(--card2)}

.pe-hd{display:flex;align-items:center;gap:7px;margin-left:7px}

.pe-rank{flex:0 0 auto;min-width:20px;height:20px;padding:0 5px;border-radius:6px;background:var(--card2);color:var(--text);font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;border:1px solid var(--border2)}

.pe-card.strong .pe-rank{background:var(--gold);color:var(--text)}

.pe-card.mid .pe-rank{background:var(--blue-bg);color:var(--blue)}

.pe-team{font-size:14px;font-weight:900;color:var(--text);letter-spacing:-.02em;overflow-wrap:break-word;line-height:1.2}

.pe-num{font-size:14px;font-weight:900;color:var(--gold-dark);flex:0 0 auto}


.pe-sp{flex:1}

.pe-bar{height:3px;border-radius:2px;background:var(--border2);margin:6px 0 6px 7px;overflow:hidden}

.pe-bar i{display:block;height:100%;border-radius:2px;background:var(--gold-dark)}

.pe-card.mid .pe-bar i{background:var(--blue)}

.pe-card.weak .pe-bar i{background:var(--muted)}

.pe-sub{font-size:10px;font-weight:700;color:var(--muted);margin-left:7px}

.pe-move{display:flex;align-items:center;gap:7px;margin:4px 0 0 7px;min-height:18px}

.pe-spark{flex:0 0 auto;display:block}

.pe-delta{font-size:11px;font-weight:900;letter-spacing:-.01em}

.pe-delta.up{color:var(--blue)}

.pe-delta.dn{color:var(--green)}

.pe-delta.flat{color:var(--dim);font-weight:700}

.pe-sigs{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 0 7px}

.pe-tag.soft{background:var(--card2);color:var(--dim);border-color:var(--border2)}

.pe-tag.cush{background:var(--green-bg);color:var(--green)}

.pe-tag.prior{background:var(--purple-bg);color:var(--purple)}

.pe-tag.bounce{background:var(--red-bg);color:var(--red)}

.pe-ft{display:flex;align-items:center;gap:6px;margin:8px 0 0 7px;padding-top:7px;border-top:2px dashed var(--border2)}

.pe-ftlab{font-size:8px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

.pe-ftval{font-size:12px;font-weight:900;color:var(--text);margin-right:3px}

.pe-mkt{width:58px;padding:3px 6px;font-size:16px;font-weight:900;background:var(--cream);color:var(--text);border:2px solid var(--border2);border-radius:6px}

.pe-mini.ghost{border-color:var(--border2);color:var(--muted);box-shadow:none}

.pe-chip-res{font-size:11px;font-weight:900;padding:3px 9px;border-radius:6px;border:2px solid var(--border);cursor:pointer;font-family:'Nunito',sans-serif}

.pe-chip-res.w{background:var(--green-bg);color:var(--green)}

.pe-chip-res.l{background:var(--red-bg);color:var(--red)}



.pem-hd{font-size:8px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;margin:14px 0 7px;padding-top:10px;border-top:2px dashed var(--border2)}

.pem-row{display:flex;align-items:center;gap:9px;padding:6px 0;border-bottom:1px dashed var(--border2)}

.pem-row:last-of-type{border-bottom:none}

.pem-score{flex:0 0 auto;font-size:13px;font-weight:900;color:var(--text);font-variant-numeric:tabular-nums;min-width:52px}

.pem-mid{flex:1;min-width:0}

.pem-teams{font-size:11px;font-weight:800;color:var(--text);overflow-wrap:break-word;line-height:1.2}

.pem-sub{font-size:9px;font-weight:700;color:var(--muted);margin-top:1px}

.pem-diff{flex:0 0 auto;text-align:right;font-size:12px;font-weight:900;color:var(--muted)}

.pem-diff span{display:block;font-size:8px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--dim)}

.pem-diff.big{color:var(--purple)}

.pem-diff.big span{color:var(--purple)}



.pem-prov{font-size:9px;font-weight:800;color:var(--muted);margin-bottom:2px}

.pem-prov b{color:var(--text)}

.pem-warn{background:var(--red-bg);border:2px solid var(--red);border-radius:8px;padding:7px 10px;font-size:9px;font-weight:800;color:var(--red);line-height:1.45;margin-top:8px}

.pem-bench{display:flex;gap:6px;margin-top:8px}

.pem-bl{flex:1;background:var(--card2);border:2px solid var(--border2);border-radius:8px;padding:6px 8px;text-align:center}

.pem-bl span{display:block;font-size:7px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}

.pem-bl b{display:block;font-size:14px;font-weight:900;color:var(--text);margin-top:1px}

.pem-knob{margin-top:12px;padding-top:10px;border-top:2px dashed var(--border2)}

.pem-knoblab{font-size:9px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}

.pem-knoblab b{color:var(--text);font-size:11px}

#pem-priorw{width:100%;accent-color:var(--gold-dark)}

.pem-knobends{display:flex;justify-content:space-between;font-size:8px;font-weight:700;color:var(--dim);margin-top:1px}

.pe-stat-val.neg{color:var(--red)}



.pem-sechd{font-size:8px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;margin:0 0 8px}

.pem-sechd span{font-weight:700;color:var(--dim);letter-spacing:0;text-transform:none}

.pem-knobs{margin-top:12px;padding-top:10px;border-top:2px dashed var(--border2)}

.pem-knob{margin-bottom:11px}

.pem-knoblab{display:flex;align-items:center;gap:5px;font-size:9px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}

.pem-knoblab b{color:var(--text);font-size:11px}

.pem-info{margin-left:auto;width:15px;height:15px;border-radius:50%;border:1.5px solid var(--border2);background:#fff;color:var(--muted);font-size:9px;font-weight:900;cursor:pointer;line-height:1;padding:0;font-family:inherit}

.pem-range{width:100%;accent-color:var(--gold-dark);margin:0}

.pem-knobends{display:flex;justify-content:space-between;font-size:8px;font-weight:700;color:var(--dim);margin-top:1px}



.pem-flip{display:inline-block;font-size:7px;font-weight:900;text-transform:uppercase;letter-spacing:.05em;padding:1px 5px;border-radius:4px;background:var(--purple-bg);color:var(--purple);border:1px solid var(--purple);margin-left:3px}

.pem-slope{font-size:9px;font-weight:700;color:var(--muted);line-height:1.5;background:var(--card2);border:2px solid var(--border2);border-radius:8px;padding:7px 9px;margin-bottom:8px}

.pem-slope b{color:var(--text)}

.pem-slope.bad{background:var(--gold-bg);border-color:var(--gold-dark);color:var(--gold-dark)}

.pem-slope.bad b{color:var(--gold-dark)}

.pem-noise{font-size:9px;font-weight:800;color:var(--gold-dark);background:var(--gold-bg);border:2px solid var(--gold-dark);border-radius:8px;padding:6px 9px;margin-top:6px;line-height:1.45}

.pem-base{background:var(--card2);border:2px solid var(--border2);border-radius:8px;padding:8px 10px;margin-bottom:8px}

.pem-baserow{display:flex;justify-content:space-between;align-items:baseline;font-size:9px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:2px 0}

.pem-baserow b{font-size:13px;font-weight:900;color:var(--text);text-transform:none;letter-spacing:0}

.pem-baserow b.good{color:var(--green)}

.pem-baserow b.bad{color:var(--red)}

.pem-baserow b.same{color:var(--muted)}

.pem-basechg{font-size:9px;font-weight:700;color:var(--muted);line-height:1.45;margin-top:5px;padding-top:5px;border-top:2px dashed var(--border2)}

.pem-basechg b{color:var(--text)}

.pem-runs{display:flex;flex-direction:column;gap:6px}

.pem-run{background:var(--card2);border:2px solid var(--border2);border-radius:8px;padding:7px 9px}

.pem-runtop{display:flex;justify-content:space-between;align-items:baseline;gap:8px}

.pem-runtop b{font-size:11px;font-weight:900;color:var(--text)}

.pem-runtop span{font-size:13px;font-weight:900;color:var(--text);white-space:nowrap}

/* Head to head */

.pe-vsno{padding:9px;font-size:10px;font-weight:800;color:var(--muted)}
.pe-vshead{display:flex;align-items:center;gap:6px;margin:4px 0 10px}
.pe-vsname{flex:1;text-align:center;font-size:13px;font-weight:900;color:var(--text);line-height:1.2}
.pe-vsvs{font-size:9px;font-weight:900;color:var(--dim);text-transform:uppercase}
.pe-vssec{font-size:8px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;margin:12px 0 5px;padding-left:7px;border-left:3px solid var(--gold-dark)}

.pe-vstxt{font-size:10px;font-weight:800;color:var(--text);overflow-wrap:break-word;line-height:1.2}
.pe-vssub{font-size:9px;font-weight:800;color:var(--muted);white-space:nowrap}
.pe-vsrk{font-size:8px;font-weight:900;padding:1px 4px;border-radius:5px;background:var(--border2);color:var(--muted);white-space:nowrap}

/* Simulation */

.pe-simtop{background:var(--card2);border:2px solid var(--border);border-radius:9px;padding:9px;text-align:center;box-shadow:2px 2px 0 var(--border);margin-bottom:8px}

.pe-simscore b{font-size:17px;font-weight:900;color:var(--text);font-variant-numeric:tabular-nums}
.pe-simline{font-size:15px;font-weight:900;color:var(--gold-dark);margin-top:3px;font-variant-numeric:tabular-nums}

.pe-simrow{display:flex;align-items:center;gap:5px;margin-bottom:2px}

.pe-simtrack i.lo{background:var(--blue)}

.pem-sos{display:flex;align-items:center;gap:7px;padding:3px 0}

/* Prophescore layout: setup first, board big, everything else folded. */
.pe-hdr{display:flex;align-items:center;gap:9px;margin-bottom:14px}

.pe-title{font-size:18px;font-weight:900;color:var(--text);flex:1;letter-spacing:-.02em}

.pe-rec{font-size:12px;font-weight:900;color:var(--muted);background:var(--card2);border:2px solid var(--border2);border-radius:7px;padding:3px 8px}

.pe-rec span{color:var(--gold-dark)}

.pe-setupbar{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}

.pe-setup{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:10px 11px;border:2px solid var(--border);border-radius:10px;background:#fff;cursor:pointer;font-family:'Nunito',sans-serif;box-shadow:3px 3px 0 var(--border)}

.pe-setup:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--border)}

.pe-setup.todo{background:var(--gold-bg);border-color:var(--gold-dark)}

.pe-setup.off{opacity:.62;box-shadow:2px 2px 0 var(--border2);border-color:var(--border2)}

.pe-setup.warn{background:var(--gold-bg)}

.pe-si{font-size:15px;flex:0 0 auto;line-height:1}

.pe-sl{font-size:12px;font-weight:900;color:var(--text);flex:0 0 auto}

.pe-ss{flex:1;font-size:10px;font-weight:700;color:var(--muted);text-align:right;overflow-wrap:break-word;line-height:1.2}

.pe-sc{flex:0 0 16px;text-align:center;font-size:13px;font-weight:900;color:var(--dim)}

.pe-setup.ok .pe-sc{color:var(--green)}

.pe-setup.todo .pe-sc,.pe-setup.warn .pe-sc{color:var(--gold-dark)}

.pe-setup.busy{opacity:.55;pointer-events:none}

.pe-model{display:flex;align-items:center;gap:7px;margin:7px 0 0 7px;padding:5px 8px;background:var(--card2);border-radius:7px;border:1px solid var(--border2)}

.pe-model.big{background:var(--purple-bg);border-color:var(--purple)}

.pe-mlab{font-size:7px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}

.pe-mscore{font-size:12px;font-weight:900;color:var(--text);font-variant-numeric:tabular-nums}

.pe-mline{font-size:10px;font-weight:800;color:var(--muted)}

.pe-mdiff{font-size:12px;font-weight:900;color:var(--muted);font-variant-numeric:tabular-nums}

.pe-model.big .pe-mdiff,.pe-model.big .pe-mlab{color:var(--purple)}

.pe-fold{background:#fff;border:2px solid var(--border2);border-radius:10px;margin-top:10px;overflow:hidden}

.pe-fold[open]{border-color:var(--border);box-shadow:3px 3px 0 var(--border2)}

.pe-fold summary{display:flex;align-items:center;gap:8px;padding:11px 12px;cursor:pointer;list-style:none}

.pe-fold summary::-webkit-details-marker{display:none}

.pe-fname{font-size:11px;font-weight:900;color:var(--text);text-transform:uppercase;letter-spacing:.06em}

.pe-fsub{flex:1;font-size:10px;font-weight:700;color:var(--dim);text-align:right;overflow-wrap:break-word;line-height:1.2}

.pe-farrow{flex:0 0 auto;font-size:15px;font-weight:900;color:var(--dim);transition:transform .15s}

.pe-fold[open] .pe-farrow{transform:rotate(90deg)}

.pe-fbody{padding:0 12px 12px}

.pe-fbody .section-label:first-child{margin-top:0}

.pe-fbody .admin-panel{box-shadow:none;border-color:var(--border2)}



/* Compact board cards: one scannable row, tap to open. */
details.pe-card{padding:0;overflow:hidden}

details.pe-card::before{top:0;bottom:0}

.pe-sum{display:flex;align-items:center;gap:7px;padding:9px 10px 9px 13px;cursor:pointer;list-style:none}

.pe-sum::-webkit-details-marker{display:none}

.pe-sum .pe-team{font-size:13px;flex:0 1 auto;min-width:0}

.pe-sum .pe-num{font-size:13px}

.pe-minibar{flex:1 1 30px;min-width:22px;height:4px;border-radius:2px;background:var(--border2);overflow:hidden}

.pe-minibar i{display:block;height:100%;border-radius:2px;background:var(--gold-dark)}

.pe-card.mid .pe-minibar i{background:var(--blue)}

.pe-card.weak .pe-minibar i{background:var(--muted)}

.pe-mdot{flex:0 0 auto;font-size:10px;font-weight:900;color:var(--muted);font-variant-numeric:tabular-nums;min-width:30px;text-align:right}

.pe-mdot.big{color:var(--purple)}

.pe-sum .pe-mini{flex:0 0 auto;padding:3px 6px;font-size:9px;box-shadow:1px 1px 0 var(--border2)}

.pe-sum .pe-chip-res{flex:0 0 auto;padding:2px 7px;font-size:10px}

.pe-carrow{flex:0 0 10px;font-size:14px;font-weight:900;color:var(--dim);transition:transform .15s;text-align:center}

details.pe-card[open] .pe-carrow{transform:rotate(90deg)}

.pe-cbody{padding:0 11px 9px 13px;border-top:2px dashed var(--border2);margin-top:2px;padding-top:8px}

.pe-cbody .pe-sub,.pe-cbody .pe-move,.pe-cbody .pe-sigs,.pe-cbody .pe-model,.pe-cbody .pe-ft{margin-left:0}

.pe-cbody .pe-ft{border-top:none;padding-top:6px}



.pe-smain{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}

.pe-sr1{display:flex;align-items:baseline;gap:6px;min-width:0}

.pe-sr1 .pe-team{overflow-wrap:break-word;line-height:1.2}

.pe-sr2{display:flex;align-items:center;gap:7px;min-width:0}

.pe-vs{font-size:10px;font-weight:700;color:var(--text);overflow-wrap:break-word;line-height:1.2;flex:0 1 auto;max-width:62%}

.pe-sr2 .pe-minibar{flex:1 1 20px;min-width:16px}




.pe-mpick{flex:0 0 auto;font-size:10px;font-weight:700;color:var(--muted);max-width:44%;overflow-wrap:break-word;line-height:1.2}

.pe-mpick b{font-weight:900;color:var(--muted)}

.pe-mpick.dis{color:var(--purple)}

.pe-mpick.dis b{color:var(--purple)}

.pe-mpickbig{font-size:13px;font-weight:900;color:var(--text);letter-spacing:-.01em}

.pe-model.big .pe-mpickbig{color:var(--purple)}

.pe-mnote{font-size:9px;font-weight:700;color:var(--purple);line-height:1.5;margin-top:4px}

.pe-mnote b{font-weight:900}



.pe-tagsm{flex:0 0 auto;font-size:7px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;background:var(--card2);border-radius:3px;padding:2px 4px;align-self:center}

.pe-team.dis,.pe-num.dis{color:var(--purple)}

.pe-edgelab{font-size:7px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;color:var(--dim)}



.pe-edgeon{color:var(--gold-dark)}
/* This page owns nothing but Prophescore, so the shell is minimal. */
.ps-gate{max-width:420px;margin:60px auto;padding:0 16px;text-align:center}
.ps-gate h1{font-size:18px;font-weight:900;margin-bottom:8px}
.ps-gate p{font-size:12px;font-weight:700;color:var(--muted);line-height:1.6;margin-bottom:14px}
.ps-boot{max-width:420px;margin:80px auto;text-align:center;font-size:11px;font-weight:800;color:var(--muted)}

/* ── Games & matchup card (Scorecery style) ───────────────────────────── */
.pe-nav{display:grid;grid-template-columns:1fr 1fr;margin:-4px 0 16px;background:#fff;border:2px solid var(--border);border-radius:12px;box-shadow:3px 3px 0 var(--border);overflow:hidden}
.pe-nav button{padding:10px 8px;border:none;background:#fff;color:var(--muted);font:900 13px 'Nunito',sans-serif;cursor:pointer}
.pe-nav button+button{border-left:2px solid var(--border)}
.pe-nav button.on{background:var(--gold);color:var(--text)}
.pear{font-family:'Nunito',sans-serif;color:var(--text)}
.pr-h1{font-size:22px;font-weight:900;letter-spacing:-.02em;line-height:1.1}
.pr-h2{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:4px 0 12px}
.pr-weeks{display:flex;gap:5px;overflow-x:auto;padding:0 4px 8px 0;margin-bottom:10px;-webkit-overflow-scrolling:touch}
.pr-weeks::-webkit-scrollbar{display:none}
.pr-wk{flex:none;min-width:34px;height:32px;padding:0 8px;border:2px solid var(--border);background:#fff;font:900 12px 'Nunito',sans-serif;color:var(--muted);border-radius:8px;box-shadow:2px 2px 0 var(--border);cursor:pointer;position:relative}
.pr-wk:active{transform:translate(2px,2px);box-shadow:none}
.pr-wk.now{color:var(--text)}
.pr-wk.now:after{content:"";position:absolute;top:-4px;right:-4px;width:8px;height:8px;border-radius:50%;background:var(--red2);border:1.5px solid #fff}
.pr-wk.on{background:var(--gold);color:var(--text)}
.pr-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.pr-seg{display:flex;background:#fff;border:2px solid var(--border);border-radius:10px;padding:3px;gap:3px;box-shadow:2px 2px 0 var(--border)}
.pr-seg button{border:none;background:none;padding:6px 10px;border-radius:7px;font:900 11px 'Nunito',sans-serif;color:var(--muted);cursor:pointer}
.pr-seg button.on{background:#111;color:#fff}
.pr-btn{border:2px solid var(--border);background:var(--gold);color:var(--text);border-radius:9px;padding:8px 12px;font:900 11px 'Nunito',sans-serif;box-shadow:2px 2px 0 var(--border);cursor:pointer}
.pr-btn:active{transform:translate(2px,2px);box-shadow:none}
.pr-btn.ghost{background:#fff;margin-left:auto}
.pr-note{background:var(--gold-bg);border:2px solid var(--border);border-radius:12px;padding:12px;font-size:12px;font-weight:700;line-height:1.5;margin-bottom:12px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;box-shadow:3px 3px 0 var(--border)}
.pr-empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:12px;font-weight:800}
.pr-link{border:none;background:none;color:var(--text);text-decoration:underline;font:inherit;font-weight:900;cursor:pointer}
.pr-day{font-size:10px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin:18px 2px 8px}
.pr-game{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--border);border-radius:12px;box-shadow:3px 3px 0 var(--border);margin-bottom:10px;padding:0;overflow:hidden;cursor:pointer;font-family:'Nunito',sans-serif;color:var(--text)}
.pr-game:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--border)}
.pr-gtop{display:flex;justify-content:space-between;padding:6px 11px;font-size:10px;font-weight:800;color:var(--muted);background:var(--cream);border-bottom:2px solid var(--border)}
.pr-gtop span:last-child{color:var(--text);background:var(--gold);border:1.5px solid var(--border);border-radius:20px;padding:0 7px;font-weight:900}
.pr-live{color:var(--red2);font-weight:900}
.pr-trow{display:flex;align-items:center;gap:10px;padding:8px 11px;border-bottom:1.5px solid var(--border2)}
.pr-tlogo{width:30px;height:30px;object-fit:contain;flex:none}
.pr-tname{flex:1;min-width:0;display:flex;flex-direction:column}
.pr-tname b{font-weight:900;font-size:15px;overflow-wrap:break-word;line-height:1.2}
.pr-tname b i{font-style:normal;font-size:10px;font-weight:900;color:#fff;background:#111;border-radius:5px;padding:0 4px;margin-right:3px;vertical-align:2px}
.pr-tname span{font-size:10px;font-weight:800;color:var(--muted)}
.pr-tproj{text-align:right;display:flex;flex-direction:column;align-items:flex-end}
.pr-tproj b{font-weight:900;font-size:19px;line-height:1.1}
.pr-tproj b.fav{color:#2f5fd0}
.pr-tproj b.dog{color:var(--red2)}
.pr-tproj span{font-size:10px;font-weight:800;color:var(--muted)}
.pr-gfoot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 8px;padding:7px 11px;font-size:11px;font-weight:900}
.pr-gfoot span:last-child{margin-left:auto;color:var(--muted);font-weight:800;text-align:right}
.pr-foot{font-size:10px;font-weight:700;color:var(--muted);text-align:center;margin:14px 0 6px;line-height:1.5}

/* matchup card */
#pear-host{font-family:'Nunito',sans-serif}
.pc-back{position:fixed;inset:0;z-index:9000;background:rgba(0,0,0,.45);touch-action:none}
.pc{position:fixed;z-index:9001;left:50%;top:50%;top:var(--pc-mid,50%);transform:translate(-50%,-50%);width:min(760px,calc(100vw - 20px));max-height:calc(100vh - 28px);max-height:calc(var(--pc-h,100vh) - 28px);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  background:var(--bg);color:var(--text);border:3px solid var(--border);border-radius:16px;padding:12px 10px 10px;box-shadow:6px 6px 0 var(--border);font-family:'Nunito',sans-serif}

.pc-title{text-align:center;font-weight:900;font-size:clamp(16px,4.8vw,26px);line-height:1.15;padding:0 42px;letter-spacing:-.02em}
.pc-sub{text-align:center;font-size:clamp(9px,2.6vw,11px);font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:3px}
.pc-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,1fr);align-items:center;gap:6px;margin-top:8px;background:#fff;border:2px solid var(--border);border-radius:14px;box-shadow:3px 3px 0 var(--border);padding:10px 6px}
.pc-logo{min-width:0;border:none;background:none;padding:2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}

.pc-logo span{font-size:8.5px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;border:1.5px solid var(--border);border-radius:20px;padding:2px 8px;background:var(--gold-bg);box-shadow:1.5px 1.5px 0 var(--border);text-align:center;line-height:1.25;max-width:100%}
.pc-lcol{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.pc-info{border:2px solid var(--border);background:#fff;color:var(--text);border-radius:20px;padding:3px 10px;font:900 10px 'Nunito',sans-serif;box-shadow:2px 2px 0 var(--border);cursor:pointer;max-width:100%;line-height:1.25}
.pc-info:active{transform:translate(2px,2px);box-shadow:none}
.pc-backrow{margin:-2px 44px 6px 0}
.pc-bk{border:2px solid var(--border);background:#fff;color:var(--text);border-radius:9px;padding:5px 10px;font:900 11px 'Nunito',sans-serif;box-shadow:2px 2px 0 var(--border);cursor:pointer;max-width:100%;text-align:left;line-height:1.25}
.pc-bk:active{transform:translate(2px,2px);box-shadow:none}
.pc-logo:active span{transform:translate(1.5px,1.5px);box-shadow:none}
.pc-mid{min-width:0;overflow-wrap:break-word;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.pc-pair{display:flex;justify-content:center;align-items:flex-end;gap:clamp(8px,5vw,34px);width:100%}
.pc-pair div{display:flex;flex-direction:column;align-items:center}
.pc-pair small{font-size:clamp(7px,2vw,9px);font-weight:900;color:var(--muted);letter-spacing:.04em}

.pc-pair.pts{margin-top:6px}
.pc-pair em{font-style:normal;font-size:clamp(16px,4.5vw,26px);font-weight:900;padding-bottom:2px;color:var(--muted)}
.pc-kv{display:inline-block;font-size:clamp(11px,3.2vw,14px);font-weight:900;border:1.5px solid var(--border);border-radius:20px;padding:1px 10px;margin-top:5px;background:var(--cream)}
.pc-kv+.pc-kv{margin-top:3px}
.pc-line{max-width:100%;overflow-wrap:break-word;font-size:clamp(15px,4.6vw,22px);font-weight:900;margin-top:6px;background:var(--gold);border:2px solid var(--border);border-radius:10px;padding:2px 10px;box-shadow:2px 2px 0 var(--border)}
.pc-vegas{font-size:clamp(9.5px,2.8vw,12px);font-weight:800;color:var(--muted);margin-top:5px}
.pc-final{font-size:clamp(11px,3vw,13px);font-weight:900;color:var(--red2);margin-top:2px}
.pc-none{font-size:12px;font-weight:800;color:var(--muted);padding:14px 4px}
.pc-ctrls{display:flex;justify-content:center;gap:8px;margin:10px 0 8px;flex-wrap:wrap}
.pc-ctrls button{border:2px solid var(--border);background:#fff;border-radius:9px;padding:6px 11px;font:900 11px 'Nunito',sans-serif;color:var(--text);box-shadow:2px 2px 0 var(--border);cursor:pointer}
.pc-ctrls button:active{transform:translate(2px,2px);box-shadow:none}
.pc-ctrls button.on{background:#111;color:#fff}
.pc-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.45fr) minmax(0,1fr);grid-template-areas:'l c r';gap:clamp(4px,1.4vw,12px);font-size:clamp(7.5px,2.3vw,11.5px);font-weight:800;background:#fff;border:2px solid var(--border);border-radius:14px;box-shadow:3px 3px 0 var(--border);padding:8px clamp(4px,1.6vw,10px)}
.pc-side,.pc-center{min-width:0}
.pc-side.l{grid-area:l}.pc-side.r{grid-area:r}.pc-center{grid-area:c}
.pc-rec{font-weight:900;margin-bottom:1px;color:var(--muted)}
.pc-side.r .pc-rec{text-align:right}
.pc-srow{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:3px;min-height:2.05em;border-bottom:1.5px solid var(--border2)}
.pc-side.r .pc-srow{grid-template-columns:auto auto 1fr}
.pc-srow.hd .pc-lab{font-weight:900}
.pc-lab{padding-left:1.4em;color:#444;min-width:0;overflow-wrap:anywhere}
.pc-lab.hd{padding-left:0;color:var(--text)}
.pc-side.r .pc-lab{padding-left:0;padding-right:1.4em;text-align:right}
.pc-side.r .pc-lab.hd{padding-right:0}
.pc-val{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:900}
.pc-side.r .pc-val,.pc-crow .pc-val:last-child{text-align:left}
.pc-shd{font-weight:900;font-size:.9em;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-top:.6em;min-height:1.9em;border-bottom:2px solid var(--border);display:flex;align-items:flex-end}
.pc-side.r .pc-shd{justify-content:flex-end}
.pc-rk{display:inline-flex;align-items:center;justify-content:center;min-width:2.5em;height:1.75em;font-variant-numeric:tabular-nums;font-weight:900;border-radius:5px}
.pc-rk:empty{visibility:hidden}
.pc-chd{font-weight:900;text-align:center;background:#111;color:#fff;border-radius:6px;padding:.3em .4em;margin:.2em 0 .15em;line-height:1.25;overflow-wrap:anywhere}
.pc-crow{display:grid;grid-template-columns:1fr auto 1.7fr auto 1fr;align-items:center;gap:3px;min-height:2.05em;border-bottom:1.5px solid var(--border2)}
.pc-clab{text-align:center;font-size:.92em;color:#444;line-height:1.1;min-width:0;overflow-wrap:anywhere}
.pc-foot{text-align:center;font-size:clamp(9px,2.6vw,11px);font-weight:900;color:var(--muted);margin-top:8px;text-transform:uppercase;letter-spacing:.08em}
@media(max-width:520px){.pc{padding:10px 7px 8px}.pc-lab{padding-left:.7em}.pc-side.r .pc-lab{padding-right:.7em}.pc-rk{min-width:2.2em}}
/* Phones: the two team columns side by side, the head-to-head block full width underneath */
@media(max-width:480px){
  .pc-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:'l r' 'c c';column-gap:14px;row-gap:10px;font-size:clamp(10px,3.1vw,12.5px)}
  .pc-center{border-top:2px solid var(--border);padding-top:6px}

  .pc-pair{gap:clamp(6px,3vw,20px)}

}

<script>

// ── PROPHESCORE ─ STANDALONE SHELL ─────────────────────────────────
// Split out of index.html so the hub stays small and this can be worked on by
// itself. It runs against the same Firebase project, so the signed-in session
// carries across from the hub with no second login — the same way cfbpool.html
// works. Everything below the shim is the Prophescore code verbatim.

var HUB = "index.html";      // where Back goes

var MASTER_UIDS = { "SJr0tv9puDcNZLAcNy1ErOUGijg1": true };

var DB = null, AUTH = null;
try{
  firebase.initializeApp({apiKey:"AIzaSyAL0ansyAjP9A0oh35lhUV7EcxE7iYSc5Y",authDomain:"rwc-picks.firebaseapp.com",databaseURL:"https://rwc-picks-default-rtdb.firebaseio.com",projectId:"rwc-picks",appId:"1:965978379243:web:35f9db9a664f9170e27fae"});
  DB = firebase.database();
  try{ AUTH = firebase.auth(); }catch(e){}
}catch(e){}

// The host app's screen object. Prophescore reads .screen and .currentUser from
// it; nothing else here needs the rest of it.
var SC = { screen: "prophescore", currentUser: null };

var SCORECERY_TEXT_PRESETS = [
  {fill:"#ffffff", stroke:"#111111"},
  {fill:"#e8c840", stroke:"#111111"},
  {fill:"#fdf8ee", stroke:"#0a2088"},
  {fill:"#ff8fb3", stroke:"#111111"},
  {fill:"#8ed1ff", stroke:"#111111"},
  {fill:"#9ef2c8", stroke:"#111111"},
  {fill:"#ffd166", stroke:"#3a2a00"},
  {fill:"#ffffff", stroke:"#4c1d95"}
];
var SCORECERY_SHADOW_PRESETS = [
  {near:"#111111", trail:["#1a4fd6","#0a2088","#060e44"]}, // blue
  {near:"#111111", trail:["#d62839","#8b0000","#4a0000"]}, // crimson
  {near:"#111111", trail:["#2d8a4e","#1a5c33","#0d2e1a"]}, // green
  {near:"#1e1033", trail:["#7c3aed","#4c1d95","#2e1065"]}, // purple
  {near:"#3a1a00", trail:["#f97316","#c2410c","#7c2d12"]}, // orange
  {near:"#111111", trail:["#64748b","#334155","#1e293b"]}, // steel
  {near:"#111111", trail:["#e8c840","#b89a00","#5c4d00"]}  // gold
];
function randomLogoStyle(size){
  var t = SCORECERY_TEXT_PRESETS[Math.floor(Math.random()*SCORECERY_TEXT_PRESETS.length)];
  var s = SCORECERY_SHADOW_PRESETS[Math.floor(Math.random()*SCORECERY_SHADOW_PRESETS.length)];
  var shadow =
    "1px 1px 0 "+s.near+","+
    "2px 2px 0 "+s.near+","+
    "3px 3px 0 "+s.near+","+
    "4px 4px 0 "+s.trail[0]+","+
    "6px 6px 0 "+s.trail[1]+","+
    "7px 7px 0 "+s.trail[2];
  return "color:"+t.fill+";-webkit-text-stroke:2.5px "+t.stroke+";text-shadow:"+shadow+";"+(size?("font-size:"+size+"px;"):"");
}
// One combo per page load, same as the hub.
var CURRENT_LOGO_STYLE = randomLogoStyle();

function ME(){
  try{ if(AUTH && AUTH.currentUser && AUTH.currentUser.uid) return AUTH.currentUser.uid; }catch(e){}
  return (SC.currentUser && SC.currentUser.uid) || null;
}
function isRootMaster(uid){ return !!(uid && MASTER_UIDS[uid]); }

function x(s){ var t=String(s||""); t=t.replace(/&/g,"&amp;"); t=t.replace(/</g,"&lt;"); t=t.replace(/>/g,"&gt;"); t=t.replace(/'/g,"&#39;"); return t; }

function scDialog(opts){
  opts = opts || {};
  return new Promise(function(resolve){
    var prev = document.getElementById("sc-dialog-overlay");
    if(prev) prev.remove();

    var isInput = !!opts.input;
    var okColor = opts.danger ? "var(--red2)" : "var(--gold)";
    var okText  = opts.danger ? "#ffffff" : "var(--text)";

    var el = document.createElement("div");
    el.id = "sc-dialog-overlay";
    el.className = "auth-modal-overlay";
    el.style.zIndex = "900";   // above every other overlay, incl. share sheets

    var msgHtml = opts.message
      ? '<div style="font-size:12px;font-weight:700;color:var(--muted);line-height:1.5;text-align:center;margin-bottom:'+(isInput?'14px':'18px')+';white-space:pre-line">'+x(opts.message)+'</div>'
      : '';
    var inputHtml = isInput
      ? '<input class="auth-input" id="sc-dialog-input" type="'+(opts.password?'password':'text')+'" '+
        'placeholder="'+x(opts.placeholder||"")+'" value="'+x(opts.defaultValue||"")+'" '+
        'autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" '+
        'style="width:100%;margin-bottom:18px">'
      : '';

    el.innerHTML =
      '<div class="auth-modal-box" style="max-width:320px;padding:22px 20px">' +
        '<div style="font-size:14px;font-weight:900;color:var(--text);text-align:center;margin-bottom:'+((opts.message||isInput)?'12px':'18px')+'">'+x(opts.title||"Confirm")+'</div>' +
        msgHtml +
        inputHtml +
        '<div style="display:flex;gap:10px">' +
          '<button id="sc-dialog-cancel" style="flex:1;padding:11px 8px;border-radius:10px;border:2px solid var(--border);background:#ffffff;color:var(--text);font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:3px 3px 0 var(--border)">Cancel</button>' +
          '<button id="sc-dialog-ok" style="flex:1;padding:11px 8px;border-radius:10px;border:2px solid var(--border);background:'+okColor+';color:'+okText+';font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:3px 3px 0 var(--border)">'+x(opts.okLabel||"OK")+'</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(el);

    var input = document.getElementById("sc-dialog-input");
    if(input){ input.focus(); input.select(); }

    var done = false;
    function finish(val){
      if(done) return;         // guard against double-fire (Enter + click)
      done = true;
      document.removeEventListener("keydown", onKey);
      el.remove();
      resolve(val);
    }
    function ok(){ finish(isInput ? String(input ? input.value : "") : true); }
    function cancel(){ finish(false); }

    function onKey(e){
      if(e.key === "Escape") cancel();
      else if(e.key === "Enter" && (isInput || document.activeElement !== document.getElementById("sc-dialog-cancel"))) ok();
    }
    document.addEventListener("keydown", onKey);

    document.getElementById("sc-dialog-ok").addEventListener("click", ok);
    document.getElementById("sc-dialog-cancel").addEventListener("click", cancel);
    el.addEventListener("click", function(e){ if(e.target===el) cancel(); });  // tap outside = cancel
  });
}

function scConfirm(message, opts){
  opts = opts || {};
  return scDialog({ title: opts.title || "Confirm", message: message,
                    okLabel: opts.okLabel || "OK", danger: opts.danger });
}

function toast(msg, type){
  var t=document.getElementById("toast");
  t.innerHTML=msg;
  t.className = "show" + (type==="ok"?" toast-ok":type==="err"?" toast-err":type==="info"?" toast-info":"");
  clearTimeout(t._hideTimer);
  t._hideTimer = setTimeout(function(){ t.className=""; },2600);
}

// ── shims for the four host-app functions Prophescore called ─────────────

// In the hub this re-rendered whatever screen was current. Here the only way
// out of Prophescore is back to the hub, so that is what it means.
function draw(){ location.href = HUB; }

function render(h){
  document.getElementById("root").innerHTML = h;
  var bb = document.getElementById("btn-back");
  if(bb) bb.addEventListener("click", function(){ location.href = HUB; });
  var lg = document.getElementById("btn-logo");
  if(lg) lg.addEventListener("click", function(){ location.href = HUB; });
  var pf = document.getElementById("btn-profile");
  if(pf) pf.addEventListener("click", function(){ location.href = HUB; });
}

function topbar(showBack){
  var h = '<div class="topbar">';
  h += '<button class="btn btn-ghost btn-sm" id="btn-back" style="margin-right:4px">&#8592;</button>';
  h += '<div style="cursor:pointer" id="btn-logo"><div class="logo">' +
       '<span class="scorecery-logo" style="' + CURRENT_LOGO_STYLE + '">SCORECERY</span></div></div>';
  h += '<div class="topbar-right">';
  if(SC.currentUser){
    var em = SC.currentUser.emoji || '&#127919;';
    h += '<button class="btn btn-ghost btn-sm" id="btn-profile" style="gap:5px;display:flex;align-items:center">' +
         em + ' ' + x(SC.currentUser.username || "") + '</button>';
  }
  h += '</div></div>';
  return h;
}

// Prophescore's group import needs the list of groups this account belongs to.
// The hub kept a cache of every group; here the user record's own list is the
// source, with the same repair pass when a group knows about you and the index
// does not.
var _allGroupsCache = [];
function _myGroupIds(u){
  var seen = {}, ids = [];
  ((u && u.groups) || []).forEach(function(g){
    if(!g || seen[g]) return;
    seen[g] = true; ids.push(g);
  });
  var uid = ME();
  var missing = [];
  if(uid && _allGroupsCache && _allGroupsCache.length){
    _allGroupsCache.forEach(function(g){
      if(!g || !g.id || seen[g.id]) return;
      if(((g.players)||[]).indexOf(uid) < 0) return;
      seen[g.id] = true; ids.push(g.id); missing.push(g.id);
    });
  }
  if(missing.length && DB && uid){
    DB.ref("users/" + uid + "/groups").set(ids);
    if(SC.currentUser) SC.currentUser.groups = ids;
  }
  return ids;
}

// ── POOL EDGE ────────────────────────────────────────────────────────────────
// Owner-only stale-line tracker. Gated on isRootMaster() — the single root UID,
// not granted masters, since this is a personal tool rather than an admin one.
// NOTE: this gate is cosmetic. The code ships to every visitor; the only real
// protection is the Firebase rule on prophescore/{uid}.
var PE = { games: [], history: [], meta: null, priors: {}, settings: null, turnovers: {}, season: null,
           runs: [], baseline: null, teamstats: {}, ready: false, err: "" };
var PE_KEYNUMS = [3, 7];

function peOwner(){ return isRootMaster(ME()); }

function peLocalKey(){ return "prophescore_" + (ME() || "anon"); }
// Pre-rename key. Read-only fallback so a board saved as "Pool Edge" survives.
function peLegacyLocalKey(){ return "pe_data_" + (ME() || "anon"); }

function peLoad(cb){
  if(PE.ready){ if(cb) cb(); return; }
  // Local first so the screen paints instantly, then reconcile with the server.
  try{
    var raw = localStorage.getItem(peLocalKey()) || localStorage.getItem(peLegacyLocalKey());
    if(raw){
      var o = JSON.parse(raw);
      PE.games = o.games||[]; PE.history = o.history||[]; PE.meta = o.meta||null;
      PE.priors = o.priors||{}; PE.settings = o.settings||null; PE.turnovers = o.turnovers||{};
      PE.season = o.season||null;
      PE.runs = o.runs||[]; PE.baseline = o.baseline||null;
      PE.teamstats = o.teamstats||{};
      PE.tune = o.tune||null;
      PE.lines = o.lines||{};
    }
  }catch(e){}
  var uid = ME();
  if(!DB || !uid){ peAfterLoad(); PE.ready = true; if(cb) cb(); return; }
  DB.ref("prophescore/"+uid).once("value", function(sn){
    var v = sn.val();
    if(v){
      PE.games = v.games || []; PE.history = v.history || []; PE.meta = v.meta || null;
      PE.priors = v.priors || PE.priors || {};
      PE.settings = v.settings || PE.settings || null;
      PE.turnovers = v.turnovers || PE.turnovers || {};
      PE.season = v.season || PE.season || null;
      PE.runs = v.runs || PE.runs || [];
      PE.baseline = v.baseline || PE.baseline || null;
      PE.teamstats = v.teamstats || PE.teamstats || {};
      PE.tune = v.tune || PE.tune || null;
      PE.lines = v.lines || PE.lines || {};
    }
    peAfterLoad();
    PE.ready = true; PE.err = "";
    if(cb) cb();
  }, function(err){
    // Read denied or offline — keep the local copy and name the reason.
    peAfterLoad();
    PE.ready = true;
    var code = (err && (err.code || err.message)) ? String(err.code || err.message) : "unknown";
    PE.err = /permission|denied/i.test(code)
      ? "PERMISSION_DENIED \u2014 Firebase is refusing to read prophescore/$uid. Add the rule below. Using this device\u2019s copy."
      : ("Cloud read failed (" + code + ") \u2014 using this device\u2019s copy.");
    if(cb) cb();
  });
}

// Everything derived from what was just loaded. Called from all three exits of
// peLoad so no path can quietly skip it.
function peAfterLoad(){
  if(pemCleanRuns()) setTimeout(function(){ try{ peSave(); }catch(e){} }, 0);   // drop old auto-fit copies for good
  pemApplySavedOpts();
  // A bad cache must not break the page, but swallowing the reason means the
  // model silently fails to restore and the setup bar just says "build to
  // predict" forever. Keep the message and show it.
  PEM.restoreErr = "";
  try{
    pemRestoreSeason();
  }catch(e){
    PEM.restoreErr = (e && (e.message || e.name)) ? String(e.message || e.name) : "unknown error";
  }
}

// Firebase rejects any `undefined` outright, which is a common silent cause of
// a failed write. Round-tripping through JSON drops those keys.
function peClean(o){
  try{ return JSON.parse(JSON.stringify(o === undefined ? null : o)); }
  catch(e){ return null; }
}

function peSave(){
  var payload = peClean({
    games:     PE.games     || [],
    history:   PE.history   || [],
    meta:      PE.meta      || null,
    priors:    PE.priors    || null,
    settings:  PE.settings  || null,
    // Keyed by ESPN event id, so it survives rebuilds and season rollovers and
    // only the genuinely new games ever need fetching again.
    turnovers: PE.turnovers || null,
    // The fitted model's raw input. Storing the games rather than the ratings
    // means a reload refits locally in milliseconds and every slider still
    // works — ratings alone would restore a frozen model.
    season:    PE.season    || null,
    // Tuning history. Without a written record every session starts from
    // scratch and "this feels better" is the only available evidence.
    runs:      PE.runs      || [],
    baseline:  PE.baseline  || null,
    // Per-game team lines, keyed by event id like the turnover cache, so they
    // survive a rebuild and only genuinely new games ever cost a request.
    teamstats: PE.teamstats || null,
    // Auto-tune: on/off, and which data it last tuned against.
    tune:      PE.tune      || null,
    // Closing lines by event id, for the record vs Vegas.
    lines:     PE.lines     || null
  });
  try{ localStorage.setItem(peLocalKey(), JSON.stringify(payload)); }catch(e){}
  var uid = ME();
  if(!DB || !uid) return;
  var was = PE.err;
  function fail(err){
    var code = (err && (err.code || err.message)) ? String(err.code || err.message) : "unknown";
    // Name the actual failure. "Unavailable" on its own is unactionable.
    PE.err = /permission|denied/i.test(code)
      ? "PERMISSION_DENIED \u2014 Firebase is refusing the write. Add a rule for prophescore/$uid (see below). Saving to this device only."
      : ("Cloud sync failed (" + code + ") \u2014 saving to this device only.");
    if(was !== PE.err && SC.screen === "prophescore") renderPoolEdge();
  }
  try{
    DB.ref("prophescore/"+uid).set(payload, function(err){
      if(err){ fail(err); return; }
      PE.err = "";
      if(was !== PE.err && SC.screen === "prophescore") renderPoolEdge();
    });
  }catch(e){ fail(e); }
}

function peCrossesKey(a, b){
  var lo = Math.min(a,b), hi = Math.max(a,b);
  for(var i=0;i<PE_KEYNUMS.length;i++){ var k = PE_KEYNUMS[i]; if(lo < k && hi >= k) return true; }
  return false;
}

// Rule order: line delta, then model divergence, then the favorite-tax prior.
function peEvaluate(g){
  var delta = Math.round((g.mkt - g.pool)*100)/100;
  var mag = Math.abs(delta);
  var side, reason, score;

  if(mag >= 0.5){
    side = delta > 0 ? "fav" : "dog";
    reason = "delta";
  } else if(g.model != null && Math.abs(g.model - g.mkt) >= 3){
    side = g.model > g.mkt ? "fav" : "dog";
    reason = "model";
  } else {
    side = "dog";
    reason = "prior";
  }

  var key = (mag >= 0.5) && peCrossesKey(g.pool, g.mkt);
  var mv = peMovement(g);
  if(reason === "delta")      score = mag * (key ? 1.5 : 1) * (mv.steam ? 1.25 : 1);
  else if(reason === "model") score = Math.min(Math.abs(g.model - g.mkt) * 0.25, 1.2);
  else                        score = 0.15;

  // Only the two documented priors move the score. Everything else in
  // peSignals is displayed and tracked, but deliberately unweighted until the
  // calibration table says it earns a weight.
  if(side === "dog"){
    if(g.pool >= 7 && g.favIsHome === false) score += 0.30;
    if(g.pool >= 14)                        score += 0.20;
  }

  return {
    delta: delta, mag: mag, side: side, reason: reason, key: key,
    score: Math.round(score*100)/100, steam: mv.steam, mv: mv,
    team: side === "fav" ? g.fav : g.dog,
    number: side === "fav" ? ("-" + g.pool) : ("+" + g.pool)
  };
}


// Movement shape from the stored snapshots. A line that jumps in one go is
// behaving like sharp money; one that drifts across several reads looks like
// public drift. Endpoint-to-endpoint delta can't tell those apart.
function peMovement(g){
  var h = g.hist || [];
  if(h.length < 2) return { legs:0, net:0, maxJump:0, steam:false, path:"" };
  var net = Math.abs(h[h.length-1].m - h[0].m);
  var maxJump = 0, travelled = 0;
  for(var i=1;i<h.length;i++){
    var d = Math.abs(h[i].m - h[i-1].m);
    travelled += d;
    if(d > maxJump) maxJump = d;
  }
  // One decisive move that accounts for most of the travel.
  var steam = (h.length >= 3) && maxJump >= 1 && maxJump >= travelled * 0.7;
  return {
    legs: h.length, net: net, maxJump: maxJump, travelled: travelled, steam: steam,
    path: h.map(function(s){ return s.m; }).join(" \u2192 ")
  };
}

// Book disagreement — wide spread across providers means the number is unsettled.
function peDispersion(g){
  var b = g.books || [];
  if(b.length < 2) return 0;
  var vals = b.map(function(x){ return x.favSide === (g.favIsHome?"home":"away") ? x.spread : -x.spread; });
  return Math.max.apply(null, vals) - Math.min.apply(null, vals);
}

// ── POOL EDGE: SIGNAL REGISTRY ───────────────────────────────────────────────
// Single place that decides what a row displays. Adding a predictive metric
// later means appending one entry here — the renderer just maps over whatever
// comes back, so layout never has to change again.
function peKeyCrossed(a, b){
  var lo = Math.min(a,b), hi = Math.max(a,b), hit = null;
  PE_KEYNUMS.forEach(function(k){ if(lo < k && hi >= k) hit = k; });
  return hit;
}

function peSignals(g, e, ctx){
  var out = [];
  var k = (e.reason === "delta") ? peKeyCrossed(g.pool, g.mkt) : null;
  if(k) out.push({ tone:"key",   label:"crosses " + k });
  if(e.steam) out.push({ tone:"steam", label:"steam" });
  var d = peDispersion(g);
  if(d >= 1) out.push({ tone:"disp", label:"books \u00b1" + d });
  if(e.reason === "model") out.push({ tone:"soft", label:"model tiebreak" });
  if(e.reason === "prior") out.push({ tone:"soft", label:"no movement" });

  // ── Structural properties of the line. Not ratings: facts about the number.
  var onDog = (e.side === "dog");

  // Cushion: points relative to expected scoring. Same spread means very
  // different things in a 38-point game and a 62-point game.
  // Cushion only means something in comparison. A pool is ten games, so the
  // board itself is the reference class rather than a league-wide constant.
  if(g.total && g.pool > 0 && ctx && ctx.cushMed){
    var cush = g.pool / g.total;
    var pctOfTotal = Math.round(cush*100);
    if(onDog && cush >= ctx.cushMed * 1.35){
      out.push({ tone:"cush", label:"widest cushion \u00b7 " + pctOfTotal + "%" });
    } else if(!onDog && cush <= ctx.cushMed * 0.65){
      out.push({ tone:"soft", label:"thin cushion \u00b7 " + pctOfTotal + "%" });
    }
  }

  // Documented: home underdogs of 7+ covered 59.69% over a 20-year sample.
  // Home dog = the DOG is at home, i.e. the favourite is the away team.
  if(onDog && g.pool >= 7 && g.favIsHome === false){
    out.push({ tone:"prior", label:"home dog 7+" });
  }

  // Favourite tax is steepest at the top of the board.
  if(onDog && g.pool >= 14) out.push({ tone:"prior", label:"big fav fade" });

  // Line moved and came back — somebody tried, the market refused.
  var mvB = peMovement(g);
  if(mvB.legs >= 3 && mvB.travelled >= 2 && mvB.net <= 0.5){
    out.push({ tone:"bounce", label:"bounce \u00b7 " + mvB.travelled + " travelled" });
  }

  // Pool number was never the market number to begin with.
  if(g.open != null && Math.abs(g.open - g.pool) >= 1){
    out.push({ tone:"soft", label:"off-market at lock" });
  }
  // Future metrics drop in here.
  return out;
}

// Tiny line-history sparkline. Reads as shape rather than numbers.
function peSpark(g, up){
  var hs = (g.hist||[]).map(function(s){ return s.m; });
  if(hs.length < 2) return "";
  var min = Math.min.apply(null,hs), max = Math.max.apply(null,hs);
  var rng = (max-min) || 1, W = 46, H = 14;
  var pts = hs.map(function(v,i){
    return ((i/(hs.length-1))*W).toFixed(1) + "," + (H - ((v-min)/rng)*H).toFixed(1);
  }).join(" ");
  var col = up ? "var(--blue)" : "var(--green)";
  var last = pts.split(" ").pop().split(",");
  return '<svg class="pe-spark" viewBox="0 0 '+(W+4)+' '+(H+4)+'" width="'+(W+4)+'" height="'+(H+4)+'" aria-hidden="true">' +
         '<polyline points="'+pts+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(2,2)"/>' +
         '<circle cx="'+(parseFloat(last[0])+2).toFixed(1)+'" cy="'+(parseFloat(last[1])+2).toFixed(1)+'" r="2.4" fill="'+col+'"/>' +
         '</svg>';
}

function peTier(score){
  if(score >= 1.5) return "strong";
  if(score >= 0.5) return "mid";
  return "weak";
}

// Median cushion across the current board — the reference every row is judged
// against. Returned alongside the rows so signals don't recompute it per game.
function peBoardCtx(games){
  var cs = [];
  games.forEach(function(g){ if(g.total && g.pool > 0) cs.push(g.pool/g.total); });
  if(!cs.length) return { cushMed: 0 };
  cs.sort(function(a,b){ return a-b; });
  var mid = Math.floor(cs.length/2);
  return { cushMed: cs.length % 2 ? cs[mid] : (cs[mid-1]+cs[mid])/2 };
}

function peBoard(){
  var rows = PE.games.map(function(g){ return { g:g, e:peEvaluate(g) }; });
  rows.sort(function(a,b){ return b.e.score - a.e.score; });
  var n = rows.length;
  rows.forEach(function(r,i){ r.conf = n - i; });
  return rows;
}

function peGraded(){
  var rows = peBoard();
  var live = rows.filter(function(r){ return r.g.result; })
                 .map(function(r){ return {conf:r.conf, max:rows.length, result:r.g.result}; });
  return PE.history.filter(function(h){ return h.result; }).concat(live);
}

// ── POOL EDGE: IMPORT FROM GROUP ─────────────────────────────────────────────
// Reads a CFB pool's saved slate straight out of the group. The pool's own
// `spread` field IS the Tuesday-locked number, so it lands in `pool` and the
// market number is what you fill in afterwards.
function peCfbBase(groupId, year){
  var root = "groups/" + groupId + "/data/cfbpool";
  return year ? (root + "/seasons/" + year) : root;
}

// Groups the owner belongs to that actually carry the CFB pool.
function peMyCfbGroups(cb){
  var u = SC.currentUser;
  var ids = _myGroupIds(u);
  if(!ids.length){ cb([]); return; }

  // Prefer the cache the profile screen already filled.
  if(_allGroupsCache && _allGroupsCache.length){
    var hit = _allGroupsCache.filter(function(g){
      return g && ids.indexOf(g.id) >= 0 && (g.pools||[]).indexOf("cfb") >= 0;
    });
    if(hit.length){ cb(hit.map(function(g){ return {id:g.id, name:g.name||g.id}; })); return; }
  }
  if(!DB){ cb([]); return; }

  // Cold path — read the group records directly.
  var out = [], pending = ids.length;
  ids.forEach(function(id){
    DB.ref("groups/"+id).once("value", function(sn){
      var g = sn.val();
      if(g && (g.pools||[]).indexOf("cfb") >= 0) out.push({id:id, name:g.name||id});
      if(--pending === 0) cb(out);
    }, function(){ if(--pending === 0) cb(out); });
  });
}

// meta lives at the unsuffixed path by default; fall back to the newest season.
function peLoadCfbMeta(groupId, cb){
  if(!DB){ cb(null); return; }
  DB.ref(peCfbBase(groupId, null)+"/meta").once("value", function(sn){
    var meta = sn.val();
    if(meta && meta.weekIds && meta.weekIds.length){ cb({meta:meta, year:null}); return; }
    DB.ref(peCfbBase(groupId, null).replace(/\/data\/cfbpool$/, "/data/cfbpool")+"/seasons").once("value", function(sn2){
      var seasons = sn2.val() || {};
      var years = Object.keys(seasons).sort();
      if(!years.length){ cb(null); return; }
      var y = years[years.length-1];
      var m = (seasons[y]||{}).meta;
      cb(m && m.weekIds ? {meta:m, year:y} : null);
    }, function(){ cb(null); });
  }, function(){ cb(null); });
}

// Gathers everything needed to describe each week: how many games have teams,
// whether spreads are in, whether the week is locked, and whether the owner has
// already picked. The point is to surface the week that's still open, since
// that's the one worth evaluating.
function peLoadWeekStates(groupId, year, meta, cb){
  var base = peCfbBase(groupId, year);
  var ids  = meta.weekIds || [];
  var labels = meta.weekLabels || {};
  var uid = ME();
  var out = {};

  function finish(){
    cb(ids.map(function(w){
      var s = out[w] || {};
      var games = s.games || {};
      var filled = 0, spreads = 0;
      Object.keys(games).forEach(function(gid){
        var g = games[gid] || {};
        if((g.away||"").trim() && (g.home||"").trim()){
          filled++;
          if(Math.abs(parseFloat(g.spread)||0) > 0) spreads++;
        }
      });
      var myPicks = 0;
      Object.keys(s.picks || {}).forEach(function(k){
        if(k === "tb") return;
        var p = s.picks[k];
        if(p && p.side) myPicks++;
      });
      return {
        id: w,
        label: labels[w] || w,
        filled: filled,
        spreads: spreads,
        locked: !!s.locked,
        myPicks: myPicks,
        // "Evaluate me": games are in, the week isn't locked, and picks aren't done.
        open: filled > 0 && !s.locked && myPicks < filled
      };
    }));
  }

  if(!DB || !ids.length){ finish(); return; }

  var pending = 2 + ids.length;
  function step(){ if(--pending === 0) finish(); }

  DB.ref(base+"/games").once("value", function(sn){
    var all = sn.val() || {};
    ids.forEach(function(w){ out[w] = out[w] || {}; out[w].games = all[w] || {}; });
    step();
  }, step);

  DB.ref(base+"/locked").once("value", function(sn){
    var lk = sn.val() || {};
    ids.forEach(function(w){ out[w] = out[w] || {}; out[w].locked = !!lk[w]; });
    step();
  }, step);

  ids.forEach(function(w){
    if(!uid){ step(); return; }
    DB.ref(base+"/picks/"+w+"/"+uid).once("value", function(sn){
      out[w] = out[w] || {}; out[w].picks = sn.val() || {};
      step();
    }, step);
  });
}

function peImportWeek(groupId, year, weekId, cb){
  if(!DB){ cb(null); return; }
  DB.ref(peCfbBase(groupId, year)+"/games/"+weekId).once("value", function(sn){
    var games = sn.val() || {};
    var out = [], skipped = 0, pk = 0;
    // g1..g10 — sort on the numeric suffix, or g10 lands between g1 and g2.
    Object.keys(games).sort(function(a,b){
      var na = parseInt(String(a).replace(/\D/g,""),10), nb = parseInt(String(b).replace(/\D/g,""),10);
      if(isNaN(na) || isNaN(nb)) return String(a).localeCompare(String(b));
      return na - nb;
    }).forEach(function(gid){
      var g = games[gid] || {};
      var away = (g.away||"").trim(), home = (g.home||"").trim();
      if(!away || !home){ skipped++; return; }           // blank slot
      var sp = Math.abs(parseFloat(g.spread) || 0);
      var fav, dog;
      if(g.favSide === "away"){ fav = away; dog = home; }
      else { fav = home; dog = away; }                    // home, or pick'em
      if(g.favSide === "even" || !sp) pk++;
      var favIsHome = (g.favSide !== "away");
      out.push({
        id: "imp" + Date.now() + "_" + gid,
        fav: fav, dog: dog,
        pool: sp,
        mkt: sp,        // flat until a market number lands
        model: null,
        result: null,
        // Kept so ESPN lines can be matched by id rather than by team name.
        awayId: String(g.awayId||""), homeId: String(g.homeId||""),
        favIsHome: favIsHome
      });
    });
    cb({games:out, skipped:skipped, pickem:pk});
  }, function(){ cb(null); });
}

// ── POOL EDGE: ESPN MARKET LINES ─────────────────────────────────────────────
// The scoreboard feed carries a live odds block per game. That number is the
// market — the only input in this system with real predictive support — so it
// fills the Market column. Nothing here is a rating or a projection.
function peNormName(s){
  return String(s||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
}

// Points the favorite gives, from ESPN's odds block. Mirrors cfbpool.html's
// parser so the two agree on who's favored.
function peEspnLine(comp){
  var odds = (comp.odds||[])[0];
  if(!odds) return null;
  var aOdds = odds.awayTeamOdds||{}, hOdds = odds.homeTeamOdds||{};
  var awayFav = aOdds.favorite === true, homeFav = hOdds.favorite === true;
  if(typeof odds.spread === "number" && (awayFav || homeFav)){
    return { spread: Math.abs(odds.spread), favSide: awayFav ? "away" : "home" };
  }
  if(odds.details){
    var m = String(odds.details).match(/(-?\d+(\.\d+)?)/);
    if(!m) return null;
    if(/^PK|^EVEN/i.test(String(odds.details).trim())) return { spread:0, favSide:"home" };
    return { spread: Math.abs(parseFloat(m[1])), favSide: awayFav ? "away" : "home" };
  }
  return null;
}

function peFetchEspnLines(cb){
  var meta = PE.meta || {};
  var url = "https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=80&limit=300";
  if(meta.espnWeek && meta.espnYear) url += "&year="+meta.espnYear+"&week="+meta.espnWeek+"&seasontype=2";

  fetch(url).then(function(r){ return r.json(); }).then(function(data){
    var events = (data && data.events) || [];
    var rows = [];
    events.forEach(function(ev){
      var comp = (ev.competitions||[])[0];
      if(!comp) return;
      var cs = comp.competitors || [];
      var away = null, home = null;
      cs.forEach(function(c){ if(c.homeAway==="away") away=c; else if(c.homeAway==="home") home=c; });
      if(!away || !home) return;
      var line = peEspnLine(comp);
      // ESPN's odds array can carry several providers. Disagreement between
      // books is free signal, so keep them all rather than just the first.
      var ou = null;
      (comp.odds||[]).forEach(function(o){
        if(ou === null && typeof o.overUnder === "number") ou = o.overUnder;
      });
      var books = [];
      (comp.odds||[]).forEach(function(o){
        var l = peEspnLine({odds:[o]});
        if(l) books.push({ name: (o.provider&&o.provider.name)||"book", spread:l.spread, favSide:l.favSide });
      });
      rows.push({
        awayId: String((away.team&&away.team.id)||""),
        homeId: String((home.team&&home.team.id)||""),
        awayName: peNormName((away.team&&(away.team.location||away.team.displayName))||""),
        homeName: peNormName((home.team&&(home.team.location||home.team.displayName))||""),
        awayAb: peNormName((away.team&&away.team.abbreviation)||""),
        homeAb: peNormName((home.team&&home.team.abbreviation)||""),
        line: line, books: books, total: ou
      });
    });
    cb(null, rows);
  }).catch(function(err){ cb(err || new Error("fetch failed")); });
}

// Find the ESPN row for one board game. IDs first — names only as a fallback,
// since "Miami" and "Miami (OH)" are a real collision in this sport.
function peMatchRow(g, rows){
  var i;
  if(g.awayId && g.homeId){
    for(i=0;i<rows.length;i++){
      if(rows[i].awayId===String(g.awayId) && rows[i].homeId===String(g.homeId)) return rows[i];
    }
  }
  var f = peNormName(g.fav), d = peNormName(g.dog);
  for(i=0;i<rows.length;i++){
    var r = rows[i];
    var names = [r.awayName, r.homeName, r.awayAb, r.homeAb];
    if(names.indexOf(f) >= 0 && names.indexOf(d) >= 0) return r;
  }
  return null;
}

// Applies a fetched line to a board game. Result is signed in terms of g.fav:
// if ESPN now has the other side favored, the market number goes negative —
// which is a genuine signal, not an error.
function peApplyLine(g, row){
  if(!row || !row.line) return false;
  var favSideInRow;
  if(g.favIsHome === true)       favSideInRow = "home";
  else if(g.favIsHome === false) favSideInRow = "away";
  else {
    // No stored side (hand-entered game) — fall back to matching the name.
    var fav = peNormName(g.fav);
    if(fav === row.homeName || fav === row.homeAb)      favSideInRow = "home";
    else if(fav === row.awayName || fav === row.awayAb) favSideInRow = "away";
    else return false;
  }
  g.mkt = (row.line.favSide === favSideInRow) ? row.line.spread : -row.line.spread;
  return true;
}

// ── POOL EDGE: SCORE MODEL (experimental, unweighted) ────────────────────────
// Additive ratings: points = league average + offence(team) + defence(opponent)
// ± half the home edge, fitted to completed FBS-vs-FBS results.
//
// Two things are deliberately NOT fitted:
//   • Home edge is a SETTING, not a parameter. In September, home teams are
//     systematically stronger (P5 programmes buy home games), so a fitted home
//     edge absorbs their quality and rails at whatever ceiling it is given.
//     Confirmed: identical true edge of 2.4 fits to 3.4 on a balanced schedule
//     and rails at 5.0 when home teams are better.
//   • Everything else is exposed as a knob, because with this little data the
//     right settings are an empirical question, not something to hardcode.
//
// Kept OUT of the pick score. A rating model is what the market already prices.
var PEM = {
  ratings:null, prior:null, priorNames:null, avg:0, n:0, mae:null, holdout:null, cv:null,
  busy:false, weeks:0, dropped:0, priorSrc:"none", priorN:0, fbsSrc:"", nameMap:null, toStats:null,
  opts: {
    hfa:      2.5,   // points, fixed
    scale:    1.0,   // expands ratings back out after shrinkage
    oppW:     1.0,   // how hard to adjust for who the opponent was
    toAdj:    0.0,   // share of the turnover swing to regress away
    priorW:   0.55,  // 0 = results only, 1 = prior only
    lambda:   0.020, // shrinkage toward prior
    cap:      28,    // blowout margin cap
    recency:  0.0,   // 0 = all games equal, 1 = heavy tilt to recent
    carry:    0.5,   // how much of last season's rating a team starts with
    capSlope: 0.0,   // share of the margin past the cap that still counts
    lr: 0.035, epochs: 300
  }
};

var PEM_DEFAULTS = { hfa:2.5, scale:1.0, oppW:1.0, toAdj:0.0, priorW:0.55, lambda:0.020, cap:28, recency:0.0, carry:0.5, capSlope:0.0 };

// Margins past the cap are trimmed. With a taper (capSlope > 0) the part past
// the cap still counts, at that fraction, instead of being thrown away.
function pemCapped(a, b, cap, slope){
  var m = a - b, k = slope || 0;
  if(m >  cap) return [b + cap + (m - cap) * k, b];
  if(m < -cap) return [a, a + cap + (-m - cap) * k];
  return [a, b];
}


// ── STORED PRIORS ───────────────────────────────────────────────────────────
// SP+ has no public API, so the paste is the supply line. Keeping it per week
// means it survives reloads and you only re-paste when new numbers publish.
// Slider positions are worth keeping — retuning from scratch every visit is
// exactly the friction that makes a tool annoying. Debounced so dragging does
// not write on every frame.
var _pemOptsTimer = null;
function pemSaveOpts(){
  PE.settings = {};
  for(var k in PEM.opts) PE.settings[k] = PEM.opts[k];
  if(_pemOptsTimer) clearTimeout(_pemOptsTimer);
  _pemOptsTimer = setTimeout(function(){ _pemOptsTimer = null; peSave(); }, 700);
}

function pemApplySavedOpts(){
  var s = PE.settings;
  if(!s) return false;
  // Only keys the model actually has, so a stale save cannot inject junk.
  for(var k in PEM.opts){
    if(typeof s[k] === "number" && isFinite(s[k])) PEM.opts[k] = s[k];
  }
  return true;
}

function pePriorKey(){
  var y = (PE.meta && PE.meta.espnYear) || new Date().getFullYear();
  var w = (PE.meta && PE.meta.espnWeek) || 0;
  return y + "-w" + w;
}

function pePriorLatest(preferKey){
  var st = PE.priors || {};
  if(preferKey && st[preferKey]) return { key: preferKey, e: st[preferKey] };
  var best = null;
  Object.keys(st).forEach(function(k){
    var e = st[k];
    if(!e) return;
    if(!best || (e.at||0) > (best.e.at||0)) best = { key:k, e:e };
  });
  return best;
}

function pePriorSave(text, ratingsById, matched, label){
  PE.priors = PE.priors || {};
  PE.priors[pePriorKey()] = {
    text: String(text||"").slice(0, 20000),
    r: ratingsById, at: Date.now(), n: matched, label: label || "SP+"
  };
  // Keep the last 8 weeks so the record does not grow without bound.
  var keys = Object.keys(PE.priors).sort(function(a,b){
    return (PE.priors[b].at||0) - (PE.priors[a].at||0);
  });
  keys.slice(8).forEach(function(k){ delete PE.priors[k]; });
  peSave();
}

function pePriorToModel(r){
  var out = {}, n = 0;
  for(var id in r){
    var v = Number(r[id]);
    if(isNaN(v)) continue;
    out[id] = { off: v/2, def: -v/2, fpi: v };
    n++;
  }
  return n ? out : null;
}

// Runs once the model has a name map, so re-parsing can pick up teams that
// could not be matched before that map existed.
function pemRestorePrior(){
  var hit = pePriorLatest(pePriorKey());
  if(!hit) return false;
  var e = hit.e, ratings = e.r;
  if(e.text && PEM.nameMap){
    var re = pemParsePaste(e.text, PEM.nameMap);
    if(re && re.matched >= (e.n || 0)){
      ratings = {};
      for(var id in re.prior) ratings[id] = re.prior[id].fpi;
      e.r = ratings; e.n = re.matched;
    }
  }
  var model = pePriorToModel(ratings || {});
  if(!model) return false;
  PEM.prior = model;
  PEM.priorN = Object.keys(model).length;
  PEM.priorSrc = (e.label || "SP+") + " \u00b7 " + hit.key;
  PEM.priorAt = e.at || null;
  PEM.priorStale = (hit.key !== pePriorKey());
  return true;
}

function pemFetchWeek(year, week, cb){
  var url = "https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard" +
            "?groups=80&limit=400&seasontype=2&year=" + year + "&week=" + week;
  fetch(url).then(function(r){ return r.json(); }).then(function(d){
    var out = [];
    ((d && d.events) || []).forEach(function(ev){
      var c = (ev.competitions||[])[0];
      if(!c) return;
      if(!(((c.status||{}).type||{}).completed)) return;
      var away=null, home=null;
      (c.competitors||[]).forEach(function(t){
        if(t.homeAway==="away") away=t; else if(t.homeAway==="home") home=t;
      });
      if(!away || !home) return;
      var as = parseInt(away.score,10), hs = parseInt(home.score,10);
      if(isNaN(as) || isNaN(hs)) return;
      out.push({
        eventId: String(ev.id||""),
        week: week,
        awayId: String((away.team||{}).id||""), homeId: String((home.team||{}).id||""),
        awayName: (away.team||{}).displayName || "", homeName: (home.team||{}).displayName || "",
        as: as, hs: hs, neutral: !!c.neutralSite
      });
    });
    cb(null, out);
  }).catch(function(e){ cb(e); });
}


// ── TURNOVER ADJUSTMENT ──────────────────────────────────────────────────────
// Turnovers are worth roughly 4.5 points of margin each, and turnover margin
// barely correlates from week to week — so it is luck baked into every final
// score the model learns from. Removing it lets the ratings reflect how teams
// actually played. Measured worth ~1 point of margin error at three games per
// team, and progressively less as the season fills in.
var PEM_TO_PTS = 4.5;

// Small concurrency pool — one box score per game is ~180 requests.
function pemPool(items, limit, worker, done){
  if(!items.length){ done(); return; }
  var i = 0, active = 0, finished = 0;
  function pump(){
    while(active < limit && i < items.length){
      active++;
      worker(items[i++], function(){
        active--; finished++;
        if(finished === items.length) done(); else pump();
      });
    }
  }
  pump();
}

// Pulls each side's giveaways out of a summary response. Prefers an explicit
// "turnovers" stat, falls back to fumbles lost + interceptions thrown.
function pemParseTurnovers(d){
  var teams = (((d||{}).boxscore||{}).teams) || [];
  var out = {};
  teams.forEach(function(t){
    var id = String(((t||{}).team||{}).id||"");
    if(!id) return;
    var stats = t.statistics || [];
    var tov = null, fum = null, ints = null;
    stats.forEach(function(s){
      var nm = String((s||{}).name || (s||{}).label || "").toLowerCase().replace(/[^a-z]/g,"");
      var v = parseFloat((s||{}).displayValue);
      if(isNaN(v)) return;
      if(nm === "turnovers" || nm === "totalturnovers") tov = v;
      else if(nm === "fumbleslost") fum = v;
      else if(nm === "interceptions" || nm === "interceptionsthrown") ints = v;
    });
    if(tov === null && (fum !== null || ints !== null)) tov = (fum||0) + (ints||0);
    if(tov !== null) out[id] = tov;
  });
  return Object.keys(out).length === 2 ? out : null;
}

// \u2500\u2500 TEAM STAT LINES \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
