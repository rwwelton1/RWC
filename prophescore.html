// Repaint ONLY the model panel — a full renderPoolEdge() would rebuild the
// board and throw away scroll position on every slider tick.
function pemRepaint(){
  var el = document.getElementById("pem-panel");
  if(!el){ renderPoolEdge(); return; }
  el.innerHTML = pemPanelInner();
  pemBindPanel();
}

function pemBindPanel(){
  var build = document.getElementById("pem-build") || document.getElementById("pem-rebuild");
  if(build) build.addEventListener("click", function(){
    var b = this; b.disabled = true; b.textContent = "Fetching…";
    pemBuild(function(err){
      if(err){ b.disabled = false; b.textContent = "Build from season results"; toast("Couldn't reach ESPN","warn"); return; }
      pemRepaint();
      toast("Model built on " + PEM.n + " games", "ok");
    });
  });

  // Live sliders. Refit is cached-data only, so it stays responsive.
  var pending = null;
  Array.prototype.forEach.call(document.querySelectorAll("[data-pem-knob]"), function(inp){
    inp.addEventListener("input", function(){
      var key = this.getAttribute("data-pem-knob");
      var v = parseFloat(this.value);
      if(isNaN(v)) return;
      PEM.opts[key] = v;
      var kd = null;
      PEM_KNOBS.forEach(function(k){ if(k.key===key) kd=k; });
      var lab = document.getElementById("pem-v-" + key);
      if(lab && kd) lab.textContent = kd.fmt(v);      // instant readout
      if(pending) cancelAnimationFrame(pending);
      pending = requestAnimationFrame(function(){
        pending = null;
        if(pemRefit()) pemRepaint();
      });
      pemSaveOpts();
    });
  });

  var auto = document.getElementById("pem-auto");
  if(auto) auto.addEventListener("click", function(){
    var out = document.getElementById("pem-tuned");
    var btn = this;
    btn.disabled = true;
    var before = pemOptsSnapshot();
    pemAutoTuneAsync(function(done, total, label){
      var p = document.getElementById("pem-tuned");
      if(p) p.innerHTML = "Sweeping <b>" + x(label) + "</b> \u2014 " + done + " of " + total + "\u2026";
    }, function(best){
      btn.disabled = false;
      pemSaveOpts();
      // A tune is worth recording whether or not it helped \u2014 especially if not.
      var cmp = pemCompare(pemOptsSnapshot(), before);
      pemLogRun("auto-tune");
      pemRepaint();
      var o2 = document.getElementById("pem-tuned");
      if(!best){ if(o2) o2.textContent = "Not enough data to sweep."; return; }
      var msg = "Swept each input in turn, keeping the most conservative setting that is statistically tied with the best one. CV error <b>" +
                best.mae.toFixed(2) + "</b> over " + (best.n||0) + " games.";
      if(cmp){
        var vd = pemVerdict(cmp);
        msg += " Against where you started: <b>" + (cmp.d > 0 ? "+" : "") + cmp.d.toFixed(2) +
               " \u00b1 " + cmp.se.toFixed(2) + " pts \u2014 " + vd.word + "</b>.";
        if(!vd.real) msg += " Tuning did not find anything the data can actually support; the old settings were fine.";
      }
      if(o2) o2.innerHTML = msg;
    });
  });

  var reset = document.getElementById("pem-reset");
  if(reset) reset.addEventListener("click", function(){
    for(var k in PEM_DEFAULTS) PEM.opts[k] = PEM_DEFAULTS[k];
    pemSaveOpts();
    pemRefit(); pemRepaint();
  });

  var logBtn = document.getElementById("pem-logrun");
  if(logBtn) logBtn.addEventListener("click", function(){
    if(pemLogRun("manual")){ pemRepaint(); toast("Run logged", "ok"); }
    else toast("Build the model first", "warn");
  });

  var baseBtn = document.getElementById("pem-setbase");
  if(baseBtn) baseBtn.addEventListener("click", function(){
    if(pemSetBaseline()){ pemRepaint(); toast("Baseline pinned at " + PE.baseline.mae.toFixed(1) + " pts", "ok"); }
    else toast("Build the model first", "warn");
  });

  var rebase = document.getElementById("pem-rebase");
  if(rebase) rebase.addEventListener("click", function(){
    if(!PE.baseline) return;
    // Keep the settings, refresh only the number, so the reference config is
    // unchanged but its score is measured on the same games as everything else.
    var cur = pemOptsSnapshot();
    pemApplyOpts(PE.baseline.opts);
    PE.baseline.mae = Math.round(PEM.cv.mae*100)/100;
    PE.baseline.se  = PEM.cv.se ? Math.round(PEM.cv.se*100)/100 : null;
    PE.baseline.n   = PEM.cv.n;
    PE.baseline.upto = (PE.season && PE.season.upto) || null;
    pemApplyOpts(cur);
    peSave(); pemRepaint();
    toast("Baseline re-scored on " + PE.baseline.n + " games", "ok");
  });

  var toBase = document.getElementById("pem-tobase");
  if(toBase) toBase.addEventListener("click", function(){
    if(PE.baseline && pemApplyOpts(PE.baseline.opts)){ pemRepaint(); toast("Back to baseline", "ok"); }
  });

  Array.prototype.forEach.call(document.querySelectorAll(".pem-restore"), function(b){
    b.addEventListener("click", function(){
      var i = parseInt(this.getAttribute("data-pem-run"), 10);
      var r = (PE.runs || [])[i];
      if(r && pemApplyOpts(r.opts)){ pemRepaint(); toast("Loaded \u201c" + r.label + "\u201d", "ok"); }
    });
  });

  var toBtn = document.getElementById("pem-to");
  if(toBtn) toBtn.addEventListener("click", function(){
    if(!PEM._games || !PEM._games.length){ toast("Build the model first","warn"); return; }
    var b = this; b.disabled = true; b.textContent = "Loading 0%";
    pemFetchBoxScores(PEM._games, function(done, total){
      b.textContent = "Loading " + Math.round(100*done/total) + "%";
    }, function(_e, res){
      PEM.toStats = pemTurnoverStats(PEM._games);
      if(!PEM.toStats){
        b.disabled = false; b.textContent = "Load turnovers";
        toast("No turnover data came back","warn"); return;
      }
      // Default to full regression once the data is actually there.
      if(!PEM.opts.toAdj) PEM.opts.toAdj = 1;
      pemSaveOpts();
      pemRefit(); pemRepaint();
      toast(res.of
        ? ("Turnovers: " + res.got + " of " + res.of + " fetched, " + res.cached + " saved")
        : ("Turnovers already saved for " + res.cached + " games"), "ok");
    });
  });

  var paste = document.getElementById("pem-paste");
  if(paste) paste.addEventListener("click", function(){ pemShowPasteModal(); });

  Array.prototype.forEach.call(document.querySelectorAll("[data-pem-help]"), function(b){
    b.addEventListener("click", function(e){
      e.preventDefault();
      toast(this.getAttribute("data-pem-help"), "ok");
    });
  });
}

// Coordinate descent over the knobs. One pass per knob, repeated twice.
// Runs one knob per tick so the page keeps painting. onStep gets
// (done, total, knobLabel); done gets the same shape pemAutoTune returned.
function pemAutoTuneAsync(onStep, done){
  if(!PEM._games){ done && done(null); return; }
  // Two passes is worth it while the sweeps are cheap. Once the season fills in
  // the second pass costs seconds and almost never changes an answer.
  var passes = PEM._games.length > 350 ? 1 : 2;
  var keys = [];
  for(var p=0; p<passes; p++){
    PEM_KNOBS.forEach(function(k){
      if(k.key === "priorW" && !PEM.prior) return;
      if(k.key === "toAdj"  && !PEM.toStats) return;
      keys.push(k);
    });
  }
  var i = 0, best = null;
  function step(){
    if(i >= keys.length){
      pemRefit();
      if(best && PEM.cv) best.n = PEM.cv.n;
      done && done(best);
      return;
    }
    var k = keys[i++];
    var r = pemTuneOne(k.key);
    if(r) best = r;
    onStep && onStep(i, keys.length, k.label || k.key);
    setTimeout(step, 0);
  }
  setTimeout(step, 0);
}

var PEM_GRID = {
    hfa:     [0,0.5,1,1.5,2,2.5,3,3.5,4],
    scale:   [0.6,0.8,1,1.2,1.4,1.6,1.9,2.2],
    oppW:    [0,0.35,0.6,0.85,1,1.2,1.45,1.75],
    toAdj:   [0,0.25,0.5,0.75,1],
    priorW:  [0,0.2,0.35,0.5,0.65,0.8,1],
    lambda:  [0,0.005,0.01,0.02,0.035,0.05,0.07],
    cap:     [14,17,21,24,28,35,45],
    recency: [0,0.25,0.5,0.75,1]
};

function pemAutoTune(){
  if(!PEM._games) return null;
  var best = null;
  for(var pass=0; pass<2; pass++){
    PEM_KNOBS.forEach(function(k){
      var r = pemTuneOne(k.key);
      if(r) best = r;
    });
  }
  pemRefit();
  if(best && PEM.cv) best.n = PEM.cv.n;
  return best;
}

// One knob, swept and settled. Shared by the blocking and async tuners so they
// cannot disagree about what "best" means.
function pemTuneOne(key){
  var grid = PEM_GRID;
  if(!PEM._games) return null;
  if(key === "priorW" && !PEM.prior) return null;   // meaningless without one
  if(key === "toAdj"  && !PEM.toStats) return null; // no box scores loaded
  var vals = grid[key]; if(!vals) return null;
  var best = null;
  (function(k){
      var res = pemSweep(k.key, vals, true);
      var bv = null, bm = Infinity, bErr = null;
      res.forEach(function(r){
        if(r.mae !== null && r.mae < bm){ bm = r.mae; bv = r.v; bErr = r.errs; }
      });
      if(bv === null) return;
      // One-standard-error rule. The lowest score on a sweep is usually the
      // luckiest one, not the best one \u2014 taking it verbatim is what pins every
      // knob to a grid edge. So among the values that are within one PAIRED
      // standard error of the winner \u2014 statistically tied with it \u2014 keep the
      // one nearest the default. A real effect still wins; a lucky one does not.
      var home = (PEM_DEFAULTS && typeof PEM_DEFAULTS[k.key] === "number") ? PEM_DEFAULTS[k.key] : bv;
      var pick = bv, dist = Math.abs(bv - home);
      res.forEach(function(r){
        if(r.mae === null || r.v === bv || !r.errs) return;
        var pd = pemPairedDiff(r.errs, bErr);
        if(!pd || !pd.se) return;
        if(r.mae > bm + pd.se) return;          // genuinely worse than the winner
        var dd = Math.abs(r.v - home);
        if(dd < dist){ dist = dd; pick = r.v; }
      });
      PEM.opts[k.key] = pick;
      best = { mae: bm };
  })({ key: key });
  return best;
}

function pemShowPasteModal(){
  var ex = document.getElementById("pem-paste-overlay");
  if(ex) ex.remove();
  var _prev = pePriorLatest(pePriorKey());
  var _prevText = (_prev && _prev.e && _prev.e.text) ? _prev.e.text : "";
  var el = document.createElement("div");
  el.id = "pem-paste-overlay";
  el.className = "auth-modal-overlay";
  el.innerHTML =
    '<div class="auth-modal-box" style="max-width:360px;padding:20px">' +
      '<button class="auth-modal-close" id="pem-p-close">&#10005;</button>' +
      '<div style="font-size:13px;font-weight:900;color:var(--text);margin-bottom:4px">&#128203; Paste ratings</div>' +
      '<div style="font-size:9px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px">One team per line</div>' +
      '<div class="pe-note" style="margin-top:0">Any net rating in points works — SP+, FPI, Sagarin. Formats like <b>Georgia 22.5</b>, <b>1. Georgia 22.5</b> or <b>Georgia,22.5</b> all parse.</div>' +
      (_prev ? ('<div class="pe-note">Holding <b>' + (_prev.e.n||0) + '</b> teams from <b>' + x(_prev.key) + '</b>, shown below. Stored per week, so last week\u2019s set is kept.</div>') : '') +
      '<textarea id="pem-p-text" rows="8" style="width:100%;margin-top:8px;padding:8px;font-size:13px;font-family:ui-monospace,Menlo,monospace;border:2px solid var(--border);border-radius:8px;background:var(--cream);color:var(--text)" placeholder="Ohio State 28.4&#10;Georgia 26.1&#10;Texas 24.9">' + x(_prevText) + '</textarea>' +
      '<div class="pe-note" id="pem-p-status"></div>' +
      '<button class="btn btn-gold" id="pem-p-go" style="width:100%;margin-top:8px">Load ratings</button>' +
    '</div>';
  document.body.appendChild(el);
  el.addEventListener("click", function(e){ if(e.target===el) el.remove(); });
  document.getElementById("pem-p-close").addEventListener("click", function(){ el.remove(); });
  document.getElementById("pem-p-go").addEventListener("click", function(){
    var txt = document.getElementById("pem-p-text").value;
    var st  = document.getElementById("pem-p-status");
    var goBtn = this;
    if(!String(txt||"").trim()){
      if(st) st.innerHTML = "<b>Nothing to load.</b> Paste a list of teams and ratings.";
      return;
    }

    function finish(){
      var res = pemParsePaste(txt, PEM.nameMap || {}) || { prior:null, matched:0, missed:[] };
      var ratings = {};
      if(res.prior) for(var pid in res.prior) ratings[pid] = res.prior[pid].fpi;

      // The ratings are kept whatever the match rate. Names improve once the
      // model is built, and pemRestorePrior re-parses this text then, so a
      // thin match now is not a reason to throw the paste away.
      pePriorSave(txt, ratings, res.matched, "SP+");

      var lines = String(txt).split(/\n/).filter(function(s){ return s.trim(); }).length;
      if(res.matched){
        PEM.prior = res.prior;
        PEM.priorN = res.matched;
        PEM.priorSrc = "SP+ \u00b7 " + pePriorKey();
        PEM.priorAt = Date.now(); PEM.priorStale = false;
        if(!PEM.opts.priorW) PEM.opts.priorW = 0.55;
        pemSaveOpts();
        pemRefit();
        el.remove();
        if(typeof pemRepaint === "function" && document.getElementById("pem-panel")) pemRepaint();
        else renderPoolEdge();
        var extra = (res.matched < lines * 0.6)
          ? " \u00b7 more will match once the model is built"
          : (res.missed.length ? (" \u00b7 " + res.missed.length + " unmatched") : "");
        toast(res.matched + " of " + lines + " teams matched" + extra, "ok");
      } else {
        // Saved but unmatched: say so plainly rather than losing the paste.
        if(st) st.innerHTML = "<b>Saved, but no names matched yet.</b> " +
          (pemNameCount()
            ? "Team names are matched against ESPN\u2019s \u2014 try \u201cOhio State\u201d rather than an abbreviation."
            : "Team names aren\u2019t loaded. Build the score model and these will be matched automatically.");
      }
    }

    if(pemNameCount() < 100){
      if(st) st.textContent = "Loading team names\u2026";
      goBtn.disabled = true;
      pemEnsureNameMap(function(){
        goBtn.disabled = false;
        finish();                 // proceed regardless; finish() copes with a thin map
      });
      return;
    }
    finish();
  });
}

function renderPoolEdge(){
  if(!peOwner()){ SC.screen = "profile"; draw(); return; }
  if(!PE.ready){ peLoad(function(){ if(SC.screen==="prophescore") renderPoolEdge(); }); }
  PE.ui = PE.ui || { adj:false, calib:false, add:false, open:{} };

  var rows = peBoard();
  var graded = peGraded();
  var w = graded.filter(function(x){ return x.result==="W"; }).length;
  var l = graded.filter(function(x){ return x.result==="L"; }).length;
  var pct = (w+l) ? (100*w/(w+l)) : null;
  var boardCtx = peBoardCtx(PE.games);
  var maxScore = rows[0] ? rows[0].e.score : 1;

  var h = topbar(false);
  h += '<div class="main fade-up">';
  h += '<div class="pe-hdr">';
  h += '<div class="pe-title">&#128201; Prophescore</div>';
  if(w+l) h += '<div class="pe-rec">' + w + '-' + l + (pct!=null ? ' <span>' + pct.toFixed(0) + '%</span>' : '') + '</div>';
  h += '<button class="btn btn-ghost btn-sm" id="pe-back">&#8592; Back</button>';
  h += '</div>';

  if(PE.err){
    h += '<div class="pe-err">' + x(PE.err) + '</div>';
    if(/PERMISSION_DENIED/.test(PE.err)){
      h += '<div class="pe-rule"><div class="pe-rulehd">Add this to your Firebase rules, then reload</div>' +
           '<pre>"prophescore": {\n  "$uid": {\n    ".read":  "auth != null &amp;&amp; auth.uid === $uid",\n    ".write": "auth != null &amp;&amp; auth.uid === $uid"\n  }\n}</pre>' +
           '<div class="pe-rulenote">Same level as "users" and "groups". Until it is there, everything here lives only on this device.</div></div>';
    }
  }

  // ── Setup bar. Four things the week needs, each one tap, status on the right.
  //    Ratings sits first because it is the input that is pasted every week.
  var pr = pePriorLatest(pePriorKey());
  var priorReady = !!(pr && pr.e && pr.e.n);
  var priorStale = priorReady && pr.key !== pePriorKey();
  var linesAt = null;
  PE.games.forEach(function(g){
    if(g.hist && g.hist.length > 1){
      var t = g.hist[g.hist.length-1].t;
      if(t && (!linesAt || t > linesAt)) linesAt = t;
    }
  });

  function setupRow(id, icon, label, status, state){
    return '<button class="pe-setup ' + state + '" id="' + id + '">' +
           '<span class="pe-si">' + icon + '</span>' +
           '<span class="pe-sl">' + label + '</span>' +
           '<span class="pe-ss">' + status + '</span>' +
           '<span class="pe-sc">' + (state==="ok" ? "&#10003;" : (state==="warn" ? "!" : "&rsaquo;")) + '</span>' +
           '</button>';
  }
  h += '<div class="pe-setupbar">';
  h += setupRow("pe-paste-top", "&#128203;", "SP+ ratings",
        priorReady ? (pr.e.n + " teams" + (priorStale ? " · last week" : "")) : "paste to add",
        priorReady ? (priorStale ? "warn" : "ok") : "todo");
  h += setupRow("pe-import", "&#128229;", "Games",
        PE.games.length ? (PE.games.length + " on board") : "import a week",
        PE.games.length ? "ok" : "todo");
  h += setupRow("pe-espn", "&#128225;", "Market lines",
        linesAt ? ("updated " + new Date(linesAt).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"})) : "fetch current",
        linesAt ? "ok" : (PE.games.length ? "todo" : "off"));
  var mdlStale = PEM.ratings && pemSeasonStale();
  h += setupRow("pe-buildmodel", "&#129518;", "Score model",
        PEM.ratings ? (PEM.n + " games fit" + (mdlStale ? " \u00b7 tap to add week" : "")) : "build to predict",
        PEM.ratings ? (mdlStale ? "warn" : "ok") : "off");
  h += '</div>';

  // ── Board ────────────────────────────────────────────────────────────────
  h += '<div class="section-label">This Week&#39;s Board</div>';
  if(!rows.length){
    h += '<div class="admin-panel"><div class="pe-empty">No games yet. Import a week above.</div></div>';
  } else {
    rows.forEach(function(r){
      var g = r.g, e = r.e, conf = r.conf;
      var tier = peTier(e.score);
      var sigs = peSignals(g, e, boardCtx);
      var toward = (e.reason === "delta") ? (e.side === "fav" ? g.fav : g.dog) : null;
      var up = (e.side === "fav");
      var pct2 = Math.max(6, Math.round((e.score / (maxScore||1)) * 100));

      var openCard = !!(PE.ui.open && PE.ui.open[g.id]);
      var mp = null, favM = null, mDiff = null, mPickTeam = null, mPickLine = null, mAgrees = true;
      if(PEM.ratings && g.awayId && g.homeId){
        mp = pemPredict(g.awayId, g.homeId, false);
        if(mp){
          favM = Math.round(((g.favIsHome === false) ? (mp.away - mp.home) : (mp.home - mp.away))*10)/10;
          mDiff = Math.round((favM - g.mkt)*10)/10;
          // Which side would the model take AT the market number?
          if(favM > g.mkt){ mPickTeam = g.fav; mPickLine = -favM; }
          else            { mPickTeam = g.dog; mPickLine =  favM; }
          mAgrees = (mPickTeam === e.team);
        }
      }
      function peFmtLine(v){ return (v >= 0 ? "+" : "") + (Math.round(v*10)/10); }

      // Collapsed by default so the whole board reads at a glance; the detail
      // is one tap away rather than always on screen.
      h += '<details class="pe-card ' + tier + (g.result ? " done" : "") + '" data-pe-card="' + x(g.id) + '"' + (openCard ? " open" : "") + '>';
      var _vs = (g.favIsHome === true)  ? (x(g.dog) + ' at ' + x(g.fav))
              : (g.favIsHome === false) ? (x(g.fav) + ' at ' + x(g.dog))
              : (x(g.fav) + ' vs ' + x(g.dog));

      h += '<summary class="pe-sum">';
      h += '<span class="pe-rank">' + conf + '</span>';
      h += '<span class="pe-smain">';
      h +=   '<span class="pe-sr1">';
      if(mPickTeam){
        // Model leads. Without a model there is nothing to promote, so the
        // line-edge pick keeps the headline.
        h +=   '<span class="pe-tagsm">Model</span>';
        h +=   '<span class="pe-team' + (mAgrees ? "" : " dis") + '">' + x(mPickTeam) + '</span>';
        h +=   '<span class="pe-num' + (mAgrees ? "" : " dis") + '">' + peFmtLine(mPickLine) + '</span>';
      } else {
        h +=   '<span class="pe-team">' + x(e.team) + '</span>';
        h +=   '<span class="pe-num">' + e.number + '</span>';
      }
      h +=   '</span>';
      h +=   '<span class="pe-sr2">';
      h +=     '<span class="pe-vs">' + _vs + '</span>';
      h +=     '<span class="pe-minibar"><i style="width:' + pct2 + '%"></i></span>';
      if(mPickTeam){
        var hTeam = (g.favIsHome === true) ? g.fav : ((g.favIsHome === false) ? g.dog : null);
        var hLine = (g.favIsHome === true) ? -g.pool : ((g.favIsHome === false) ? g.pool : null);
        if(hTeam !== null){
          var edgeOnHome = (e.team === hTeam);
          h += '<span class="pe-mpick">' +
               '<span class="pe-edgelab">Line</span> ' +
               '<b class="' + (edgeOnHome ? "pe-edgeon" : "") + '">' + x(hTeam) + '</b> ' +
               peFmtLine(hLine) + '</span>';
        } else {
          h += '<span class="pe-mpick">' +
               '<span class="pe-edgelab">Line</span> <b>' + x(e.team) + '</b> ' + e.number + '</span>';
        }
      }
      h +=   '</span>';
      h += '</span>';
      if(g.result){
        h += '<span class="pe-chip-res ' + (g.result==="W"?"w":"l") + '" data-pe-res="" data-pe-id="' + x(g.id) + '">' + g.result + '</span>';
      } else {
        h += '<span class="pe-mini" data-pe-res="W" data-pe-id="' + x(g.id) + '">W</span>';
        h += '<span class="pe-mini" data-pe-res="L" data-pe-id="' + x(g.id) + '">L</span>';
      }
      h += '<span class="pe-carrow">&rsaquo;</span>';
      h += '</summary>';

      h += '<div class="pe-cbody">';
      h += '<div class="pe-move">';
      h += peSpark(g, up);
      if(e.reason === "delta"){
        h += '<span class="pe-delta ' + (up?"up":"dn") + '">' + e.mag + ' pt &rarr; ' + x(toward) + '</span>';
      } else {
        h += '<span class="pe-delta flat">line hasn&rsquo;t moved</span>';
      }
      h += '</div>';

      if(sigs.length){
        h += '<div class="pe-sigs">' + sigs.map(function(s){
          return '<span class="pe-tag ' + s.tone + '">' + x(s.label) + '</span>';
        }).join("") + '</div>';
      }

      if(mp){
        h += '<div class="pe-model' + (mAgrees ? "" : " big") + '">';
        h += '<span class="pe-mlab">Model picks</span>';
        h += '<span class="pe-mpickbig">' + x(mPickTeam) + ' ' + peFmtLine(mPickLine) + '</span>';
        h += '<span class="pe-sp"></span>';
        h += '<span class="pe-mscore">' + Math.round(mp.away) + '&ndash;' + Math.round(mp.home) + '</span>';
        h += '</div>';
        if(!mAgrees){
          h += '<div class="pe-mnote">The model and your line edge disagree. <b>W/L grades your pool pick, ' +
               x(e.team) + ' ' + e.number + '</b> \u2014 the board ranking is still line edge, not the model.</div>';
        }
      }

      h += '<div class="pe-ft">';
      h += '<span class="pe-ftlab">Locked</span><span class="pe-ftval">' + g.pool + '</span>';
      if(g.total) h += '<span class="pe-ftlab">O/U</span><span class="pe-ftval">' + g.total + '</span>';
      h += '<span class="pe-ftlab">Market</span>';
      h += '<input class="pe-mkt" type="number" step="0.25" inputmode="decimal" value="' + g.mkt + '" data-pe-mkt="' + x(g.id) + '">';
      h += '<span class="pe-sp"></span>';
      h += '<button class="pe-mini ghost" data-pe-del="' + x(g.id) + '" title="Remove">&minus;</button>';
      h += '</div>';
      h += '</div>';

      h += '</details>';
    });
    h += '<div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:4px">';
    h += '<button class="btn btn-ghost btn-sm" id="pe-bank">Bank week &amp; clear</button>';
    h += '<button class="btn btn-ghost btn-sm" id="pe-clear">Clear</button>';
    h += '</div>';
  }

  // ── Everything else folds away ───────────────────────────────────────────
  function fold(id, title, sub, open, body){
    return '<details class="pe-fold" id="' + id + '"' + (open ? " open" : "") + '>' +
           '<summary><span class="pe-fname">' + title + '</span>' +
           '<span class="pe-fsub">' + sub + '</span>' +
           '<span class="pe-farrow">&rsaquo;</span></summary>' +
           '<div class="pe-fbody">' + body + '</div></details>';
  }

  var adjSub = PEM.ratings
      ? ((PEM.cv ? PEM.cv.mae.toFixed(1) + " err" : "") + " · " + PEM_KNOBS.length + " inputs")
      : "build the model first";
  h += fold("pe-fold-adj", "Model &amp; adjustments", adjSub, PE.ui.adj, pemPanelHtml());

  var n = graded.length;
  var cal = '<table class="pe-tbl"><thead><tr><th>Confidence tier</th><th>Record</th><th>Hit %</th></tr></thead><tbody>';
  [ {name:"High (top third)",   test:function(v){ return v.conf >  v.max*2/3; }},
    {name:"Middle",             test:function(v){ return v.conf <= v.max*2/3 && v.conf > v.max/3; }},
    {name:"Low (bottom third)", test:function(v){ return v.conf <= v.max/3; }} ].forEach(function(t){
    var set = graded.filter(t.test);
    var tw = set.filter(function(v){ return v.result==="W"; }).length;
    var tl = set.filter(function(v){ return v.result==="L"; }).length;
    cal += '<tr><td>' + t.name + '</td><td>' + tw + '-' + tl + '</td><td>' + ((tw+tl)?(100*tw/(tw+tl)).toFixed(1)+"%":"—") + '</td></tr>';
  });
  cal += '</tbody></table>';
  cal += '<div class="pe-note">' + (n < 200
      ? (n + ' graded picks. Roughly ' + (200-n) + ' more before this table means much — high should beat low if the delta is doing any work.')
      : (n + ' graded picks. Large enough to read. If high does not beat low, the edge ranking is not working.')) + '</div>';
  cal += '<div class="pe-note">Breakeven against a standard spread is 52.4%. Telling a 57% system from a coin flip takes roughly 200 graded picks — about two seasons at ten a week.</div>';
  h += fold("pe-fold-calib", "Calibration", (n ? n + " graded" : "no picks graded yet"), PE.ui.calib, cal);

  var addBody = '<div class="pe-form">' +
    '<div><label class="pe-lab" for="pe-fav">Favourite</label><input class="pe-in" id="pe-fav" placeholder="Michigan" autocorrect="off"></div>' +
    '<div><label class="pe-lab" for="pe-dog">Underdog</label><input class="pe-in" id="pe-dog" placeholder="Iowa" autocorrect="off"></div>' +
    '<div><label class="pe-lab" for="pe-pool">Your locked #</label><input class="pe-in" id="pe-pool" type="number" step="0.5" inputmode="decimal" placeholder="4.5"></div>' +
    '<div><label class="pe-lab" for="pe-mkt">Current market</label><input class="pe-in" id="pe-mkt" type="number" step="0.5" inputmode="decimal" placeholder="5.5"></div>' +
    '</div>' +
    '<div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:10px">' +
    '<button class="btn btn-gold btn-sm" id="pe-add">Add to board</button>' +
    '<button class="btn btn-ghost btn-sm" id="pe-example">Load sample week</button></div>';
  h += fold("pe-fold-add", "Add a game by hand", "rarely needed", PE.ui.add, addBody);

  h += '</div>';
  render(h);

  // Remember which sections are open, without re-rendering and losing scroll.
  [["pe-fold-adj","adj"],["pe-fold-calib","calib"],["pe-fold-add","add"]].forEach(function(p){
    var el = document.getElementById(p[0]);
    if(el) el.addEventListener("toggle", function(){ PE.ui[p[1]] = el.open; });
  });

  document.getElementById("pe-back").addEventListener("click", function(){
    SC.screen = "profile"; draw();
  });

  var topPaste = document.getElementById("pe-paste-top");
  if(topPaste) topPaste.addEventListener("click", function(){ pemShowPasteModal(); });

  var addBtn = document.getElementById("pe-add");
  if(addBtn) addBtn.addEventListener("click", function(){
    var fav = (document.getElementById("pe-fav").value||"").trim();
    var dog = (document.getElementById("pe-dog").value||"").trim();
    var pool = parseFloat(document.getElementById("pe-pool").value);
    var mkt  = parseFloat(document.getElementById("pe-mkt").value);
    if(!fav || !dog || isNaN(pool) || isNaN(mkt)){
      toast("Need both teams, your number, and the market number","warn"); return;
    }
    PE.games.push({
      id: "g" + Date.now() + Math.random().toString(36).slice(2,6),
      fav: fav, dog: dog, pool: Math.abs(pool), mkt: Math.abs(mkt),
      model: null, result: null
    });
    PE.ui.add = true;
    peSave(); renderPoolEdge();
    var f = document.getElementById("pe-fav"); if(f) f.focus();
  });

  var impBtn = document.getElementById("pe-import");
  if(impBtn) impBtn.addEventListener("click", function(){ showPeImportModal(); });

  var bm = document.getElementById("pe-buildmodel");
  if(bm) bm.addEventListener("click", function(){
    // Built and current: nothing to fetch, just open the knobs.
    if(PEM.ratings && !pemSeasonStale()){ PE.ui.adj = true; renderPoolEdge(); return; }
    var b = this; b.classList.add("busy");
    var ss = b.querySelector(".pe-ss"); if(ss) ss.textContent = "fetching season\u2026";
    var had = !!PEM.ratings;
    pemBuild(function(err){
      b.classList.remove("busy");
      if(err){
        // A stale model still predicts, so a failed refresh is not a reset.
        toast(had ? "Couldn't reach ESPN \u2014 keeping the saved model" : "Couldn't reach ESPN", "warn");
        renderPoolEdge(); return;
      }
      PE.ui.adj = true;
      renderPoolEdge();
      toast("Model built on " + PEM.n + " games", "ok");
    });
  });

  var espnBtn = document.getElementById("pe-espn");
  if(espnBtn) espnBtn.addEventListener("click", function(){
    if(!PE.games.length){ toast("Import a week first","warn"); return; }
    var b = this; b.classList.add("busy");
    peFetchEspnLines(function(err, rws){
      b.classList.remove("busy");
      if(err || !rws){ toast("Couldn't reach ESPN","warn"); return; }
      var hit = 0, miss = [];
      PE.games.forEach(function(g){
        var row = peMatchRow(g, rws);
        if(row && peApplyLine(g, row)){
          hit++;
          g.books = row.books || [];
          if(typeof row.total === "number") g.total = row.total;
          // The first market number seen is the closest thing to an opener.
          if(g.open == null) g.open = g.mkt;
          if(!g.hist || !g.hist.length) g.hist = [{ t: 0, m: g.pool }];
          var last = g.hist[g.hist.length-1];
          if(last.m !== g.mkt) g.hist.push({ t: Date.now(), m: g.mkt });
        }
        else miss.push(g.fav + "/" + g.dog);
      });
      peSave(); renderPoolEdge();
      if(!hit) toast("No games matched — check the week","warn");
      else toast(hit + " line" + (hit===1?"":"s") + " updated" + (miss.length ? (" · " + miss.length + " not found") : ""), "ok");
    });
  });

  var exBtn = document.getElementById("pe-example");
  if(exBtn) exBtn.addEventListener("click", function(){
    PE.games = [
      {fav:"Texas",            dog:"Tennessee",        pool:4,    mkt:4.75, model:null},
      {fav:"Louisville",       dog:"Wake Forest",      pool:13,   mkt:13,   model:null},
      {fav:"Georgia",          dog:"Oklahoma",         pool:14,   mkt:14,   model:10},
      {fav:"Florida",          dog:"Ole Miss",         pool:3,    mkt:3.5,  model:null},
      {fav:"Michigan",         dog:"Iowa",             pool:4.5,  mkt:5.5,  model:null},
      {fav:"Boise State",      dog:"Western Michigan", pool:7.5,  mkt:7.5,  model:null},
      {fav:"Alabama",          dog:"South Carolina",   pool:12.5, mkt:12.5, model:null},
      {fav:"LSU",              dog:"Texas A&M",        pool:9.5,  mkt:8.5,  model:null},
      {fav:"Oregon",           dog:"USC",              pool:2.5,  mkt:3.25, model:null},
      {fav:"Mississippi State",dog:"Missouri",         pool:5.5,  mkt:6.5,  model:null}
    ].map(function(g,i){ g.id = "ex"+i+Date.now(); g.result = null; return g; });
    peSave(); renderPoolEdge();
  });

  Array.prototype.forEach.call(document.querySelectorAll("[data-pe-res]"), function(b){
    b.addEventListener("click", function(ev){
      // These sit inside <summary>; without this the card would also toggle.
      ev.preventDefault(); ev.stopPropagation();
      var id = this.getAttribute("data-pe-id");
      var v  = this.getAttribute("data-pe-res") || null;
      var g  = PE.games.filter(function(z){ return z.id===id; })[0];
      if(g){ g.result = v; peSave(); renderPoolEdge(); }
    });
  });

  // Remember which cards are open across re-renders.
  Array.prototype.forEach.call(document.querySelectorAll("[data-pe-card]"), function(d){
    d.addEventListener("toggle", function(){
      PE.ui.open = PE.ui.open || {};
      PE.ui.open[d.getAttribute("data-pe-card")] = d.open;
    });
  });

  Array.prototype.forEach.call(document.querySelectorAll("[data-pe-del]"), function(b){
    b.addEventListener("click", function(){
      var id = this.getAttribute("data-pe-del");
      PE.games = PE.games.filter(function(z){ return z.id!==id; });
      peSave(); renderPoolEdge();
    });
  });

  Array.prototype.forEach.call(document.querySelectorAll("[data-pe-mkt]"), function(inp){
    inp.addEventListener("change", function(){
      var id = this.getAttribute("data-pe-mkt");
      var v  = parseFloat(this.value);
      var g  = PE.games.filter(function(z){ return z.id===id; })[0];
      // Not abs: a negative market means the other side is now favoured.
      if(g && !isNaN(v)){ g.mkt = v; peSave(); renderPoolEdge(); }
    });
  });

  var bank = document.getElementById("pe-bank");
  if(bank) bank.addEventListener("click", async function(){
    var rws = peBoard();
    var fin = rws.filter(function(r){ return r.g.result; });
    if(!fin.length){ toast("Mark some results first","warn"); return; }
    if(!await scConfirm("Bank " + fin.length + " graded pick(s) and clear the board?", {title:"Bank Week", okLabel:"Bank"})) return;
    fin.forEach(function(r){
      PE.history.push({
        conf: r.conf, max: rws.length, result: r.g.result,
        pick: r.e.team + " " + r.e.number,
        date: new Date().toISOString().slice(0,10)
      });
    });
    PE.games = [];
    peSave(); renderPoolEdge();
    toast("Week banked","ok");
  });

  var clr = document.getElementById("pe-clear");
  if(clr) clr.addEventListener("click", async function(){
    if(!await scConfirm("Clear the board without banking results?", {title:"Clear Board", okLabel:"Clear"})) return;
    PE.games = []; peSave(); renderPoolEdge();
  });

  pemBindPanel();
}



// ── BOOT ─────────────────────────────────────────────────────
// Resolve the signed-in identity first: the owner gate and every DB write need
// it. Same pattern as cfbpool — onAuthStateChanged fires once with the restored
// session, with a timeout so a slow or missing auth never hangs the page.
function psGate(msg, sub){
  document.getElementById("root").innerHTML =
    '<div class="ps-gate"><h1>' + msg + '</h1><p>' + sub + '</p>' +
    '<a class="btn btn-gold" href="' + HUB + '">Back to Scorecery</a></div>';
}

function psStart(){
  var uid = ME();
  if(!uid){
    psGate("Not signed in", "Prophescore runs on your Scorecery account. Sign in on the hub and come back.");
    return;
  }
  if(!isRootMaster(uid)){
    psGate("Owner only", "This tool is not part of your account.");
    return;
  }
  // Load the user record so the topbar and the group import have what they need.
  function go(){
    // Groups the account can import a week from.
    if(DB){
      DB.ref("groups").once("value", function(sn){
        var v = sn.val() || {};
        _allGroupsCache = Object.keys(v).map(function(k){
          var g = v[k] || {}; g.id = g.id || k; return g;
        });
      }, function(){});
    }
    renderPoolEdge();
  }
  if(DB){
    DB.ref("users/" + uid).once("value", function(sn){
      SC.currentUser = sn.val() || { uid: uid };
      SC.currentUser.uid = SC.currentUser.uid || uid;
      go();
    }, function(){ SC.currentUser = { uid: uid }; go(); });
  } else {
    SC.currentUser = { uid: uid };
    go();
  }
}

(function boot(){
  document.getElementById("root").innerHTML =
    '<div class="ps-boot">Loading Prophescore\u2026</div>';
  if(!AUTH){ psStart(); return; }
  var started = false;
  function once(){ if(started) return; started = true; psStart(); }
  AUTH.onAuthStateChanged(function(){ once(); });
  setTimeout(once, 2500);
})();
</script>
