    }
    if(adminStep===3 && g.away&&g.home){
      h+='<div style="font-size:11px;font-weight:800;color:var(--text);margin-bottom:4px">'+x(g.home)+' <span style="color:var(--muted);font-weight:700">v</span> '+x(g.away)+'</div>';
      var r=(ST.results[weekId]||{})[gid];
      // Live/final scoreline from today's scoreboard feed, when available.
      var _scoreStr="";
      if(_scData&&_scData.events){
        var nAway=normalizeTeamName(g.away), nHome=normalizeTeamName(g.home);
        _scData.events.forEach(function(ev){
          var comp=(ev.competitions||[])[0]||{};
          var comps=comp.competitors||[];
          var ac=comps.find(function(c){return c.homeAway==="away";})||{};
          var hc=comps.find(function(c){return c.homeAway==="home";})||{};
          var an=normalizeTeamName((ac.team&&(ac.team.shortDisplayName||ac.team.displayName))||"");
          var hn=normalizeTeamName((hc.team&&(hc.team.shortDisplayName||hc.team.displayName))||"");
          if(an===nAway&&hn===nHome){
            var state=(comp.status&&comp.status.type&&comp.status.type.state)||"";
            var asc=ac.score!=null?ac.score:"\u2013", hsc=hc.score!=null?hc.score:"\u2013";
            if(state==="in"||state==="post") _scoreStr=x(g.home)+' '+hsc+' \u2013 '+asc+' '+x(g.away)+(state==="in"?' \u{1F534}':'');
          }
        });
      }
      h+='<div style="font-size:8px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:6px 0 2px">Result at full time</div>';
      h+='<div class="adm-btns">';
      if(_scoreStr) h+='<div style="font-size:9px;font-weight:800;color:var(--muted);width:100%;margin-bottom:4px">'+_scoreStr+'</div>';
      h+='<button class="adm-btn'+(r==="home"?" sel":"")+'" data-week="'+weekId+'" data-gid="'+gid+'" data-result="home">'+x(g.home)+' win</button>';
      h+='<button class="adm-btn'+(r==="draw"?" sel":"")+'" data-week="'+weekId+'" data-gid="'+gid+'" data-result="draw">Draw</button>';
      h+='<button class="adm-btn'+(r==="away"?" sel":"")+'" data-week="'+weekId+'" data-gid="'+gid+'" data-result="away">'+x(g.away)+' win</button>';
      if(r) h+='<button class="adm-btn clr" data-week="'+weekId+'" data-gid="'+gid+'" data-result="CLEAR">Clear</button>';
      h+='</div>';
    }
    h+='</div>';
  });
  // Step 2: save-and-advance button.
  if(adminStep===2){
    h+='<button class="btn btn-gold" id="b-finalize-continue" style="width:calc(100% - 20px);margin:4px 10px 8px;font-size:11px;padding:8px">&#128274; Lock in this matchweek\u2019s slate &#8250;</button>';
  }
  } // end step 2/3 game cards

  // Tiebreaker — set up in step 2, enter the actual total in step 3 (Enter Results).
  if(adminStep===2 || adminStep===3){
  var tb=ST.tiebreaker[weekId]||{};
  h+='<div class="adm-sec-label">Tiebreaker Match'+(adminStep===3?' &mdash; Enter Final Total':'')+'</div>';
  h+='<div class="adm-game">';
  if(adminStep===2) h+='<div class="adm-game-title">Press &amp; hold any fixture in the import list to set it as the tiebreaker</div>';
  else h+='<div class="adm-game-title">Enter the combined goals in the tiebreaker match to break standings ties.</div>';
  if(tb.away&&tb.home){
    h+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;padding:8px;background:var(--purple-bg);border-radius:8px;border:1px solid var(--purple)">';
    if(tb.homeLogo) h+='<img src="'+tb.homeLogo+'" style="width:22px;height:22px;object-fit:contain" onerror="this.style.display=\'none\'">';
    h+='<span style="font-size:12px;font-weight:800">'+x(tb.home)+'</span>';
    h+='<span style="color:var(--muted);font-weight:700">v</span>';
    if(tb.awayLogo) h+='<img src="'+tb.awayLogo+'" style="width:22px;height:22px;object-fit:contain" onerror="this.style.display=\'none\'">';
    h+='<span style="font-size:12px;font-weight:800">'+x(tb.away)+'</span>';
    if(tb.actual!=null) h+='<span style="margin-left:auto;font-size:12px;font-weight:900;color:var(--purple)">'+tb.actual+' goals</span>';
    h+='</div>';
    h+='<div class="adm-row">';
    h+='<input class="adm-input" id="tb-actual" type="number" placeholder="Total goals scored" value="'+(tb.actual!=null?tb.actual:"")+'" style="flex:1">';
    h+='<button class="adm-btn" id="b-tb-fetch-result" style="white-space:nowrap">&#128202; Fetch</button>';
    h+='<button class="adm-btn sel" id="b-tb-save">Save</button>';
    h+='</div>';
  } else {
    h+='<div style="font-size:10px;color:var(--muted);padding:8px 0">No tiebreaker set yet. Import fixtures above and press &amp; hold one to set it.</div>';
  }
  h+='</div>';
  } // end tiebreaker (step 2)

  h+='</div>';
  return h;
}
function renderGroupPicks(){
  var h='';
  if(ST.weekIds.length===0){
    h+='<div class="lb-note">No weeks set up yet.</div>';
    return h;
  }

  // Week selector — dropdown with Compare button
  var weekId=ST.curWeek||displayWeekId();
  var compareBtnHtml='<button class="gp-compare-btn'+(ST.compareMode?" active":"")+'" id="b-compare-toggle">'+(ST.compareMode?'&#10005; Clear':'&#9878; Compare')+'</button>';
  h+=weekDropdown(weekId, compareBtnHtml);
  if(ST.compareMode){
    var selCount=Object.keys(ST.compareSelected).length;
    var hintTxt=selCount===0?'Tap rows to select players':selCount+' selected';
    h+='<div class="gp-compare-hint">';
    h+='<span>'+hintTxt+'</span>';
    if(selCount>0){
      h+='<button class="gp-isolate-btn'+(ST.compareIsolated?' active':'')+'" id="b-isolate-toggle">'+(ST.compareIsolated?'Unisolate':'Isolate')+'</button>';
    }
    h+='</div>';
  }

  if(!weekId){ h+='<div class="lb-note">No week selected.</div>'; return h; }

  var games=ST.games[weekId]||{};
  var results=ST.results[weekId]||{};
  var locked=!!ST.locked[weekId];
  var active=activeGames(weekId);

  if(!active.length){
    h+='<div class="lb-note">No games set up for this week yet.</div>';
    return h;
  }

  // Sort players by week score descending (if locked), else season score
  var players=PARTS.slice();
  if(locked){
    players.sort(function(a,b){ return weekScore(weekId,b).total - weekScore(weekId,a).total; });
  }

  h+='<div class="gp-wrap"><table class="gp-table gp-grid"><thead><tr>';

  // Sticky name column header — tappable to sort alpha
  h+='<th class="gp-name" data-sort-name="1" style="min-width:90px;cursor:pointer">Players</th>';

  // Sticky Pts column — second column
  h+='<th class="gp-pts-cell" data-sort-pts="1" style="cursor:pointer">Pts</th>';

  // Game columns
  active.forEach(function(gid){
    var g=games[gid]||{};
    var awayLogo=g.awayLogo||"";
    var homeLogo=g.homeLogo||"";
    var gameIsLocked=isGameLocked(weekId,gid);
    h+='<th data-sort-gid="'+gid+'">';
    h+='<div class="gp-game-head">';
    h+='<div class="gp-logos">';
    var _hPos=RANKINGS[normalizeTeamName(g.home)], _aPos=RANKINGS[normalizeTeamName(g.away)];
    if(_hPos) h+='<span class="rank-badge sm">'+_hPos.rank+'</span>';
    h+=homeLogo?'<img class="gp-logo" src="'+homeLogo+'" onerror="this.style.display=\'none\'">'
               :'<span class="gp-logo-fallback"></span>';
    h+='<span class="gp-vs">v</span>';
    if(_aPos) h+='<span class="rank-badge sm">'+_aPos.rank+'</span>';
    h+=awayLogo?'<img class="gp-logo" src="'+awayLogo+'" onerror="this.style.display=\'none\'">'
               :'<span class="gp-logo-fallback"></span>';
    h+='</div>';
    // Sub-line: final score once played, otherwise the kickoff day/time.
    var sub="";
    var _r=results[gid];
    if(_r&&g.homeScore!=null&&g.awayScore!=null){
      sub=x(String(g.homeScore))+"\u2013"+x(String(g.awayScore));
    } else if(g.kickoffTs){
      sub=new Date(g.kickoffTs).toLocaleString("en-US",{weekday:"short",hour:"numeric"});
    }
    h+='<div class="gp-subline">'+sub+(gameIsLocked?'<span class="gp-lock" title="Locked">&#128274;</span>':'')+'</div>';
    h+='</div>';
    h+='</th>';
  });

  // Points column header already added as 2nd sticky column above
  h+='</tr></thead><tbody>';

  // Player rows
  players.forEach(function(player){
    var uk=player;   // uid
    var picks=((ST.picks[weekId]||{})[uk])||{};
    var ws=weekScore(weekId,player);

    // Points still possible = one per pending (unresolved) pick, plus any draw bonus.
    var stillPossible=0;
    active.forEach(function(gid){
      var p=picks[gid]||{};
      if(p.side&&!results[gid]) stillPossible+=1+(p.side==="draw"?DRAW_BONUS:0);
    });

    var isMe=ST.user&&player===ST.user;
    var isSelected=ST.compareMode&&ST.compareSelected[player];
    var hasSelection=ST.compareMode&&Object.keys(ST.compareSelected).length>0;
    var isDimmed=ST.compareMode&&hasSelection&&!isSelected;
    var isHidden=ST.compareMode&&ST.compareIsolated&&hasSelection&&!isSelected;
    var rowCls=(ST.compareMode?"gp-row-selectable":"")+(isSelected?" gp-row-selected":isDimmed?" gp-row-dimmed":"")+(isHidden?" gp-row-hidden":"");
    var rowAttrs='data-pts="'+stillPossible+'" data-pts-earned="'+ws.total+'"';
    // Per-match outcome, so tapping a column header groups everyone who called it right.
    active.forEach(function(gid){
      var p=picks[gid]||{}, r=results[gid];
      var v=!p.side?0:(r?(p.side===r?2:1):1.5);   // 1.5 = picked, still pending
      rowAttrs+=' data-hit-'+gid+'="'+v+'"';
    });
    h+='<tr class="'+rowCls+'" '+rowAttrs+' data-compare-player="'+x(player)+'"'+(isMe&&!isSelected?' style="background:var(--gold-bg)"':'')+'>'; 

    // Compute streak — consecutive correct picks across all resolved games (most recent first)
    var streak=0;
    var allResolved=[];
    ST.weekIds.forEach(function(w){
      var wGames=ST.games[w]||{};
      var wResults=ST.results[w]||{};
      var wPicks=((ST.picks[w]||{})[uk])||{};
      GAME_IDS.forEach(function(gid){
        var g=wGames[gid];
        if(!g||!g.away||!g.home) return;
        var r=wResults[gid];
        if(!r) return; // only resolved matches
        var p=wPicks[gid]||{};
        if(!p.side) return; // must have picked
        var ts=parseKickoffTs(g)||0;
        allResolved.push({ts:ts,correct:p.side===r});
      });
    });
    allResolved.sort(function(a,b){return b.ts-a.ts;}); // most recent first
    for(var si=0;si<allResolved.length;si++){
      if(allResolved[si].correct) streak++;
      else break;
    }
    var onFire=streak>=3;

    // Name cell
    var nameBg=isSelected?'var(--blue-bg)':isMe?'var(--gold-bg)':'';
    h+='<td class="gp-name"'+(nameBg?' style="background:'+nameBg+'"':'')+'><span class="gp-name-txt">'+pem(player)+x(nameOf(player))+(onFire?' <span style="font-size:11px">&#128293;</span>':'')+(isSelected?' <span style="font-size:9px;color:var(--blue)">&#10003;</span>':'')+'</span></td>';

    // Points cell — second column (sticky)
    h+='<td class="gp-pts-cell">';
    if(locked&&stillPossible===0){
      h+='<div class="gp-pts-earned">'+ws.total+'</div>';
    } else if(ws.total>0||stillPossible>0){
      h+='<div class="gp-pts-earned">'+ws.total+'</div>';
      if(stillPossible>0) h+='<div class="gp-pts-possible" title="Points still possible">+'+stillPossible+' poss</div>';
    } else {
      h+='<span class="gp-nopick">–</span>';
    }
    h+='</td>';

    // Pick cells
    active.forEach(function(gid){
      var g=games[gid]||{};
      var p=picks[gid]||{};
      var r=results[gid];
      var gameLocked=isGameLocked(weekId,gid);
      var isMyRow=ST.user&&player===ST.user;
      // Hide picks for other players until the game kicks off
      var showPick=isMyRow||gameLocked;
      h+='<td>';
      if(!p.side){
        // No pick made → blank cell.
        h+='<span class="gp-nopick"></span>';
      } else if(!showPick){
        // Pick made but the game hasn't kicked off → subtle dash (conceals the choice but
        // shows that a pick exists), same look as a made-but-hidden pick.
        h+='<span class="gp-nopick">&ndash;</span>';
      } else {
        var isDrawPick=p.side==="draw";
        var pickedLogo=isDrawPick?"":(p.side==="away"?(g.awayLogo||""):(g.homeLogo||""));
        var pickedName=isDrawPick?"Draw":(p.side==="away"?(g.away||""):(g.home||""));
        var outcome="pending";
        if(r) outcome=(r===p.side)?"correct":"wrong";
        h+='<div class="gp-pick'+(outcome!=="pending"?" "+outcome:"")+'">';
        if(isDrawPick){
          // A draw has no crest — show the 1-X-2 marker instead.
          h+='<div style="width:30px;height:30px;border:2px dashed var(--border2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:var(--muted)" title="Draw">X</div>';
        } else if(pickedLogo){
          h+='<img class="gp-pick-logo" src="'+pickedLogo+'" title="'+x(pickedName)+'" onerror="this.outerHTML=\'<div class=gp-logo-fallback></div>\'">';
        } else {
          h+='<div style="font-size:9px;font-weight:800;color:var(--muted);max-width:52px;overflow:hidden;text-overflow:ellipsis">'+x(pickedName)+'</div>';
        }
        h+='</div>';
      }
      h+='</td>';
    });

    h+='</tr>';
  });

  h+='</tbody></table></div>';
  return h;
}

var _drawPending=false;
function scheduleDraw(){if(_drawPending)return;_drawPending=true;setTimeout(function(){_drawPending=false;draw();},0);}

function draw(){
  var h='';
  if(PUBLIC_VIEW)h+='<div style="display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--blue-bg);border-bottom:2px solid var(--border);font-size:10px;font-weight:800;color:var(--blue)">&#128065; Public View &mdash; read only</div>';
  h+='<div class="topbar">';
  h+='<div class="topbar-left"><a href="index.html" style="display:flex;align-items:center;gap:3px;text-decoration:none;color:var(--muted);font-size:9px;font-weight:600;padding:4px 8px;border:1px solid var(--border);border-radius:6px;white-space:nowrap">&#8592; Hub</a></div>';
  h+='<div class="topbar-center"><div class="app-name"><span class="scorecery-logo">SCORECERY</span></div><div class="app-sub">Premier League &middot; Pick’em'+(SEASON_YEAR?' &middot; '+SEASON_YEAR:'')+'</div></div>';
  h+='<div class="topbar-right">';
  if(ST.user){
    var _dispName = nameOf(ST.user);
    if(_dispName==="(unknown)"){
      // Name directory hasn't resolved yet. For the signed-in user, fall back to their
      // Google display name; otherwise show just the emoji (no scary "(unknown)").
      try{ _dispName = (AUTH && AUTH.currentUser && AUTH.currentUser.uid===ST.user && AUTH.currentUser.displayName) || ""; }catch(e){ _dispName=""; }
    }
    h+='<span class="tag">'+pem(ST.user)+x(_dispName)+'</span>';
    if(!URL_USER) h+='<button class="btn btn-ghost" id="b-switch">&#8646;</button>';
  }
  // Admin toggle — group admins/master only. Gear icon; filled gold while admin is open,
  // ghost when closed. Click toggles (same behavior as the hub's ⚡ bolt).
  if(!PUBLIC_VIEW && isGroupAdminByUid()){
    var _adminOpen = (ST.page==="admin");
    h+='<button class="btn '+(_adminOpen?"btn-gold":"btn-ghost")+'" id="b-admin" style="font-size:12px'+(_adminOpen?'':';color:#64748b')+'">&#9881;</button>';
  }
  h+='</div></div>';

  var tabs=[{id:"standings",lbl:"&#128202; Standings"},{id:"picks",lbl:"&#9917; Picks"},{id:"group",lbl:"&#128101; Group"},{id:"scores",lbl:"&#128308; Scores"}];
  // Missing picks badge — only show to the current user if THEY haven't finished, within 4h of kickoff
  if(ST.weekIds.length&&ST.user){
    var _cw=displayWeekId();
    if(_cw&&!ST.locked[_cw]){
      var _firstKick=getFirstKickoff(_cw);
      var _hoursToKick=_firstKick?(_firstKick-Date.now())/(1000*60*60):null;
      if(_firstKick&&_hoursToKick!==null&&_hoursToKick<=4&&_hoursToKick>0){
        var _active=activeGames(_cw);
        var _myPk=((ST.picks[_cw]||{})[ST.user])||{};
        var _made=_active.filter(function(gid){return _myPk[gid]&&_myPk[gid].side;}).length;
        if(_made<_active.length){
          var _left=_active.length-_made;
          tabs[1].lbl='&#128101; Group <span style="background:var(--red2);color:#fff;border-radius:8px;font-size:8px;padding:1px 5px;margin-left:3px;vertical-align:middle">'+_left+'</span>';
        }
      }
    }
  }
  if(ST.admin&&!PUBLIC_VIEW) tabs.push({id:"admin",lbl:"&#9881; Admin"});
  h+='<div class="page-bar">';
  tabs.forEach(function(t){h+='<button class="ptab'+(ST.page===t.id?" active":"")+'" data-page="'+t.id+'">'+t.lbl+'</button>';});
  h+='</div>';

  if(!ST.user&&!ST.admin&&!PUBLIC_VIEW&&ST.page!=="scores"&&ST.page!=="group"){
    h+=userSelectScreen();
    document.getElementById("root").innerHTML=h;
    stopScoreRefresh();
    bind();return;
  }

  if(ST.page==="picks") h+=renderPicks();
  else if(ST.page==="group") h+=renderGroupPicks();
  else if(ST.page==="scores") h+='<div class="scores-wrap" id="scores-wrap"><div class="scores-loading">Loading scores&hellip;</div></div>';
  else if(ST.page==="standings") h+=renderStandings();
  else if(ST.page==="admin"&&ST.admin) h+=renderAdmin();
  else { ST.page="picks"; h+=renderPicks(); }

  document.getElementById("root").innerHTML=h;
  bind();
  if(ST.page==="scores"){
    // Refetch when the cached feed belongs to a different week than the one on screen.
    if(_scData && _scWeek===scoresWeekId()) renderScoresInto(); else startScoreRefresh();
  } else {
    stopScoreRefresh();
  }
  // Start countdown if on picks tab, week is unlocked, and we have kickoff data
  if(ST.page==="picks"&&ST.curWeek&&!ST.locked[ST.curWeek]&&document.getElementById("countdown-display")){
    startCountdown(ST.curWeek);
  } else {
    stopCountdown();
  }
}

// ── Bindings ─────────────────────────────────────────────
function bind(){
  var els,i,el;
  els=document.querySelectorAll(".ptab");
  for(i=0;i<els.length;i++) els[i].addEventListener("click",function(){
    ST.page=this.getAttribute("data-page");
    if(ST.page==="admin") fetchRankings();
    draw();
  });

  els=document.querySelectorAll(".user-btn");
  for(i=0;i<els.length;i++) els[i].addEventListener("click",function(){
    if(PUBLIC_VIEW) return;   // spectators never adopt an identity
    ST.user=this.getAttribute("data-user");
    ST.viewUser=null;
    try{ localStorage.setItem("epl_user_"+(GROUP_ID||"g"),ST.user); }catch(e){}
    draw();
  });

  el=document.getElementById("week-dropdown"); if(el) el.addEventListener("change",function(){
    var prev=ST.curWeek;
    ST.curWeek=this.value;
    _picksSorted=false; _picksOriginalOrder=null;
    if(ST.curWeek!==prev&&ST._subscribePicksForWeek){
      if(!ST.picks[ST.curWeek]) ST._subscribePicksForWeek(ST.curWeek);
    }
    // If on admin tab and new week has no games, auto-fetch ESPN
    if(ST.page==="admin"&&ST.curWeek){
      var games=ST.games[ST.curWeek]||{};
      var noGames=!GAME_IDS.some(function(gid){ var g=games[gid]; return g&&g.away&&g.home; });
      if(noGames){
        ST.importGames=null; ST.importSelected={};
        ST.importWeek=ST.curWeek;
        fetchEspnSchedule(ST.curWeek);
        return; // fetchEspnSchedule calls draw() on completion
      }
    }
    draw();
  });

  // Dismiss onboarding tip
  el=document.getElementById("b-dismiss-tip"); if(el) el.addEventListener("click",function(){
    var _tipKey="epl_tip_seen_"+(GROUP_ID||"g");
    try{ localStorage.setItem(_tipKey,"1"); }catch(e){}
    var banner=document.getElementById("epl-tip-banner");
    if(banner) banner.style.display="none";
  });


  // Undo pick
  el=document.getElementById("undo-pick-btn"); if(el) el.addEventListener("click",function(){
    if(!_undoPick) return;
    clearTimeout(_undoTimer); _undoTimer=null;
    var u=_undoPick; _undoPick=null;
    delete _pendingPicks[_pendKey(u.weekId,u.uk,u.gid)];   // the pick is being reverted
    if(!ST.picks[u.weekId]) ST.picks[u.weekId]={};
    if(!ST.picks[u.weekId][u.uk]) ST.picks[u.weekId][u.uk]={};
    var restored=ST.picks[u.weekId][u.uk][u.gid]||{};
    // A cleared pick restores wholesale (side AND confidence); a side change
    // restores just the side.
    if(u.prevObj){ restored=JSON.parse(JSON.stringify(u.prevObj)); }
    else if(u.prevSide) restored.side=u.prevSide;
    else delete restored.side;
    ST.picks[u.weekId][u.uk][u.gid]=restored;
    _savePickCache(u.weekId, u.uk, restored);
    document.getElementById("toast").classList.remove("show");
    _updatePickDom(u.weekId, u.gid, restored.side||null);
    var _wrap=document.querySelector('.unpicked-wrap[data-gid="'+u.gid+'"]');
    if(_wrap) _wrap.style.borderLeftColor=restored.side?"transparent":"var(--border)";
    _updateProgressBar(u.weekId);
    // Write the reverted value straight away — there is nothing left to undo.
    if(DB) DB.ref(BASE+"/picks/"+u.weekId+"/"+u.uk+"/"+u.gid).set(restored);
    if(u.prevObj) draw();   // bring the confidence chips back
  });
  el=document.getElementById("b-switch2"); if(el) el.addEventListener("click",function(){
    ST.user=null; ST.viewUser=null;
    try{ localStorage.removeItem("epl_user_"+(GROUP_ID||"g")); }catch(e){}
    draw();
  });
  el=document.getElementById("b-share-picks"); if(el) el.addEventListener("click",function(){ shareMyPicks(ST.curWeek||displayWeekId()); });
  el=document.getElementById("b-reset-picks"); if(el) el.addEventListener("click",function(){ resetAllPicks(ST.curWeek); });

  // Tiebreaker guess input (picks tab)
  el=document.getElementById("tb-guess-input"); if(el) el.addEventListener("change",function(){
    if(PUBLIC_VIEW) return;   // read-only spectator
    setTiebreakerGuess(ST.curWeek, this.value);
  });

// Resolve the signed-in Google identity before loading, so admin-by-uid is known when the
// group record arrives and so DB writes carry an authenticated session (required by the
// security rules). onAuthStateChanged fires once with the restored session (or null).
(function bootWithAuth(){
  if(!AUTH){ loadData(); return; }
  var _started=false;
  function _go(){ if(_started) return; _started=true; loadData(); }
  AUTH.onAuthStateChanged(function(user){
    MY_UID = user ? user.uid : null;
    // Auth and the group record race each other; whichever lands second resolves
    // the identity. Harmless to call twice — it no-ops once ST.user is set.
    if(autoIdentifyMember()) scheduleDraw();
    _go();
  });
  // Safety net: if auth is slow/unavailable, don't hang the page.
  setTimeout(_go, 2500);
})();

// Replaces CFB's AP/CFP poll. Maps normalized team name \u2192 {rank} where rank is the club's
// current league position, shown as a small badge next to each side.
var RANKINGS = {}; // normalized team name → {rank, source}

// Club name variants: ESPN's short names vs. how people actually type them.
// Keys and values are compared after stripping to lowercase-alphanumeric.
var TEAM_ALIASES={
  "manutd":"manchesterunited","manchesterutd":"manchesterunited","mufc":"manchesterunited",
  "mancity":"manchestercity","mcfc":"manchestercity",
  "spurs":"tottenham","tottenhamhotspur":"tottenham","thfc":"tottenham",
  "wolves":"wolverhampton","wolverhamptonwanderers":"wolverhampton",
  "newcastle":"newcastleunited","nufc":"newcastleunited",
  "westham":"westhamunited","whufc":"westhamunited",
  "brighton":"brightonhovealbion","brightonandhovealbion":"brightonhovealbion",
  "forest":"nottinghamforest","nottmforest":"nottinghamforest",
  "leeds":"leedsunited","sheffutd":"sheffieldunited","sheffwed":"sheffieldwednesday",
  "palace":"crystalpalace","cpfc":"crystalpalace",
  "villa":"astonvilla","avfc":"astonvilla",
  "bournemouth":"afcbournemouth",
  "leicester":"leicestercity","lcfc":"leicestercity",
  "norwich":"norwichcity","ipswich":"ipswichtown",
  "luton":"lutontown","burnley":"burnley",
  "brentford":"brentford","fulham":"fulham","everton":"everton",
  "arsenal":"arsenal","chelsea":"chelsea","liverpool":"liverpool",
  "southampton":"southampton","sunderland":"sunderland"
};
function normalizeTeamName(n){
  var base=String(n||"").toLowerCase().replace(/[^a-z0-9]/g,"");
  return TEAM_ALIASES[base]||base;
}

function fetchTiebreakerResult(weekId){
  var tb=ST.tiebreaker[weekId]||{};
  if(!tb.away||!tb.home){toast("No tiebreaker match set");return;}
  var btn=document.getElementById("b-tb-fetch-result");
  if(btn){btn.textContent="Loading\u2026";btn.disabled=true;}
  var url="https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/scoreboard?dates="+weekDateRange(weekId)+"&limit=100";
  fetch(url)
    .then(function(r){return r.json();})
    .then(function(data){
      var events=(data&&data.events)||[];
      var nA=normalizeTeamName(tb.away), nH=normalizeTeamName(tb.home);
      var found=null;
      events.forEach(function(ev){
        var comp=(ev.competitions||[])[0]||{};
        var comps=comp.competitors||[];
        var away=comps.find(function(c){return c.homeAway==="away";})||{};
        var home=comps.find(function(c){return c.homeAway==="home";})||{};
        var an=normalizeTeamName((away.team&&(away.team.shortDisplayName||away.team.displayName))||"");
        var hn=normalizeTeamName((home.team&&(home.team.shortDisplayName||home.team.displayName))||"");
        if(an===nA&&hn===nH){
          if((comp.status&&comp.status.type&&comp.status.type.state)==="post"){
            found=(parseInt(away.score)||0)+(parseInt(home.score)||0);
          }
        }
      });
      if(found!==null){
        setTiebreakerField(weekId,"actual",found);
        var inp=document.getElementById("tb-actual");
        if(inp) inp.value=found;
        toast("\u2713 Total: "+found+" goal"+(found!==1?"s":""));
        draw();
      } else {
        toast("Match not found or not finished yet");
      }
      if(btn){btn.textContent="\u{1F4CA} Fetch";btn.disabled=false;}
    })
    .catch(function(){
      toast("Could not reach ESPN");
      if(btn){btn.textContent="\u{1F4CA} Fetch";btn.disabled=false;}
    });
}

function fetchRankings(){
  // ESPN's soccer standings payload nests groups → standings → entries.
  fetch("https://site.api.espn.com/apis/v2/sports/soccer/eng.1/standings")
    .then(function(r){return r.json();})
    .then(function(data){
      var map={};
      function walk(node){
        if(!node||typeof node!=="object") return;
        var entries=(node.standings&&node.standings.entries)||node.entries;
        if(Array.isArray(entries)){
          entries.forEach(function(e){
            var t=e.team||{};
            var nm=t.shortDisplayName||t.displayName||t.name;
            if(!nm) return;
            var pos=null;
            (e.stats||[]).forEach(function(st){
              if(st.name==="rank"||st.type==="rank"||st.name==="position") pos=Number(st.value)||pos;
            });
            if(pos) map[normalizeTeamName(nm)]={rank:pos,source:"PL"};
          });
        }
        (node.children||[]).forEach(walk);
      }
      walk(data);
      RANKINGS=map;
      if(ST.page==="group"||ST.page==="picks") draw();
    })
    .catch(function(){}); // silently fail — table positions are decorative
}
fetchRankings();
</script>
