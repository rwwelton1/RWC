// YYYY-MM-DD \u2192 YYYYMMDD (ESPN's dates= format)
function _espnDate(d){ return String(d||"").replace(/-/g,""); }
// Build the ESPN dates= range for a week, falling back to a \u00b13-day window around today.
function weekDateRange(weekId){
  var m=(ST._weekMeta&&ST._weekMeta[weekId])||{};
  if(m.startDate&&m.endDate) return _espnDate(m.startDate)+"-"+_espnDate(m.endDate);
  if(m.startDate) return _espnDate(m.startDate);
  var now=new Date(), a=new Date(now.getTime()-3*86400000), b=new Date(now.getTime()+4*86400000);
  function f(d){ return d.getFullYear()+("0"+(d.getMonth()+1)).slice(-2)+("0"+d.getDate()).slice(-2); }
  return f(a)+"-"+f(b);
}

// ── AUTO-RESULT FETCH SCHEDULE ────────────────────────────
// Fetches results only during scheduled windows (ET):
// Thu 11 PM, Fri 11 PM, Sat 12 PM / 4 PM / 8 PM / 11 PM, Sun 9 AM
// Runs a 5-min ticker that checks if we're in a window before firing.

var _resultScheduleTimer = null;
var _lastAutoResultFetch = 0; // ts of last auto fetch, to avoid duplicate fires per window

// Fetch windows: [dayOfWeek (0=Sun), hourET]
var RESULT_FETCH_WINDOWS = [
  [4, 23], // Thursday  11 PM
  [5, 23], // Friday    11 PM
  [6, 12], // Saturday  12 PM
  [6, 16], // Saturday   4 PM
  [6, 20], // Saturday   8 PM
  [6, 23], // Saturday  11 PM
  [0,  9]  // Sunday     9 AM
];
var RESULT_FETCH_WINDOW_MINUTES = 30; // fire within 30 min of each window start

function _nowET() {
  var n = new Date();
  var jan = new Date(n.getFullYear(), 0, 1);
  var jul = new Date(n.getFullYear(), 6, 1);
  var isDST = n.getTimezoneOffset() < Math.max(jan.getTimezoneOffset(), jul.getTimezoneOffset());
  return new Date(n.getTime() + n.getTimezoneOffset() * 60000 + (isDST ? -4 : -5) * 3600000);
}

function _inResultFetchWindow() {
  var et = _nowET();
  var day = et.getDay(), hour = et.getHours(), min = et.getMinutes();
  var totalMin = hour * 60 + min;
  for (var i = 0; i < RESULT_FETCH_WINDOWS.length; i++) {
    var wd = RESULT_FETCH_WINDOWS[i][0];
    var wh = RESULT_FETCH_WINDOWS[i][1];
    var windowStart = wh * 60;
    if (day === wd && totalMin >= windowStart && totalMin < windowStart + RESULT_FETCH_WINDOW_MINUTES) {
      return true;
    }
  }
  return false;
}

// A game is in its "live results window" from its kickoff until 5 hours after — that's when
// auto-fetching its final makes sense. No admin lock required; it's purely time-driven.
var RESULT_WINDOW_MS = 3 * 60 * 60 * 1000; // 3 hours (90' + stoppage + buffer)
function anyGameInLiveWindow(weekId){
  if(!weekId) return false;
  var games = ST.games[weekId] || {};
  var now = Date.now();
  return GAME_IDS.some(function(gid){
    var g = games[gid];
    if(!g || !g.away || !g.home) return false;
    if((ST.results[weekId]||{})[gid]) return false;        // already has a result
    var ts = parseKickoffTs(g);
    if(!ts) return false;
    return now >= ts && now <= ts + RESULT_WINDOW_MS;      // kicked off, within 5h
  });
}

function startResultSchedule() {
  stopResultSchedule();

  function tick() {
    var weekId = currentWeekId();
    if (!weekId) return;
    // Only fetch while at least one game is in its live window (kickoff → +5h) and unresolved.
    // This replaces the old hardcoded weekend-hours gate — games run Thu–Mon at all hours.
    if (!anyGameInLiveWindow(weekId)) return;
    if (Date.now() - _lastAutoResultFetch < 4 * 60 * 1000) return;
    _lastAutoResultFetch = Date.now();
    fetchAllResults(weekId);
  }
  tick(); // check immediately on start
  _resultScheduleTimer = setInterval(tick, 5 * 60 * 1000); // every 5 min
}

function stopResultSchedule() {
  clearInterval(_resultScheduleTimer);
  _resultScheduleTimer = null;
}
var _scTimer=null, _scData=null, _scLoading=false, _scLastFetch=0, _scWeek=null;

// The week whose slate the Scores tab reflects: whatever week the user is on.
function scoresWeekId(){ return ST.curWeek || displayWeekId(); }

function fetchScoreboard(){
  if(_scLoading) return;
  _scLoading=true;
  var _reqWeek=scoresWeekId();   // stamp the request so a week switch invalidates it
  // Pull the matchweek's own date range, not today — a matchweek spans Fri→Mon and
  // the user may be looking at it days before or after any of it kicks off.
  var range=weekDateRange(scoresWeekId());
  fetch("https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/scoreboard?dates="+range+"&limit=100")
    .then(function(r){return r.json();})
    .then(function(data){
      _scLoading=false; _scLastFetch=Date.now(); _scData=data; _scWeek=_reqWeek;
      // Fresh feed — post any finals it reveals before the tab repaints.
      try{ autoPostFinalsFromScoreboard(); }catch(e){}
      if(ST.page==="scores") renderScoresInto();
    })
    .catch(function(){
      _scLoading=false;
      var el=document.getElementById("scores-wrap");
      if(el) el.innerHTML='<div class="scores-empty">&#9917;<br>Could not load scores.<br><br><button class="scores-refresh" onclick="fetchScoreboard()">&#8635; Retry</button></div>';
    });
}

// Does this ESPN event correspond to one of the pool's stored games? Same tiered
// match used when auto-filling results: team id, then abbreviation, then name.
function _eventMatchesGame(ev, g){
  if(!g||!g.away||!g.home) return false;
  var comp=(ev.competitions||[])[0]||{};
  var comps=comp.competitors||[];
  var awayC=comps.find(function(c){return c.homeAway==="away";})||{};
  var homeC=comps.find(function(c){return c.homeAway==="home";})||{};
  var eAwayId=String((awayC.team&&awayC.team.id)||"");
  var eHomeId=String((homeC.team&&homeC.team.id)||"");
  if(g.awayId&&g.homeId&&eAwayId&&eHomeId) return g.awayId===eAwayId&&g.homeId===eHomeId;
  var eA=String((awayC.team&&awayC.team.abbreviation)||"").toUpperCase();
  var eH=String((homeC.team&&homeC.team.abbreviation)||"").toUpperCase();
  if(g.awayAbbrev&&g.homeAbbrev&&eA&&eH) return g.awayAbbrev.toUpperCase()===eA&&g.homeAbbrev.toUpperCase()===eH;
  var an=normalizeTeamName((awayC.team&&(awayC.team.shortDisplayName||awayC.team.displayName))||"");
  var hn=normalizeTeamName((homeC.team&&(homeC.team.shortDisplayName||homeC.team.displayName))||"");
  return an===normalizeTeamName(g.away)&&hn===normalizeTeamName(g.home)&&an.length>=3;
}

// Only the games this pool selected for the week, in slate order.
function _slateEvents(){
  var wk=scoresWeekId();
  var games=(ST.games&&ST.games[wk])||{};
  var all=(_scData&&_scData.events)||[];
  var out=[];
  activeGames(wk).forEach(function(gid){
    var g=games[gid];
    for(var i=0;i<all.length;i++){
      if(_eventMatchesGame(all[i],g)){ out.push(all[i]); return; }
    }
  });
  // The tiebreaker is usually not one of the pool's own games, so add it here —
  // it is shown alongside them rather than in a banner of its own.
  var tbEv=_tiebreakerEvent();
  if(tbEv && out.indexOf(tbEv)<0) out.push(tbEv);
  return out;
}

// Broadcaster, trimmed to fit a third-width card. ESPN's own shortName is often
// already an abbreviation (ACCN, SECN, FS1); the map covers the ones it spells
// out, and anything else falls back to an initialism or a 5-character clip.
var _TV_SHORT={
  "ACC NETWORK":"ACCN","SEC NETWORK":"SECN","BIG TEN NETWORK":"BTN",
  "CBS SPORTS NETWORK":"CBSSN","FOX SPORTS 1":"FS1","FOX SPORTS 2":"FS2",
  "NFL NETWORK":"NFLN","USA NETWORK":"USA","THE CW":"CW","PARAMOUNT+":"PARA",
  "PEACOCK":"PCOCK","ESPN NETWORKS":"ESPN","ESPNEWS":"ESPNN","PAC-12 NETWORK":"P12N",
  "MOUNTAIN WEST NETWORK":"MWN","NBC SPORTS":"NBCSN","AMAZON PRIME VIDEO":"PRIME"
};
function _tvShort(name){
  var up=String(name||"").trim().toUpperCase();
  if(!up) return "";
  if(_TV_SHORT[up]) return _TV_SHORT[up];
  if(up.length<=5) return up;                       // ESPN, ABC, CBS, ACCN, FS1
  var words=up.split(/[\s\-\/]+/).filter(Boolean);
  if(words.length>1){                                // multi-word → initialism
    var ini=words.map(function(w){return w.charAt(0);}).join("");
    if(ini.length>=2&&ini.length<=5) return ini;
  }
  return up.slice(0,5);
}
// Pull the TV network off a competition, same fields the schedule import uses.
function _tvFor(comp){
  var tv="";
  var geo=((comp&&comp.geoBroadcasts)||[]).find(function(b){ return b.type&&b.type.shortName==="TV"; });
  if(geo&&geo.media) tv=geo.media.shortName||geo.media.name||"";
  if(!tv&&comp&&comp.broadcasts&&comp.broadcasts.length) tv=(comp.broadcasts[0].names||[])[0]||"";
  return _tvShort(tv);
}

// "9/5 12p" / "9/5 12:45p" — short enough for a third-width card. Top-level so
// both the score cards and the tiebreaker panel can use it.
function _compactWhen(ev){
  var d=(ev&&ev.date)?new Date(ev.date):null;
  if(!d||isNaN(d.getTime())) return "";
  var hr=d.getHours(), mn=d.getMinutes();
  var ap=hr>=12?"PM":"AM", h12=hr%12; if(h12===0) h12=12;
  return (d.getMonth()+1)+"/"+d.getDate()+" "+h12+":"+("0"+mn).slice(-2)+" "+ap;
}

// Find the tiebreaker match in the raw feed. Matched on its own because it is
// frequently outside the pool's own slate and so never survives _slateEvents().
function _tiebreakerEvent(){
  var tb=(ST.tiebreaker&&ST.tiebreaker[scoresWeekId()])||{};
  if(!tb.away||!tb.home) return null;
  var all=(_scData&&_scData.events)||[];
  var nA=normalizeTeamName(tb.away), nH=normalizeTeamName(tb.home);
  for(var i=0;i<all.length;i++){
    var comp=(all[i].competitions||[])[0]||{};
    var comps=comp.competitors||[];
    var ac=comps.find(function(c){return c.homeAway==="away";})||{};
    var hc=comps.find(function(c){return c.homeAway==="home";})||{};
    var an=normalizeTeamName((ac.team&&(ac.team.shortDisplayName||ac.team.displayName))||"");
    var hn=normalizeTeamName((hc.team&&(hc.team.shortDisplayName||hc.team.displayName))||"");
    if(an===nA&&hn===nH) return all[i];
  }
  return null;
}

// Is this event the week's tiebreaker match?
function _isTiebreakerEvent(ev){
  var tbEv=_tiebreakerEvent();
  return !!(tbEv && ev===tbEv);
}

// Post results for any slate game the scoreboard now shows as final. Driven by
// the same poll that powers the Scores tab, so it keeps working long after the
// scheduled fetch window has closed.
// Admin-only: results are the group's shared truth and only the admin may write
// them, so for everyone else this is a no-op rather than a failed write.
function autoPostFinalsFromScoreboard(){
  if(PUBLIC_VIEW) return 0;
  if(!DB) return 0;
  if(!(typeof isGroupAdminByUid==="function" && isGroupAdminByUid())) return 0;
  var wk=scoresWeekId();
  if(!wk) return 0;
  var games=(ST.games&&ST.games[wk])||{};
  var results=(ST.results&&ST.results[wk])||{};
  var all=(_scData&&_scData.events)||[];
  if(!all.length) return 0;
  var posted=0;

  activeGames(wk).forEach(function(gid){
    if(results[gid]) return;                       // already resolved
    var g=games[gid];
    if(!g||!g.away||!g.home) return;
    for(var i=0;i<all.length;i++){
      var ev=all[i];
      if(!_eventMatchesGame(ev,g)) continue;
      var comp=(ev.competitions||[])[0]||{};
      var state=(comp.status&&comp.status.type&&comp.status.type.state)||"";
      if(state!=="post") return;                   // matched, but not final yet
      var comps=comp.competitors||[];
      var ac=comps.find(function(c){return c.homeAway==="away";})||{};
      var hc=comps.find(function(c){return c.homeAway==="home";})||{};
      var as=parseInt(ac.score), hs=parseInt(hc.score);
      if(isNaN(as)||isNaN(hs)) return;             // final with no score — leave it
      // Win / draw / loss at full time.
      setResult(wk,gid, hs>as ? "home" : as>hs ? "away" : "draw");
      setGameField(wk,gid,"awayScore",as);
      setGameField(wk,gid,"homeScore",hs);
      posted++;
      return;
    }
  });
  if(posted){
    toast("\u2713 "+posted+" result"+(posted!==1?"s":"")+" posted automatically");
  }
  return posted;
}

function renderScoresInto(){
  var el=document.getElementById("scores-wrap");
  if(!el) return;
  var _wkLabel=(ST.weekLabels&&ST.weekLabels[scoresWeekId()])||"";
  var _slateSize=activeGames(scoresWeekId()).length;
  if(!_slateSize){
    el.innerHTML='<div class="scores-empty">&#9917;<br>No games in this week yet.<br><span style="font-size:9px;color:var(--dim)">Scores appear once the slate is set</span></div>';
    return;
  }
  var events=_slateEvents();
  if(!events.length){
    el.innerHTML='<div class="scores-empty">&#9917;<br>Waiting on scores for '+x(_wkLabel)+'.<br><span style="font-size:9px;color:var(--dim)">Check back nearer kickoff</span>'+
      '<br><br><button class="scores-refresh" onclick="fetchScoreboard()">&#8635; Refresh</button></div>';
    return;
  }
  var live=[],pre=[],done=[];
  events.forEach(function(ev){
    var comp=(ev.competitions||[])[0]; if(!comp) return;
    var state=(comp.status&&comp.status.type&&comp.status.type.state)||"pre";
    if(state==="in") live.push(ev);
    else if(state==="post") done.push(ev);
    else pre.push(ev);
  });

  var dateLabel=_wkLabel||new Date().toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});

  function card(ev){
    var comp=(ev.competitions||[])[0]; if(!comp) return "";
    var status=comp.status||{};
    var state=(status.type&&status.type.state)||"pre";
    var detail=(status.type&&status.type.shortDetail)||"";
    var isLive=state==="in", isFinal=state==="post";
    var tvNet=_tvFor(comp);

    var comps=comp.competitors||[];
    var away=comps.find(function(c){return c.homeAway==="away";})||comps[0]||{};
    var home=comps.find(function(c){return c.homeAway==="home";})||comps[1]||{};

    function tname(c){
      var t=(c&&c.team)||{};
      var ab=String(t.abbreviation||"").trim();
      if(ab && ab.length<=5) return ab;                    // ECU, ALA, WAKE, OSU
      var nm=String(t.shortDisplayName||t.displayName||"").trim();
      if(!nm) return "?";
      if(nm.length<=5) return nm;
      // No usable abbreviation — take the first word, capped at 5 characters.
      var first=nm.split(/\s+/)[0];
      return (first.length<=5?first:first.slice(0,5)).toUpperCase();
    }
    function tcolor(c){var col=(c.team&&c.team.color)||"";return(col&&col.length===6&&col!=="000000")?"#"+col:"#475569";}
    // ESPN puts the crest on the competitor's team object, sometimes as a bare
    // `logo`, sometimes as the first entry of a `logos` array.
    function tlogo(c){
      var t=(c&&c.team)||{};
      if(t.logo) return t.logo;
      if(t.logos&&t.logos.length&&t.logos[0].href) return t.logos[0].href;
      return "";
    }

    var aName=tname(away), hName=tname(home);
    var aScore=away.score!=null?String(away.score):"";
    var hScore=home.score!=null?String(home.score):"";
    var aNum=parseInt(aScore)||0, hNum=parseInt(hScore)||0;

    var aWin=isFinal&&aNum>hNum, hWin=isFinal&&hNum>aNum;
    var aLead=isLive&&aNum>hNum, hLead=isLive&&hNum>aNum;
    var tied=isLive&&aNum===hNum&&aScore!=="";

    function teamRow(name,color,score,wins,leads,logo){
      var cls="sc-team";
      if(wins||leads) cls+=" winner";
      else if(isFinal&&!wins) cls+=" loser";
      else if(isLive&&!leads&&!tied&&score!=="") cls+=" loser";
      // Crest when the feed has one; the coloured dot is the fallback, and also
      // takes over if the image 404s.
      var mark = logo
        ? '<img class="sc-logo" src="'+logo+'" alt="" onerror="this.outerHTML=\'<div class=&quot;sc-dot&quot; style=&quot;background:'+color+'&quot;></div>\'">'
        : '<div class="sc-dot" style="background:'+color+'"></div>';
      return '<div class="'+cls+'">'+
        mark+
        '<div class="sc-name">'+x(name)+'</div>'+
        '<div class="sc-score'+(state==="pre"?" pre":"")+'">'+x(state==="pre"?"":score)+'</div>'+
        '</div>';
    }

    return '<div class="score-card'+(isLive?" live":isFinal?" final":"")+'">'+
      '<div class="sc-head">'+
        '<span class="sc-status '+(isLive?"live":isFinal?"final":"pre")+'">'+(isLive?"&#9679; LIVE":isFinal?"Final":x(_compactWhen(ev)))+'</span>'+
        (isLive
          ? '<span class="sc-detail">'+x(detail)+'</span>'
          : (tvNet ? '<span class="sc-tv">'+x(tvNet)+'</span>' : '<span class="sc-detail"></span>'))+
      '</div>'+
      teamRow(aName,tcolor(away),aScore,aWin,aLead,tlogo(away))+
      teamRow(hName,tcolor(home),hScore,hWin,hLead,tlogo(home))+
      '</div>';
  }

  function section(games,label){
    if(!games.length) return "";
    var s='<div class="scores-section-label">'+label+' &middot; '+games.length+'</div>';
    s+='<div class="scores-strip">';
    games.forEach(function(ev){s+=card(ev);});
    s+='</div>';
    return s;
  }

  var ago=_scLastFetch?Math.round((Date.now()-_scLastFetch)/1000):0;
  var h='<div class="scores-date-header">'+
    '<span>&#9917; '+x(dateLabel)+' &middot; '+events.filter(function(e){return !_isTiebreakerEvent(e);}).length+' of '+_slateSize+'</span>'+
    '<button class="scores-refresh" onclick="fetchScoreboard()">&#8635; Refresh</button>'+
    '</div>';
  if(live.length) h+=section(live,"&#128308; In Progress");
  h+=section(pre,"&#128336; Upcoming");
  h+=section(done,"&#10003; Final");
  h+='<div style="text-align:center;padding:10px 0 4px;font-size:7px;color:var(--dim)">Updated '+ago+'s ago &middot; auto-refreshes every 60s &middot; via ESPN</div>';
  el.innerHTML=h;
}

function startScoreRefresh(){
  clearInterval(_scTimer);
  fetchScoreboard();
  _scTimer=setInterval(function(){if(ST.page==="scores")fetchScoreboard();},60000);
}
function stopScoreRefresh(){clearInterval(_scTimer);_scTimer=null;}

// ── ESPN SCHEDULE IMPORT (Admin) ───────────────────────────────────────────
function fetchEspnSchedule(weekId){
  ST.importLoading=true; ST.importError=""; draw();
  var range=weekDateRange(weekId||ST.curWeek);
  var url="https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/scoreboard?dates="+range+"&limit=100";
  fetch(url)
    .then(function(r){return r.json();})
    .then(function(data){
      ST.importLoading=false;
      ST.importGames=parseEspnSchedule(data);
      // A Premier League matchweek is exactly 10 fixtures and ALL of them are used, so
      // preselect everything the range returned rather than making the admin tick 10 boxes.
      ST.importSelected={};
      ST.importGames.forEach(function(g,i){ ST.importSelected[i]=true; });
      if(!ST.importGames.length) ST.importError="No Premier League fixtures in "+range+". Widen the date range.";
      else if(ST.importGames.length!==10) ST.importError="Found "+ST.importGames.length+" fixtures (a full matchweek is 10). Adjust the dates, then untick any extras.";
      draw();
    })
    .catch(function(){
      ST.importLoading=false;
      ST.importError="Could not reach ESPN. Check your connection.";
      draw();
    });
}
function parseEspnSchedule(data){
  var events=(data&&data.events)||[];
  var out=events.map(function(ev){
    var comp=(ev.competitions||[])[0]||{};
    var comps=comp.competitors||[];
    var away=comps.find(function(c){return c.homeAway==="away";})||{};
    var home=comps.find(function(c){return c.homeAway==="home";})||{};
    var awayName=(away.team&&(away.team.shortDisplayName||away.team.displayName))||"TBD";
    var homeName=(home.team&&(home.team.shortDisplayName||home.team.displayName))||"TBD";
    var awayId=String((away.team&&away.team.id)||"");
    var homeId=String((home.team&&home.team.id)||"");
    var awayAbbrev=String((away.team&&away.team.abbreviation)||"");
    var homeAbbrev=String((home.team&&home.team.abbreviation)||"");
    function teamLogo(competitor){
      var t=competitor.team;
      if(!t) return "";
      if(t.logo) return t.logo;
      if(t.logos&&t.logos.length) return t.logos[0].href||"";
      return "";
    }
    var dt=ev.date?new Date(ev.date):null;
    var kickoff=dt?dt.toLocaleString("en-US",{weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}):"";
    var kickoffTs=dt?dt.getTime():null;
    var venue=(comp.venue&&comp.venue.fullName)||"";
    var tv="";
    var geo=(comp.geoBroadcasts||[]).find(function(b){ return b.type&&b.type.shortName==="TV"; });
    if(geo&&geo.media) tv=geo.media.shortName||geo.media.name||"";
    if(!tv&&comp.broadcasts&&comp.broadcasts.length) tv=(comp.broadcasts[0].names||[])[0]||"";
    return {away:awayName,home:homeName,awayId:awayId,homeId:homeId,
            awayAbbrev:awayAbbrev,homeAbbrev:homeAbbrev,
            awayLogo:teamLogo(away),homeLogo:teamLogo(home),
            kickoff:kickoff,kickoffTs:kickoffTs,venue:venue,tv:tv};
  });
  // Chronological — a matchweek reads Fri \u2192 Mon.
  out.sort(function(a,b){ return (a.kickoffTs||0)-(b.kickoffTs||0); });
  return out;
}
function guessWeekNumber(label){
  var m=String(label||"").match(/(\d+)/);
  return m?parseInt(m[1]):1;
}

// ── Countdown helpers ─────────────────────────────────────
var _countdownTimer=null;

// Parse kickoff string like "Sat, Aug 29 at 12:00 PM" → timestamp (ms)
// Falls back to kickoffTs if stored, otherwise parses the display string
function parseKickoffTs(game){
  if(game.kickoffTs) return game.kickoffTs;
  var s=String(game.kickoff||"");
  if(!s) return null;
  // Try removing the weekday prefix: "Sat, Aug 29 at 12:00 PM" → "Aug 29 at 12:00 PM"
  s=s.replace(/^[A-Za-z]+,?\s*/,"");
  // Replace "at" with space: "Aug 29 12:00 PM"
  s=s.replace(/\s+at\s+/," ");
  // Append current year if missing
  var yr=new Date().getFullYear();
  var d=new Date(s+" "+yr);
  if(isNaN(d.getTime())) return null;
  return d.getTime();
}
// Convert a game's kickoff to the value a <input type="datetime-local"> expects
// (YYYY-MM-DDTHH:MM in LOCAL time). Returns "" if unknown.
function _kickoffToLocalInput(game){
  var ts=parseKickoffTs(game);
  if(!ts) return "";
  var d=new Date(ts);
  function p(n){return String(n).padStart(2,"0");}
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"T"+p(d.getHours())+":"+p(d.getMinutes());
}
// Human display string from a timestamp, e.g. "Sat, Aug 29 at 12:00 PM".
function _tsToKickoffLabel(ts){
  if(!ts) return "";
  var d=new Date(ts);
  return d.toLocaleString("en-US",{weekday:"short",month:"short",day:"numeric"})+" at "+
         d.toLocaleString("en-US",{hour:"numeric",minute:"2-digit"});
}

// Returns true if this specific game's pick window is closed
// (either the whole week is locked, or this game's kickoff has passed)
function isGameLocked(weekId, gid){
  if(ST.locked[weekId]) return true;
  var g=(ST.games[weekId]||{})[gid];
  if(!g) return false;
  var ts=parseKickoffTs(g);
  return ts?Date.now()>=ts:false;
}

function getFirstKickoff(weekId){
  var games=ST.games[weekId]||{};
  var earliest=null;
  GAME_IDS.forEach(function(gid){
    var g=games[gid];
    if(!g||!g.away||!g.home) return;
    var ts=parseKickoffTs(g);
    if(ts&&(earliest===null||ts<earliest)) earliest=ts;
  });
  return earliest;
}

function formatCountdownEpl(ms){
  if(ms<=0) return null;
  var s=Math.floor(ms/1000);
  var m=Math.floor(s/60); s=s%60;
  var h=Math.floor(m/60); m=m%60;
  var d=Math.floor(h/24); h=h%24;
  if(d>0) return d+'d '+h+'h '+('0'+m).slice(-2)+'m';
  if(h>0) return h+'h '+('0'+m).slice(-2)+'m '+('0'+s).slice(-2)+'s';
  return ('0'+m).slice(-2)+'m '+('0'+s).slice(-2)+'s';
}

function startCountdown(weekId){
  stopCountdown();
  var firstKickoff=getFirstKickoff(weekId);
  if(!firstKickoff) return;
  function tick(){
    var el=document.getElementById("countdown-display");
    if(!el) { stopCountdown(); return; }
    var remaining=firstKickoff-Date.now();
    if(remaining<=0){
      el.textContent="&#128274; Locked";
      el.style.color="var(--red2)";
      stopCountdown();
    } else {
      el.textContent="🔒 "+formatCountdownEpl(remaining);
    }
  }
  tick();
  _countdownTimer=setInterval(tick,1000);
}
function stopCountdown(){ clearInterval(_countdownTimer); _countdownTimer=null; }
function addImportedGames(weekId){
  var selected=ST.importGames.filter(function(g,i){return ST.importSelected[i];});
  if(!selected.length){toast("Select at least one game");return;}
  if(selected.length>10){toast("A matchweek is 10 fixtures \u2014 untick the extras");return;}
  // The selection is the desired FINAL set for the week (already-imported games come pre-
  // selected). So we overwrite: write the selected games into slots 1..N and clear any
  // remaining slots, letting the admin swap games even when the week was already full.
  var n=selected.length;
  for(var i=0;i<GAME_IDS.length;i++){
    var gid=GAME_IDS[i];
    if(i<n){
      var g=selected[i];
      setGameField(weekId,gid,"away",g.away);
      setGameField(weekId,gid,"home",g.home);
      setGameField(weekId,gid,"awayId",g.awayId||"");
      setGameField(weekId,gid,"homeId",g.homeId||"");
      setGameField(weekId,gid,"awayAbbrev",g.awayAbbrev||"");
      setGameField(weekId,gid,"homeAbbrev",g.homeAbbrev||"");
      setGameField(weekId,gid,"kickoff",g.kickoff);
      setGameField(weekId,gid,"kickoffTs",g.kickoffTs||"");
      setGameField(weekId,gid,"awayLogo",g.awayLogo||"");
      setGameField(weekId,gid,"homeLogo",g.homeLogo||"");
      setGameField(weekId,gid,"tv",g.tv||"");
    } else {
      // Clear leftover slot so the week reflects exactly the selected games.
      if(DB) DB.ref(BASE+"/games/"+weekId+"/"+gid).remove();
      if(ST.games[weekId]) delete ST.games[weekId][gid];
    }
  }
  ST.importSelected={};
  toast("&#10003; Matchweek set to "+n+" fixture"+(n!==1?"s":""));
  // Suggest lockDate: use the earliest kickoff from imported games
  var firstKickoff=null;
  for(var si=0;si<n;si++){
    var sg=selected[si];
    if(sg.kickoffTs&&(firstKickoff===null||sg.kickoffTs<firstKickoff)) firstKickoff=sg.kickoffTs;
  }
  if(firstKickoff&&DB){
    var _kd=new Date(firstKickoff);
    var _kdStr=_kd.getFullYear()+"-"+("0"+(_kd.getMonth()+1)).slice(-2)+"-"+("0"+_kd.getDate()).slice(-2);
    DB.ref("globalSettings/poolDates/epl/lockDate").once("value",function(sn){
      var existing=sn.val()||"";
      if(existing!==_kdStr){
        if(confirm("First kickoff is "+_kdStr+" — update the Premier League lock date to match?")){
          DB.ref("globalSettings/poolDates/epl/lockDate").set(_kdStr);
          toast("&#10003; Lock date updated to "+_kdStr);
        }
      }
    });
  }
  draw();
}

// ── Pick actions ─────────────────────────────────────────
var _undoTimer=null, _undoPick=null;

// Picks written but not yet committed, keyed week|user|game. A pick sits here for
// the 3s undo window; anything still present is re-applied over incoming
// snapshots so the server's older state can't erase it.
var _pendingPicks={};
function _pendKey(weekId,uk,gid){ return weekId+"|"+uk+"|"+gid; }

// Commit one pending pick. Safe to call twice — the entry is removed first.
function _flushPick(key){
  var p=_pendingPicks[key];
  if(!p) return;
  delete _pendingPicks[key];
  if(!DB) return;
  DB.ref(BASE+"/picks/"+p.weekId+"/"+p.uk+"/"+p.gid).set(p.cur,function(err){
    if(!err){
      var t=document.getElementById("tick-"+p.gid);
      if(t){ t.innerHTML='<span class="save-tick">&#10003;</span>'; setTimeout(function(){t.innerHTML="";},1000); }
    } else {
      // Put it back so a later flush retries rather than silently dropping it.
      _pendingPicks[key]=p;
    }
  });
}
// Commit everything outstanding, optionally sparing one key (the pick currently
// showing an Undo button).
function _flushAllPicks(exceptKey){
  Object.keys(_pendingPicks).forEach(function(k){ if(k!==exceptKey) _flushPick(k); });
}
// Don't let a backgrounded or closed tab strand a pick inside its undo window.
try{
  window.addEventListener("pagehide",function(){ _flushAllPicks(); });
  document.addEventListener("visibilitychange",function(){
    if(document.visibilityState==="hidden") _flushAllPicks();
  });
}catch(e){}
function setPickSide(weekId,gid,side){
  if(PUBLIC_VIEW) return;   // read-only spectator
  if(!ST.user){toast("Select your name first");return;}
  if(isGameLocked(weekId,gid)){toast("&#128274; Game is locked");return;}
  var uk=ST.user;
  if(!ST.picks[weekId])ST.picks[weekId]={};
  if(!ST.picks[weekId][uk])ST.picks[weekId][uk]={};
  var cur=ST.picks[weekId][uk][gid]||{};
  var prevSide=cur.side;
  if(cur.side===side) delete cur.side;
  else cur.side=side;
  ST.picks[weekId][uk][gid]=cur;
  _savePickCache(weekId, uk, cur);
  // Update pick highlight in-place — no full redraw
  _updatePickDom(weekId, gid, cur.side);
  // Remove unpicked accent border immediately
  var _wrap=document.querySelector('.unpicked-wrap[data-gid="'+gid+'"]');
  if(_wrap) _wrap.style.borderLeftColor=cur.side?"transparent":"var(--border)";
  _updateProgressBar(weekId);
  // Undo toast for 3 seconds before committing to Firebase
  // A new pick means the previous one's undo window is over — commit it rather
  // than cancelling it, which is what silently dropped picks before.
  if(_undoTimer){ clearTimeout(_undoTimer); _undoTimer=null; }
  _flushAllPicks(_pendKey(weekId,uk,gid));
  var g=(ST.games[weekId]||{})[gid]||{};
  var teamName=cur.side?(cur.side==="draw"?("Draw \u2014 "+(g.home||"")+" v "+(g.away||"")):sideLabel(g,cur.side)):"cleared";
  _undoPick={weekId:weekId,gid:gid,prevSide:prevSide,cur:cur,uk:uk};
  var undoEl=document.getElementById("toast");
  undoEl.innerHTML=(cur.side?"&#10003; "+x(teamName):"Cleared")+'&nbsp;&nbsp;<span id="undo-pick-btn" style="text-decoration:underline;cursor:pointer">Undo</span>';
  undoEl.classList.add("show");
  clearTimeout(_tt);
  // Hold this pick for the undo window, but record it as pending so a snapshot
  // can't wipe it and a page-hide can still flush it.
  var _key=_pendKey(weekId,uk,gid);
  _pendingPicks[_key]={weekId:weekId,uk:uk,gid:gid,cur:cur};
  _undoTimer=setTimeout(function(){
    undoEl.classList.remove("show"); _undoPick=null; _undoTimer=null;
    _flushPick(_key);
  },3000);
}

// Guard: re-apply DOM pick state after any scheduleDraw that fires while undo is pending
var _origScheduleDraw=scheduleDraw;
scheduleDraw=function(){
  _origScheduleDraw();
  // After the draw settles, re-apply any pending in-flight pick state
  if(_undoPick){
    setTimeout(function(){
      if(_undoPick) _updatePickDom(_undoPick.weekId, _undoPick.gid, _undoPick.cur.side||null);
    },0);
  }
};

  if(ST.locked[weekId]){toast("&#128274; Week is locked");return;}

// Clear every pick for the week (the reset button next to the progress bar).
function resetAllPicks(weekId){
  if(PUBLIC_VIEW) return;   // read-only spectator
  if(!ST.user){toast("Select your name first");return;}
  if(ST.locked[weekId]){toast("&#128274; Week is locked");return;}
  var uk=ST.user;
  if(!ST.picks[weekId]||!ST.picks[weekId][uk]) return;
  var active=activeGames(weekId);
  var anyLocked=active.some(function(gid){ return isGameLocked(weekId,gid); });
  if(!confirm("Clear all your picks for this matchweek?"+(anyLocked?"\\n\\nMatches that have already kicked off will keep their picks.":""))) return;
  // Any pick still inside its undo window would otherwise commit over the wipe.
  if(_undoTimer){ clearTimeout(_undoTimer); _undoTimer=null; }
  _undoPick=null;
  active.forEach(function(gid){
    if(isGameLocked(weekId,gid)) return;   // a kicked-off match is final
    if(ST.picks[weekId][uk][gid]){
      delete _pendingPicks[_pendKey(weekId,uk,gid)];
      delete ST.picks[weekId][uk][gid];
      if(DB) DB.ref(BASE+"/picks/"+weekId+"/"+uk+"/"+gid).remove();
    }
  });
  _savePickCache(weekId, uk, ST.picks[weekId][uk]);
  toast("&#129529; Picks cleared");
  draw();
}

// Count how many completed weeks each player has WON (for "his 2nd win" context).
// Returns a map uid -> number of weekly wins up to & including weekId.
function _weeklyWinCounts(uptoWeekId){
  var wins={};
  var idx=ST.weekIds.indexOf(uptoWeekId);
  var weeks=ST.weekIds.slice(0, idx+1).filter(function(w){ return weekIsComplete(w); });
  weeks.forEach(function(w){
    var best=-1, winners=[];
    PARTS.forEach(function(p){
      var ws=weekScore(w,p);
      if((ws.correct+ws.wrong)===0) return;   // didn't play
      if(ws.total>best){ best=ws.total; winners=[p]; }
      else if(ws.total===best){ winners.push(p); }
    });
    winners.forEach(function(p){ wins[p]=(wins[p]||0)+1; });
  });
  return wins;
}
function _ordinal(n){
  var s=["th","st","nd","rd"], v=n%100;
  return n+(s[(v-20)%10]||s[v]||s[0]);
}
function _joinNames(arr){
  if(arr.length===1) return arr[0];
  if(arr.length===2) return arr[0]+" & "+arr[1];
  return arr.slice(0,-1).join(", ")+" & "+arr[arr.length-1];
}

// Weekly recap. mode "prose" (default) = narrative paragraph like a commissioner email;
// mode "card" = compact stat card with medals.
function shareWeekRecap(weekId, mode){
  mode = mode || "prose";
  var label=ST.weekLabels[weekId]||weekId;
  var active=activeGames(weekId);
  if(!active.length){ toast("No games this week yet"); return; }

  var scored=PARTS.map(function(p){
    var ws=weekScore(weekId,p);
    return {name:p, total:ws.total, correct:ws.correct, wrong:ws.wrong};
  }).filter(function(r){ return (r.correct+r.wrong)>0; });
  if(!scored.length){ toast("No results yet for "+label); return; }
  scored.sort(function(a,b){ return b.total-a.total; });

  // Group into placement tiers (handles ties).
  var winnerScore=scored[0].total;
  var winners=scored.filter(function(r){return r.total===winnerScore;}).map(function(r){return nameOf(r.name);});
  var secondScore=null, seconds=[];
  for(var i=0;i<scored.length;i++){ if(scored[i].total<winnerScore){ secondScore=scored[i].total; break; } }
  if(secondScore!=null) seconds=scored.filter(function(r){return r.total===secondScore;}).map(function(r){return nameOf(r.name);});
  var lastScore=scored[scored.length-1].total;
  var lasts=scored.filter(function(r){return r.total===lastScore;}).map(function(r){return nameOf(r.name);});

  var winCounts=_weeklyWinCounts(weekId);
  var gutsy=_gutsiestHit(weekId, active);

  var text;
  if(mode==="card"){
    var medals=["🥇","🥈","🥉"];
    var lines=["⚽ "+label+" Recap",""];
    scored.slice(0,3).forEach(function(r,i){
      lines.push(medals[i]+" "+nameOf(r.name)+" — "+r.total+" pts ("+r.correct+"-"+r.wrong+")");
    });
    if(scored.length>3){
      lines.push("");
      lines.push("🥄 Last: "+_joinNames(lasts)+" ("+lastScore+" pts)");
    }
    if(gutsy) lines.push("💪 Boldest call: "+nameOf(gutsy.name)+" — only one on "+gutsy.team);
    lines.push("");
    lines.push("— via Scorecery");
    text=lines.join("\n");
  } else {
    // Narrative prose.
    var parts=[];
    // Winner sentence with win-count context.
    var wc = winCounts[scored[0].name]||1;
    var winnerPhrase;
    if(winners.length>1){
      winnerPhrase=_joinNames(winners)+" tied to win "+label+" with "+winnerScore+" points";
    } else {
      winnerPhrase=winners[0]+" won "+label+" with "+winnerScore+" points"
        + (wc>1 ? " — their "+_ordinal(wc)+" weekly win of the season" : "");
    }
    parts.push(winnerPhrase+".");
    // Second place.
    if(seconds.length){
      parts.push((seconds.length>1?_joinNames(seconds)+" tied for 2nd":seconds[0]+" took 2nd")+" with "+secondScore+".");
    }
    // Last place (wooden spoon) — only if more than a couple players.
    if(scored.length>2 && lastScore<winnerScore){
      parts.push(_joinNames(lasts)+" brought up the rear with "+(lastScore===0?"just ":"a total of ")+lastScore+" point"+(lastScore!==1?"s":"")+" 🥄.");
    }
    // Gutsiest pick as color.
    if(gutsy){
      parts.push("Boldest call of the week: "+nameOf(gutsy.name)+" was the only one to back "+gutsy.team+" in "+gutsy.fixture+" — and it landed.");
    }
    text="⚽ "+label+" Recap\n\n"+parts.join(" ")+"\n\n— via Scorecery";
  }

  if(navigator.share){
    navigator.share({text:text}).catch(function(){});
  } else {
    try{ navigator.clipboard.writeText(text); toast("Recap copied ✓"); }
    catch(e){ toast("Recap ready"); }
  }
}
// Boldest correct call of the week: the right answer that the fewest players had.
// Ties break toward the rarer outcome, then toward a draw (hardest to call).
function _gutsiestHit(weekId, active){
  var games=ST.games[weekId]||{}, results=ST.results[weekId]||{};
  var best=null;
  active.forEach(function(gid){
    var r=results[gid];
    if(!r) return;
    var hits=[], total=0;
    PARTS.forEach(function(p){
      var pk=(((ST.picks[weekId]||{})[p])||{})[gid];
      if(!pk||!pk.side) return;
      total++;
      if(pk.side===r) hits.push(p);
    });
    if(hits.length!==1||total<3) return;   // only interesting if exactly one player nailed it
    var g=games[gid]||{};
    var cand={ name:hits[0], gid:gid, outcome:r, total:total,
               team:(r==="draw"?"the draw":(r==="away"?g.away:g.home)),
               fixture:(g.home||"")+" v "+(g.away||"") };
    if(!best || (r==="draw"&&best.outcome!=="draw") || cand.total>best.total) best=cand;
  });
  return best;
}

function shareMyPicks(weekId){
  var uk=ST.user;
  var picks=((ST.picks[weekId]||{})[uk])||{};
  var games=ST.games[weekId]||{};
  var active=activeGames(weekId);
  var label=ST.weekLabels[weekId]||weekId;
  var lines=["📋 "+x(nameOf(ST.user))+" – "+label+" Picks"];
  // Kickoff order — the natural way to read a matchweek.
  var sorted=active.slice().sort(function(a,b){
    return ((games[a]||{}).kickoffTs||0)-((games[b]||{}).kickoffTs||0);
  });
  sorted.forEach(function(gid){
    var g=games[gid]||{};
    var p=picks[gid]||{};
    if(!p.side) return;
    var fixture=(g.home||"")+" v "+(g.away||"");
    var call=p.side==="draw"?("Draw \u2014 "+fixture):(sideLabel(g,p.side)+" \u2014 "+fixture);
    lines.push("  "+call);
  });
  var unpicked=active.filter(function(gid){ return !picks[gid]||!picks[gid].side; }).length;
  if(unpicked) lines.push("  ⚠ "+unpicked+" unpicked");
  var text=lines.join("\n");
  if(navigator.share){
    navigator.share({text:text}).catch(function(){});
  } else {
    try{ navigator.clipboard.writeText(text); toast("Picks copied to clipboard ✓"); }
    catch(e){ toast(text.substring(0,80)+"…"); }
  }
}
function _updatePickDom(weekId, gid, side){
  var rows=document.querySelectorAll('[data-pick-week="'+weekId+'"][data-pick-gid="'+gid+'"]');
  rows.forEach(function(row){
    var rowSide=row.getAttribute("data-pick-side");
    // Keep the row's own modifiers (draw-row) — only the mypick flag toggles.
    var base="team-pick clickable"+(rowSide==="draw"?" draw-row":"");
    var nm=row.querySelector(".tp-name");
    row.className = (side&&side===rowSide) ? base+" mypick" : base;
    if(nm) nm.style.color="";   // colours come from CSS, not inline overrides
  });
  // Hide the outstanding-selection chip once this match has a pick.
  var need=document.getElementById("need-"+gid);
  if(need) need.style.display = side ? "none" : "";
}

// Update the progress bar's pick count without a full redraw.
function _updateProgressBar(weekId){
  var active=activeGames(weekId), N=active.length;
  var picks=((ST.picks[weekId]||{})[ST.user])||{};
  var made=0;
  active.forEach(function(gid){ if(picks[gid]&&picks[gid].side) made++; });
  var allDone=made===N&&N>0;
  var pickPct=N>0?Math.round(made/N*100):0;
  var bars=document.querySelectorAll("#pick-progress-bar > div");
  if(bars[0]){
    bars[0].style.width=pickPct+'%';
    bars[0].style.background=allDone?'var(--green)':'var(--blue)';
  }
  var info=document.getElementById("pick-progress-info");
  if(info) info.innerHTML='&#9998; '+made+'/'+N+' picks';
}

function renameWeek(weekId, newLabel){
  if(!newLabel||!weekId) return;
  ST.weekLabels[weekId]=newLabel;
  if(DB) DB.ref(BASE+"/meta/weekLabels/"+weekId).set(newLabel, function(){ toast("&#10003; Week renamed"); draw(); });
}
function copyWeekGames(fromWeekId, toWeekId){
  var srcGames=ST.games[fromWeekId]||{};
  var label=ST.weekLabels[fromWeekId]||fromWeekId;
  if(!confirm("Copy game matchups from "+label+" to this week? Existing games will be overwritten.")) return;
  GAME_IDS.forEach(function(gid){
    var g=srcGames[gid]||{};
    // Copy teams but clear results and kickoff
    setGameField(toWeekId,gid,"away",g.away||"");
    setGameField(toWeekId,gid,"home",g.home||"");
    setGameField(toWeekId,gid,"kickoff","");
    if(DB) DB.ref(BASE+"/games/"+toWeekId+"/"+gid+"/kickoffTs").remove();
  });
}
function removeWeek(weekId){
  if(!confirm("Delete \""+(ST.weekLabels[weekId]||weekId)+"\" and all its games, picks, and results?"))return;
  var weekIds=ST.weekIds.filter(function(w){return w!==weekId;});
  ST.weekIds=weekIds;
  delete ST.weekLabels[weekId];
  ST.curWeek=weekIds.length?weekIds[weekIds.length-1]:null;
  if(DB){
    DB.ref(BASE+"/meta/weekIds").set(weekIds);
    DB.ref(BASE+"/meta/weekLabels/"+weekId).remove();
    DB.ref(BASE+"/games/"+weekId).remove();
    DB.ref(BASE+"/results/"+weekId).remove();
    DB.ref(BASE+"/picks/"+weekId).remove();
    DB.ref(BASE+"/locked/"+weekId).remove();
  }
  draw();
  toast("Week removed");
}
function setGameField(weekId,gid,field,value){
  if(!ST.games[weekId])ST.games[weekId]={};
  if(!ST.games[weekId][gid])ST.games[weekId][gid]={away:"",home:"",kickoff:""};
  ST.games[weekId][gid][field]=value;
  if(DB)DB.ref(BASE+"/games/"+weekId+"/"+gid+"/"+field).set(value);
}
function setResult(weekId,gid,val){
  if(!ST.results[weekId])ST.results[weekId]={};
  if(val==="CLEAR"){
    delete ST.results[weekId][gid];
    if(DB)DB.ref(BASE+"/results/"+weekId+"/"+gid).remove();
  } else {
    ST.results[weekId][gid]=val;
    if(DB)DB.ref(BASE+"/results/"+weekId+"/"+gid).set(val);
  }
  draw();
}
function toggleLock(weekId){
  var newVal=!ST.locked[weekId];
  ST.locked[weekId]=newVal;
  if(DB){
    DB.ref(BASE+"/locked/"+weekId).set(newVal);
  }
  draw();
  if(newVal){
    // Finalizing pulls the latest results immediately; the ongoing schedule is game-time
    // driven and already running regardless of finalize state.
    fetchAllResults(weekId);
  }
  // Ensure the schedule is running (it self-gates on game windows).
  startResultSchedule();
}

// Lock/unlock the fixture list for a week. Purely a confirmation guard — it freezes the

}

function fetchAllResults(weekId){
  var range=weekDateRange(weekId);
  var btn=document.getElementById("b-fetch-all-results");
  if(btn){btn.textContent="Fetching\u2026";btn.disabled=true;}
  var url="https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/scoreboard?dates="+range+"&limit=100";
  fetch(url)
    .then(function(r){return r.json();})
    .then(function(data){
      var events=(data&&data.events)||[];
      if(btn){btn.textContent="\u{1F4CA} Fetch All Results";btn.disabled=false;}
      if(!events.length){ toast("No fixtures found in that date range"); return; }
      var games=ST.games[weekId]||{};
      var found=0;
      GAME_IDS.forEach(function(gid){
        var g=games[gid];
        if(!g||!g.away||!g.home) return;
        if((ST.results[weekId]||{})[gid]) return;              // already resolved
        var normAway=normalizeTeamName(g.away), normHome=normalizeTeamName(g.home);
        events.forEach(function(ev){
          if((ST.results[weekId]||{})[gid]) return;            // matched on an earlier pass
          var comp=(ev.competitions||[])[0]||{};
          var state=(comp.status&&comp.status.type&&comp.status.type.state)||"";
          if(state!=="post") return;                           // only full-time results
          var comps=comp.competitors||[];
          var awayC=comps.find(function(c){return c.homeAway==="away";})||{};
          var homeC=comps.find(function(c){return c.homeAway==="home";})||{};
          var eAwayId=String((awayC.team&&awayC.team.id)||"");
          var eHomeId=String((homeC.team&&homeC.team.id)||"");
          var eAwayAbbr=String((awayC.team&&awayC.team.abbreviation)||"").toUpperCase();
          var eHomeAbbr=String((homeC.team&&homeC.team.abbreviation)||"").toUpperCase();
          var an=normalizeTeamName((awayC.team&&(awayC.team.shortDisplayName||awayC.team.displayName))||"");
          var hn=normalizeTeamName((homeC.team&&(homeC.team.shortDisplayName||homeC.team.displayName))||"");
          // Tier 1: ESPN team-id match (unambiguous). Tier 2: abbreviation. Tier 3: exact name.
          var idMatch   = g.awayId && g.homeId && eAwayId && eHomeId && g.awayId===eAwayId && g.homeId===eHomeId;
          var abbrMatch = !idMatch && g.awayAbbrev && g.homeAbbrev && eAwayAbbr && eHomeAbbr &&
                          g.awayAbbrev.toUpperCase()===eAwayAbbr && g.homeAbbrev.toUpperCase()===eHomeAbbr;
          var nameOK    = !idMatch && !abbrMatch && an===normAway && hn===normHome && an.length>=3;
          if(!(idMatch||abbrMatch||nameOK)) return;
          var aScore=parseInt(awayC.score)||0;
          var hScore=parseInt(homeC.score)||0;
          // Win / Draw / Loss at full time. No extra time in league play, so the 90' + stoppage
          // scoreline is the result outright.
          var result = hScore>aScore ? "home" : aScore>hScore ? "away" : "draw";
          setResult(weekId,gid,result);
          setGameField(weekId,gid,"awayScore",aScore);
          setGameField(weekId,gid,"homeScore",hScore);
          found++;
        });
      });
      // Tiebreaker: total goals in the nominated fixture.
      var tb=ST.tiebreaker[weekId]||{};
      if(tb.away&&tb.home&&tb.actual==null){
        var nA=normalizeTeamName(tb.away), nH=normalizeTeamName(tb.home);
        events.forEach(function(ev){
          var comp=(ev.competitions||[])[0]||{};
          if((comp.status&&comp.status.type&&comp.status.type.state)!=="post") return;
          var comps=comp.competitors||[];
          var ac=comps.find(function(c){return c.homeAway==="away";})||{};
          var hc=comps.find(function(c){return c.homeAway==="home";})||{};
          var an=normalizeTeamName((ac.team&&(ac.team.shortDisplayName||ac.team.displayName))||"");
          var hn=normalizeTeamName((hc.team&&(hc.team.shortDisplayName||hc.team.displayName))||"");
          if(an===nA&&hn===nH){
            setTiebreakerField(weekId,"actual",(parseInt(ac.score)||0)+(parseInt(hc.score)||0));
            found++;
          }
        });
      }
      if(found>0){
        var stillMissing=activeGames(weekId).filter(function(gid){ return !(ST.results[weekId]||{})[gid]; });
        if(stillMissing.length) toast("\u2713 Auto-filled "+found+" \u2014 "+stillMissing.length+" still need manual entry");
        else toast("\u2713 Auto-filled "+found+" result"+(found!==1?"s":""));
        draw();
      } else {
        toast("No finished matches found yet \u2014 try again after full time");
      }
    })
    .catch(function(){
      if(btn){btn.textContent="\u{1F4CA} Fetch All Results";btn.disabled=false;}
      toast("Could not reach ESPN");
    });
}

function setGroupPublic(val){

    if(err){toast("Failed to save");return;}
    ST.groupPublic=val;

// ── Renderers ────────────────────────────────────────────
function weekDropdown(curWeek, extraContent){
  var h='<div class="week-select-bar">';
  h+='<select class="week-select-main" id="week-dropdown">';
  // Build visible weeks: admin sees all, players see only open/completed weeks
  var _cur=displayWeekId();
  var showWeeks=ST.admin?ST.weekIds:ST.weekIds.filter(function(w){
    if(ST.locked[w]) return true;
    if(w===_cur) return true;
    var games=ST.games[w]||{};
    return GAME_IDS.some(function(gid){ var g=games[gid]; return g&&g.away&&g.home; });
  });
  showWeeks.forEach(function(w){
    var lbl=ST.weekLabels[w]||w;
    var isCurrent=w===_cur;
    var isLocked=!!ST.locked[w];
    var suffix=isLocked&&isCurrent?" · Current · Locked":isLocked?" · Final":isCurrent?" · Current":"";
    h+='<option value="'+w+'"'+(curWeek===w?" selected":"")+'>'+x(lbl+suffix)+'</option>';
  });
  h+='</select>';
  if(extraContent) h+=extraContent;
  h+='</div>';
  return h;
}
function userSelectScreen(){

function renderGameCard(weekId,gid,g,canPick,viewerPicks,locked,result){
  var pick=viewerPicks[gid]||{};
  var gameLocked=isGameLocked(weekId,gid); // per-match kickoff lock
  var effectiveLocked=locked||gameLocked;
  var effectiveCanPick=canPick&&!gameLocked;
  function logoImg(url){ return url?'<img src="'+url+'" style="width:22px;height:22px;object-fit:contain;border-radius:4px;flex-shrink:0;margin-right:6px" onerror="this.style.display=\'none\'">':""; }
  var h='<div class="game-card">';

  // Header: kickoff, broadcaster, save tick, and points earned once resolved.
  h+='<div class="gc-head"><div class="gc-label">'+x(g.kickoff||"")+(g.tv?' <span style="font-size:8px;font-weight:800;color:var(--blue);background:var(--blue-bg);border-radius:3px;padding:0 4px;margin-left:4px;letter-spacing:.02em">'+x(g.tv)+'</span>':'')+'</div>';
  // Outstanding-selection marker: visible until this match has a pick.
  if(canPick&&!gameLocked&&!result){
    h+='<span class="gc-need" id="need-'+gid+'"'+(pick.side?' style="display:none"':'')+'>PICK</span>';
  }
  h+='<div id="tick-'+gid+'" style="min-width:20px;max-width:20px;overflow:hidden;line-height:1;display:flex;align-items:center;justify-content:center"></div>';
  if(effectiveLocked&&result){
    if(pick.side){
      var won=pick.side===result;
      var earned=1+((result==="draw")?DRAW_BONUS:0);
      h+='<div class="gc-pts'+(won?" earned":"")+'">'+(won?("\u2713 +"+earned):"\u2717")+'</div>';
    } else {
      h+='<div class="gc-pts">\u2013</div>';
    }
  } else if(gameLocked&&!result){
    h+='<div class="gc-pts" style="color:var(--muted)">\u{1F512}</div>';
  }
  h+='</div>';

  // Final score strip once the match is resolved.
  if(result&&(g.homeScore!=null&&g.awayScore!=null)){
    h+='<div style="padding:4px 12px;font-size:10px;font-weight:800;color:var(--muted);background:var(--cream);border-bottom:1px solid var(--border2)">Full time &middot; '+x(g.home)+' '+x(String(g.homeScore))+'\u2013'+x(String(g.awayScore))+' '+x(g.away)+'</div>';
  }

  // Three outcome rows in 1-X-2 order: home win, draw, away win.
  SIDES.forEach(function(side){
    var isDraw=side==="draw";
    var sel=pick.side===side;
    var cls="team-pick"+(isDraw?" draw-row":"");
    if(effectiveLocked&&result){
      if(result===side) cls+=" winner";
      else cls+=" loser";
      if(sel) cls+=" mypick";
    } else if(sel) cls+=" mypick";
    if(effectiveCanPick) cls+=" clickable";
    h+='<div class="'+cls+'" data-pick-week="'+weekId+'" data-pick-gid="'+gid+'" data-pick-side="'+side+'">';
    h+='<div style="display:flex;align-items:center;flex:1;min-width:0">';
    if(isDraw){
      h+='<div class="tp-x">X</div><div class="tp-name">Draw</div>';
    } else {
      var team=(side==="home"?g.home:g.away)||"TBD";
      var logo=(side==="home"?g.homeLogo:g.awayLogo)||"";
      var pos=RANKINGS[normalizeTeamName(team)];
      var posBadge=pos?'<span class="rank-badge" title="League position">'+pos.rank+'</span>':'';
      h+=logoImg(logo)+posBadge+'<div class="tp-name">'+x(team)+'</div>';
    }
    h+='</div>';
    h+='<div class="tp-spread">'+sideMarker(side)+'</div>';
    h+='</div>';
  });

  h+='</div>';
  return h;
}

    if(tb.homeLogo) h+='<img src="'+tb.homeLogo+'" style="width:22px;height:22px;object-fit:contain" onerror="this.style.display=\'none\'">';
    h+='<span style="font-size:12px;font-weight:800">'+x(tb.home)+'</span>';
    h+='</div>';
    h+='<div style="padding:8px 12px;background:var(--cream);border-top:1px solid var(--border2);display:flex;align-items:center;gap:8px">';
    h+='<span style="font-size:9px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em">Total Points</span>';

    } else {
      h+='<input id="tb-guess-input" type="number" min="0" max="200" placeholder="e.g. 47" value="'+x(tbPick)+'" '+(ST.user?'':'disabled')+' style="width:80px;border:2px solid var(--border);border-radius:6px;padding:5px 8px;font-size:13px;font-weight:800;font-family:\'Nunito\',sans-serif;background:#ffffff;box-shadow:2px 2px 0 var(--border)">';

// One-shot backfill of picks for played weeks that have no live listener.
var _histPicksFetched={};
function ensureHistoricPicks(){
  if(!DB) return;
  var need=(ST.weekIds||[]).filter(function(w){
    if(w===ST.curWeek) return false;                                  // live listener owns it
    if(_histPicksFetched[w]) return false;                            // already requested
    if(ST.picks[w]&&Object.keys(ST.picks[w]).length) return false;    // already in memory
    return Object.keys(ST.results[w]||{}).length>0;                   // only weeks actually played
  });
  if(!need.length) return;
  need.forEach(function(w){
    _histPicksFetched[w]=true;   // set before the call so a redraw can't queue it twice
    DB.ref(BASE+"/picks/"+w).once("value").then(function(sn){
      ST.picks[w]=sn.val()||{};
      _weekScoreCache={};        // week totals were computed against empty picks
      scheduleDraw();
    }).catch(function(){ delete _histPicksFetched[w]; });   // let a later draw retry
  });
}

function renderStandings(){
  ensureHistoricPicks();
  var SEASON_WEEKS=ST.weekIds.length||15;
  // Most points a single match can still yield: 1, plus the draw bonus if the
  // admin has enabled one (the best case being a correctly-called draw).
  var MAX_PTS_PER_MATCH=1+(Number(DRAW_BONUS)||0);
  // Matches with no result yet, across the whole season. Weeks whose fixtures
  // haven't been imported are billed at a full matchweek.
  var matchesRemaining=(function(){
    var n=0;
    ST.weekIds.forEach(function(w){
      var act=activeGames(w);
      if(!act.length){ n+=GAME_IDS.length; return; }
      var res=ST.results[w]||{};
      act.forEach(function(gid){ if(!res[gid]) n++; });
    });
    return n;
  })();

  var h='<div class="lb-wrap" style="padding:0">';
  if(ST.weekIds.length===0){h+='<div class="lb-note">No weeks yet.</div></div>';return h;}

  var completedWeeks=ST.weekIds.filter(function(w){return weekIsComplete(w);});
  var curWeekId=displayWeekId();
  var curLocked=!!(curWeekId&&weekIsComplete(curWeekId));
  var weeksPlayed=completedWeeks.length;
  var weeksRemaining=Math.max(0, SEASON_WEEKS - weeksPlayed);

  // Split completed weeks: show last 3, collapse the rest into "History"
  var RECENT_COUNT=3;
  var historyWeeks=completedWeeks.length>RECENT_COUNT?completedWeeks.slice(0,-RECENT_COUNT):[];
  var recentWeeks=completedWeeks.length>RECENT_COUNT?completedWeeks.slice(-RECENT_COUNT):completedWeeks;
  var showHistory=ST._standingsShowHistory||false;
  var visibleWeeks=showHistory?completedWeeks:recentWeeks;

  var rows=PARTS.map(function(p){
    var total=seasonScore(p);
    var weekScores={};
    var seasonCorrect=0, seasonWrong=0;
    ST.weekIds.forEach(function(w){
      var ws=weekScore(w,p);
      weekScores[w]=ws;
      // Live record: count wins/losses from games that have finished (have a result),
      // matching the live points total, not only fully-complete weeks.
      seasonCorrect+=ws.correct; seasonWrong+=ws.wrong;
    });
    // Ceiling = banked so far + everything still to play for.
    var possible=total + (matchesRemaining * MAX_PTS_PER_MATCH);
    // Best/worst week stats
    var bestWk=null, bestPts=-1, worstWk=null, worstPts=999;
    completedWeeks.forEach(function(w){
      var ws=weekScores[w];
      if(ws.total>bestPts){ bestPts=ws.total; bestWk=w; }
      if(ws.total<worstPts){ worstPts=ws.total; worstWk=w; }
    });
    return {name:p,total:total,possible:possible,weekScores:weekScores,bestWk:bestWk,bestPts:bestPts,worstWk:worstWk,worstPts:worstPts,seasonCorrect:seasonCorrect,seasonWrong:seasonWrong};
  });
  rows.sort(function(a,b){return b.total-a.total;});

  // ── Week-to-week rank movement ──
  // Compute each player's rank as of the PREVIOUS completed week (season total through the
  // week before the most recent one), then compare to their current rank for an arrow.
  (function(){
    if(completedWeeks.length < 1) return;                 // need at least one completed week
    // Weeks up to and including the previous completed week.
    var priorWeeks = completedWeeks.slice(0, completedWeeks.length-1);
    // Prior-week totals per player (season points through the previous completed week).
    var priorTotals = PARTS.map(function(p){
      var t=0;
      priorWeeks.forEach(function(w){ t+=weekScore(w,p).total; });
      return {name:p, total:t};
    });
    priorTotals.sort(function(a,b){ return b.total-a.total; });
    var priorRank={};
    priorTotals.forEach(function(r,i){ priorRank[r.name]=i+1; });
    // Attach movement to each current row (positive = moved up).
    rows.forEach(function(r,i){
      var curRank=i+1;
      var pr=priorRank[r.name];
      r._move = (pr==null) ? 0 : (pr - curRank);          // +N = climbed N spots
      r._hasPrior = priorWeeks.length>0;
    });
  })();

  var leaderTotal=rows.length?rows[0].total:0;

  var weekBest={}, weekWorst={};
  completedWeeks.forEach(function(w){
    var scores=PARTS.map(function(p){ return weekScore(w,p).total; });
    weekBest[w]=Math.max.apply(null,scores);
    weekWorst[w]=Math.min.apply(null,scores);
  });

  // Controls row above table
  h+='<div style="display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--cream);border-bottom:1px solid var(--border2)">';
  h+='<div style="font-size:9px;font-weight:700;color:var(--muted);flex:1">'+weeksPlayed+' week'+(weeksPlayed!==1?'s':'')+' played &middot; '+weeksRemaining+' remaining</div>';
  if(completedWeeks.length){
    var _recapWk=completedWeeks[completedWeeks.length-1];
    h+='<button id="b-week-recap" data-wk="'+_recapWk+'" style="font-size:8px;font-weight:800;padding:3px 9px;border-radius:6px;border:1.5px solid var(--gold);background:var(--gold-bg);color:var(--gold-dark);cursor:pointer;font-family:\'Nunito\',sans-serif">&#128241; Recap</button>';
    h+='<button id="b-week-recap-card" data-wk="'+_recapWk+'" style="font-size:8px;font-weight:800;padding:3px 8px;border-radius:6px;border:1.5px solid var(--border2);background:#fff;color:var(--muted);cursor:pointer;font-family:\'Nunito\',sans-serif">&#127942; Card</button>';
  }
  if(historyWeeks.length){
    h+='<button id="b-toggle-history" style="font-size:8px;font-weight:800;padding:3px 9px;border-radius:6px;border:1.5px solid var(--border2);background:#fff;color:var(--muted);cursor:pointer;font-family:\'Nunito\',sans-serif">'+(showHistory?'&#8249; Hide history':'&#128202; History ('+historyWeeks.length+')')+'</button>';
  }
  h+='</div>';

  h+='<div class="gp-wrap"><table class="gp-table"><thead><tr>';
  h+='<th style="position:sticky;left:0;z-index:3;background:var(--cream);width:28px;min-width:28px;text-align:center;font-size:9px;padding:6px 4px;border-right:1px solid var(--border2)">#</th>';
  h+='<th data-sort-name="1" style="position:sticky;left:28px;z-index:3;background:var(--cream);min-width:100px;cursor:pointer;text-align:left;padding:6px 8px;border-right:2px solid var(--border)">Players</th>';
  h+='<th data-sort-total="1" style="cursor:pointer;min-width:44px;text-align:center;font-size:9px">Pts</th>';
  h+='<th data-sort-possible="1" style="cursor:pointer;min-width:48px;text-align:center;font-size:9px;color:var(--blue)">Poss</th>';

  visibleWeeks.forEach(function(w){
    h+='<th data-sort-week="'+w+'" style="cursor:pointer;min-width:58px;text-align:center;font-size:9px">'+x(ST.weekLabels[w]||w)+'</th>';
  });

  if(curWeekId&&!curLocked){
    h+='<th style="min-width:62px;text-align:center;font-size:9px;color:var(--green)">&#9998; '+x(ST.weekLabels[curWeekId]||curWeekId)+'<div style="font-size:7px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em">picks</div></th>';
  }

  h+='</tr></thead><tbody>';

  rows.forEach(function(r,i){
    var rank=i+1;
    var isMe=ST.user&&r.name===ST.user;
    var sortAttrs='data-total="'+r.total+'" data-possible="'+r.possible+'" data-name="'+x(r.name)+'" data-rank="'+rank+'"';
    completedWeeks.forEach(function(w){
      sortAttrs+=' data-week-'+w+'="'+r.weekScores[w].total+'"';
    });

    h+='<tr '+sortAttrs+(isMe?' style="background:var(--gold-bg)"':'')+' data-st-player="'+x(r.name)+'">';

    var rankCol=rank===1?'var(--gold-dark)':rank===2?'#888':rank===3?'#b45309':'var(--muted)';
    // Week-to-week movement arrow (only once there's a prior week to compare against).
    var moveHtml='';
    if(r._hasPrior){
      if(r._move>0)      moveHtml='<div style="font-size:7px;font-weight:900;color:var(--green);line-height:1">&#9650;'+r._move+'</div>';
      else if(r._move<0) moveHtml='<div style="font-size:7px;font-weight:900;color:var(--red2);line-height:1">&#9660;'+Math.abs(r._move)+'</div>';
      else               moveHtml='<div style="font-size:7px;font-weight:800;color:var(--muted);line-height:1">&ndash;</div>';
    }
    h+='<td style="position:sticky;left:0;z-index:2;background:'+(isMe?'var(--gold-bg)':'#ffffff')+';text-align:center;font-size:11px;font-weight:900;color:'+rankCol+';padding:7px 2px;width:28px;min-width:28px;max-width:28px;border-right:1px solid var(--border2)">'+rank+moveHtml+'</td>';

    // Name + best/worst week callout
    var bestLabel=r.bestWk&&completedWeeks.length>1?'<span style="font-size:7px;color:var(--green);font-weight:700"> ▲'+r.bestPts+'</span>':'';
    var worstLabel=r.worstWk&&completedWeeks.length>1&&r.worstWk!==r.bestWk?'<span style="font-size:7px;color:var(--red2);font-weight:700"> ▼'+r.worstPts+'</span>':'';
    h+='<td style="position:sticky;left:28px;z-index:2;background:'+(isMe?'var(--gold-bg)':'#ffffff')+';font-size:12px;font-weight:900;padding:7px 8px;border-right:2px solid var(--border);min-width:100px">'+pem(r.name)+x(nameOf(r.name))+bestLabel+worstLabel+'</td>';

    h+='<td style="text-align:center;padding:7px 6px'+(isMe?';background:var(--gold-bg)':'')+'">';
    h+='<div style="font-size:13px;font-weight:900;color:var(--text)">'+(r.total||'–')+'</div>';
    if(r.seasonCorrect>0||r.seasonWrong>0){
      h+='<div style="font-size:8px;font-weight:700;color:var(--muted)">'+r.seasonCorrect+'-'+r.seasonWrong+'</div>';
    }
    h+='</td>';

    var isEliminated=weeksRemaining>0&&r.possible<leaderTotal&&rank>1;
    h+='<td style="text-align:center;padding:7px 6px">';
    if(isEliminated){
      h+='<div style="font-size:11px;font-weight:900;color:var(--red2)">&#10007; &ndash;</div>';
    } else {
      h+='<div style="font-size:12px;font-weight:900;color:var(--blue)">'+r.possible+'</div>';
    }
    h+='</td>';

    visibleWeeks.forEach(function(w){
      var ws=r.weekScores[w];
      var isBest=ws.total>0&&ws.total===weekBest[w];
      var isWorst=ws.total===weekWorst[w]&&weekBest[w]!==weekWorst[w];
      var col=isBest?'var(--green)':isWorst?'var(--red2)':'var(--text)';
      var bg=isBest?'rgba(93,186,74,.1)':isWorst?'rgba(232,85,85,.1)':'';
      var weight=isBest||isWorst?'900':'700';
      var tbW=ST.tiebreaker[w]||{};
      var tiedForBest=isBest&&PARTS.filter(function(p){return weekScore(w,p).total===weekBest[w];}).length>1;
      var showAsterisk=tiedForBest&&tbW.actual!=null;
      h+='<td style="text-align:center;padding:7px 6px'+(bg?';background:'+bg:'')+'">';
      if(ws.total>0||ws.correct>0||ws.wrong>0){
        h+='<div style="font-size:13px;font-weight:'+weight+';color:'+col+'">'+ws.total+(showAsterisk?'<span style="font-size:9px;color:var(--purple);vertical-align:super">*</span>':'')+'</div>';
        h+='<div style="font-size:8px;font-weight:700;color:var(--muted)">'+ws.correct+'-'+ws.wrong+'</div>';
      } else {
        h+='<span class="gp-nopick">&ndash;</span>';
      }
      h+='</td>';
    });

    if(curWeekId&&!curLocked){
      var active=activeGames(curWeekId);
      var picks=((ST.picks[curWeekId]||{})[r.name])||{};
      var made=0;
      active.forEach(function(gid){var p=picks[gid]||{};if(p.side)made++;});
      var allDone=active.length>0&&made===active.length;
      h+='<td style="text-align:center;padding:7px 6px">';
      if(allDone){
        h+='<div style="font-size:16px">&#10003;</div>';
      } else {
        h+='<div style="font-size:10px;font-weight:800;color:var(--muted)">'+made+'/'+active.length+'</div>';
      }
      h+='</td>';
    }

    h+='</tr>';
  });

  h+='</tbody></table></div>';
  h+='</div>';
  return h;
}

function renderImportResults(weekId){
  if(!ST.importGames||!ST.importGames.length){
    if(ST.importError) return '<div style="font-size:10px;font-weight:700;color:var(--red2);padding:8px 10px">'+x(ST.importError)+'</div>';
    return '';
  }
  var h='';
  var selCount=Object.keys(ST.importSelected).filter(function(k){return ST.importSelected[k];}).length;

  if(ST.importError){
    h+='<div style="font-size:10px;font-weight:700;color:var(--red2);padding:8px 10px 0">'+x(ST.importError)+'</div>';
  }

  h+='<div style="padding:6px 10px;border-top:1px solid var(--border2)">';
  h+='<div style="display:flex;justify-content:space-between;align-items:center">';
  h+='<div style="font-size:9px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em">Every fixture is used</div>';
  h+='<span style="font-size:12px;font-weight:900;color:'+(selCount===10?"var(--green)":"var(--red2)")+'">'+selCount+' / 10 selected</span>';
  h+='</div>';
  h+='<div style="font-size:8.5px;font-weight:700;color:var(--muted);margin-top:2px;line-height:1.3">A Premier League matchweek is exactly 10 fixtures and all 10 are picked, so everything in range is preselected. Press &amp; hold a fixture to make it the tiebreaker (total goals).</div>';
  h+='</div>';

  var curTb=ST.tiebreaker[weekId]||{};
  h+='<div style="border-top:1px solid var(--border2)">';
  ST.importGames.forEach(function(g,origIdx){
    var checked=!!ST.importSelected[origIdx];
    var isTb=curTb.away&&curTb.home&&curTb.away===g.away&&curTb.home===g.home;
    var _wkNow = ST.importWeek || ST.curWeek;
    var _existingNow = ST.games[_wkNow] || {};
    var _alreadyIn = Object.keys(_existingNow).some(function(gid){
      var gm=_existingNow[gid]; return gm&&gm.away&&gm.home&&_gameKey(gm.away,gm.home)===_gameKey(g.away,g.home);
    });
    var homePos=RANKINGS[normalizeTeamName(g.home)];
    var awayPos=RANKINGS[normalizeTeamName(g.away)];
    function posBadge(p){ return p?'<span class="rank-badge sm" title="League position">'+p.rank+'</span>':''; }
    h+='<label data-imp-label="'+origIdx+'" style="display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--border2);cursor:pointer'+(isTb?";background:var(--purple-bg)":_alreadyIn?";background:var(--green-bg)":"")+'">';
    h+='<input type="checkbox" data-imp-idx="'+origIdx+'" '+(checked?"checked":"")+' style="width:16px;height:16px;flex-shrink:0;accent-color:var(--gold)">';
    h+='<div style="flex:1;min-width:0">';
    // Home first — the natural way a fixture is written in football.
    h+='<div style="display:flex;align-items:center;gap:4px;font-size:11px;font-weight:800;flex-wrap:wrap">';
    if(g.homeLogo) h+='<img src="'+g.homeLogo+'" style="width:18px;height:18px;object-fit:contain" onerror="this.style.display=\'none\'">';
    h+=posBadge(homePos)+x(g.home)+'<span style="font-size:9px;font-weight:700;color:var(--muted)">v</span>';
    if(g.awayLogo) h+='<img src="'+g.awayLogo+'" style="width:18px;height:18px;object-fit:contain" onerror="this.style.display=\'none\'">';
    h+=posBadge(awayPos)+x(g.away);
    if(_alreadyIn) h+='<span style="font-size:8px;font-weight:900;color:var(--green);background:var(--green-bg);border:1px solid var(--green);border-radius:3px;padding:0 4px;margin-left:4px">&#10003; IN WEEK</span>';
    if(isTb) h+='<span style="font-size:8px;font-weight:900;color:var(--purple);background:var(--purple-bg);border:1px solid var(--purple);border-radius:3px;padding:0 4px;margin-left:4px">TB</span>';
    h+='</div>';
    var meta=x(g.kickoff);
    if(g.venue) meta+=' &middot; '+x(g.venue);
    h+='<div style="font-size:9px;color:var(--muted)">'+meta+'</div>';
    h+='</div></label>';
  });
  h+='</div>';
  h+='<div style="padding:8px 10px;border-top:1px solid var(--border2)">';
  h+='<button class="btn btn-green" id="b-add-imported" style="width:100%;font-size:11px">Set '+x(ST.weekLabels[weekId]||weekId)+' to these '+selCount+' fixture'+(selCount!==1?'s':'')+'</button>';
  h+='</div>';
  return h;
}
