<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<link rel="apple-touch-icon" sizes="512x512" href="/poolplay-icon.png">
<link rel="icon" type="image/png" href="/poolplay-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>Scorecery – CFB Top 25</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f0e8;--card:#fff;--card2:#fdf8ee;--border:#111;--border2:#ddd;
  --text:#111;--muted:#777;--dim:#aaa;--on-bg:#777;
  --gold:#e8c840;--gold-bg:#fffbe8;--gold-dark:#b89a00;--team-tab:#e8c840;--team-tab-ink:#111;--team-bar:#fff;--bar-sub:#777;
  --green:#5dba4a;--green-dark:#15803d;--green-bg:#edfae8;
  --blue:#5590e8;--blue-bg:#e8f0ff;
  --red:#c0392b;--red2:#e85555;--red-bg:#ffe8e8;
  --purple:#9955e8;--purple-bg:#f5e8ff;
  --cream:#fdf8ee;--accent:#111;--accent-bg:#fffbe8
}
html{background:var(--bg)}
body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;font-size:13px;min-height:100vh;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(48px + env(safe-area-inset-bottom,0px))}
button,input,select{font-family:'Nunito',sans-serif;touch-action:manipulation}
button{cursor:pointer;border:none;outline:none;color:inherit}
a{color:inherit;text-decoration:none}

/* ── Top bar (same shell as Dynasty) ── */
.topbar{background:var(--team-bar,#fff);border-bottom:3px solid var(--border);padding:9px 12px 9px;padding-top:calc(9px + env(safe-area-inset-top,0px));position:sticky;top:0;z-index:50;box-shadow:0 3px 0 var(--border)}
.topbar-top{display:flex;align-items:center;gap:8px;width:100%}
.topbar-center{flex:1;min-width:0;overflow:hidden;text-align:center}
.topbar-row{display:flex;align-items:center;justify-content:flex-end;gap:5px;flex-shrink:0}
.app-name{font-size:14px;font-weight:900;white-space:nowrap;letter-spacing:-.02em;line-height:1.1}
.app-name .scorecery-logo{font-size:14px}
.app-sub{font-size:9px;font-weight:700;color:var(--bar-sub,var(--muted));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase;letter-spacing:.05em;margin-top:4px;display:block}
.tag{background:var(--cream);border:2px solid var(--border);border-radius:20px;padding:3px 9px;font-size:9px;font-weight:800;box-shadow:2px 2px 0 var(--border);white-space:nowrap}
.hub-btn{flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#fff;border:2px solid var(--border);border-radius:8px;box-shadow:2px 2px 0 var(--border);padding:0 9px;height:34px;gap:3px;line-height:1;font-size:11px;font-weight:900;color:#111}
.hub-btn .hub-arrow{color:var(--muted)}
.rib-btn{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;flex-shrink:0;background:#fff;border:2px solid var(--border);border-radius:8px;box-shadow:1.5px 1.5px 0 var(--border);padding:0 3px;height:34px;cursor:pointer;line-height:1;color:var(--text);min-width:36px}
.rib-btn .rib-ico{font-size:13px;line-height:1}
.rib-btn .rib-lbl{font-size:6px;font-weight:900;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap}
.rib-btn.on{background:var(--team-tab,var(--gold));color:var(--team-tab-ink,var(--text))}
.rib-btn:active{transform:translate(2px,2px);box-shadow:none}
.menu-wrap{position:relative}
.menu-sheet{position:absolute;top:40px;right:0;z-index:60;min-width:196px;background:#fff;border:2.5px solid var(--border);border-radius:12px;box-shadow:4px 5px 0 var(--border);overflow:hidden}
.menu-item{display:flex;align-items:center;gap:9px;width:100%;padding:10px 12px;background:#fff;border:none;border-bottom:1.5px solid var(--border2);font-size:12px;font-weight:800;color:var(--text);text-align:left;cursor:pointer}
.menu-item:last-child{border-bottom:none}
.menu-item:active{background:var(--gold-bg)}
.menu-item .mi-ico{font-size:15px;width:20px;text-align:center;flex:none}
.menu-item.danger{color:var(--red2)}
.menu-scrim{position:fixed;inset:0;z-index:55}
.scorecery-logo{font-weight:900;color:#fff;text-transform:uppercase;letter-spacing:.05em;-webkit-text-stroke:3px #111;text-shadow:1px 1px 0 #111,2px 2px 0 #111,3px 3px 0 var(--logo-1,#c9082a),4px 4px 0 var(--logo-2,#17408b),5px 5px 0 var(--logo-3,#0d2a5c);paint-order:stroke fill}

.btn{border-radius:9px;padding:9px 12px;font-size:11px;font-weight:900;border:2px solid var(--border);box-shadow:2px 2px 0 var(--border);transition:transform .1s,box-shadow .1s;display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1.1}
.btn:active{transform:translate(2px,2px);box-shadow:none}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn-ghost{background:#fff;color:var(--text)}
.btn-gold{background:var(--gold);color:#111}
.btn-blue{background:var(--blue-bg);color:#1d4ed8}
.btn-red{background:var(--red-bg);color:var(--red)}
.btn-dark{background:#111;color:#fff}

#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(40px);background:#fff;border:2px solid var(--border);border-radius:10px;padding:7px 16px;font-size:10px;font-weight:800;z-index:9999;opacity:0;transition:all .2s;pointer-events:none;white-space:nowrap;box-shadow:3px 3px 0 var(--border)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.wrap{padding:14px;max-width:560px;margin:0 auto}
.hero{background:#fff;border:2px solid var(--border);border-radius:14px;padding:14px;box-shadow:5px 5px 0 var(--border);margin-bottom:14px}
.hero-top{display:flex;align-items:center;gap:10px}
.hero h1{font-size:20px;font-weight:900;line-height:1.1}
.hero p{font-size:11px;font-weight:700;color:var(--muted);line-height:1.5;margin-top:3px}
.hero-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.poll-line{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:10px;font-weight:800;color:var(--muted)}
.poll-dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
.poll-dot.ok{background:var(--green)} .poll-dot.bad{background:var(--red2)} .poll-dot.busy{background:var(--gold);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}

.banner{background:var(--gold-bg);border:2px solid var(--border);border-radius:12px;padding:11px 12px;box-shadow:3px 3px 0 var(--border);margin-bottom:12px}
.banner b{font-size:12px;font-weight:900;display:block}
.banner span{font-size:10px;font-weight:700;color:var(--muted);display:block;margin-top:2px}
.banner .row-btns{display:flex;gap:7px;margin-top:9px}

.cmp{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px}
.cmp-cell{background:#fff;border:2px solid var(--border);border-radius:11px;padding:8px 8px 7px;box-shadow:2px 2px 0 var(--border);min-width:0}
.cmp-num{font-size:17px;font-weight:900;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmp-lbl{font-size:8px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.cmp-sub{font-size:9.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}

.sec-title{font-size:11px;font-weight:900;color:var(--on-bg,#777);letter-spacing:.1em;text-transform:uppercase;margin:0 2px 8px;display:flex;align-items:center;gap:8px}
.sec-title .hint{margin-left:auto;font-size:9px;letter-spacing:0;text-transform:none;font-weight:800}

/* ── Ballot rows ── */
#ballot{position:relative;display:flex;flex-direction:column;gap:6px}
.row{position:relative;display:flex;align-items:center;gap:8px;height:56px;background:#fff;border:2px solid var(--border);border-radius:12px;box-shadow:2px 2px 0 var(--border);padding:0 4px 0 0;overflow:hidden;transition:transform .16s ease;will-change:transform}
.row.dragging{transition:none;z-index:20;box-shadow:6px 8px 0 var(--border);cursor:grabbing}
body.is-dragging{user-select:none;-webkit-user-select:none}
body.is-dragging .row:not(.dragging){opacity:.92}
.rk{flex:none;width:38px;align-self:stretch;display:flex;align-items:center;justify-content:center;background:#111;color:#fff;font-size:17px;font-weight:900;border-right:2px solid var(--border)}
.stripe{flex:none;width:5px;align-self:stretch;margin-left:-8px;background:var(--tc,#ddd)}
.logo-box{flex:none;width:38px;height:38px;border-radius:9px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}
.logo-box img{width:34px;height:34px;object-fit:contain;display:block}
.mono{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;font-size:10px;font-weight:900;color:#fff;letter-spacing:-.02em}
.tm{flex:1;min-width:0;cursor:pointer;padding:6px 0;background:none;text-align:left}
.tm-name{font-size:14px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.15}
.tm-sub{font-size:9.5px;font-weight:800;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.mv{flex:none;min-width:34px;text-align:center;font-size:10px;font-weight:900;border-radius:20px;padding:3px 6px;border:1.5px solid var(--border);background:#fff}
.mv.up{color:var(--green-dark);background:var(--green-bg)}
.mv.dn{color:var(--red);background:var(--red-bg)}
.mv.eq{color:var(--muted)}
.mv.nr{color:var(--gold-dark);background:var(--gold-bg)}
.arrows{flex:none;display:flex;flex-direction:column;gap:2px}
.arrows button{width:26px;height:21px;border-radius:6px;background:var(--cream);border:1.5px solid var(--border);font-size:9px;font-weight:900;line-height:1;display:flex;align-items:center;justify-content:center}
.arrows button:active{background:var(--gold)}
.arrows button[disabled]{opacity:.25}
.handle{flex:none;width:30px;align-self:stretch;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--muted);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.row.empty{background:transparent;border-style:dashed;box-shadow:none}
.row.empty .rk{background:#fff;color:var(--dim)}
.add-slot{flex:1;height:100%;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:900;color:var(--muted);background:none;text-align:left;padding-left:4px}
.add-slot .plus{width:26px;height:26px;border-radius:50%;border:2px dashed var(--muted);display:flex;align-items:center;justify-content:center;font-size:15px}

.foot{margin-top:16px;text-align:center;font-size:9.5px;font-weight:800;color:var(--muted);line-height:1.7}
.foot .save-ok{color:var(--green-dark)} .foot .save-bad{color:var(--red)}
.linkish{background:none;text-decoration:underline;font-weight:900;font-size:inherit;color:inherit}

/* ── Sheets (bottom sheet on phones) ── */
.sh-back{position:fixed;inset:0;z-index:9000;background:rgba(0,0,0,.38)}
.sheet{position:fixed;z-index:9001;left:50%;bottom:0;transform:translateX(-50%);width:min(520px,100vw);max-height:88vh;background:#fff;border:3px solid var(--border);border-bottom:none;border-radius:18px 18px 0 0;box-shadow:0 -4px 0 var(--border);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sh-head{padding:14px 16px 8px;display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--border2)}
.sh-title{font-size:15px;font-weight:900;flex:1;min-width:0}
.sh-title small{display:block;font-size:9px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:1px}
.sh-x{font-size:17px;font-weight:900;color:var(--muted);background:none;padding:2px 6px}
.sh-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 16px 16px}
.sh-search{width:100%;padding:10px 12px;font-size:14px;font-weight:800;border:2px solid var(--border);border-radius:10px;background:var(--cream);margin-bottom:10px}
.pk-sec{font-size:9px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:6px 2px 6px}
.pk-item{display:flex;align-items:center;gap:10px;width:100%;padding:7px 8px;border:2px solid var(--border2);border-radius:10px;background:#fff;margin-bottom:5px;text-align:left}
.pk-item:active{background:var(--gold-bg)}
.pk-item .pk-name{flex:1;min-width:0;font-size:13px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk-item .pk-name small{display:block;font-size:9px;font-weight:800;color:var(--muted)}
.pk-chip{flex:none;font-size:9px;font-weight:900;padding:3px 7px;border-radius:20px;border:1.5px solid var(--border);background:#fff}
.pk-chip.on{background:var(--gold);}
.pk-empty{text-align:center;padding:18px;font-size:11px;font-weight:800;color:var(--muted)}
.rank-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:6px 0 14px}
.rank-grid button{height:38px;border-radius:9px;border:2px solid var(--border);background:#fff;font-size:14px;font-weight:900;box-shadow:2px 2px 0 var(--border)}
.rank-grid button.cur{background:#111;color:#fff}
.rank-grid button:active{transform:translate(2px,2px);box-shadow:none}
.sh-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.share-prev{display:block;width:100%;border:2px solid var(--border);border-radius:12px;box-shadow:3px 3px 0 var(--border);background:var(--cream);min-height:200px}
.share-busy{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:260px;font-size:11px;font-weight:800;color:var(--muted)}
.sh-note{font-size:9.5px;font-weight:700;color:var(--muted);text-align:center;margin-top:8px;line-height:1.5}

/* profile */
.pf-sec{font-size:8.5px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:12px 0 5px;display:flex;align-items:baseline;gap:6px}
.pf-sec span{font-size:7.5px;font-weight:700;text-transform:none;letter-spacing:0;opacity:.75}
.pf-input{width:100%;padding:8px 10px;font-size:13px;font-weight:700;border:2px solid var(--border);border-radius:9px;background:var(--card2);color:var(--text)}
.pf-badges{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;max-height:172px;overflow-y:auto;padding:2px}
.pf-badge{font-size:19px;line-height:1;padding:7px 0;border:2px solid var(--border);border-radius:9px;background:var(--card2);cursor:pointer}
.pf-badge.on{box-shadow:0 0 0 2.5px var(--border)}
.pf-empty{padding:12px 10px;font-size:10px;font-weight:700;color:var(--muted);text-align:center}
.pf-eras{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pf-era{padding:8px 4px;border:2px solid var(--border);border-radius:9px;background:#fff;font-size:11px;font-weight:900;line-height:1.2}
.pf-era span{display:block;font-size:8px;font-weight:700;color:var(--muted)}
.pf-era.sel{background:var(--gold)}
.pf-teams{max-height:220px;overflow-y:auto;border:2px solid var(--border2);border-radius:10px}
.pf-team{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;background:#fff;border-bottom:1px solid var(--border2);font-size:12px;font-weight:800;text-align:left}
.pf-team .sw{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--border);flex:none}
.pf-team.sel{background:var(--gold-bg)}

.boot-wrap{display:flex;align-items:center;justify-content:center;min-height:60vh}
.boot-dots{display:flex;gap:7px}
.boot-dots span{width:9px;height:9px;border-radius:50%;background:var(--muted,#999);opacity:.5;animation:bootPulse 1.1s ease-in-out infinite}
.boot-dots span:nth-child(2){animation-delay:.15s}
.boot-dots span:nth-child(3){animation-delay:.3s}
@keyframes bootPulse{0%,80%,100%{opacity:.25;transform:scale(.85)}40%{opacity:1;transform:scale(1)}}
/* ── Tabs, weekly save, compare toggle ── */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:0;background:#fff;border:2px solid var(--border);border-radius:12px;box-shadow:3px 3px 0 var(--border);overflow:hidden;margin-bottom:14px}
.tab{padding:10px 8px;font-size:12px;font-weight:900;background:#fff;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.tab+.tab{border-left:2px solid var(--border)}
.tab.on{background:var(--team-tab,var(--gold));color:var(--team-tab-ink,#111)}
.tab .cnt{background:#111;color:#fff;font-size:9px;border-radius:10px;padding:1px 6px}
.save-row{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:2px dashed var(--border2);flex-wrap:wrap}
.save-row .btn{margin-left:auto}
.sv{font-size:10.5px;font-weight:800;color:var(--muted);flex:1;min-width:140px}
.sv.ok{color:var(--green-dark)} .sv.warn{color:var(--gold-dark)}
.banner.edit{background:#fff;border-color:var(--border);border-width:2.5px;box-shadow:4px 4px 0 var(--gold-dark)}
.seg{display:flex;background:#fff;border:2px solid var(--border);border-radius:10px;padding:3px;gap:3px;margin-bottom:10px;box-shadow:2px 2px 0 var(--border)}
.seg button{flex:1;padding:7px 6px;font-size:11px;font-weight:900;border-radius:7px;background:transparent;color:var(--muted)}
.seg button.on{background:#111;color:#fff}
.hint-card{background:var(--cream);border:2px dashed var(--border2);border-radius:11px;padding:10px 12px;font-size:10.5px;font-weight:700;color:var(--muted);line-height:1.5;margin-bottom:12px}
.cmp-note{font-size:9.5px;font-weight:800;color:var(--muted);margin:-6px 2px 12px;text-align:right}
.cmp4{grid-template-columns:1fr 1fr}

/* ── Season ── */
.card{background:#fff;border:2px solid var(--border);border-radius:14px;box-shadow:4px 4px 0 var(--border);padding:12px;margin-bottom:14px}
.card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.card-head b{font-size:14px;font-weight:900;flex:1}
.mini-tog{font-size:10px;font-weight:900;padding:4px 9px;border-radius:20px;border:2px solid var(--border);background:#fff;color:var(--muted)}
.mini-tog.on{background:var(--gold);color:#111}
.chart-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px}
.chart{display:block}
.chart .gl{stroke:#e6e0d4;stroke-width:1}
.chart .gl.nr{stroke-dasharray:3 4;stroke:#ccc}
.chart .ax{font:800 10px Nunito,sans-serif;fill:#999}
.chart .ax.wk{fill:#555;font-size:10.5px}
.chart .lbl{font:900 11px Nunito,sans-serif;paint-order:stroke;stroke:#fff;stroke-width:3px}
.legend{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.lg-chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:900;padding:4px 8px;border:1.5px solid var(--border);border-radius:20px;background:#fff}
.lg-x{color:var(--muted);font-size:9px;margin-left:2px}
.lg-empty{font-size:10.5px;font-weight:800;color:var(--muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none;border:1.5px solid #fff;box-shadow:0 0 0 1px #111}
.card-foot{font-size:9px;font-weight:800;color:var(--muted);margin-top:7px}
.wk-strip{display:flex;gap:6px;overflow-x:auto;padding:0 2px 8px;margin-bottom:8px;-webkit-overflow-scrolling:touch}
.wk-strip::-webkit-scrollbar{display:none}
.wk-chip{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:58px;padding:7px 8px;border:2px solid var(--border);border-radius:10px;background:#fff;box-shadow:2px 2px 0 var(--border)}
.wk-chip b{font-size:12px;font-weight:900}
.wk-chip.on{background:var(--gold)}
.wk-chip:active{transform:translate(2px,2px);box-shadow:none}
.wk-one{display:flex;align-items:center;gap:3px;font-size:9px;font-weight:900;color:var(--muted)}
.logo-mini{flex:none;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center}
.logo-mini img{width:18px;height:18px;object-fit:contain}
.logo-mini .mono{width:18px;height:18px;font-size:6px}
.grid-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;background:#fff;border:2px solid var(--border);border-radius:12px;box-shadow:3px 3px 0 var(--border);margin-bottom:6px}
table.trk{border-collapse:separate;border-spacing:0;font-size:11px;font-weight:900;min-width:100%}
table.trk th{position:sticky;top:0;background:#111;color:#fff;font-size:9.5px;padding:6px 4px;text-align:center;white-space:nowrap}
table.trk th.stk{text-align:left;padding-left:8px;left:0;z-index:2}
table.trk td{padding:0;height:30px;border-bottom:1px solid #eee}
table.trk td.stk{position:sticky;left:0;background:#fff;z-index:1;padding:0 8px;white-space:nowrap;border-right:2px solid var(--border);max-width:150px}
table.trk td.stk .stk-in{display:flex;align-items:center;gap:5px;height:30px}
table.trk td.stk .tn{overflow:hidden;text-overflow:ellipsis;max-width:108px}
table.trk tr{cursor:pointer}
table.trk tr.sel td.stk{background:var(--gold-bg)}
table.trk td.c{text-align:center;min-width:34px;position:relative}
table.trk td.c.nr{color:#ccc}
table.trk td.c i{position:absolute;top:3px;right:3px;width:0;height:0;border-left:3px solid transparent;border-right:3px solid transparent}
table.trk td.c i.u{border-bottom:5px solid var(--green-dark)}
table.trk td.c i.d{border-top:5px solid var(--red)}
.path{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px}
.path-c{display:flex;flex-direction:column;align-items:center;min-width:36px;padding:4px 5px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-weight:900;background:var(--gold-bg)}
.path-c small{font-size:8px;color:var(--muted)}
.path-c.nr{background:#fff;color:var(--dim)}
.sh-actions.three{grid-template-columns:1fr 1fr 1fr}
.wk-list{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.wk-row{display:flex;align-items:center;gap:8px;padding:5px 8px 5px 0;border:1.5px solid var(--border);border-left:5px solid var(--tc,#ddd);border-radius:8px;background:#fff}
.wk-row.empty{border-left-color:#ddd;border-style:dashed;color:var(--dim)}
.wk-rk{width:26px;text-align:right;font-size:13px;font-weight:900}
.wk-nm{flex:1;min-width:0;font-size:12.5px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk-pick{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.wk-pick button{position:relative;height:40px;border-radius:9px;border:2px solid var(--border);background:#fff;font-size:12px;font-weight:900;box-shadow:2px 2px 0 var(--border)}
.wk-pick button.has{background:var(--green-bg)}
.wk-pick button.cur{background:var(--gold)}
.wk-pick button i{position:absolute;top:1px;right:4px;font-size:9px;font-style:normal;color:var(--green-dark)}
.wk-pick button:active{transform:translate(2px,2px);box-shadow:none}
/* ── Committee ── */
.tab{font-size:11.5px;padding:10px 4px}
.c-chip{flex:none;padding:8px 12px;border:2px solid var(--border);border-radius:20px;background:#fff;font-size:11.5px;font-weight:900;box-shadow:2px 2px 0 var(--border);white-space:nowrap}
.c-chip.on{background:#111;color:#fff}
.c-chip.add{padding:8px 13px}
.c-head h1{font-size:18px}
.code{font-family:ui-monospace,Menlo,monospace;letter-spacing:.08em;color:var(--text)}
.how{display:flex;flex-direction:column;gap:5px;margin-top:10px;background:var(--cream);border:2px dashed var(--border2);border-radius:10px;padding:9px 11px}
.how div{font-size:10.5px;font-weight:800;color:#555;line-height:1.4;padding-left:14px;position:relative}
.how div:before{content:"\2022";position:absolute;left:3px;color:var(--gold-dark)}
.c-status{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fff;border:2px solid var(--border);border-radius:11px;padding:9px 11px;margin-bottom:10px;font-size:11px;font-weight:800;color:var(--muted);box-shadow:2px 2px 0 var(--border)}
.c-status span{flex:1;min-width:150px}
.c-status.ok{color:var(--green-dark);background:var(--green-bg)}
.c-status .warn{color:var(--gold-dark)}
.mems{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.mem{display:inline-flex;align-items:center;gap:4px;padding:4px 8px 4px 5px;border:1.5px solid var(--border2);border-radius:20px;background:#fff;font-size:10.5px;font-weight:900;color:var(--muted)}
.mem.in{border-color:var(--border);color:var(--text)}
.mem[disabled]{opacity:.75}
.mem-em{font-size:13px}
.mem-st{font-size:10px}
.mem.in .mem-st{color:var(--green-dark)}
.lock{text-align:center;background:#fff;border:2px solid var(--border);border-radius:14px;padding:18px 14px;box-shadow:4px 4px 0 var(--border);display:flex;flex-direction:column;gap:4px;align-items:center}
.lock b{font-size:14px;font-weight:900}
.lock span{font-size:11px;font-weight:700;color:var(--muted);line-height:1.5;max-width:300px}
.c-share{width:100%;margin-bottom:6px}
.clist{display:flex;flex-direction:column;gap:6px}
.crow{display:flex;align-items:center;gap:8px;height:56px;background:#fff;border:2px solid var(--border);border-radius:12px;box-shadow:2px 2px 0 var(--border);padding:0 8px 0 0;overflow:hidden;text-align:left;width:100%}
.crow:active{transform:translate(2px,2px);box-shadow:none}
.crow .rk{flex:none;width:38px;align-self:stretch;display:flex;align-items:center;justify-content:center;background:#111;color:#fff;font-size:17px;font-weight:900;border-right:2px solid var(--border)}
.crow .rk small{font-size:10px;margin-right:1px}
.crow .tm{display:flex;flex-direction:column;padding:0}
.you{flex:none;font-size:9.5px;font-weight:900;color:var(--muted);background:var(--cream);border:1.5px solid var(--border2);border-radius:20px;padding:3px 6px;white-space:nowrap}
.you.nr{color:var(--dim)}
.others{font-size:10.5px;font-weight:700;color:var(--muted);line-height:1.6;margin-top:12px;padding:0 2px}
.others b{color:var(--text)}
.or{display:flex;align-items:center;gap:8px;margin:14px 0 10px;color:var(--dim);font-size:10px;font-weight:900;text-transform:uppercase}
.or:before,.or:after{content:"";flex:1;height:2px;background:var(--border2)}
.code-in{text-transform:uppercase;letter-spacing:.15em;font-family:ui-monospace,Menlo,monospace;font-size:18px;text-align:center}
.big-code{font-family:ui-monospace,Menlo,monospace;font-size:34px;font-weight:900;letter-spacing:.18em;text-align:center;padding:12px;border:2.5px dashed var(--border);border-radius:14px;background:var(--gold-bg)}
.inv-link{font-size:10.5px;font-weight:700;color:var(--muted);text-align:center;margin-top:6px;word-break:break-all}
.pk-chip.kick{background:var(--red-bg);color:var(--red);cursor:pointer}
@media(max-width:374px){.tab{font-size:10.5px}.you{display:none}}
@media(max-width:480px){.sub-pre{display:none}}
@media(max-width:420px){.hub-btn .hub-word{display:none}.hub-btn{padding:0;width:34px}.hub-btn .hub-arrow{color:#111;font-size:15px}}
@media(max-width:374px){.rib-btn .rib-lbl{display:none}.rib-btn{min-width:32px}.rib-btn .rib-ico{font-size:15px}.app-name .scorecery-logo{font-size:12.5px}}
@media(max-width:360px){.arrows{display:none}.tm-name{font-size:13px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.001ms !important;animation-duration:.001ms !important}}
</style>

function loadLogoIndex(era){
  if(era==="espn") return;

  try{
    var raw=localStorage.getItem("logoidx_"+era);
    if(raw){ var c=JSON.parse(raw); if(c&&c.ts&&(Date.now()-c.ts)<30*60*1000&&c.map){ _logoIndex[era]=c.map; _logoIndexState[era]="done"; return; } }
  }catch(e){}

    .then(function(r){ return r.ok?r.json():Promise.reject(); })

  }).filter(function(r){ return r.team && r.team.name; }).sort(function(a,b){ return (b.pts||0)-(a.pts||0); });
  return {season:season, week:slot.label, key:slot.key, n:slot.n, headline:ap.headline||("AP Top 25 · "+slot.label), ranks:ranks, others:others, fetchedAt:Date.now()};
}
function loadAP(opts){

function tagCurrentWeek(){

function fillFromAP(quiet){

function loadTeams(){

  }catch(e){}

    .then(function(r){ if(!r.ok) throw 0; return r.json(); })

// ── Team records ───────────────────────────────────────────
// The AP poll only carries real records for the 25 ranked teams — its "receiving
// votes" list reports everyone as 0-0. So every FBS team's overall record comes
// from ESPN's standings, one request for the whole division, cached for 3 hours.
var RECS={byId:{}, byKey:{}, ts:0}, _recsState="idle";
function loadRecords(force){
  if(_recsState==="loading") return;
  if(!force){
    try{ var c=JSON.parse(localStorage.getItem("t25_recs")||"null"); if(c && c.ts && Date.now()-c.ts<3*3600e3 && c.byId){ RECS=c; _recsState="done"; return; } }catch(e){}
  }
  _recsState="loading";
  fetch("https://site.api.espn.com/apis/v2/sports/football/college-football/standings?group=80", {cache:"no-store"})
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(d){
      var byId={}, byKey={}, n=0;
      (function walk(node){
        if(!node) return;
        (node.children||[]).forEach(walk);
        ((node.standings&&node.standings.entries)||[]).forEach(function(en){
          var t=en.team||{}, stats=en.stats||[], o=null;
          for(var i=0;i<stats.length;i++) if(stats[i].name==="overall"){ o=stats[i]; break; }
          if(!o) for(var j=0;j<stats.length;j++) if(stats[j].type==="total"){ o=stats[j]; break; }
          var rec=o&&(o.summary||o.displayValue);
          if(!rec || !/^\d+-\d+/.test(rec)) return;
          if(t.id) byId[String(t.id)]=rec;
          var k=logoKey(t.location||t.shortDisplayName||t.displayName); if(k) byKey[k]=rec;
          n++;
        });
      })(d);
      if(!n) throw 0;
      RECS={byId:byId, byKey:byKey, ts:Date.now()}; _recsState="done";
      try{ localStorage.setItem("t25_recs", JSON.stringify(RECS)); }catch(e){}
      draw(); refreshPicker();
    })
    .catch(function(){ _recsState="failed"; });
}
function liveRecord(t){ return t ? ((t.id && RECS.byId[String(t.id)]) || RECS.byKey[logoKey(t.name)] || "") : ""; }
// Record to show for a team. live=true for the ballot you're working on (today's
// record); false for a saved week (the record as of that week).
function recordFor(t, ap, live){
  if(!t) return "";
  if(live){ var r=liveRecord(t); if(r) return r; }
  var e=apEntry(t, ap===undefined?null:ap);
  if(e && e.rank && e.rec) return e.rec;
  if(t.rec) return t.rec;                                   // saved with that week
  if(e && e.rec && e.rec!=="0-0") return e.rec;             // never trust the 0-0 placeholder
  return "";
}
// Slots for a saved week, with each team's record frozen as of saving.
function weekSlots(b, ap, live){
  var s=slotsOf(b);
  b.forEach(function(t,i){ if(!t) return; var rc=recordFor(t, ap, live); if(rc) s["r"+(i+1)].rec=rc; });
  return s;
}

// ── Comparisons (vs the AP poll, or vs your own previous week) ─
// A context says what a ballot is measured against. The current ballot uses the
// live poll; a saved week uses the poll that was saved with it.
function ctxFor(weekKey, ap, mode){
  mode=mode||ST.cmp;
  if(mode==="last") return {mode:"last", prev:prevWeek(weekKey)};
  return {mode:"ap", ap:ap};
}
// The AP poll the ballot on screen belongs to: the saved one when editing a past
// week, otherwise the poll for the ballot's week (normally the live one).
function curAP(){
  if(ST.edit) return ST.edit.ap||null;
  var k=ST.meta&&ST.meta.weekKey;
  if(ST.ap && (!k || ST.ap.key===k)) return ST.ap;
  return (k?apForKey(k):null) || ST.ap;
}
function curCtx(){ return ctxFor(ST.edit?ST.edit.key:(ST.meta&&ST.meta.weekKey), curAP()); }
function apEntry(t, ap){
  ap = ap===undefined ? ST.ap : ap;
  if(!ap||!t) return null;
  var all=ap.ranks.concat(ap.others||[]);
  for(var i=0;i<all.length;i++) if(sameTeam(all[i].team,t)) return all[i];
  return null;
}
function moveInfo(t, myRank, ctx){
  ctx=ctx||curCtx();
  var ref;
  if(ctx.mode==="last"){
    if(!ctx.prev) return null;
    ref=rankIn(slotsToBallot(ctx.prev.slots), t);
    if(!ref) return {cls:"nr", txt:"NEW", d:null};
  } else {
    if(!ctx.ap) return null;
    var e=apEntry(t, ctx.ap); ref=e&&e.rank?e.rank:0;
    if(!ref) return {cls:"nr", txt:"NR", d:null};
  }
  var d=ref-myRank;
  if(d>0) return {cls:"up", txt:"▲"+d, d:d};
  if(d<0) return {cls:"dn", txt:"▼"+(-d), d:d};
  return {cls:"eq", txt:"=", d:0};
}
function ctxName(ctx){
  if(ctx.mode==="last") return ctx.prev ? ("your "+ctx.prev.label) : "";
  return ctx.ap ? ("AP "+(ctx.ap.week||"")) : "";
}
function ballotStats(b, ctx){
  b=b||ST.ballot; ctx=ctx||curCtx();
  var s={filled:0, match:0, rise:null, drop:null, nr:[]};
  b.forEach(function(t,i){
    if(!t) return; s.filled++;
    var m=moveInfo(t,i+1,ctx); if(!m) return;
    if(m.cls==="nr"){ s.nr.push(t); return; }
    s.match++;
    if(m.d>0 && (!s.rise||m.d>s.rise.d)) s.rise={t:t,d:m.d};
    if(m.d<0 && (!s.drop||m.d<s.drop.d)) s.drop={t:t,d:m.d};
  });
  return s;
}

// ── Ballot edits ───────────────────────────────────────────
function moveSlot(from,to){
  if(from===to||from<0||to<0||from>=N||to>=N) return;
  var t=ST.ballot.splice(from,1)[0];
  ST.ballot.splice(to,0,t);
  changed();
}
function placeTeam(slot, team){
  team=compactTeam(team);
  var j=-1; ST.ballot.forEach(function(b,i){ if(sameTeam(b,team)) j=i; });
  if(j===slot){ closeSheet(); return; }
  if(j>=0){ ST.ballot[j]=ST.ballot[slot]; ST.ballot[slot]=team; toast("Swapped into #"+(slot+1)); }
  else ST.ballot[slot]=team;
  closeSheet(); changed();
}
function removeSlot(i){ ST.ballot[i]=null; closeSheet(); changed(); }
function clearBallot(){
  if(!confirm("Clear this ballot?")) return;
  ST.ballot=emptyBallot(); changed();
}

// ── Saving ─────────────────────────────────────────────────
// Layout at pools/top25/<uid>:
//   slots, season, week, weekKey, updatedAt, ap   ← the ballot you're working on
//   stats                                         ← summary the Hub reads for badges
//   weeks/<season>_<nn>                           ← each saved weekly ballot
// The current ballot is written with update(), never set(), so autosaves can't wipe weeks.
var _saveT=null, _saveSeq=0;
function rootBallot(){ return ST.edit ? ST.cur.ballot : ST.ballot; }
function rootMeta(){ return ST.edit ? ST.cur.meta : ST.meta; }
function changed(){
  if(ST.edit){ ST.editDirty=true; draw(); return; }   // a past week only saves when you press Save
  ST.meta=ST.meta||{};
  ST.meta.updatedAt=Date.now();
  if(ST.ap && !ST.ap.stale && !ST.meta.weekKey) tagCurrentWeek();
  ST.hadSave=true;
  writeLocal();
  clearTimeout(_saveT); _saveT=setTimeout(persist, 700);
  draw();
}
function clean(o){ return JSON.parse(JSON.stringify(o, function(k,v){ return (typeof v==="number"&&!isFinite(v))?null:v; })); }
function hubStats(){
  var b=rootBallot(), st=ballotStats(b, {mode:"ap", ap:ST.ap});
  var perSeason={}; Object.keys(ST.weeks).forEach(function(k){ var p=keyParts(k); if(p) perSeason[p.season]=(perSeason[p.season]||0)+1; });
  var most=0; Object.keys(perSeason).forEach(function(s){ most=Math.max(most, perSeason[s]); });
  return {filled:st.filled, matchAP:st.match, maxRise:st.rise?st.rise.d:0, maxDrop:st.drop?-st.drop.d:0, notRanked:st.nr.length, weeksSaved:most};
}
function rootPayload(){
  var m=rootMeta()||{};
  return clean({slots:slotsOf(rootBallot()), season:m.season||null, week:m.week||null, weekKey:m.weekKey||null,
    updatedAt:m.updatedAt||Date.now(), ap:m.ap||null, stats:hubStats()});
}
function writeLocal(){
  try{
    var p=rootPayload(); p.weeks=ST.weeks; p.committees=ST.comms;
    localStorage.setItem(LS_KEY(), JSON.stringify(p));
  }catch(e){}
}
function canCloud(){ return !!(DB && ST.user); }
function setSave(s){ ST.saveState=s; drawFoot(); }
function persist(){
  if(!canCloud()){ setSave({ok:true, local:true, at:Date.now()}); return; }
  var seq=++_saveSeq;
  setSave({pending:true, at:Date.now()});
  try{
    DB.ref(BASE()).update(rootPayload()).then(function(){
      if(seq===_saveSeq) setSave({ok:true, at:Date.now()});
    }).catch(function(e){ saveFailed(e, seq, persist); });
  }catch(e){ setSave({ok:false, at:Date.now(), err:(e&&e.message)||"write threw"}); }
}
function saveFailed(e, seq, retry){
  var msg=(e&&e.message)||"write failed";
  if(seq==null || seq===_saveSeq) setSave({ok:false, at:Date.now(), err:msg});
  if(/permission|denied/i.test(msg)){ toast("Save failed — not signed in yet. Retrying…"); setTimeout(retry,1500); }
  else toast("⚠️ Save failed — "+x(String(msg).slice(0,80)));
}
function pushWeek(key){
  var w=ST.weeks[key]; if(!w) return;
  if(!canCloud()){ w.pending=false; writeLocal(); return; }
  var body=clean(w); delete body.pending;
  DB.ref(BASE()+"/weeks/"+key).set(body).then(function(){
    if(ST.weeks[key]){ ST.weeks[key].pending=false; writeLocal(); }
  }).catch(function(e){ saveFailed(e, null, function(){ pushWeek(key); }); });
}

// Save the ballot on screen as a week.
function saveWeek(key){
  var p=keyParts(key); if(!p) return;
  var existing=ST.weeks[key];
  var ap = ST.edit && ST.edit.key===key ? ST.edit.ap : apForKey(key);
  ST.weeks[key]={key:key, label:(ap&&ap.key===key&&ap.week)||(existing&&existing.label)||weekLabel(p.n), season:p.season, n:p.n,
                 slots:weekSlots(ST.ballot, ap||null, !ST.edit), ap:ap||null, savedAt:Date.now(), pending:true};
  if(ST.edit && ST.edit.key===key) ST.editDirty=false;
  pushWeek(key); writeLocal(); persist();   // persist refreshes the Hub's stats
  toast("✓ Saved as your "+x(ST.weeks[key].label)+" ballot");
  closeSheet(); draw();
}
function deleteWeek(key){
  var w=ST.weeks[key]; if(!w) return;
  if(!confirm("Delete your "+w.label+" ballot? This can't be undone.")) return;
  delete ST.weeks[key];
  if(ST.edit && ST.edit.key===key){ ST.editDirty=false; stopEditing(true); }
  if(canCloud()) DB.ref(BASE()+"/weeks/"+key).remove().catch(function(){ toast("Could not delete from your account"); });
  writeLocal(); persist(); closeSheet(); draw();
  toast("Deleted "+x(w.label));
}
// Before the ballot moves on to a new poll, file the old one away if it never was.
function archiveIfUnsaved(){
  var m=ST.meta; if(!m||!m.weekKey||!filledCount()) return null;
  if(ST.weeks[m.weekKey]) return null;
  ST.weeks[m.weekKey]={key:m.weekKey, label:m.week||weekLabel(keyParts(m.weekKey).n), season:keyParts(m.weekKey).season, n:keyParts(m.weekKey).n,
    slots:weekSlots(ST.ballot, m.ap||apForKey(m.weekKey), true), ap:m.ap||apForKey(m.weekKey), savedAt:Date.now(), pending:true};

// Status of the current ballot against its saved week.
function weekSaveStatus(){

  if(!k) return {key:null, state:"none"};
  var w=ST.weeks[k];
  if(!w) return {key:k, state:"unsaved"};

// ── Editing a saved week ───────────────────────────────────
function startEditing(key){
  var w=ST.weeks[key]; if(!w) return;
  if(ST.edit){ if(!stopEditing()) return; }
  ST.cur={ballot:ST.ballot, meta:ST.meta};
  ST.edit={key:key, label:w.label, season:w.season, ap:w.ap||null};

}
function stopEditing(force){

  ST.ballot=ST.cur.ballot; ST.meta=ST.cur.meta; ST.edit=null; ST.cur=null; ST.editDirty=false;

}

// ── Loading ────────────────────────────────────────────────
function readSave(obj){
  if(!obj) return null;
  var weeks={};
  Object.keys(obj.weeks||{}).forEach(function(k){ var w=obj.weeks[k]; if(w && keyParts(k) && w.slots) weeks[k]=w; });
  if(!obj.slots && !Object.keys(weeks).length && !obj.committees) return null;
  var wk=obj.weekKey;
  if(wk && !keyParts(wk)){ var m=/^(\d{4})\|(\d+)/.exec(wk); wk=m?makeKey(+m[1],+m[2]):null; }   // earlier "2026|5" format
  return {ballot:slotsToBallot(obj.slots), weeks:weeks, committees:obj.committees||{},
          meta:{season:obj.season, week:obj.week, weekKey:wk, updatedAt:obj.updatedAt||0, ap:obj.ap||null}};
}
function loadData(){
  var local=null;
  try{ local=readSave(JSON.parse(localStorage.getItem(LS_KEY())||"null")); }catch(e){}
  function apply(remote, remoteOK){
    var pick=remote;
    if(local && (!remote || (local.meta.updatedAt||0)>(remote.meta.updatedAt||0))) pick=local;
    if(pick){ ST.ballot=pick.ballot; ST.meta=pick.meta; ST.hadSave=filledCount()>0; }
    // Weeks: the account is the source of truth once it has been read; a week that only
    // this device has is kept only if it never reached the account (pending).
    var weeks={};
    if(remote) Object.keys(remote.weeks).forEach(function(k){ weeks[k]=remote.weeks[k]; });
    if(local) Object.keys(local.weeks).forEach(function(k){
      var lw=local.weeks[k];
      if(!remoteOK || lw.pending){ if(!weeks[k] || (lw.savedAt||0)>(weeks[k].savedAt||0)) weeks[k]=lw; }
    });
    ST.weeks=weeks;
    ST.comms=(remoteOK ? (remote&&remote.committees) : (local&&local.committees)) || {};
    ST.loaded=true;
    if(remoteOK){
      Object.keys(weeks).forEach(function(k){ if(weeks[k].pending) pushWeek(k); });
      if(pick===local && local) setTimeout(persist, 400);
    }
    if(ST.ap && !ST.hadSave) fillFromAP(true);
    if(ST.ap && ST.meta && ST.meta.weekKey===ST.ap.key && !ST.meta.ap) ST.meta.ap=apSnap(ST.ap);
    draw();
    initCommittees();
  }
  if(!canCloud()){ apply(null,false); return; }
  DB.ref(BASE()).once("value").then(function(sn){ apply(readSave(sn.val()), true); })
    .catch(function(){ apply(null,false); });
  loadProfile();
}

// ── Render ─────────────────────────────────────────────────
function curWeekLabel(){

function seasonData(season){
  var keys=weekKeysSorted(season);
  var W=keys.map(function(k){ var w=ST.weeks[k]; return {key:k, w:w, n:w.n!=null?w.n:keyParts(k).n, label:w.label, ballot:slotsToBallot(w.slots)}; });
  var map={}, order=[];
  W.forEach(function(wk,wi){
    wk.ballot.forEach(function(t,i){
      if(!t) return;
      var k=tkey(t);
      if(!map[k]){ map[k]={k:k, t:t, ranks:[], ap:[]}; order.push(k); }
      map[k].t=t; map[k].ranks[wi]=i+1;
    });
  });
  W.forEach(function(wk,wi){
    if(!wk.w.ap) return;
    wk.w.ap.ranks.forEach(function(r){ var k=tkey(r.team); if(!map[k]){ for(var mk in map){ if(sameTeam(map[mk].t,r.team)){ k=mk; break; } } } if(map[k]) map[k].ap[wi]=r.rank; });
  });
  var rows=order.map(function(k){ var r=map[k]; for(var i=0;i<W.length;i++){ r.ranks[i]=r.ranks[i]||0; r.ap[i]=r.ap[i]||0; }
    r.best=Math.min.apply(null, r.ranks.filter(Boolean)); r.last=r.ranks[W.length-1]||99; r.weeks=r.ranks.filter(Boolean).length; return r; });
  rows.sort(function(a,b){ return (a.last-b.last) || (a.best-b.best) || (b.weeks-a.weeks) || a.t.name.localeCompare(b.t.name); });
  return {W:W, rows:rows};
}
function seasonStats(D){
  var W=D.W, rows=D.rows, jump=null, diffs=0, dn=0, ones={}, loyal=0;
  rows.forEach(function(r){
    if(r.weeks===W.length) loyal++;
    for(var i=0;i<W.length;i++){
      if(r.ranks[i]===1) ones[r.k]=(ones[r.k]||0)+1;
      if(r.ranks[i] && r.ap[i]){ diffs+=Math.abs(r.ranks[i]-r.ap[i]); dn++; }
      if(i>0 && r.ranks[i] && r.ranks[i-1]){ var d=r.ranks[i-1]-r.ranks[i]; if(d>0 && (!jump||d>jump.d)) jump={r:r,d:d,from:W[i-1],to:W[i]}; }
    }
  });
  var top=null; Object.keys(ones).forEach(function(k){ if(!top||ones[k]>top.n) top={k:k,n:ones[k]}; });
  var topRow=top&&rows.filter(function(r){ return r.k===top.k; })[0];
  return {jump:jump, avgAP:dn?diffs/dn:null, top:topRow?{t:topRow.t,n:top.n}:null, loyal:loyal};
}

function heat(r){ var a=0.12+0.78*(25-r)/24; return "rgba(232,200,64,"+a.toFixed(2)+")"; }
function chartSVG(W, sel){
  var cols=W.length, padL=30, padR=54, padT=12, plotH=240, padB=44;
  var avail=Math.max(280, Math.min(532, (window.innerWidth||390)-28)-28);
  var cw=cols>1?Math.max(46,(avail-padL-padR)/(cols-1)):0;
  var width=cols>1?Math.round(padL+padR+cw*(cols-1)):avail, H=padT+plotH+padB, nrY=padT+plotH+20;
  function X(i){ return cols>1?padL+i*cw:padL+(width-padL-padR)/2; }
  function Y(r){ return r?padT+(r-1)*plotH/24:nrY; }
  var s='<svg class="chart" width="'+width+'" height="'+H+'" viewBox="0 0 '+width+' '+H+'" xmlns="http://www.w3.org/2000/svg">';
  [1,5,10,15,20,25].forEach(function(r){ var y=Y(r).toFixed(1); s+='<line x1="'+padL+'" x2="'+(width-padR+10)+'" y1="'+y+'" y2="'+y+'" class="gl"/><text x="'+(padL-8)+'" y="'+(+y+4)+'" class="ax" text-anchor="end">'+r+'</text>'; });
  s+='<line x1="'+padL+'" x2="'+(width-padR+10)+'" y1="'+nrY+'" y2="'+nrY+'" class="gl nr"/><text x="'+(padL-8)+'" y="'+(nrY+4)+'" class="ax" text-anchor="end">NR</text>';
  W.forEach(function(wk,i){ s+='<text x="'+X(i).toFixed(1)+'" y="'+(H-8)+'" class="ax wk" text-anchor="middle">'+x(weekShort(wk.n))+'</text>'; });
  var labels=[];
  sel.forEach(function(r){
    var c=lineColor(r.t);
    if(ST.showAP){
      var seg=[];
      function flush(){ if(seg.length>1) s+='<polyline points="'+seg.join(" ")+'" fill="none" stroke="'+c+'" stroke-width="2" stroke-dasharray="4 4" opacity=".55"/>'; seg=[]; }
      r.ap.forEach(function(v,i){ if(v && W[i].w.ap) seg.push(X(i).toFixed(1)+","+Y(v).toFixed(1)); else flush(); }); flush();
    }
    var pts=r.ranks.map(function(v,i){ return X(i).toFixed(1)+","+Y(v).toFixed(1); });
    if(pts.length>1){
      s+='<polyline points="'+pts.join(" ")+'" fill="none" stroke="#fff" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>';
      s+='<polyline points="'+pts.join(" ")+'" fill="none" stroke="'+c+'" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>';
    }
    r.ranks.forEach(function(v,i){ s+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="'+(v?4.5:3.5)+'" fill="'+(v?c:"#fff")+'" stroke="'+(v?"#fff":c)+'" stroke-width="'+(v?1.5:2)+'"><title>'+x(r.t.name)+' · '+x(weekShort(W[i].n))+': '+(v?"#"+v:"unranked")+(r.ap[i]?" (AP #"+r.ap[i]+")":"")+'</title></circle>'; });
    var last=r.ranks[cols-1];
    labels.push({y:Y(last), c:c, t:(r.t.abbr||abbrOf(r.t.name))+(last?" "+last:"")});
  });
  // Keep end labels from stacking on each other.
  labels.sort(function(a,b){ return a.y-b.y; });
  for(var i=1;i<labels.length;i++) if(labels[i].y-labels[i-1].y<13) labels[i].y=labels[i-1].y+13;
  labels.forEach(function(l){ s+='<text x="'+(X(cols-1)+9).toFixed(1)+'" y="'+(l.y+4).toFixed(1)+'" class="lbl" fill="'+l.c+'">'+x(l.t)+'</text>'; });
  s+='</svg>';
  return s;
}

// ── Committees ─────────────────────────────────────────────
// A committee stores only who is on it:
//   pools/top25c/<CODE> = {name, code, owner, created, members/<uid>:{name,emoji,joined}}
// Ballots are NOT copied in. The combined ranking reads each member's own saved weeks
// straight from pools/top25/<uid>/weeks, so a ballot exists in one place and every
// save, edit or delete shows up in every committee automatically.
// Scoring is the AP/CFP style points count: 25 for a #1 vote, 24 for #2 … 1 for #25.
var JOIN_CODE=(function(){ var m=location.search.match(/[?&]join=([A-Za-z0-9]{4,10})/); return m?m[1].toUpperCase():null; })();
var COMM={data:{}, weeks:{}, err:{}, subs:[], watched:{}};
function myUid(){ return _isUid(ST.user) ? ST.user : (MY_UID||null); }
function canCommittee(){ return !!(DB && myUid()); }
function CPATH(c){ return "pools/top25c/"+c; }
function UPATH(u){ return "pools/top25/"+u; }
function newCode(){ var A="ABCDEFGHJKMNPQRSTUVWXYZ23456789", s=""; for(var i=0;i<6;i++) s+=A.charAt(Math.floor(Math.random()*A.length)); return s; }
function myName(){ var n=(ST.profile.name||"").trim(); if(!n){ try{ n=localStorage.getItem("pp_user")||""; }catch(e){} } return (n&&!_isUid(n))?n:"Player"; }
function myEmoji(){ return ST.profile.emoji||"🎯"; }
function inviteURL(code){ return location.origin+location.pathname+"?join="+code; }

function unwatch(){
  COMM.subs.forEach(function(s){ try{ s.ref.off("value", s.cb); }catch(e){} });
  COMM.subs=[]; COMM.watched={};
}
function watch(path, cb, onErr){
  var ref=DB.ref(path);
  ref.on("value", cb, function(e){ if(onErr) onErr(e); });
  COMM.subs.push({ref:ref, cb:cb});
}
function selectComm(code){
  if(!canCommittee() || !code) return;
  unwatch(); ST.comm=code; ST.cweek=null;
  try{ localStorage.setItem("t25_comm", code); }catch(e){}
  watch(CPATH(code), function(sn){
    var d=sn.val();
    COMM.data[code]=d||false;
    var me=myUid();
    if(d && me && !(d.members||{})[me]){ toast("You’re no longer on "+x(d.name)); dropIndex(code); return; }
    if(d) watchMembers(code);
    if(ST.tab==="committee") draw();
    refreshCSheet();
  }, function(){ COMM.data[code]=false; draw(); });
}
// One live listener per member's saved weeks (your own come from ST.weeks).
function watchMembers(code){
  var d=COMM.data[code]; if(!d) return;
  Object.keys(d.members||{}).forEach(function(u){
    if(u===myUid() || COMM.watched[u]) return;
    COMM.watched[u]=1;
    watch(UPATH(u)+"/weeks", function(sn){
      COMM.weeks[u]=sn.val()||{}; delete COMM.err[u];
      if(ST.tab==="committee") draw(); refreshCSheet();
    }, function(){ COMM.err[u]=true; COMM.weeks[u]={}; if(ST.tab==="committee") draw(); });
  });
}
function memberWeek(u, key){
  if(u===myUid()) return ST.weeks[key]||null;
  var w=COMM.weeks[u]; return (w&&w[key]&&w[key].slots)?w[key]:null;
}
function curBallotKey(){ return (ST.meta&&ST.meta.weekKey)||(ST.ap&&ST.ap.key)||null; }
// Weeks anyone on the committee has a ballot for, plus the live poll week.
function commWeeks(code){
  var d=COMM.data[code]; if(!d) return [];
  var season=(ST.ap&&ST.ap.season)||(ST.meta&&ST.meta.season)||new Date().getFullYear(), set={};
  Object.keys(d.members||{}).forEach(function(u){
    var ws = u===myUid() ? ST.weeks : (COMM.weeks[u]||{});
    Object.keys(ws||{}).forEach(function(k){ var p=keyParts(k); if(p && p.season===season && ws[k] && ws[k].slots) set[k]=1; });
  });
  var ck=curBallotKey(); if(ck && keyParts(ck) && keyParts(ck).season===season) set[ck]=1;
  return Object.keys(set).sort();
}
function commWeek(code){
  var ks=commWeeks(code);
  if(ST.cweek && ks.indexOf(ST.cweek)>=0) return ST.cweek;
  var ck=curBallotKey();
  return (ck && ks.indexOf(ck)>=0) ? ck : (ks[ks.length-1]||null);
}
function weekName(key){
  var p=keyParts(key); if(!p) return "";
  if(ST.ap && ST.ap.key===key) return ST.ap.week;
  return (ST.weeks[key]&&ST.weeks[key].label)||weekLabel(p.n);
}
function combined(code, key){
  var d=COMM.data[code], out={voters:[], list:[], others:[]};
  if(!d||!key) return out;
  var map={};
  Object.keys(d.members||{}).forEach(function(u){
    var w=memberWeek(u,key); if(!w) return;
    out.voters.push(u);
    slotsToBallot(w.slots).forEach(function(t,i){
      if(!t) return;
      var k=tkey(t), m=map[k]||(map[k]={k:k, t:t, pts:0, fpv:0, ranks:{}, n:0});
      m.pts+=N-i; if(i===0) m.fpv++; m.ranks[u]=i+1; m.n++;
      if(!m.t.rec && t.rec) m.t=t;
    });
  });
  var all=Object.keys(map).map(function(k){ var m=map[k], r=Object.keys(m.ranks).map(function(u){ return m.ranks[u]; });
    m.hi=Math.min.apply(null,r); m.lo=Math.max.apply(null,r); return m; });
  all.sort(function(a,b){ return (b.pts-a.pts)||(b.fpv-a.fpv)||(b.n-a.n)||a.t.name.localeCompare(b.t.name); });
  all.forEach(function(m,i){ m.rank=(i>0&&all[i-1].pts===m.pts)?all[i-1].rank:i+1; m.tie=false; });
  all.forEach(function(m,i){ if((i>0&&all[i-1].rank===m.rank)||(i<all.length-1&&all[i+1].rank===m.rank)) m.tie=true; });
  out.list=all.slice(0,N); out.others=all.slice(N);
  return out;
}
function prevCommKey(code, key){
  var ks=commWeeks(code), best=null;
  ks.forEach(function(k){ if(k<key && combined(code,k).voters.length) best=k; });
  return best;
}
function commCtx(code, key){
  var pk=prevCommKey(code,key); if(!pk) return {mode:"last", prev:null};
  var pc=combined(code,pk);
  return {mode:"last", prev:{label:"committee "+weekName(pk), slots:slotsOf(pc.list.map(function(m){ return m.t; }))}};
}

function setIndex(code, name){ return DB.ref(UPATH(myUid())+"/committees/"+code).set({name:name, joined:Date.now()}); }
function dropIndex(code){
  delete ST.comms[code];
  if(canCommittee()) DB.ref(UPATH(myUid())+"/committees/"+code).remove().catch(function(){});
  if(ST.comm===code){ unwatch(); ST.comm=null; var left=Object.keys(ST.comms); if(left.length) selectComm(left[0]); }
  writeLocal(); draw();
}
function createCommittee(name){
  name=String(name||"").trim().slice(0,40);
  if(name.length<2){ toast("Give your committee a name"); return; }
  if(!canCommittee()){ toast("Sign in through the Hub first"); return; }
  var me=myUid(), tries=0;
  (function attempt(){
    var code=newCode();
    DB.ref(CPATH(code)).once("value").then(function(sn){
      if(sn.val() && ++tries<5) return attempt();
      var m={}; m[me]={name:myName(), emoji:myEmoji(), joined:Date.now()};
      return DB.ref(CPATH(code)).set({name:name, code:code, owner:me, created:Date.now(), members:m})
        .then(function(){ return setIndex(code,name); })
        .then(function(){ ST.comms[code]={name:name}; writeLocal(); selectComm(code); ST.tab="committee"; openSheet({type:"cinvite", code:code, fresh:true}); draw(); });
    }).catch(function(e){ toast("Couldn’t create it — "+x(String((e&&e.message)||"error").slice(0,60))); });
  })();
}
function joinCommittee(code){
  code=String(code||"").trim().toUpperCase().replace(/[^A-Z0-9]/g,"");
  if(code.length<4){ toast("Enter the committee code"); return; }
  if(!canCommittee()){ toast("Sign in through the Hub first"); return; }
  var me=myUid();
  DB.ref(CPATH(code)).once("value").then(function(sn){
    var d=sn.val();
    if(!d){ toast("No committee with code "+x(code)); return; }
    if((d.members||{})[me]){ ST.comms[code]={name:d.name}; setIndex(code,d.name); selectComm(code); ST.tab="committee"; closeSheet(); draw(); return; }
    if(Object.keys(d.members||{}).length>=30){ toast("That committee is full (30 members)"); return; }
    return DB.ref(CPATH(code)+"/members/"+me).set({name:myName(), emoji:myEmoji(), joined:Date.now()})
      .then(function(){ return setIndex(code,d.name); })
      .then(function(){
        ST.comms[code]={name:d.name}; writeLocal(); selectComm(code); ST.tab="committee"; closeSheet(); draw();
        toast("✓ You’re on "+x(d.name));
      });
  }).catch(function(e){ toast("Couldn’t join — "+x(String((e&&e.message)||"error").slice(0,60))); });
}
function leaveCommittee(code){
  var d=COMM.data[code]; if(!d) { dropIndex(code); closeSheet(); return; }
  var me=myUid(), others=Object.keys(d.members||{}).filter(function(u){ return u!==me; });
  if(!confirm("Leave "+d.name+"?"+(d.owner===me&&others.length?" The chair passes to another member.":""))) return;
  var p=DB.ref(CPATH(code)+"/members/"+me).remove();
  if(d.owner===me && others.length) p=p.then(function(){ return DB.ref(CPATH(code)+"/owner").set(others[0]); });
  if(!others.length) p=p.then(function(){ return DB.ref(CPATH(code)).remove(); });   // last one out
  p.then(function(){ closeSheet(); dropIndex(code); toast("Left "+x(d.name)); }).catch(function(){ toast("Couldn’t leave right now"); });
}
function kickMember(code, u){
  var d=COMM.data[code]; if(!d||d.owner!==myUid()||u===myUid()) return;
  var nm=(d.members[u]&&d.members[u].name)||"this member";

function _loadImg(src){
  return new Promise(function(res){
    if(!src) return res(null);
    var im=new Image(), done=false;
    var to=setTimeout(function(){ if(!done){ done=true; res(null); } }, 7000);
    im.crossOrigin="anonymous";
    im.onload=function(){ if(done) return; done=true; clearTimeout(to); res(im.naturalWidth?im:null); };
    im.onerror=function(){ if(done) return; done=true; clearTimeout(to); res(null); };
    im.src=src;
  });
}
function _proxy(u){ return u ? "https://images.weserv.nl/?url="+encodeURIComponent(u.replace(/^https?:\/\//,""))+"&w=160&h=160&fit=contain&output=png" : ""; }
function canvasLogo(t){
  var first=logoSrc(t), espn=t.logo||espnLogo(t.id);
  return _loadImg(first).then(function(im){
    if(im) return im;
    return (espn&&espn!==first?_loadImg(espn):Promise.resolve(null)).then(function(im2){
      return im2 || _loadImg(_proxy(espn));
    });
  });
}
function rrect(g,x0,y0,w,h,r){
  var tl,tr,br,bl; if(typeof r==="number"){ tl=tr=br=bl=r; } else { tl=r[0];tr=r[1];br=r[2];bl=r[3]; }
  g.beginPath(); g.moveTo(x0+tl,y0); g.lineTo(x0+w-tr,y0); g.quadraticCurveTo(x0+w,y0,x0+w,y0+tr);
  g.lineTo(x0+w,y0+h-br); g.quadraticCurveTo(x0+w,y0+h,x0+w-br,y0+h); g.lineTo(x0+bl,y0+h);
  g.quadraticCurveTo(x0,y0+h,x0,y0+h-bl); g.lineTo(x0,y0+tl); g.quadraticCurveTo(x0,y0,x0+tl,y0); g.closePath();
}
function fitText(g,txt,maxW){
  if(g.measureText(txt).width<=maxW) return txt;
  var s=txt; while(s.length>1 && g.measureText(s+"…").width>maxW) s=s.slice(0,-1);
  return s+"…";
}
function tri(g,cx,cy,sz,up){ g.beginPath(); if(up){ g.moveTo(cx,cy-sz*0.6); g.lineTo(cx+sz*0.62,cy+sz*0.45); g.lineTo(cx-sz*0.62,cy+sz*0.45); } else { g.moveTo(cx,cy+sz*0.6); g.lineTo(cx+sz*0.62,cy-sz*0.45); g.lineTo(cx-sz*0.62,cy-sz*0.45); } g.closePath(); g.fill(); }
// Layered wordmark, the canvas version of .scorecery-logo.
function stackText(g,txt,x0,y0,size,layers,step){
  g.font="900 "+size+"px Nunito, sans-serif"; g.lineJoin="round";
  var offs=[[1,"#111"],[2,"#111"],[3,layers[0]],[4,layers[1]],[5,layers[2]]];
  for(var i=offs.length-1;i>=0;i--){
    var o=offs[i][0]*step; g.fillStyle=offs[i][1]; g.strokeStyle=offs[i][1]; g.lineWidth=size*0.2;
    g.strokeText(txt,x0+o,y0+o); g.fillText(txt,x0+o,y0+o);
  }
  g.strokeStyle="#111"; g.lineWidth=size*0.2; g.strokeText(txt,x0,y0);
  g.fillStyle="#fff"; g.fillText(txt,x0,y0);
}

function buildGraphic(G){
  var fontP = (document.fonts&&document.fonts.load) ? Promise.all([document.fonts.load("900 40px Nunito"),document.fonts.load("800 20px Nunito")]).catch(function(){}) : Promise.resolve();
  var logosP = Promise.all(G.ballot.map(function(t){ return t?canvasLogo(t):Promise.resolve(null); }));
  return Promise.all([fontP,logosP]).then(function(r){
    var imgs=r[1];
    var res=paintGraphic(imgs,G);
    return new Promise(function(ok){
      try{ res.cv.toBlob(function(b){ ok({blob:b, missing:res.missing}); },"image/png"); }
      catch(e){
        // A logo slipped through without CORS and tainted the canvas: redraw without logos.
        var r2=paintGraphic(G.ballot.map(function(){ return null; }),G);
        r2.cv.toBlob(function(b){ ok({blob:b, missing:G.ballot.filter(Boolean).length}); },"image/png");
      }
    });
  });
}
function paintGraphic(imgs,G){
  var W=1080,H=1350, cv=document.createElement("canvas"); cv.width=W; cv.height=H;
  var g=cv.getContext("2d"), missing=0;
  var fan=ST.fanTeam&&TEAM_COLORS[ST.fanTeam];
  var headBg=fan?fan[0]:"#111", headInk=_readableInk(headBg), layers=logoLayers();
  // background
  g.fillStyle="#f5f0e8"; g.fillRect(0,0,W,H);
  g.fillStyle="rgba(17,17,17,0.045)";
  for(var yy=0; yy<H; yy+=36) for(var xx=(yy/36)%2?18:0; xx<W; xx+=36){ g.beginPath(); g.arc(xx,yy,2,0,Math.PI*2); g.fill(); }
  // header band
  g.fillStyle=headBg; g.fillRect(0,0,W,206);
  g.fillStyle="#111"; g.fillRect(0,206,W,8);
  g.textBaseline="alphabetic"; g.textAlign="left";
  var title=G.title||"MY TOP 25", tsz=96, emo=G.emoji||ST.profile.emoji, tmax=W-96-(emo?100:0);
  g.font="900 "+tsz+"px Nunito, sans-serif";
  while(tsz>48 && g.measureText(title).width>tmax){ tsz-=4; g.font="900 "+tsz+"px Nunito, sans-serif"; }
  title=fitText(g,title,tmax);
  stackText(g,title,48,120,tsz,layers,tsz/32);
  var who=(ST.profile.name||"").trim();
  var wk=G.week||"", season=G.season||new Date().getFullYear(), ctx=G.ctx;
  var subParts=[]; if(who) subParts.push(who.toUpperCase()+"’S BALLOT"); if(wk) subParts.push(String(wk).toUpperCase()); subParts.push(String(season)+" COLLEGE FOOTBALL");
  g.font="900 27px Nunito, sans-serif"; g.fillStyle=headInk==="#111"?"#333":"rgba(255,255,255,0.9)";
  g.fillText(fitText(g,G.subtitle||subParts.join("  ·  "),W-96),50,172);
  // emoji badge top-right
  if(emo){ g.font="64px sans-serif"; g.textAlign="right"; g.fillText(emo,W-48,112); g.textAlign="left"; }

  // rows
  var top=246, colGap=24, side=40, colW=(W-side*2-colGap)/2, pitch=78, rh=66;
  G.ballot.forEach(function(t,i){
    var col=i<13?0:1, r=i<13?i:i-13;
    var x0=side+col*(colW+colGap), y0=top+r*pitch;
    if(!t){
      g.setLineDash([10,8]); g.strokeStyle="#999"; g.lineWidth=3; rrect(g,x0,y0,colW,rh,14); g.stroke(); g.setLineDash([]);
      g.fillStyle="#999"; g.font="900 30px Nunito, sans-serif"; g.textAlign="center"; g.fillText(String(i+1),x0+32,y0+44); g.textAlign="left";
      return;
    }
    var pal=teamPal(t), ink=_readableInk(pal.p);
    g.fillStyle="#111"; rrect(g,x0+5,y0+5,colW,rh,14); g.fill();
    g.fillStyle=pal.p; rrect(g,x0,y0,colW,rh,14); g.fill();
    // secondary-color accent strip along the bottom
    if(pal.s && pal.s.toLowerCase()!==pal.p.toLowerCase()){ g.save(); rrect(g,x0,y0,colW,rh,14); g.clip(); g.fillStyle=pal.s; g.fillRect(x0,y0+rh-7,colW,7); g.restore(); }
    g.fillStyle="#111"; rrect(g,x0,y0,62,rh,[14,0,0,14]); g.fill();
    g.fillStyle="#fff"; var rl=G.rankLabel?G.rankLabel(t,i):String(i+1); g.font="900 "+(rl.length>=3?25:rl.length===2?31:34)+"px Nunito, sans-serif"; g.textAlign="center"; g.fillText(rl,x0+31,y0+45); g.textAlign="left";
    g.strokeStyle="#111"; g.lineWidth=3; rrect(g,x0,y0,colW,rh,14); g.stroke();
    // logo tile
    var lx=x0+72, ly=y0+6, ls=54;
    g.fillStyle="#fff"; rrect(g,lx,ly,ls,ls,11); g.fill();
    var im=imgs[i];
    if(im){ var sc=Math.min((ls-8)/im.naturalWidth,(ls-8)/im.naturalHeight), iw=im.naturalWidth*sc, ih=im.naturalHeight*sc; g.drawImage(im,lx+(ls-iw)/2,ly+(ls-ih)/2,iw,ih); }
    else { missing++; g.fillStyle=pal.p; g.beginPath(); g.arc(lx+ls/2,ly+ls/2,ls/2-5,0,Math.PI*2); g.fill(); g.fillStyle=_readableInk(pal.p); g.font="900 17px Nunito, sans-serif"; g.textAlign="center"; g.fillText(String(t.abbr||abbrOf(t.name)).slice(0,4),lx+ls/2,ly+ls/2+6); g.textAlign="left"; }
    // name + sub
    var m=moveInfo(t,i+1,ctx), chipW=m?68:0;
    var nx=lx+ls+12, maxW=x0+colW-nx-(chipW?chipW+14:12);
    var sub=G.rowSub ? G.rowSub(t,i) : recordFor(t, G.recAP||null, !!G.live);
    g.fillStyle=ink; g.font="900 29px Nunito, sans-serif";
    g.fillText(fitText(g,t.name,maxW),nx,sub?y0+33:y0+43);
    if(sub){ g.globalAlpha=0.82; g.font="800 18px Nunito, sans-serif"; g.fillText(fitText(g,sub,maxW),nx,y0+55); g.globalAlpha=1; }
    // vs-AP chip
    if(m){
      var cx=x0+colW-chipW-10, cy=y0+(rh-34)/2-2;
      g.fillStyle="#fff"; rrect(g,cx,cy,chipW,34,17); g.fill(); g.strokeStyle="#111"; g.lineWidth=2.5; g.stroke();
      var col2 = m.cls==="up"?"#15803d":m.cls==="dn"?"#c0392b":m.cls==="nr"?"#b89a00":"#777";
      g.fillStyle=col2; g.font="900 20px Nunito, sans-serif";
      if(m.cls==="up"||m.cls==="dn"){
        var num=String(Math.abs(m.d)), tw=g.measureText(num).width, tot=14+5+tw, sx=cx+(chipW-tot)/2;
        tri(g,sx+7,cy+17,14,m.cls==="up"); g.fillText(num,sx+19,cy+24);
      } else { g.textAlign="center"; g.font="900 "+(m.txt==="NEW"?17:20)+"px Nunito, sans-serif"; g.fillText(m.cls==="nr"?m.txt:"=",cx+chipW/2,cy+24); g.textAlign="left"; }
    }
  });
  // legend in the empty 13th slot of column two
  var lgx=side+colW+colGap, lgy=top+12*pitch, ref=ctxName(ctx);
  g.fillStyle="#fff"; rrect(g,lgx,lgy,colW,rh,14); g.fill(); g.strokeStyle="#111"; g.lineWidth=3; g.stroke();
  g.font="900 15px Nunito, sans-serif"; g.fillStyle="#777";
  g.fillText(fitText(g, G.legend ? G.legend : ref?("VS. "+(ctx.mode==="ap"?"AP POLL \u00B7 "+String(ctx.ap.week||"").toUpperCase():"MY "+String(ctx.prev.label).toUpperCase())):"YOUR RANKINGS", colW-32),lgx+16,lgy+25);
  if(ref){
    var nrWord=ctx.mode==="ap"?"NR":"NEW", nrTxt=ctx.mode==="ap"?"unranked":"new";
    g.font="800 16px Nunito, sans-serif"; var lx2=lgx+16, ly2=lgy+50;
    g.fillStyle="#15803d"; tri(g,lx2+6,ly2-6,12,true); g.fillStyle="#111"; g.fillText("higher",lx2+16,ly2); lx2+=16+g.measureText("higher").width+16;
    g.fillStyle="#c0392b"; tri(g,lx2+6,ly2-6,12,false); g.fillStyle="#111"; g.fillText("lower",lx2+16,ly2); lx2+=16+g.measureText("lower").width+16;
    g.fillStyle="#b89a00"; g.font="900 16px Nunito, sans-serif"; g.fillText(nrWord,lx2,ly2); lx2+=g.measureText(nrWord).width+6; g.fillStyle="#111"; g.font="800 16px Nunito, sans-serif"; g.fillText(nrTxt,lx2,ly2);
  }
  // footer
  g.fillStyle="#111"; g.fillRect(0,H-66,W,66);
  stackText(g,"SCORECERY",40,H-20,34,layers,1.3);
  g.font="800 20px Nunito, sans-serif"; g.fillStyle="rgba(255,255,255,0.8)"; g.textAlign="right";
  var d=new Date(); var ds=d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
  g.fillText("CFB Top 25  ·  "+ds,W-40,H-26); g.textAlign="left";
  return {cv:cv, missing:missing};
}


// ── Drag to reorder (pointer events: mouse + touch) ────────
var DRAG=null;
function onHandleDown(e){
  var hd=e.target.closest(".handle"); if(!hd) return;
  if(e.button!=null && e.button!==0) return;
  e.preventDefault();
  var rows=[].slice.call(document.querySelectorAll("#ballot .row"));
  var i=+hd.getAttribute("data-i");
  var tops=rows.map(function(r){ return r.getBoundingClientRect().top+window.scrollY; });
  var tb=document.querySelector(".topbar");
  DRAG={i:i,to:i,rows:rows,tops:tops,pitch:rows.length>1?(tops[1]-tops[0]):62,startY:e.clientY+window.scrollY,cy:e.clientY,row:rows[i],
        topEdge:(tb?tb.getBoundingClientRect().bottom:0)+50, raf:0};
  DRAG.row.classList.add("dragging"); document.body.classList.add("is-dragging");
  window.addEventListener("pointermove",onDragMove,{passive:false});
  window.addEventListener("pointerup",onDragEnd); window.addEventListener("pointercancel",onDragEnd);
  DRAG.raf=requestAnimationFrame(dragTick);
}
function onDragMove(e){ if(!DRAG) return; e.preventDefault(); DRAG.cy=e.clientY; }
function dragTick(){
  if(!DRAG) return;
  var sp=0;
  if(DRAG.cy<DRAG.topEdge) sp=-Math.min(18,(DRAG.topEdge-DRAG.cy)/3+4);
  else if(DRAG.cy>window.innerHeight-70) sp=Math.min(18,(DRAG.cy-(window.innerHeight-70))/3+4);
  if(sp) window.scrollBy(0,sp);
  var n=DRAG.rows.length, dy=(DRAG.cy+window.scrollY)-DRAG.startY;
  dy=Math.max(DRAG.tops[0]-DRAG.tops[DRAG.i], Math.min(DRAG.tops[n-1]-DRAG.tops[DRAG.i], dy));
  DRAG.row.style.transform="translateY("+dy+"px) scale(1.02)";
  var to=Math.max(0,Math.min(n-1,Math.round(DRAG.i+dy/DRAG.pitch)));
  if(to!==DRAG.to){
    DRAG.to=to;
    DRAG.rows.forEach(function(r,j){
      if(j===DRAG.i){ r.querySelector(".rk").textContent=to+1; return; }
      var s=0;
      if(DRAG.i<to && j>DRAG.i && j<=to) s=-1;
      if(to<DRAG.i && j>=to && j<DRAG.i) s=1;
      r.style.transform=s?("translateY("+(s*DRAG.pitch)+"px)"):"";
      r.querySelector(".rk").textContent=j+1+s;
    });
    if(navigator.vibrate) try{ navigator.vibrate(6); }catch(_){}
  }
  DRAG.raf=requestAnimationFrame(dragTick);
}
function onDragEnd(){
  if(!DRAG) return;
  var d=DRAG; DRAG=null;
  cancelAnimationFrame(d.raf);
  window.removeEventListener("pointermove",onDragMove); window.removeEventListener("pointerup",onDragEnd); window.removeEventListener("pointercancel",onDragEnd);
  document.body.classList.remove("is-dragging");
  if(d.to!==d.i) moveSlot(d.i,d.to); else draw();
}



// ── Events (one delegated handler) ─────────────────────────
function quickSaveWeek(){
  if(ST.edit){ saveWeek(ST.edit.key); return; }
  if(!filledCount()){ toast("Add some teams first"); return; }
  var k=ST.meta&&ST.meta.weekKey;
  if(k && keyParts(k)) saveWeek(k);
  else openSheet({type:"saveweek"});      // no poll to tie it to — ask which week
}
document.addEventListener("pointerdown", onHandleDown);
document.addEventListener("click", function(e){
  var el=e.target.closest("[data-act]"); if(!el) return;
  var a=el.getAttribute("data-act"), i=+el.getAttribute("data-i"), k=el.getAttribute("data-k");
  switch(a){
    case "_menu": e.stopPropagation(); ST.menuOpen=!ST.menuOpen; renderTop(); return;
    case "_menuclose": ST.menuOpen=false; renderTop(); return;
    case "tab": ST.tab=el.getAttribute("data-tab"); window.scrollTo(0,0); draw(); return;
    case "_season": ST.menuOpen=false; ST.tab=ST.tab==="season"?"ballot":"season"; window.scrollTo(0,0); draw(); return;
    case "_ap":
      ST.menuOpen=false;
      if(ST.edit){ renderTop(); toast("Finish editing "+x(ST.edit.label)+" first"); return; }
      if(filledCount() && ST.hadSave && !confirm("Replace your ballot with the current AP Top 25?")) { renderTop(); return; }
      // Moving to a newer poll: file the old week away first so it isn't lost.
      var arch=(ST.ap && ST.meta && ST.meta.weekKey && ST.meta.weekKey!==ST.ap.key) ? archiveIfUnsaved() : null;
      if(arch) toast("Saved your "+x(arch)+" ballot to your season");
      ST.tab="ballot";
      if(ST.ap && ST.apState==="done" && !ST.ap.stale && Date.now()-(ST.ap.fetchedAt||0)<10*60*1000) fillFromAP(); else loadAP({fill:true});
      return;
    case "_refresh": ST.menuOpen=false; loadAP(); loadRecords(true); return;
    case "_share": ST.menuOpen=false; openShare(); return;
    case "_saveweek": ST.menuOpen=false; renderTop(); quickSaveWeek(); return;
    case "_pickweek": ST.menuOpen=false; if(ST.edit){ renderTop(); toast("You’re editing "+x(ST.edit.label)); return; } openSheet({type:"saveweek"}); return;
    case "savepick":
      if(ST.weeks[k] && !confirm("Replace your saved "+ST.weeks[k].label+" ballot with this one?")) return;
      saveWeek(k); return;
    case "_retry": persist(); Object.keys(ST.weeks).forEach(function(wk){ if(ST.weeks[wk].pending) pushWeek(wk); }); return;
    case "_copy": ST.menuOpen=false; renderTop(); copyText(); return;
    case "_copyshare": copyText(SHARE.G); return;
    case "_clear": ST.menuOpen=false; renderTop(); clearBallot(); return;
    case "_profile": ST.menuOpen=false; openSheet({type:"profile"}); if(ST.profile.badges===undefined) loadProfile(); return;
    case "_newweek": {
      var ar=archiveIfUnsaved(); fillFromAP(true); changed();
      toast(ar?("Saved "+x(ar)+" · loaded the new AP poll"):"✓ Loaded the new AP poll"); return; }
    case "_carry": {
      var ar2=archiveIfUnsaved(); ST.dismissedWeek=ST.ap&&ST.ap.key; tagCurrentWeek(); changed();
      toast((ar2?"Saved "+x(ar2)+" · ":"")+"Your ballot is now your "+x(ST.ap.week)+" ballot"); return; }
    case "_doneedit": stopEditing(); return;
    case "_close": closeSheet(); return;
    case "_doshare": doShare(); return;
    case "_download": doDownload(); return;
    case "cmp":
      ST.cmp=el.getAttribute("data-v")==="last"?"last":"ap";
      try{ localStorage.setItem("t25_cmp", ST.cmp); }catch(_){}
      if(ST.sheet&&ST.sheet.type==="week") renderSheet();
      draw(); return;
    case "season": ST.season=+el.getAttribute("data-v"); ST.trk=null; draw(); return;
    case "showap": ST.showAP=!ST.showAP; draw(); return;
    case "trk": {
      ST.trk=ST.trk||[];
      var at=ST.trk.indexOf(k);
      if(at>=0) ST.trk.splice(at,1);
      else { if(ST.trk.length>=6){ toast("Up to 6 teams at a time"); return; } ST.trk.push(k); }
      draw(); return; }
    case "week": openSheet({type:"week", key:k}); return;
    case "weekshare": openShare(weekG(k)); return;
    case "weekedit": startEditing(k); return;
    case "weekdel": deleteWeek(k); return;
    case "up": moveSlot(i,i-1); return;
    case "dn": moveSlot(i,i+1); return;
    case "row": openSheet({type:"row",slot:i}); return;
    case "pick": openSheet({type:"pick",slot:i}); return;
    case "pickteam": { var t=_pickList[+k]; if(t&&ST.sheet) placeTeam(ST.sheet.slot,t); return; }
    case "moveto": { var to=+el.getAttribute("data-to"); closeSheet(); moveSlot(i,to); return; }
    case "remove": removeSlot(i); return;
    case "badge": setMyBadge(el.getAttribute("data-badge")); return;
    case "era": setLogoEra(el.getAttribute("data-era")); return;
    case "fan": setFanTeam(el.getAttribute("data-fan")); return;
    // Committees
    case "cnew": openSheet({type:"cnew", mode:el.getAttribute("data-v")}); return;
    case "ccreate": { var nm=document.getElementById("c-name"); createCommittee(nm&&nm.value); return; }
    case "cjoincode": { var ci=document.getElementById("c-code"); joinCommittee(k || (ci&&ci.value)); return; }
    case "csel": selectComm(k); draw(); return;
    case "cweek": ST.cweek=k; draw(); return;
    case "cinvite": openSheet({type:"cinvite", code:k||ST.comm}); return;
    case "cmanage": openSheet({type:"cmanage", code:k||ST.comm}); return;
    case "cshareinv": {
      var d0=COMM.data[k]||{name:""};
      navigator.share({title:"Join "+d0.name, text:"Join my CFB Top 25 committee \u201C"+d0.name+"\u201D on Scorecery (code "+k+")", url:inviteURL(k)}).catch(function(){});
      return; }
    case "ccopyinv": copyStr(inviteURL(k), "\u2713 Invite link copied"); return;
    case "ccopycode": copyStr(k, "\u2713 Code copied"); return;
    case "cleave": leaveCommittee(k); return;
    case "ckick": kickMember(ST.sheet&&ST.sheet.code||ST.comm, el.getAttribute("data-u")); return;
    case "cdrop": dropIndex(k); return;
    case "cteam": openSheet({type:"cteam", k:k}); return;
    case "cmember": openSheet({type:"cmember", u:el.getAttribute("data-u")}); return;
    case "cshare": { var ck=commWeek(ST.comm); if(ck) openShare(commG(ST.comm, ck)); return; }
  }
});
function copyStr(t, msg){
  function fb(){ var ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); toast(msg); }catch(e){ toast("Couldn't copy"); } ta.remove(); }
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(function(){ toast(msg); }).catch(fb); else fb();
}
document.addEventListener("keydown", function(e){ if(e.key==="Escape" && ST.sheet) closeSheet(); });
window.addEventListener("beforeunload", function(e){ if(ST.edit && ST.editDirty){ e.preventDefault(); e.returnValue=""; } });
var _rsT; window.addEventListener("resize", function(){ clearTimeout(_rsT); _rsT=setTimeout(function(){ if(ST.tab==="season") draw(); },200); });

// ── Boot ───────────────────────────────────────────────────
// Resolve the signed-in identity before the first read/write so the ballot is keyed
// to the right account — same bootWithAuth() the Dynasty and pool pages use.
(function bootWithAuth(){
  loadAP(); loadRecords();
  if(!AUTH){ loadData(); return; }
  var started=false;
  function go(){ if(started) return; started=true; loadData(); }
  AUTH.onAuthStateChanged(function(user){
    MY_UID=user?user.uid:null;
    if(!ST.user && MY_UID) ST.user=MY_UID;
    go();
  });
  setTimeout(go, 2500);
})();
renderTop();
</script>
