const VOLUME = {
  tsp:1, teaspoon:1, t:1,
  tbsp:3, tablespoon:3, tbs:3,
  floz:6, "fluid ounce":6,
  cup:48, c:48, pint:96, pt:96, quart:192, qt:192, gallon:768, gal:768,

};
const WEIGHT = {
  g:1, gram:1, kg:1000, kilogram:1000,

};
const METRIC = new Set(["ml","milliliter","l","liter","litre","g","gram","kg","kilogram"]);

function normUnit(u) {
  if (!u) return null;
  let s = String(u).toLowerCase().trim().replace(/\./g, "");
  if (s.endsWith("es") && (s.startsWith("ounc") || s.startsWith("inch"))) s = s.slice(0, -2);
  else if (s.endsWith("s") && s.length > 2) s = s.slice(0, -1);
  return s.replace(/^fl\s*oz$/, "floz").replace(/^fluid\s*ounce$/, "floz");
}
function unitInfo(u) {
  const s = normUnit(u);
  if (!s) return { family:"count", factor:1, metric:false };
  if (VOLUME[s]) return { family:"volume", factor:VOLUME[s], metric:METRIC.has(s) };
  if (WEIGHT[s]) return { family:"weight", factor:WEIGHT[s], metric:METRIC.has(s) };
  return { family:"loose:" + s, factor:1, metric:false };
}

const GLYPH = [[1/8,"\u215B"],[1/4,"\u00BC"],[1/3,"\u2153"],[3/8,"\u215C"],
  [1/2,"\u00BD"],[5/8,"\u215D"],[2/3,"\u2154"],[3/4,"\u00BE"],[7/8,"\u215E"]];

function fmtQty(n, whole) {
  if (n == null || isNaN(n)) return "";
  if (whole) return String(Math.round(n));
  if (n >= 10) return String(Math.round(n));
  const w = Math.floor(n), frac = n - w;
  if (frac < 0.06) return String(w);
  if (frac > 0.94) return String(w + 1);
  let best = null, bestD = 1;
  for (const [v, g] of GLYPH) { const d = Math.abs(frac - v); if (d < bestD) { bestD = d; best = g; } }
  if (bestD > 0.06) return String(Number(n.toFixed(2)));
  return (w ? w : "") + best;
}

function display(base, family, metric) {
  if (family === "volume") {
    if (metric) {
      const ml = base / 0.202884;
      return ml >= 1000 ? { q: fmtQty(ml/1000), u:"l" } : { q: fmtQty(ml, true), u:"ml" };
    }
    if (base >= 48) return { q: fmtQty(base/48), u: base/48 === 1 ? "cup" : "cups" };
    if (base >= 3) return { q: fmtQty(base/3), u:"tbsp" };
    return { q: fmtQty(base), u:"tsp" };
  }
  if (family === "weight") {
    if (metric) return base >= 1000 ? { q: fmtQty(base/1000), u:"kg" } : { q: fmtQty(base, true), u:"g" };
    if (base >= 453.592) return { q: fmtQty(base/453.592), u:"lb" };
    return { q: fmtQty(base/28.3495), u:"oz" };
  }
  if (family.indexOf("loose:") === 0) return { q: fmtQty(base), u: family.slice(6) };
  return { q: fmtQty(base), u:"" };
}

function canonicalize(name) {
  if (!name) return "";

  s = s.replace(/^(fresh|dried|chopped|minced|sliced|diced|ground|large|small|medium|whole|raw)\s+/g, "");

/* ── quantity tokens ── */

const UNICODE_FRAC = {
  "\u00BD":0.5, "\u2153":1/3, "\u2154":2/3, "\u00BC":0.25, "\u00BE":0.75,
  "\u2155":0.2, "\u2156":0.4, "\u2157":0.6, "\u2158":0.8,
  "\u2159":1/6, "\u215A":5/6, "\u215B":0.125, "\u215C":0.375,
  "\u215D":0.625, "\u215E":0.875, "\u2150":1/7, "\u2151":1/9, "\u2152":0.1,
};
const FRAC_CLASS = "[\\u00BC-\\u00BE\\u2150-\\u215E]";
const NUM_PAT = "(?:\\d+\\s*" + FRAC_CLASS + "|\\d+\\s+\\d+\\/\\d+|\\d+\\/\\d+|\\d+(?:\\.\\d+)?|" + FRAC_CLASS + ")";

function toNumber(token) {
  const t = String(token).trim();
  const uni = t.match(new RegExp(FRAC_CLASS));
  if (uni) {
    const whole = parseFloat(t.replace(new RegExp(FRAC_CLASS, "g"), "").trim());
    return (isNaN(whole) ? 0 : whole) + (UNICODE_FRAC[uni[0]] || 0);
  }
  if (t.indexOf("/") > -1) {
    const parts = t.split(/\s+/);
    if (parts.length === 2) {
      const f = parts[1].split("/");
      return parseFloat(parts[0]) + Number(f[0]) / Number(f[1]);
    }
    const f = t.split("/");
    return Number(f[0]) / Number(f[1]);
  }
  const n = parseFloat(t);
  return isNaN(n) ? null : n;
}

const UNIT_WORDS = {

  tablespoon:"tbsp", tablespoons:"tbsp", tbsp:"tbsp", tbsps:"tbsp", tbs:"tbsp", tb:"tbsp",
  teaspoon:"tsp", teaspoons:"tsp", tsp:"tsp", tsps:"tsp",

];

function guessCategory(item) {
  const s = String(item).toLowerCase();
  for (const pair of CATEGORY_WORDS) {
    for (const w of pair[1]) if (s.indexOf(w) > -1) return pair[0];
  }
  return "other";
}

const PREP_WORDS = /\b(chopped|minced|diced|sliced|grated|shredded|melted|softened|divided|packed|peeled|seeded|drained|rinsed|cubed|halved|quartered|crushed|toasted|beaten|finely|roughly|thinly|freshly|plus more|to taste|for serving|for garnish|optional)\b/i;

function parseIngredient(line) {
  const raw = String(line).replace(/\s+/g, " ").trim();
  if (!raw) return null;
  let s = raw;

  const notes = [];
  s = s.replace(/\(([^)]*)\)/g, function (_, inner) { notes.push(inner.trim()); return " "; });
  s = s.replace(/\s+/g, " ").trim();

  let qty = null;
  const range = new RegExp("^(" + NUM_PAT + ")\\s*(?:[-\u2013\u2014]|to)\\s*" + NUM_PAT);
  const single = new RegExp("^(" + NUM_PAT + ")");
  let m = s.match(range);
  if (m) { qty = toNumber(m[1]); s = s.slice(m[0].length).trim(); }
  else {
    m = s.match(single);
    if (m) { qty = toNumber(m[1]); s = s.slice(m[0].length).trim(); }
  }

  let unit = null;
  const tok = s.match(/^([A-Za-z.]+)\b/);
  if (tok) {
    const key = tok[1].toLowerCase().replace(/\./g, "");
    if (UNIT_WORDS[key]) { unit = UNIT_WORDS[key]; s = s.slice(tok[0].length).trim(); }
  }
  s = s.replace(/^of\s+/i, "").trim();

  // NYT-style dual measurements: "4 tablespoons/58 grams butter"
  s = s.replace(new RegExp("^\\/\\s*" + NUM_PAT + "\\s*[A-Za-z]+\\.?\\s*", "i"), "").trim();

  let item = s, prep = "";
  const comma = s.indexOf(",");
  if (comma > -1) { item = s.slice(0, comma).trim(); prep = s.slice(comma + 1).trim(); }

  if (!prep) {
    const leading = [];
    let guard = 0;
    while (guard++ < 3) {
      const lead = item.match(/^([A-Za-z]+)\s+/);
      if (!lead || !PREP_WORDS.test(lead[1])) break;
      leading.push(lead[1]);
      item = item.slice(lead[0].length);
    }
    if (leading.length) prep = leading.join(" ");
  }

  // "1 tsp kosher salt or 1/2 teaspoon fine salt" — keep the first option.
  item = item.replace(new RegExp("\\s+or\\s+" + NUM_PAT + "[\\s\\S]*$", "i"), "").trim();

  const tail = item.match(/,?\s*\b(to taste|as needed|for serving|for garnish|divided|plus more(?:\s+\w+)*)\s*$/i);  if (tail) {
    item = item.slice(0, tail.index).trim();
    prep = prep ? tail[1] + "; " + prep : tail[1];
  }

  if (notes.length) prep = prep ? prep + "; " + notes.join("; ") : notes.join("; ");
  item = item.replace(/\s+/g, " ").replace(/[.,;]$/, "").trim();
  if (!item) return null;

  return { qty, unit, item, prep, raw, category: guessCategory(item + " " + prep) };
}

/* ── JSON-LD ── */

function decodeEntities(str) {
  return String(str)
    .replace(/<[^>]*>/g, " ")
    .replace(/&nbsp;/gi, " ")
    .replace(/&amp;/gi, "&")
    .replace(/&quot;/gi, '"')
    .replace(/&#0?39;|&apos;|&rsquo;/gi, "'")
    .replace(/&lt;/gi, "<")
    .replace(/&gt;/gi, ">")
    .replace(/&frac12;/gi, "\u00BD")
    .replace(/&frac14;/gi, "\u00BC")
    .replace(/&frac34;/gi, "\u00BE")
    .replace(/&#(\d+);/g, function (_, d) { return String.fromCharCode(Number(d)); })
    .replace(/\s+/g, " ")
    .trim();
}

function findRecipeNode(node, depth) {
  depth = depth || 0;
  if (!node || depth > 6) return null;
  if (Array.isArray(node)) {
    for (const n of node) { const hit = findRecipeNode(n, depth + 1); if (hit) return hit; }
    return null;
  }
  if (typeof node !== "object") return null;
  const t = node["@type"];
  const types = Array.isArray(t) ? t : [t];
  if (types.indexOf("Recipe") > -1) return node;
  if (node["@graph"]) return findRecipeNode(node["@graph"], depth + 1);
  for (const k of Object.keys(node)) {
    if (k[0] === "@") continue;
    const hit = findRecipeNode(node[k], depth + 1);
    if (hit) return hit;
  }
  return null;
}

function flattenInstructions(ins) {
  const out = [];
  const walk = function (n) {
    if (!n) return;
    if (typeof n === "string") {
      const txt = decodeEntities(n);
      const parts = txt.match(/[^.!?]+[.!?]*/g) || [txt];
      parts.forEach(function (p) { if (p.trim().length > 3) out.push(p.trim()); });
      return;
    }
    if (Array.isArray(n)) return n.forEach(walk);
    if (typeof n === "object") {
      if (n.itemListElement) return walk(n.itemListElement);
      if (n.text) return walk(n.text);
      if (n.name) return walk(n.name);
    }
  };
  walk(ins);
  return out.slice(0, 40);
}

function parseYield(y) {
  if (y == null) return 4;
  const s = Array.isArray(y) ? y.join(" ") : String(y);

  // "6 servings" / "Serves 6 to 8" — an explicit count wins.
  const explicit = s.match(/(\d+)\s*(?:to\s*\d+\s*)?servings?/i) || s.match(/serves\s*(\d+)/i);
  if (explicit) return Number(explicit[1]);

  const m = s.match(/\d+/);
  if (!m) return 4;
  const n = Number(m[0]);

  // A yield of "1 loaf" or "1 cake" is one object, not one portion.
  if (n === 1 && !/serving|portion|person/i.test(s)) return 4;
  return n > 0 && n < 100 ? n : 4;
}

  ["Asian", ["soy sauce","sesame oil","fish sauce","miso","gochujang","rice vinegar","hoisin","mirin","kimchi","five spice","ramen","udon","tofu","sriracha","lemongrass","curry paste","bok choy","oyster sauce","rice wine","ginger","scallion","stir-fry","stir fry","dumpling"]],
  ["Mexican", ["tortilla","salsa","jalapeno","jalape\u00F1o","chipotle","queso","masa","enchilada","taco","cotija","poblano","tomatillo","adobo","refried","chorizo","burrito","fajita","ancho","tequila","margarita","mezcal"]],
  ["Italian", ["parmesan","pecorino","mozzarella","ricotta","pancetta","prosciutto","risotto","spaghetti","penne","gnocchi","marinara","polenta","pesto","carbonara","lasagna"]],
  ["Indian", ["garam masala","turmeric","curry powder","cardamom","ghee","paneer","naan","tikka","masala","basmati","cumin seed","fenugreek"]],
  ["Mediterranean", ["feta","tahini","za'atar","hummus","pita","kalamata","tzatziki","harissa","couscous","greek yogurt","halloumi"]],
  ["French", ["creme fraiche","cr\u00E8me fra\u00EEche","dijon","tarragon","gruyere","gruy\u00E8re","baguette","brie","herbes de provence","bechamel","b\u00E9chamel","confit"]],
  ["American", ["bbq","barbecue","ranch","cheddar","bacon","cornbread","macaroni","burger","buttermilk","maple syrup","graham","biscuits and gravy"]],
];

const MEAL_HINTS = [
  ["Dessert", ["cake","cookie","brownie","pie","tart","frosting","icing","ice cream","pudding","cheesecake","cobbler","custard","fudge","sorbet","macaron","dessert","crumble"]],
  ["Breakfast", ["pancake","waffle","oatmeal","granola","omelet","omelette","scrambled","french toast","muffin","frittata","breakfast","hash brown","bagel","porridge","brunch"]],
  ["Drink", ["cocktail","margarita","mojito","smoothie","latte","lemonade","punch","martini","sangria","milkshake","spritz","negroni"]],
  ["Snack", ["dip","popcorn","trail mix","chips","crackers","appetizer","snack","nachos"]],
  ["Lunch", ["sandwich","wrap","salad","soup","panini","quesadilla","chowder","burger","taco"]],
];

function mapAlias(value, table) {
  if (!value) return null;
  const list = Array.isArray(value) ? value : [value];
  // Longest first, so "middle eastern" beats "eastern".
  const aliases = Object.keys(table).sort(function (a, b) { return b.length - a.length; });

  for (const v of list) {
    const key = String(v).toLowerCase().trim();
    if (table[key]) return table[key];

    // The leading word carries the sense: "Italian-American" is Italian.
    for (const alias of aliases) {
      if (key.indexOf(alias) === 0) return table[alias];
    }
    for (const alias of aliases) {
      if (key.indexOf(alias) > -1) return table[alias];
    }
  }
  return null;
}

function voteHints(hints, title, hay, fallback) {
  const t = String(title).toLowerCase();
  let best = fallback, bestScore = 0;
  for (const pair of hints) {
    let score = 0;
    for (const word of pair[1]) {
      if (t.indexOf(word) > -1) score += 3;   // the title is the strongest signal
      else if (hay.indexOf(word) > -1) score += 1;
    }
    if (score > bestScore) { bestScore = score; best = pair[0]; }
  }
  return bestScore > 0 ? best : fallback;
}

/* Fill in anything the page didn't tell us. */
function tagRecipe(r) {
  const hay = (
    (r.title || "") + " " +
    (r.ingredients || []).map(function (g) { return g.item + " " + (g.prep || ""); }).join(" ")
  ).toLowerCase();

  if (CUISINES.indexOf(r.cuisine) === -1) {
    r.cuisine = voteHints(CUISINE_HINTS, r.title || "", hay, "Other");
  }
  if (MEALS.indexOf(r.meal) === -1) {
    r.meal = voteHints(MEAL_HINTS, r.title || "", hay, "Dinner");
  }
  return r;
}

function buildFromLd(recipe) {
  const lines = recipe.recipeIngredient || recipe.ingredients || [];
  if (!lines.length) return null;
  return {
    title: decodeEntities(recipe.name || "Untitled"),
    servings: parseYield(recipe.recipeYield),
    cuisine: mapAlias(recipe.recipeCuisine, CUISINE_ALIASES),
    meal: mapAlias(recipe.recipeCategory, MEAL_ALIASES),
    ingredients: lines.map(function (l) { return parseIngredient(decodeEntities(l)); }).filter(Boolean),
    instructions: flattenInstructions(recipe.recipeInstructions),
  };
}

/* Strategy 1 — schema.org JSON-LD. Cleanest when it's there. */
function fromJsonLd(doc) {
  const tags = doc.querySelectorAll('script[type="application/ld+json"]');
  for (const tag of tags) {
    let parsed;
    try { parsed = JSON.parse((tag.textContent || "").trim()); } catch (e) { continue; }
    const recipe = findRecipeNode(parsed);
    if (!recipe) continue;
    const built = buildFromLd(recipe);
    if (built && built.ingredients.length) return built;
  }
  return null;
}

/* Strategy 2 — microdata attributes on the elements themselves. */
function fromMicrodata(doc) {
  const ingEls = doc.querySelectorAll('[itemprop="recipeIngredient"], [itemprop="ingredients"]');
  if (ingEls.length < 2) return null;

  const ingredients = textsOf(ingEls).map(parseIngredient).filter(Boolean);
  if (!ingredients.length) return null;

  const insEls = doc.querySelectorAll('[itemprop="recipeInstructions"] li, [itemprop="recipeInstructions"] p');
  let instructions = textsOf(insEls);
  if (!instructions.length) {
    const block = doc.querySelector('[itemprop="recipeInstructions"]');
    if (block) instructions = flattenInstructions(block.textContent || "");
  }

  return { title: guessTitle(doc), servings: guessServings(doc), ingredients, instructions };
}

/* Strategy 3 — read the page the way a person does: find the
   "Ingredients" heading, take the list under it. Catches sites
   that publish no structured data at all. */
function fromHeadings(doc) {
  let ingLines = listNear(doc, /^ingredients?\b/i, '[class*="ingredient" i] li, [id*="ingredient" i] li');
  if (!looksLikeIngredients(ingLines)) return null;

  const ingredients = ingLines.map(parseIngredient).filter(Boolean);
  if (!ingredients.length) return null;

  let insLines = listNear(
    doc,
    /^(directions?|instructions?|method|steps|preparation)\b/i,
    '[class*="instruction" i] li, [class*="direction" i] li, [class*="method" i] li'
  );
  insLines = insLines.map(function (l) { return l.replace(/^\d+[.)]\s*/, ""); })
                     .filter(function (l) { return l.length > 8; });

  return { title: guessTitle(doc), servings: guessServings(doc), ingredients, instructions: insLines.slice(0, 40) };
}

/* ── helpers for the DOM strategies ── */

function textsOf(nodes) {
  const out = [];
  const seen = {};
  Array.prototype.forEach.call(nodes, function (n) {
    const t = decodeEntities(n.textContent || "");
    if (t.length < 2 || t.length > 300) return;
    if (!/[a-z]/i.test(t)) return;
    if (seen[t]) return;
    seen[t] = 1;
    out.push(t);
  });
  return out;
}

/* Find a labelled section: try class/id selectors first, then look
   for a heading whose text matches and walk forward to the next list. */
function listNear(doc, headingRe, selector) {
  const direct = textsOf(doc.querySelectorAll(selector));
  if (direct.length >= 2) return direct;

  const heads = doc.querySelectorAll("h1,h2,h3,h4,h5,h6,strong,b,legend,summary,div,p,span");
  for (const h of heads) {
    const label = (h.textContent || "").trim();
    if (label.length > 40 || !headingRe.test(label)) continue;

    // Walk forward from the heading, and up a level if needed.
    let node = h, hops = 0;
    while (node && hops < 10) {
      let sib = node.nextElementSibling, steps = 0;
      while (sib && steps < 6) {
        if (sib.tagName === "UL" || sib.tagName === "OL") {
          const found = textsOf(sib.querySelectorAll("li"));
          if (found.length >= 2) return found;
        }
        const nested = sib.querySelectorAll ? sib.querySelectorAll("li") : [];
        if (nested.length >= 2) {
          const found = textsOf(nested);
          if (found.length >= 2) return found;
        }
        sib = sib.nextElementSibling;
        steps++;
      }
      node = node.parentElement;
      hops++;
    }
  }
  return [];
}

/* Guard against grabbing a nav menu or a list of related recipes. */
function looksLikeIngredients(lines) {
  if (!lines || lines.length < 2) return false;
  const unitish = /\b(cups?|tbsp|tablespoons?|tsp|teaspoons?|ounces?|oz|pounds?|lbs?|grams?|kg|ml|cloves?|pinch|cans?|sprigs?|slices?|sticks?|bunch)\b/i;
  const qty = new RegExp("^" + NUM_PAT);
  const hits = lines.filter(function (l) { return qty.test(l) || unitish.test(l); }).length;
  return hits >= Math.max(2, Math.floor(lines.length * 0.4));
}

function guessTitle(doc) {
  const h1 = doc.querySelector("h1");
  if (h1 && (h1.textContent || "").trim()) return decodeEntities(h1.textContent).slice(0, 120);
  const og = doc.querySelector('meta[property="og:title"]');
  let t = (og && og.getAttribute("content")) || doc.title || "";
  t = decodeEntities(t).replace(/\s+[-|\u2013]\s+[^-|\u2013]{2,40}$/, "").trim();
  return t || "Untitled";
}

function guessServings(doc) {
  const txt = (doc.body && doc.body.textContent) || "";
  const m = txt.match(/(\d+)\s*servings?\b/i) || txt.match(/serves\s*(\d+)/i) || txt.match(/yield[^\d]{0,12}(\d+)/i);
  const n = m ? Number(m[1]) : 4;
  return n > 0 && n < 100 ? n : 4;
}

/* Try each strategy in order of how much we trust it. */
function fromHtml(html) {
  let doc;
  try { doc = new DOMParser().parseFromString(html, "text/html"); }
  catch (e) { return null; }
  if (!doc) return null;
  return fromJsonLd(doc) || fromMicrodata(doc) || fromHeadings(doc);
}

/* ── pasted text ── */

function fromText(text) {
  const lines = String(text).split(/\r?\n/).map(function (l) { return l.trim(); }).filter(Boolean);
  if (!lines.length) return null;

  let title = "Untitled";
  if (!/^\d/.test(lines[0]) && lines[0].length < 90) title = lines[0];

  const startsWithQty = new RegExp("^" + NUM_PAT + "\\b|^" + FRAC_CLASS);
  const ingHeader = /^ingredients?\b/i;
  const insHeader = /^(instructions?|directions?|method|steps|preparation)\b/i;

  const ing = [], ins = [];
  let mode = null;

  for (const line of lines) {
    if (ingHeader.test(line) && line.length < 30) { mode = "ing"; continue; }
    if (insHeader.test(line) && line.length < 30) { mode = "ins"; continue; }
    if (mode === "ing") { ing.push(line); continue; }
    if (mode === "ins") { ins.push(line.replace(/^\d+[.)]\s*/, "")); continue; }
    if (startsWithQty.test(line) && line.length < 120) ing.push(line);
    else if (line.length > 40) ins.push(line.replace(/^\d+[.)]\s*/, ""));
  }

  const ingredients = ing.map(parseIngredient).filter(Boolean);
  if (!ingredients.length) return null;

  const sm = text.match(/serves\s+(\d+)|(\d+)\s+servings/i);
  const servings = sm ? Number(sm[1] || sm[2]) : 4;

  return { title, servings, ingredients, instructions: ins };
}

/* ── fetching a page from the browser ──
   A page can't read another site's HTML directly; CORS forbids it,
   so something else has to fetch on our behalf.

   Each source is tried in turn and only counts as a success if the
   result actually parses into a recipe. That matters: a blocked
   request often returns a perfectly valid Cloudflare page, and
   judging by response size alone would accept it and stop. */

function enc(u) { return encodeURIComponent(u); }

async function fetchWithTimeout(url, ms) {
  const ctrl = new AbortController();
  const timer = setTimeout(function () { ctrl.abort(); }, ms || 12000);
  try {
    return await fetch(url, { signal: ctrl.signal });
  } finally {
    clearTimeout(timer);
  }
}

async function getText(url, ms) {
  const res = await fetchWithTimeout(url, ms);
  if (!res.ok) return null;
  const body = await res.text();
  return body && body.length > 300 ? body : null;
}

const SOURCES = [
  {
    // Our own function: a real browser User-Agent and a clean IP.
    name: "own server",
    kind: "html",
    get: async function (url) {
      if (!EXTRACT_ENDPOINT) return null;
      const res = await fetchWithTimeout(EXTRACT_ENDPOINT + "?u=" + enc(url), 20000);
      if (!res.ok) return null;
      const data = await res.json().catch(function () { return null; });
      return data && data.html ? data.html : null;
    },
  },
  { name: "allorigins", kind: "html",
    get: function (url) { return getText("https://api.allorigins.win/raw?url=" + enc(url)); } },
  { name: "codetabs", kind: "html",
    get: function (url) { return getText("https://api.codetabs.com/v1/proxy?quest=" + enc(url)); } },
  { name: "corsproxy", kind: "html",
    get: function (url) { return getText("https://corsproxy.io/?url=" + enc(url)); } },
  {
    // Last resort: returns readable text rather than HTML, so the
    // structured data is gone and we fall back to reading it like
    // pasted text. Works on some sites that block everything else.
    name: "text reader",
    kind: "text",
    get: function (url) { return getText("https://r.jina.ai/" + url, 20000); },
  },
];

function stripMarkdown(t) {
  return String(t)
    .replace(/^#{1,6}\s*/gm, "")
    .replace(/^\s*[-*+]\s+/gm, "")
    .replace(/\*\*|__/g, "")
    .replace(/\[([^\]]*)\]\([^)]*\)/g, "$1");
}

function titleFromUrl(url) {
  try {
    const parts = new URL(url).pathname.split("/").filter(Boolean);
    const slug = parts.reverse().find(function (p) { return /[a-z]{3}/i.test(p) && !/^\d+$/.test(p); });
    if (!slug) return "Untitled";
    return slug.replace(/[-_]+/g, " ").replace(/\.\w+$/, "")
               .replace(/\b\w/g, function (c) { return c.toUpperCase(); }).slice(0, 80);
  } catch (e) { return "Untitled"; }
}

async function extractRecipe(value, isUrl) {
  if (!isUrl) {
    const parsed = fromText(value);
    if (!parsed) throw new Error("No ingredient lines found. Include the amounts, one ingredient per line.");
    return parsed;
  }

  let reached = false;

  for (const src of SOURCES) {
    let content = null;
    try { content = await src.get(value); } catch (e) { continue; }
    if (!content) continue;
    reached = true;

    const parsed = src.kind === "text" ? fromText(stripMarkdown(content)) : fromHtml(content);
    if (parsed && parsed.ingredients && parsed.ingredients.length >= 2) {
      if (!parsed.title || parsed.title === "Untitled") parsed.title = titleFromUrl(value);
      return parsed;
    }
  }

  throw new Error(
    reached
      ? "Reached that page but couldn't find an ingredient list — it may be behind a paywall or built by scripts. Copy the ingredients and paste them here."
      : "That site is blocking automated access. Deploy api/extract.js for a better shot, or paste the ingredients here."
  );
}

/* ── households ──
   Recipes, the planner and the pantry belong to a household, not a
   person, so everyone in the house sees the same box. Your own
   household is created on first sign-in with your uid as its id.
   Joining someone else's just repoints users/{uid}.householdId. */

const CODE_ALPHABET = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // no I, O, 0, 1

function makeCode() {
  let out = "";
  const bytes = new Uint8Array(6);
  (window.crypto || window.msCrypto).getRandomValues(bytes);
  for (const b of bytes) out += CODE_ALPHABET[b % CODE_ALPHABET.length];
  return out;
}

function pendingInvite() {
  try {
    const code = new URLSearchParams(location.search).get("join");
    return code ? code.trim().toUpperCase() : null;
  } catch (e) { return null; }
}

function clearInviteFromUrl() {
  try { history.replaceState({}, "", location.pathname); } catch (e) { /* ignore */ }
}

/* Move a solo user's existing box into their new household, once. */
async function migrateLegacy(F, uid, hid) {
  const { db, collection, doc, getDoc, getDocs, setDoc } = F;
  try {
    const already = await getDocs(collection(db, "households", hid, "recipes"));
    if (!already.empty) return;

    const old = await getDocs(collection(db, "users", uid, "recipes"));
    for (const d of old.docs) {
      await setDoc(doc(db, "households", hid, "recipes", d.id), d.data());
    }
    for (const key of ["plan", "pantry", "checked"]) {
      const one = await getDoc(doc(db, "users", uid, "state", key));
      if (one.exists()) await setDoc(doc(db, "households", hid, "state", key), one.data());
    }
  } catch (e) {
    // Nothing to move, or no access to the old path. Not fatal.
  }
}

function memberEntry(u) {
  return {
    name: u.displayName || (u.email || "").split("@")[0] || "Cook",
    email: u.email || "",
    joinedAt: Date.now(),
  };
}

async function joinWithCode(F, u, code) {
  const { db, doc, getDoc, setDoc, updateDoc, arrayUnion } = F;
  const invite = await getDoc(doc(db, "invites", code));
  if (!invite.exists()) throw new Error("That invite code isn't valid. Ask for a new one.");

  const target = invite.data().householdId;
  if (!target) throw new Error("That invite is missing its household.");

  const patch = { memberIds: arrayUnion(u.uid), joinCode: code };
  patch["members." + u.uid] = memberEntry(u);
  await updateDoc(doc(db, "households", target), patch);
  await setDoc(doc(db, "users", u.uid), { householdId: target }, { merge: true });
  return target;
}

async function resolveHousehold(F, u) {
  const { db, doc, getDoc, setDoc } = F;
  const userRef = doc(db, "users", u.uid);

  let hid = null;
  const mine = await getDoc(userRef).catch(function () { return null; });
  if (mine && mine.exists()) hid = mine.data().householdId || null;

  const code = pendingInvite();
  if (code) {
    clearInviteFromUrl();
    try {
      const joined = await joinWithCode(F, u, code);
      if (joined) return joined;
    } catch (e) {
      // Fall through to their existing or new household; surfaced by caller.
      if (!hid) {
        hid = u.uid;
      }
      throw Object.assign(e, { fallback: hid });
    }
  }

  if (hid) return hid;

  hid = u.uid; // your own household shares your uid — no lookup needed
  await setDoc(doc(db, "households", hid), {
    name: (u.displayName ? u.displayName.split(" ")[0] + "'s Kitchen" : "My Kitchen"),
    memberIds: [u.uid],
    members: { [u.uid]: memberEntry(u) },
    createdAt: Date.now(),
  }, { merge: true });
  await setDoc(userRef, { householdId: hid }, { merge: true });
  await migrateLegacy(F, u.uid, hid);
  return hid;
}

/* ── dates for the weekly planner ── */

const DAY_NAMES = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const MONTH_NAMES = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

function dayKey(d) {
  return d.getFullYear() + "-" +
    String(d.getMonth() + 1).padStart(2, "0") + "-" +
    String(d.getDate()).padStart(2, "0");
}

function startOfWeek(d) {
  const x = new Date(d);
  x.setHours(0, 0, 0, 0);
  x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); // weeks run Monday to Sunday
  return x;
}

function addDays(d, n) {
  const x = new Date(d);
  x.setDate(x.getDate() + n);
  return x;
}

function shortDate(d) {
  return MONTH_NAMES[d.getMonth()] + " " + d.getDate();
}

function RecipeBox() {
  const [fb, setFb] = useState(null);
  const [user, setUser] = useState(null);
  const [authReady, setAuthReady] = useState(false);
  const [signingIn, setSigningIn] = useState(false);
  const [authError, setAuthError] = useState("");

  const [hid, setHid] = useState(null);
  const [household, setHousehold] = useState(null);
  const [houseError, setHouseError] = useState("");
  const [inviteCode, setInviteCode] = useState("");
  const [joinInput, setJoinInput] = useState("");
  const [houseBusy, setHouseBusy] = useState(false);

  const [recipes, setRecipes] = useState([]);
  const [days, setDays] = useState({});
  const [weekStart, setWeekStart] = useState(startOfWeek(new Date()));
  const [addingTo, setAddingTo] = useState(null);
  const [pantry, setPantry] = useState(DEFAULT_PANTRY);
  const [checked, setChecked] = useState({});

  const [tab, setTab] = useState("cards");
  const [input, setInput] = useState("");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");
  const [open, setOpen] = useState(null);
  const [filterCuisine, setFilterCuisine] = useState("");
  const [filterMeal, setFilterMeal] = useState("");
  const [showPantryBlock, setShowPantryBlock] = useState(false);

  const seeded = useRef(false);
  const migrated = useRef(false);

  /* ── Boot: load SDK, settle any redirect, watch auth state ── */
  useEffect(() => {
    let stop;
    window.FB_READY.then(F => {
      setFb(F);
      // If we came back from a redirect sign-in, let it resolve first.
      F.getRedirectResult(F.auth)
        .catch(e => {
          if (e.code === "auth/unauthorized-domain") {
            setAuthError("This domain isn't authorized. Add it in Firebase → Authentication → Settings → Authorized domains.");
          } else if (e.code) {
            setAuthError("Sign-in failed: " + e.code);
          }
        })
        .finally(() => {
          stop = F.onAuthStateChanged(F.auth, u => {
            setUser(u || null);
            setAuthReady(true);
            setSigningIn(false);
          });
        });
    });
    return () => { if (stop) stop(); };
  }, []);

  /* ── Work out which household this user belongs to ── */
  useEffect(() => {
    if (!fb || !user) { setHid(null); return; }
    let cancelled = false;
    resolveHousehold(fb, user)
      .then(id => { if (!cancelled) setHid(id); })
      .catch(e => {
        if (cancelled) return;
        setHouseError(e.message || "Couldn't open your household.");
        if (e.fallback) setHid(e.fallback);
      });
    return () => { cancelled = true; };
  }, [fb, user]);

  /* ── Subscribe to the household's data ── */
  useEffect(() => {
    if (!fb || !user || !hid) return;
    const { db, collection, doc, onSnapshot, setDoc } = fb;

    const unsubHouse = onSnapshot(doc(db, "households", hid), d => {
      setHousehold(d.exists() ? d.data() : null);
    }, () => setHousehold(null));

    const unsubRecipes = onSnapshot(
      collection(db, "households", hid, "recipes"),
      snap => {
        const rows = [];
        snap.forEach(d => rows.push(Object.assign({ id: d.id }, d.data())));
        rows.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
        setRecipes(rows);
      },
      e => setError("Firestore read blocked (" + e.code + "). Check the security rules.")
    );

    const unsubPlan = onSnapshot(doc(db, "households", hid, "state", "plan"), d => {
      const data = d.exists() ? d.data() : {};
      if (data.days) { setDays(data.days); return; }

      // One-time move from the old { recipeId: multiplier } shape.
      if (data.map && Object.keys(data.map).length && !migrated.current) {
        migrated.current = true;
        const today = dayKey(new Date());
        const moved = {};
        moved[today] = Object.keys(data.map)
          .filter(k => data.map[k])
          .map(k => ({ rid: k, mult: data.map[k] }));
        setDays(moved);
        setDoc(doc(db, "households", hid, "state", "plan"), { days: moved });
        return;
      }
      setDays({});
    });

    const unsubPantry = onSnapshot(doc(db, "households", hid, "state", "pantry"), d => {
      if (d.exists()) setPantry(d.data().items || DEFAULT_PANTRY);
      else if (!seeded.current) {
        seeded.current = true;
        setDoc(doc(db, "households", hid, "state", "pantry"), { items: DEFAULT_PANTRY });
      }
    });

    const unsubChecked = onSnapshot(doc(db, "households", hid, "state", "checked"), d => {
      setChecked(d.exists() ? (d.data().map || {}) : {});
    });

    return () => { unsubHouse(); unsubRecipes(); unsubPlan(); unsubPantry(); unsubChecked(); };
  }, [fb, user, hid]);

  /* ── Writers ── */
  function writeState(key, payload) {
    if (!fb || !hid) return;
    fb.setDoc(fb.doc(fb.db, "households", hid, "state", key), payload);
  }
  function writeDays(next) {
    setDays(next);
    writeState("plan", { days: next });
  }
  function assignRecipe(key, rid) {
    const list = (days[key] || []).concat([{ rid: rid, mult: 1 }]);
    writeDays(Object.assign({}, days, { [key]: list }));
    setAddingTo(null);
  }
  function unassign(key, idx) {
    const list = (days[key] || []).filter((_, i) => i !== idx);
    const next = Object.assign({}, days);
    if (list.length) next[key] = list; else delete next[key];
    writeDays(next);
  }
  function setMult(key, idx, mult) {
    const list = (days[key] || []).map((a, i) => i === idx ? Object.assign({}, a, { mult: mult }) : a);
    writeDays(Object.assign({}, days, { [key]: list }));
  }
  function clearWeek() {
    const next = Object.assign({}, days);
    weekDates.forEach(d => { delete next[dayKey(d)]; });
    writeDays(next);
  }
  function setPantryList(items) {
    setPantry(items);
    writeState("pantry", { items });
  }
  function toggleChecked(key) {
    const next = Object.assign({}, checked, { [key]: !checked[key] });
    setChecked(next);
    writeState("checked", { map: next });
  }
  async function saveRecipe(recipe) {
    if (!fb || !hid) return;
    const tagged = tagRecipe(Object.assign({}, recipe));
    await fb.addDoc(
      fb.collection(fb.db, "households", hid, "recipes"),
      Object.assign({ createdAt: Date.now() }, tagged)
    );
  }

  async function updateRecipe(id, patch) {
    if (!fb || !hid) return;
    await fb.setDoc(fb.doc(fb.db, "households", hid, "recipes", id), patch, { merge: true });
  }
  async function removeRecipe(id) {
    if (!fb || !hid) return;
    await fb.deleteDoc(fb.doc(fb.db, "households", hid, "recipes", id));
    // Drop it from every day it was scheduled on.
    const next = {};
    Object.keys(days).forEach(k => {
      const kept = days[k].filter(a => a.rid !== id);
      if (kept.length) next[k] = kept;
    });
    writeDays(next);
  }

  /* ── Auth actions ──
     Popup first: it keeps you on the page. Mobile browsers block
     popups often enough that redirect is the necessary fallback. */
  async function signIn() {
    if (!fb || signingIn) return;
    setSigningIn(true);
    setAuthError("");
    const provider = new fb.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: "select_account" });
    try {
      await fb.signInWithPopup(fb.auth, provider);
    } catch (e) {
      const code = e.code || "";
      if (code === "auth/popup-blocked" ||
          code === "auth/cancelled-popup-request" ||
          code === "auth/operation-not-supported-in-this-environment") {
        try {
          await fb.signInWithRedirect(fb.auth, provider);
          return; // page navigates away
        } catch (e2) {
          setAuthError("Sign-in failed: " + (e2.code || "unknown"));
        }
      } else if (code === "auth/popup-closed-by-user") {
        // Nothing to report — they changed their mind.
      } else if (code === "auth/operation-not-allowed") {
        setAuthError("Enable Google sign-in: Firebase console \u2192 Authentication \u2192 Sign-in method.");
      } else if (code === "auth/unauthorized-domain") {
        setAuthError("This domain isn't authorized. Add it in Firebase \u2192 Authentication \u2192 Settings \u2192 Authorized domains.");
      } else {
        setAuthError("Sign-in failed: " + (code || "unknown"));
      }
      setSigningIn(false);
    }
  }

  /* ── Household actions ── */
  async function createInvite() {
    if (!fb || !hid || houseBusy) return;
    setHouseBusy(true); setHouseError("");
    try {
      const code = makeCode();
      await fb.setDoc(fb.doc(fb.db, "invites", code), {
        householdId: hid,
        createdBy: user.uid,
        createdAt: Date.now(),
      });
      setInviteCode(code);
    } catch (e) {
      setHouseError("Couldn't create an invite: " + (e.code || e.message));
    } finally {
      setHouseBusy(false);
    }
  }

  async function joinHousehold() {
    const code = joinInput.trim().toUpperCase();
    if (!fb || !code || houseBusy) return;
    setHouseBusy(true); setHouseError("");
    try {
      const joined = await joinWithCode(fb, user, code);
      setJoinInput("");
      setInviteCode("");
      setHid(joined);
    } catch (e) {
      setHouseError(e.message || "Couldn't join with that code.");
    } finally {
      setHouseBusy(false);
    }
  }

  async function renameHousehold(name) {
    if (!fb || !hid) return;
    await fb.setDoc(fb.doc(fb.db, "households", hid), { name: name }, { merge: true });
  }

  async function leaveHousehold() {
    if (!fb || !hid || hid === user.uid) return;
    setHouseBusy(true); setHouseError("");
    try {
      const patch = { memberIds: fb.arrayRemove(user.uid) };
      patch["members." + user.uid] = fb.deleteField();
      await fb.updateDoc(fb.doc(fb.db, "households", hid), patch);
      await fb.setDoc(fb.doc(fb.db, "users", user.uid), { householdId: user.uid }, { merge: true });
      setRecipes([]); setDays({}); setHousehold(null);
      setHid(user.uid);
    } catch (e) {
      setHouseError("Couldn't leave: " + (e.code || e.message));
    } finally {
      setHouseBusy(false);
    }
  }

  const isUrl = /^https?:\/\/\S+$/i.test(input.trim());

  async function fileCard() {
    const value = input.trim();
    if (!value || busy) return;
    setBusy(true); setError("");
    try {
      const parsed = await extractRecipe(value, isUrl);
      await saveRecipe({
        title: parsed.title || "Untitled",
        servings: parsed.servings || 4,
        cuisine: parsed.cuisine || null,
        meal: parsed.meal || null,
        sourceUrl: isUrl ? value : "",
        ingredients: (parsed.ingredients || []).map(g => ({
          qty: typeof g.qty === "number" ? g.qty : null,
          unit: g.unit || null,
          item: g.item || "",
          prep: g.prep || "",
          raw: g.raw || "",
          category: CATEGORIES.indexOf(g.category) > -1 ? g.category : "other",
        })),
        instructions: parsed.instructions || [],
      });
      setInput("");
    } catch (e) {
      setError(e.message || "That didn't work. Try pasting the recipe text.");
    } finally {
      setBusy(false);
    }
  }

  async function loadSamples() {
    for (const s of SAMPLES) await saveRecipe(s);
  }

  const pantryMap = useMemo(() => {
    const m = {};
    pantry.forEach(p => { m[p.c] = p.have; });
    return m;
  }, [pantry]);

  const weekDates = useMemo(
    () => [0,1,2,3,4,5,6].map(i => addDays(weekStart, i)),
    [weekStart]
  );

  /* Everything cooked in the week currently on screen. */
  const weekPlan = useMemo(() => {
    const out = [];
    weekDates.forEach(d => {
      (days[dayKey(d)] || []).forEach(a => {
        const recipe = recipes.find(r => r.id === a.rid);
        if (recipe) out.push({ recipe, mult: a.mult || 1 });
      });
    });
    return out;
  }, [days, weekDates, recipes]);

  /* The merge: canonical name + unit family is the bucket key. */
  const list = useMemo(() => {
    const buckets = {};
    weekPlan.forEach(entry => {
      const r = entry.recipe;
      const mult = entry.mult;
      (r.ingredients || []).forEach(g => {
        const canon = canonicalize(g.item);
        if (!canon) return;
        const info = unitInfo(g.unit);
        const key = canon + "||" + info.family;
        if (!buckets[key]) {
          buckets[key] = { canon, family:info.family, metric:false, base:0,
            unmeasured:false, category:g.category, from:new Set() };
        }
        const b = buckets[key];
        if (info.metric) b.metric = true;
        if (g.qty == null) b.unmeasured = true;
        else b.base += g.qty * info.factor * mult;
        b.from.add(r.title);
      });
    });
    const rows = Object.keys(buckets).map(k => {
      const b = buckets[k];
      const d = b.base > 0 ? display(b.base, b.family, b.metric) : { q:"", u:"" };
      return {
        key: b.canon + b.family,
        canon: b.canon,
        amount: b.base > 0 ? (d.q + " " + d.u).trim() : (b.unmeasured ? "as needed" : ""),
        category: b.category,
        from: Array.from(b.from),
        inPantry: pantryMap[b.canon] === true,
      };
    });
    rows.sort((a, b) => a.canon.localeCompare(b.canon));
    return rows;
  }, [weekPlan, pantryMap]);

  const needed = list.filter(r => !r.inPantry);
  const skipped = list.filter(r => r.inPantry);

  const grouped = useMemo(() => {
    const g = {};
    needed.forEach(r => { (g[r.category] = g[r.category] || []).push(r); });
    return CATEGORIES.filter(c => g[c]).map(c => [c, g[c]]);
  }, [needed]);

  const members = (household && household.members) || {};
  const memberIds = Object.keys(members);
  const memberCount = memberIds.length;
  const shared = memberCount > 1;
  const shareLink = inviteCode
    ? location.origin + location.pathname + "?join=" + inviteCode
    : "";

  const plannedCount = weekPlan.length;
  const weekLabel = shortDate(weekDates[0]) + " \u2013 " + shortDate(weekDates[6]);
  const thisWeek = dayKey(weekStart) === dayKey(startOfWeek(new Date()));
  const todayKey = dayKey(new Date());

  const usedCuisines = CUISINES.filter(c => recipes.some(r => r.cuisine === c));
  const usedMeals = MEALS.filter(m => recipes.some(r => r.meal === m));
  const visibleRecipes = recipes.filter(r =>
    (!filterCuisine || r.cuisine === filterCuisine) &&
    (!filterMeal || r.meal === filterMeal)
  );

  /* ── Gate: nothing renders until we know who you are ── */
  if (!authReady) {
    return (
      <div className="flex min-h-screen items-center justify-center bg-[#38423A] px-6">
        <p className="font-mono text-[11px] uppercase tracking-[0.2em] text-[#7E8B78]">Opening the box…</p>
      </div>
    );
  }

  if (!user) {
    return (
      <div className="flex min-h-screen items-center justify-center bg-[#38423A] px-5 py-10">
        <div className="w-full max-w-sm">
          <Card className="px-6 pb-6 pt-5">
            <h1 className="font-mono text-[13px] uppercase tracking-[0.24em] text-[#2B2A26]">Recipe Box</h1>
            <div className="mt-2 border-t-2 border-[#C6484A] pt-3">
              <p className="font-serif text-[15px] leading-6 text-[#5C574A]">
                Paste a link. Get a card. Shop once.
              </p>
              <p className="mt-2 font-serif text-[14px] leading-6 text-[#8A8272]">
                {pendingInvite()
                  ? "You've been invited to a recipe box. Sign in and you'll be added to it."
                  : "Sign in and your cards, meal plan, and pantry follow you to any device."}
              </p>
            </div>

            <button
              onClick={signIn}
              disabled={signingIn}
              className="mt-5 w-full rounded-sm bg-[#C6484A] px-4 py-2.5 font-mono text-[11px] uppercase tracking-[0.14em] text-[#FDFBF4] transition-opacity hover:opacity-90 disabled:opacity-40"
            >
              {signingIn ? "Signing in…" : "Continue with Google"}
            </button>

            {authError && (
              <p className="mt-3 border-l-2 border-[#C6484A] pl-2 font-serif text-[13px] leading-5 text-[#8A3A3C]">
                {authError}
              </p>
            )}
          </Card>
        </div>
      </div>
    );
  }

  return (
    <div className="min-h-screen w-full bg-[#38423A] px-4 py-6 sm:px-8 sm:py-10">
      <div className="mx-auto max-w-3xl">

        <header className="mb-6 flex items-end justify-between gap-4">
          <div>
            <h1 className="font-mono text-[13px] uppercase tracking-[0.3em] text-[#E8D9AE]">Recipe Box</h1>
            <p className="mt-1 font-serif text-sm italic text-[#9FAC99]">
              {shared && household && household.name ? household.name : "Paste a link. Get a card. Shop once."}
            </p>
          </div>
          <div className="text-right">
            <p className="max-w-[10rem] truncate font-mono text-[10px] uppercase tracking-[0.14em] text-[#7E8B78]">
              {user.displayName || user.email}
            </p>
            <button onClick={() => fb.signOut(fb.auth)}
              className="mt-0.5 font-mono text-[10px] uppercase tracking-[0.12em] text-[#8E9A88] underline underline-offset-2 hover:text-[#E8D9AE]">
              Sign out
            </button>
          </div>
        </header>

        <nav className="flex flex-wrap gap-1 px-1">
          <Tab active={tab === "cards"} onClick={() => setTab("cards")} count={recipes.length}>Cards</Tab>
          <Tab active={tab === "plan"} onClick={() => setTab("plan")} count={plannedCount}>Plan</Tab>
          <Tab active={tab === "list"} onClick={() => setTab("list")} count={needed.length}>List</Tab>
          <Tab active={tab === "pantry"} onClick={() => setTab("pantry")}>Pantry</Tab>
          <Tab active={tab === "house"} onClick={() => setTab("house")} count={memberCount > 1 ? memberCount : 0}>House</Tab>
        </nav>

        <main className="rounded-md rounded-tl-none border border-[#C9B889] bg-[#E8D9AE] p-3 sm:p-4">

          {tab === "cards" && (
            <div className="space-y-3">
              <Card className="p-3">
                <label className="mb-1.5 block font-mono text-[10px] uppercase tracking-[0.16em] text-[#8A8272]">
                  Recipe URL, or paste the recipe text
                </label>
                <textarea
                  value={input} onChange={e => setInput(e.target.value)}
                  onKeyDown={e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) fileCard(); }}
                  rows={input.indexOf("\n") > -1 ? 6 : 2}
                  placeholder="https://..."
                  className="w-full resize-y rounded-sm border border-[#D8D2BF] bg-white/60 p-2.5 font-serif text-[15px] text-[#2B2A26] placeholder:text-[#B0AA98] focus:border-[#C6484A] focus:outline-none"
                />
                <div className="mt-2 flex items-center gap-3">
                  <button onClick={fileCard} disabled={busy || !input.trim() || !user}
                    className="rounded-sm bg-[#C6484A] px-4 py-1.5 font-mono text-[11px] uppercase tracking-[0.14em] text-[#FDFBF4] transition-opacity hover:opacity-90 disabled:opacity-35">
                    {busy ? "Reading\u2026" : "File card"}
                  </button>
                  <span className="font-mono text-[10px] uppercase tracking-[0.12em] text-[#A9A292]">
                    {isUrl ? "Will fetch the page" : input.trim() ? "Will read pasted text" : "\u2318\u21B5 to file"}
                  </span>
                </div>
                {error && (
                  <p className="mt-2 border-l-2 border-[#C6484A] pl-2 font-serif text-[13px] text-[#8A3A3C]">{error}</p>
                )}
              </Card>

              {recipes.length === 0 && !busy && user && (
                <Card className="p-6 text-center">
                  <p className="font-serif text-[15px] text-[#5C574A]">The box is empty.</p>
                  <button onClick={loadSamples}
                    className="mt-2 font-mono text-[11px] uppercase tracking-[0.14em] text-[#C6484A] underline underline-offset-4">
                    File two sample cards
                  </button>
                </Card>
              )}

              {recipes.length > 2 && (usedCuisines.length > 1 || usedMeals.length > 1) && (
                <div className="flex flex-wrap gap-1.5 px-1 pb-0.5">
                  {usedCuisines.map(c => (
                    <Chip key={c} active={filterCuisine === c}
                      onClick={() => setFilterCuisine(filterCuisine === c ? "" : c)}>{c}</Chip>
                  ))}
                  {usedMeals.map(m => (
                    <Chip key={m} active={filterMeal === m}
                      onClick={() => setFilterMeal(filterMeal === m ? "" : m)}>{m}</Chip>
                  ))}
                </div>
              )}

              {recipes.length > 0 && visibleRecipes.length === 0 && (
                <Card className="p-5 text-center font-serif text-[15px] text-[#5C574A]">
                  No cards match those filters.
                </Card>
              )}

              {visibleRecipes.map(r => (
                <Card key={r.id} className="overflow-hidden">
                  <button onClick={() => setOpen(open === r.id ? null : r.id)}
                    className="block w-full px-4 pb-3 pt-3.5 text-left">
                    <h2 className="font-mono text-[13px] uppercase tracking-[0.1em] text-[#2B2A26]">{r.title}</h2>
                    <div className="mt-1.5 border-t-2 border-[#C6484A] pt-1.5">
                      <span className="font-mono text-[10px] uppercase tracking-[0.12em] text-[#8A8272]">
                        Serves {r.servings} · {(r.ingredients || []).length} ingredients
                        {r.sourceUrl ? " \u00B7 " + (r.sourceUrl.match(/\/\/(?:www\.)?([^/]+)/) || [,"web"])[1] : ""}
                      </span>
                      {(r.cuisine || r.meal) && (
                        <div className="mt-2 flex flex-wrap gap-1">
                          {r.cuisine && <Tag>{r.cuisine}</Tag>}
                          {r.meal && <Tag>{r.meal}</Tag>}
                        </div>
                      )}
                    </div>
                  </button>

                  {open === r.id && (
                    <div className="px-4 pb-4">
                      <div className="mb-4 flex flex-wrap gap-4 border-b border-dotted border-[#DAD4C1] pb-3">
                        <Picker label="Cuisine" value={r.cuisine || "Other"} options={CUISINES}
                          onChange={v => updateRecipe(r.id, { cuisine: v })} />
                        <Picker label="Meal" value={r.meal || "Dinner"} options={MEALS}
                          onChange={v => updateRecipe(r.id, { meal: v })} />
                      </div>
                      <ul style={RULED} className="mb-4 leading-7">
                        {(r.ingredients || []).map((g, i) => (
                          <li key={i} className="font-serif text-[15px] text-[#2B2A26]">
                            <span className="text-[#6B6555]">{g.qty != null ? fmtQty(g.qty) : ""} {g.unit || ""}</span>{" "}
                            {g.item}
                            {g.prep && <span className="italic text-[#8A8272]">, {g.prep}</span>}
                          </li>
                        ))}
                      </ul>
                      <ol className="space-y-2">
                        {(r.instructions || []).map((s, i) => (
                          <li key={i} className="flex gap-2.5 font-serif text-[15px] leading-6 text-[#3A362C]">
                            <span className="mt-0.5 font-mono text-[10px] text-[#C6484A]">{i + 1}</span>
                            <span>{s}</span>
                          </li>
                        ))}
                      </ol>
                      <div className="mt-4 flex items-center justify-between gap-3 border-t border-dotted border-[#DAD4C1] pt-3">
                        {r.sourceUrl ? (
                          <a href={r.sourceUrl} target="_blank" rel="noopener noreferrer"
                            className="font-mono text-[10px] uppercase tracking-[0.12em] text-[#C6484A] underline underline-offset-2 hover:opacity-80">
                            Open original ↗
                          </a>
                        ) : <span />}
                        <button onClick={() => removeRecipe(r.id)}
                          className="font-mono text-[10px] uppercase tracking-[0.12em] text-[#A9A292] underline underline-offset-2 hover:text-[#C6484A]">
                          Remove card
                        </button>
                      </div>
                    </div>
                  )}
                </Card>
              ))}
            </div>
          )}

          {tab === "plan" && (
            <div className="space-y-2">
              <Card className="flex items-center justify-between gap-2 px-3 py-2.5">
                <button onClick={() => setWeekStart(addDays(weekStart, -7))}
                  aria-label="Previous week"
                  className="rounded-sm border border-[#DAD4C1] px-2.5 py-1 font-mono text-[12px] text-[#6B6555] hover:border-[#C6484A]">‹</button>
                <div className="text-center">
                  <p className="font-mono text-[11px] uppercase tracking-[0.14em] text-[#2B2A26]">{weekLabel}</p>
                  <button onClick={() => setWeekStart(startOfWeek(new Date()))}
                    disabled={thisWeek}
                    className="font-mono text-[9px] uppercase tracking-[0.12em] text-[#C6484A] underline underline-offset-2 disabled:text-[#B0AA98] disabled:no-underline">
                    {thisWeek ? "This week" : "Back to this week"}
                  </button>
                </div>
                <button onClick={() => setWeekStart(addDays(weekStart, 7))}
                  aria-label="Next week"
                  className="rounded-sm border border-[#DAD4C1] px-2.5 py-1 font-mono text-[12px] text-[#6B6555] hover:border-[#C6484A]">›</button>
              </Card>

              {recipes.length === 0 && (
                <Card className="p-6 text-center font-serif text-[15px] text-[#5C574A]">
                  File a card first, then schedule it onto a day.
                </Card>
              )}

              {recipes.length > 0 && weekDates.map(d => {
                const key = dayKey(d);
                const entries = days[key] || [];
                const isToday = key === todayKey;
                return (
                  <Card key={key} className={"px-3 pb-2.5 pt-2.5 " + (isToday ? "ring-1 ring-[#C6484A]" : "")}>
                    <div className="flex items-baseline justify-between">
                      <span className="font-mono text-[10px] uppercase tracking-[0.16em] text-[#2B2A26]">
                        {DAY_NAMES[(d.getDay() + 6) % 7]} {d.getDate()}
                        {isToday && <span className="ml-1.5 text-[#C6484A]">today</span>}
                      </span>
                      <button onClick={() => setAddingTo(addingTo === key ? null : key)}
                        className="font-mono text-[10px] uppercase tracking-[0.12em] text-[#C6484A] hover:opacity-70">
                        {addingTo === key ? "Close" : "+ Add"}
                      </button>
                    </div>

                    {entries.length === 0 && addingTo !== key && (
                      <p className="mt-1 font-serif text-[13px] italic text-[#B0AA98]">Nothing planned</p>
                    )}

                    {entries.map((a, i) => {
                      const r = recipes.find(x => x.id === a.rid);
                      if (!r) return null;
                      return (
                        <div key={key + i} className="mt-1.5 border-t border-dotted border-[#DAD4C1] pt-1.5">
                          <div className="flex items-start justify-between gap-2">
                            <span className="min-w-0 flex-1 font-serif text-[15px] leading-5 text-[#2B2A26]">{r.title}</span>
                            <button onClick={() => unassign(key, i)} aria-label="Remove from this day"
                              className="font-mono text-[13px] leading-4 text-[#B0AA98] hover:text-[#C6484A]">×</button>
                          </div>
                          <div className="mt-1 flex items-center gap-1">
                            {[0.5, 1, 2].map(m => (
                              <button key={m} onClick={() => setMult(key, i, m)}
                                className={
                                  "w-9 rounded-sm border py-0.5 font-mono text-[10px] transition-colors " +
                                  ((a.mult || 1) === m
                                    ? "border-[#C6484A] bg-[#C6484A] text-[#FDFBF4]"
                                    : "border-[#DAD4C1] text-[#6B6555] hover:border-[#C6484A]")
                                }>
                                {m === 0.5 ? "\u00BD\u00D7" : m + "\u00D7"}
                              </button>
                            ))}
                            <span className="ml-1 font-mono text-[9px] uppercase tracking-[0.12em] text-[#A9A292]">
                              serves {Math.round(r.servings * (a.mult || 1))}
                            </span>
                          </div>
                        </div>
                      );
                    })}

                    {addingTo === key && (
                      <div className="mt-2 border-t border-dotted border-[#DAD4C1] pt-2">
                        {(usedCuisines.length > 1 || usedMeals.length > 1) && (
                          <div className="mb-2 flex flex-wrap gap-1.5">
                            {usedCuisines.map(c => (
                              <Chip key={c} active={filterCuisine === c}
                                onClick={() => setFilterCuisine(filterCuisine === c ? "" : c)}>{c}</Chip>
                            ))}
                            {usedMeals.map(m => (
                              <Chip key={m} active={filterMeal === m}
                                onClick={() => setFilterMeal(filterMeal === m ? "" : m)}>{m}</Chip>
                            ))}
                          </div>
                        )}
                        <div className="max-h-56 space-y-1 overflow-y-auto">
                          {visibleRecipes.map(r => (
                            <button key={r.id} onClick={() => assignRecipe(key, r.id)}
                              className="block w-full rounded-sm border border-[#DAD4C1] px-2 py-1.5 text-left font-serif text-[14px] text-[#2B2A26] hover:border-[#C6484A]">
                              {r.title}
                              <span className="ml-1.5 font-mono text-[9px] uppercase tracking-[0.1em] text-[#A9A292]">
                                {[r.cuisine, r.meal].filter(Boolean).join(" \u00B7 ")}
                              </span>
                            </button>
                          ))}
                          {visibleRecipes.length === 0 && (
                            <p className="py-2 text-center font-serif text-[13px] italic text-[#B0AA98]">
                              No cards match those filters.
                            </p>
                          )}
                        </div>
                      </div>
                    )}
                  </Card>
                );
              })}

              {plannedCount > 0 && (
                <div className="pt-1 text-center">
                  <button onClick={clearWeek}
                    className="font-mono text-[10px] uppercase tracking-[0.12em] text-[#8E9A88] underline underline-offset-2 hover:text-[#E8D9AE]">
                    Clear this week
                  </button>
                </div>
              )}
            </div>
          )}

          {tab === "list" && (
            <div className="space-y-3">
              {needed.length === 0 ? (
                <Card className="p-6 text-center font-serif text-[15px] text-[#5C574A]">
                  Nothing to buy for {weekLabel}. Schedule some meals on the Plan tab.
                </Card>
              ) : (
                <React.Fragment>
                  <p className="px-1 pb-0.5 font-mono text-[10px] uppercase tracking-[0.16em] text-[#8A8272]">
                    For {weekLabel} · {plannedCount} {plannedCount === 1 ? "meal" : "meals"}
                  </p>
                  {grouped.map(pair => (
                    <Card key={pair[0]} className="px-4 pb-3 pt-3.5">
                      <h3 className="font-mono text-[10px] uppercase tracking-[0.18em] text-[#C6484A]">{pair[0]}</h3>
                      <ul style={RULED} className="mt-1.5 leading-7">
                        {pair[1].map(r => (
                          <li key={r.key}>
                            <label className="flex cursor-pointer items-baseline gap-2 font-serif text-[15px]">
                              <input type="checkbox" checked={!!checked[r.key]}
                                onChange={() => toggleChecked(r.key)} className="accent-[#C6484A]" />
                              <span className={checked[r.key] ? "text-[#B0AA98] line-through" : "text-[#2B2A26]"}>
                                {r.amount && <span className="text-[#6B6555]">{r.amount} </span>}
                                {r.canon}
                                {r.from.length > 1 && (
                                  <span className="ml-1 font-mono text-[9px] uppercase tracking-wider text-[#A9A292]">
                                    {r.from.length} recipes
                                  </span>
                                )}
                              </span>
                            </label>
                          </li>
                        ))}
                      </ul>
                    </Card>
                  ))}

                  {skipped.length > 0 && (
                    <Card className="px-4 py-3">
                      <button onClick={() => setShowPantryBlock(v => !v)}
                        className="font-mono text-[10px] uppercase tracking-[0.14em] text-[#8A8272] hover:text-[#C6484A]">
                        {showPantryBlock ? "\u2212" : "+"} Assumed in pantry ({skipped.length})
                      </button>
                      {showPantryBlock && (
                        <ul className="mt-2 space-y-0.5">
                          {skipped.map(r => (
                            <li key={r.key} className="font-serif text-[14px] text-[#A9A292]">
                              {r.amount ? r.amount + " " : ""}{r.canon}
                            </li>
                          ))}
                        </ul>
                      )}
                    </Card>
                  )}
                </React.Fragment>
              )}
            </div>
          )}

          {tab === "pantry" && (
            <Card className="px-4 pb-4 pt-3.5">
              <p className="font-mono text-[10px] uppercase tracking-[0.16em] text-[#8A8272]">
                Staples marked <span className="text-[#C6484A]">have</span> drop off the list
              </p>
              <ul className="mt-3 space-y-1">
                {pantry.map((p, i) => (
                  <li key={p.c + i} className="flex items-center justify-between border-b border-dotted border-[#DAD4C1] py-1.5">
                    <span className="font-serif text-[15px] text-[#2B2A26]">{p.c}</span>
                    <div className="flex gap-1">
                      {[true, false].map(v => (
                        <button key={String(v)}
                          onClick={() => setPantryList(pantry.map((x, j) => j === i ? Object.assign({}, x, { have: v }) : x))}
                          className={
                            "w-14 rounded-sm border py-1 font-mono text-[10px] uppercase tracking-[0.1em] transition-colors " +
                            (p.have === v ? "border-[#C6484A] bg-[#C6484A] text-[#FDFBF4]"
                                          : "border-[#DAD4C1] text-[#8A8272] hover:border-[#C6484A]")
                          }>
                          {v ? "Have" : "Need"}
                        </button>
                      ))}
                    </div>
                  </li>
                ))}
              </ul>
              <AddStaple onAdd={name => setPantryList(pantry.concat([{ c: canonicalize(name), have: true }]))} />
            </Card>
          )}
          {tab === "house" && (
            <div className="space-y-3">
              <Card className="px-4 pb-4 pt-3.5">
                <label className="mb-1.5 block font-mono text-[10px] uppercase tracking-[0.16em] text-[#8A8272]">
                  Household name
                </label>
                <input
                  value={(household && household.name) || ""}
                  onChange={e => renameHousehold(e.target.value)}
                  placeholder="My Kitchen"
                  className="w-full rounded-sm border border-[#DAD4C1] bg-white/60 px-2.5 py-1.5 font-serif text-[16px] text-[#2B2A26] placeholder:text-[#B0AA98] focus:border-[#C6484A] focus:outline-none"
                />
                <p className="mt-2 font-serif text-[13px] leading-5 text-[#8A8272]">
                  Everyone here shares one recipe box, one weekly plan, and one pantry.
                </p>
              </Card>

              <Card className="px-4 pb-4 pt-3.5">
                <h3 className="font-mono text-[10px] uppercase tracking-[0.18em] text-[#C6484A]">
                  {memberCount === 1 ? "Just you" : memberCount + " cooks"}
                </h3>
                <ul className="mt-2 space-y-1">
                  {memberIds.map(id => (
                    <li key={id} className="flex items-baseline justify-between border-b border-dotted border-[#DAD4C1] py-1.5">
                      <span className="font-serif text-[15px] text-[#2B2A26]">
                        {members[id].name || "Cook"}
                        {id === user.uid && <span className="ml-1.5 font-mono text-[9px] uppercase tracking-[0.12em] text-[#A9A292]">you</span>}
                      </span>
                      <span className="max-w-[9rem] truncate font-mono text-[9px] uppercase tracking-[0.1em] text-[#A9A292]">
                        {members[id].email}
                      </span>
                    </li>
                  ))}
                </ul>
              </Card>

              <Card className="px-4 pb-4 pt-3.5">
                <h3 className="font-mono text-[10px] uppercase tracking-[0.18em] text-[#C6484A]">Invite someone</h3>

                {!inviteCode ? (
                  <>
                    <p className="mt-1.5 font-serif text-[14px] leading-5 text-[#5C574A]">
                      Create a code and send it over. Anyone who uses it joins this box.
                    </p>
                    <button onClick={createInvite} disabled={houseBusy}
                      className="mt-3 rounded-sm bg-[#C6484A] px-4 py-1.5 font-mono text-[11px] uppercase tracking-[0.14em] text-[#FDFBF4] transition-opacity hover:opacity-90 disabled:opacity-40">
                      {houseBusy ? "Working\u2026" : "Create invite code"}
                    </button>
                  </>
                ) : (
                  <>
                    <p className="mt-2 select-all border-y-2 border-[#C6484A] py-2 text-center font-mono text-[22px] tracking-[0.3em] text-[#2B2A26]">
                      {inviteCode}
                    </p>
                    <div className="mt-3 flex flex-wrap gap-2">
                      <button
                        onClick={() => {
                          if (navigator.share) navigator.share({ title: "Join my recipe box", url: shareLink });
                          else navigator.clipboard.writeText(shareLink);
                        }}
                        className="rounded-sm bg-[#C6484A] px-3 py-1.5 font-mono text-[10px] uppercase tracking-[0.12em] text-[#FDFBF4] hover:opacity-90">
                        Share link
                      </button>
                      <button onClick={() => navigator.clipboard.writeText(inviteCode)}
                        className="rounded-sm border border-[#DAD4C1] px-3 py-1.5 font-mono text-[10px] uppercase tracking-[0.12em] text-[#6B6555] hover:border-[#C6484A]">
                        Copy code
                      </button>
                      <button onClick={() => setInviteCode("")}
                        className="rounded-sm border border-[#DAD4C1] px-3 py-1.5 font-mono text-[10px] uppercase tracking-[0.12em] text-[#8A8272] hover:border-[#C6484A]">
                        Done
                      </button>
                    </div>
                  </>
                )}
              </Card>

              <Card className="px-4 pb-4 pt-3.5">
                <h3 className="font-mono text-[10px] uppercase tracking-[0.18em] text-[#C6484A]">Join another household</h3>
                <p className="mt-1.5 font-serif text-[14px] leading-5 text-[#5C574A]">
                  Got a code? Entering it moves you to their box. Your own stays put.
                </p>
                <div className="mt-3 flex gap-2">
                  <input
                    value={joinInput}
                    onChange={e => setJoinInput(e.target.value.toUpperCase())}
                    onKeyDown={e => { if (e.key === "Enter") joinHousehold(); }}
                    placeholder="ABC123"
                    maxLength={6}
                    className="w-32 rounded-sm border border-[#DAD4C1] bg-white/60 px-2.5 py-1.5 text-center font-mono text-[16px] tracking-[0.2em] text-[#2B2A26] placeholder:text-[#B0AA98] focus:border-[#C6484A] focus:outline-none"
                  />
                  <button onClick={joinHousehold} disabled={houseBusy || joinInput.trim().length < 4}
                    className="rounded-sm border border-[#DAD4C1] px-3 font-mono text-[10px] uppercase tracking-[0.12em] text-[#6B6555] hover:border-[#C6484A] disabled:opacity-40">
                    Join
                  </button>
                </div>
              </Card>

              {hid !== user.uid && (
                <div className="pt-1 text-center">
                  <button onClick={leaveHousehold} disabled={houseBusy}
                    className="font-mono text-[10px] uppercase tracking-[0.12em] text-[#8E9A88] underline underline-offset-2 hover:text-[#E8D9AE]">
                    Leave this household
                  </button>
                </div>
              )}

              {houseError && (
                <Card className="px-4 py-3">
                  <p className="border-l-2 border-[#C6484A] pl-2 font-serif text-[13px] leading-5 text-[#8A3A3C]">{houseError}</p>
                </Card>
              )}
            </div>
          )}

        </main>

        <p className="mt-4 text-center font-mono text-[10px] uppercase tracking-[0.14em] text-[#6E7A69]">
          groceries-9a4b7 · saved as you go
        </p>
      </div>
    </div>
  );
}

function Tag({ children }) {
  return (
    <span className="rounded-sm border border-[#DAD4C1] bg-[#F4EFDF] px-1.5 py-0.5 font-mono text-[9px] uppercase tracking-[0.12em] text-[#8A8272]">
      {children}
    </span>
  );
}

function Chip({ active, children, onClick }) {
  return (
    <button
      onClick={onClick}
      className={
        "rounded-sm border px-2 py-1 font-mono text-[9px] uppercase tracking-[0.12em] transition-colors " +
        (active
          ? "border-[#C6484A] bg-[#C6484A] text-[#FDFBF4]"
          : "border-[#C9B889] bg-[#F4EFDF] text-[#6B6555] hover:border-[#C6484A]")
      }
    >
      {children}
    </button>
  );
}

function Picker({ label, value, options, onChange }) {
  return (
    <label className="flex items-center gap-2">
      <span className="font-mono text-[9px] uppercase tracking-[0.16em] text-[#A9A292]">{label}</span>
      <select
        value={value}
        onChange={e => onChange(e.target.value)}
        className="rounded-sm border border-[#DAD4C1] bg-white/70 px-1.5 py-1 font-mono text-[10px] uppercase tracking-[0.1em] text-[#2B2A26] focus:border-[#C6484A] focus:outline-none"
      >
        {options.map(o => <option key={o} value={o}>{o}</option>)}
      </select>
    </label>
  );
}

function AddStaple({ onAdd }) {
  const [v, setV] = useState("");
  function add() { if (v.trim()) { onAdd(v.trim()); setV(""); } }
  return (
    <div className="mt-4 flex gap-2">
      <input value={v} onChange={e => setV(e.target.value)}
        onKeyDown={e => { if (e.key === "Enter") add(); }}
        placeholder="Add a staple"
        className="flex-1 rounded-sm border border-[#DAD4C1] bg-white/60 px-2.5 py-1.5 font-serif text-[15px] text-[#2B2A26] placeholder:text-[#B0AA98] focus:border-[#C6484A] focus:outline-none" />
      <button onClick={add}
        className="rounded-sm border border-[#DAD4C1] px-3 font-mono text-[10px] uppercase tracking-[0.12em] text-[#6B6555] hover:border-[#C6484A]">
        Add
      </button>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<RecipeBox />);
</script>
</body>
</html>
