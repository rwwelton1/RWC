function bind(){
  var els,i,el;

  // Profile panel — name and badge
  el=document.getElementById("b-profile"); if(el) el.addEventListener("click",function(){
    // Clear the badge list first so the sheet shows "loading" rather than a
    // stale one; badges may well have been earned since it was last opened.
    ST.profileOpen=true; ST.myBadges=undefined; draw(); loadMyBadges();
  });
  el=document.getElementById("b-pf-close"); if(el) el.addEventListener("click",function(){
    ST.profileOpen=false; draw();
  });
  el=document.getElementById("pf-backdrop"); if(el) el.addEventListener("click",function(){
    ST.profileOpen=false; draw();
  });
  el=document.getElementById("pf-name"); if(el) el.addEventListener("change",function(){
    // Saved on blur rather than per keystroke — draw() replaces the field, which
    // would drop the keyboard mid-word.
    setMyName(this.value);
  });
  els=document.querySelectorAll(".pf-badge");
  for(i=0;i<els.length;i++) els[i].addEventListener("click",function(){
    setMyBadge(this.getAttribute("data-badge"));
  });


  els=document.querySelectorAll(".ptab");
  for(i=0;i<els.length;i++) els[i].addEventListener("click",function(){
    var prev=ST.page;
    ST.page=this.getAttribute("data-page");
    if(prev==="live"&&ST.page!=="live") stopLiveRefresh();
    draw();
  });

  els=document.querySelectorAll(".user-btn[data-user]");
  for(i=0;i<els.length;i++) els[i].addEventListener("click",function(){
    ST.user=this.getAttribute("data-user");
    var pk=ST.picks[ST.user];
    draftPicks=pk&&pk.picks?pk.picks.slice():[];
    draw();
  });

  el=document.getElementById("b-switch"); if(el) el.addEventListener("click",function(){ST.user=null;draftPicks=[];draw();});

  el=document.getElementById("b-event-recap"); if(el) el.addEventListener("click",function(){ shareEventRecap("prose"); });
  el=document.getElementById("b-event-recap-card"); if(el) el.addEventListener("click",function(){ shareEventRecap("card"); });

  el=document.getElementById("b-admin"); if(el) el.addEventListener("click",function(){
    if(ST.admin){ST.admin=false;if(ST.page==="admin")ST.page="picks";draw();return;}
    // Admin by Google identity (group owner/admin or master) — no password.
    if(isGroupAdminByUid()){ST.admin=true;ST.page="admin";draw();toast("&#9889; Admin mode on");}
    else toast("Only the group admin can do that");
  });

  el=document.getElementById("b-lock"); if(el) el.addEventListener("click",function(){
    ST.locked=!ST.locked;
    if(DB) DB.ref(BASE+"/meta/locked").set(ST.locked);
    toast(ST.locked?"&#128274; Picks locked":"&#9998; Picks opened");
    draw();
  });

  el=document.getElementById("b-archivets"); if(el) el.addEventListener("change",function(){
    var ts = this.value ? new Date(this.value).getTime() : null;
    ST.archiveTs = ts; ST.archivePinned = !!ts;
    if(DB){
      DB.ref(BASE+"/meta/archiveTs").set(ts||null);
      DB.ref(BASE+"/meta/archivePinned").set(!!ts);
    }
    toast(ts?"\u{1F4E6} Archive time set":"Archive time cleared");
    maybeAutoArchive(); draw();
  });
  el=document.getElementById("b-archive-reset"); if(el) el.addEventListener("click",function(){
    ST.archiveTs=null; ST.archivePinned=false;
    if(DB){
      DB.ref(BASE+"/meta/archiveTs").set(null);
      DB.ref(BASE+"/meta/archivePinned").set(false);
    }
    toast("Archive time follows the finalize time"); draw();
  });

  el=document.getElementById("b-finalts"); if(el) el.addEventListener("change",function(){
    var ts = this.value ? new Date(this.value).getTime() : null;
    ST.finalizeTs = ts;
    if(DB) DB.ref(BASE+"/meta/finalizeTs").set(ts||null);
    toast(ts?"\u{1F3C6} Auto-finalize set":"Auto-finalize cleared");
    maybeAutoFinalize();
    draw();
  });

  el=document.getElementById("b-lockts"); if(el) el.addEventListener("change",function(){
    var ts = this.value ? new Date(this.value).getTime() : null;
    ST.lockTs = ts;
    if(DB) DB.ref(BASE+"/meta/lockTs").set(ts||null);
    toast(ts?"&#9200; Auto-lock set":"Auto-lock cleared");
    draw();
  });

  el=document.getElementById("b-submit"); if(el) el.addEventListener("click",showPickConfirmation);

  el=document.getElementById("b-filter"); if(el) el.addEventListener("click",function(){
    ST.filterAffordable=!ST.filterAffordable;draw();
  });

    el=document.getElementById("search-inp"); if(el){
    el.addEventListener("input",function(){refreshGolferList(this.value);});
    el.addEventListener("search",function(){refreshGolferList(this.value);});
    el.value=ST.search;
  }
  el=document.getElementById("b-search-clear"); if(el) el.addEventListener("click",function(){
    ST.search="";
    var inp=document.getElementById("search-inp");
    if(inp){inp.value="";inp.focus();}
    refreshGolferList("");
  });


  els=document.querySelectorAll(".golfer-row[data-pick]");
  for(i=0;i<els.length;i++) els[i].addEventListener("click",function(){togglePick(this.getAttribute("data-pick"));});

  // Slot card taps
  els=document.querySelectorAll(".slot-card[data-slot]");
  for(i=0;i<els.length;i++) els[i].addEventListener("click",function(e){
    if(e.target.hasAttribute&&e.target.hasAttribute("data-slot-remove")) return;
    var s=parseInt(this.getAttribute("data-slot"));
    if(ST.activeSlot===s){ST.activeSlot=null;ST.showPicker=false;}
    else{ST.activeSlot=s;ST.showPicker=true;ST.search="";}
    draw();
  });

  // Slot remove buttons
  els=document.querySelectorAll(".slot-remove[data-slot-remove]");
  for(i=0;i<els.length;i++) els[i].addEventListener("click",function(e){
    e.stopPropagation();
    var s=parseInt(this.getAttribute("data-slot-remove"));
    var _rtype=TOURNAMENT.type||"salary";
    if(s>=0&&s<draftPicks.length){
      if(_rtype==="confidence") draftPicks.splice(s,1);
      else draftPicks[s]="";
    }
    ST.activeSlot=null;ST.showPicker=false;
    draw();
  });

  // Roster row taps (re-pick)
  els=document.querySelectorAll(".roster-body .golfer-row[data-slot]");
  for(i=0;i<els.length;i++) els[i].addEventListener("click",function(){
    ST.activeSlot=parseInt(this.getAttribute("data-slot"));
    ST.showPicker=true;ST.search="";
    draw();
  });

  el=document.getElementById("b-picker-close"); if(el) el.addEventListener("click",function(){
    ST.activeSlot=null;ST.showPicker=false;draw();
  });

  el=document.getElementById("b-finalize"); if(el) el.addEventListener("click",finalizePool);
  el=document.getElementById("b-edit-tournament"); if(el) el.addEventListener("click",openTournamentEditor);
  el=document.getElementById("b-import-field"); if(el) el.addEventListener("click",importPlayerField);
  el=document.getElementById("b-recalc-field"); if(el) el.addEventListener("click",recalcField);


  // Admin score inputs
  els=document.querySelectorAll(".score-inp[data-golfer]");
  for(i=0;i<els.length;i++) els[i].addEventListener("change",function(){saveScore(this.getAttribute("data-golfer"),this.value);});

  els=document.querySelectorAll(".cut-btn[data-cut]");
  for(i=0;i<els.length;i++) els[i].addEventListener("click",function(){toggleCut(this.getAttribute("data-cut"));});

  // Wire per-round score inputs (daily pool)
  els=document.querySelectorAll(".round-inp[data-golfer]");
  for(i=0;i<els.length;i++) els[i].addEventListener("change",function(){
    saveRoundScore(this.getAttribute("data-golfer"),this.getAttribute("data-round"),this.value);
  });
}

// ── Admin actions ─────────────────────────────────────
function saveRoundScore(name,roundKey,val){
  var sc=ST.scores[name]||{};
  if(!sc.rounds) sc.rounds={};
  if(val===""||val===null){ delete sc.rounds[roundKey]; }
  else{ sc.rounds[roundKey]=Number(val); }
  // Auto-update total score from rounds
  var total=0;
  Object.keys(sc.rounds).forEach(function(k){ total+=Number(sc.rounds[k])||0; });;
  sc.score=total;
  ST.scores[name]=sc;
  if(DB) DB.ref(BASE+"/scores/"+ukey(name)).set(sc);
}

function saveScore(name,val){
  var sc=ST.scores[name]||{};
  if(val===""||val===null){delete sc.score;}
  else{sc.score=Number(val);}
  ST.scores[name]=sc;
  if(DB) DB.ref(BASE+"/scores/"+ukey(name)).set(sc);
}

function toggleCut(name){
  var sc=ST.scores[name]||{};
  sc.cut=!sc.cut;
  if(sc.cut) delete sc.score;
  ST.scores[name]=sc;
  if(DB) DB.ref(BASE+"/scores/"+ukey(name)).set(sc,function(){draw();});
  else draw();
}

// ── Firebase load ─────────────────────────────────────
function loadData(){
  if(!DB){draw();return;}
  // Resolve the signed-in Google identity first so admin-by-uid and writes work.
  var _started=false;
  function _boot(){
    if(_started) return; _started=true;
    // Load tournament config + golfer field FIRST, then start pool subscriptions
    loadTournamentConfig(function(){
      loadGolferField(function(){
        loadGroup(); // now start group/pool subscriptions
      });
    });
  }
  if(AUTH){
    AUTH.onAuthStateChanged(function(user){ MY_UID = user?user.uid:null; _boot(); });
    setTimeout(_boot, 2500);   // safety net
  } else { _boot(); }

  function loadGroup(){
    if(!GROUP_ID){ loadUserDir(function(){ loadPool(); }); return; }
    DB.ref("groups/"+GROUP_ID).once("value",function(sn){
      var g=sn.val()||{};
      if(g.players&&g.players.length) PARTS=g.players;
      GROUP_OWNER_UID=(g&&g.ownerUid)||null;
      GROUP_ADMIN_UIDS={};
      var _au=(g&&g.adminUids)||{};
      if(Array.isArray(_au)) _au.forEach(function(uid){ if(uid) GROUP_ADMIN_UIDS[uid]=true; });
      else Object.keys(_au).forEach(function(k){ var v=_au[k]; GROUP_ADMIN_UIDS[(v===true||v===undefined)?k:v]=true; });
      if(isGroupAdminByUid()){ ST.admin=true; }
      loadUserDir(function(){ loadPool(); });
    },function(){ loadUserDir(function(){ loadPool(); }); });
  }

  function loadPool(){
    // Re-draw once a minute so the scheduled auto-lock flips picks closed at lockTs without
    // needing a manual refresh (cheap; only redraws, no network).
    var _lastLockState=null;
    setInterval(function(){
      var now=isLocked();
      if(_lastLockState!==null && now!==_lastLockState) draw();
      _lastLockState=now;
      // Same tick handles the scheduled finalize, so it fires on its own rather
      // than waiting for someone to open the admin tab.
      try{ maybeAutoFinalize(); }catch(e){}
      try{ maybeAutoArchive(); }catch(e){}
    }, 60*1000);
    DB.ref("globalSettings/masterPw").on("value",function(sn){if(sn.val())MASTER_PW=sn.val();});
    DB.ref(BASE+"/meta/locked").on("value",function(sn){
      ST.locked=!!sn.val();
      draw();
    });
    DB.ref(BASE+"/meta/lockTs").on("value",function(sn){
      ST.lockTs=sn.val()||null;
      draw();
    });
    DB.ref(BASE+"/meta/finalizeTs").on("value",function(sn){
      ST.finalizeTs=sn.val()||null;
      maybeAutoFinalize();
      draw();
    });
    // Each of these can be the piece that makes archiving due, so check on arrival
    // rather than waiting for the next minute tick.
    DB.ref(BASE+"/meta/archiveTs").on("value",function(sn){ ST.archiveTs=sn.val()||null; maybeAutoArchive(); draw(); });
    DB.ref(BASE+"/meta/archivePinned").on("value",function(sn){ ST.archivePinned=!!sn.val(); maybeAutoArchive(); draw(); });
    DB.ref(BASE+"/meta/archivedAt").on("value",function(sn){ ST.archivedAt=sn.val()||null; draw(); });
    DB.ref(BASE+"/meta/finalizedAt").on("value",function(sn){
      ST.finalized=!!sn.val();
      maybeAutoArchive();          // finalising can make archiving immediately due
      draw();
    });
    DB.ref("groups/"+GROUP_ID+"/data/pgatour/results").on("value",function(sn){
      var r=sn.val();
      ST.finalizedResult=r||null;
      if(r) ST.finalized=true;      // a recorded result IS the finalized state
      draw();
    });
    // Series: past-event archive (top-3 per completed tournament).
    DB.ref(BASE+"/events").on("value",function(sn){
      _pastEvents=sn.val()||{};
      if(ST.page==="leaderboard") draw();
    });
    DB.ref(BASE+"/picks").on("value",function(sn){
      ST.picks=sn.val()||{};setTimeout(syncPlayerScoresToGroup,800);
      // If user already selected, sync draft with saved picks
      if(ST.user&&!draftPicks.length){
        var saved=ST.picks[ST.user];
        if(saved&&saved.picks) draftPicks=saved.picks.slice();
      }
      draw();
    });
    DB.ref(BASE+"/scores").on("value",function(sn){
      var raw=sn.val()||{};
      ST.scores={};
      ST._rawScores=raw; // keep raw keyed by ukey for fallback lookup
      for(var k in raw){
        // Match by ukey against GOLFERS if loaded
        var matched=false;
        for(var i=0;i<GOLFERS.length;i++){
          if(ukey(GOLFERS[i].name)===k){ST.scores[GOLFERS[i].name]=raw[k];matched=true;break;}
        }
        // Fallback: also store by raw key so cut flags work before GOLFERS loads
        if(!matched) ST.scores[k]=raw[k];
      }
      draw();
    });
    // Load cached live scores from Firebase (written by whoever last refreshed)
    // Archived event for this pool: if one exists, it IS the truth.
    DB.ref("groups/"+GROUP_ID+"/data/pgatour/events").on("value",function(sn){
      var all=sn.val()||{};
      var latest=null;
      Object.keys(all).forEach(function(k){
        var e=all[k]||{};
        if(!e.scores && !e.golfers) return;                    // podium-only, older shape
        if(!latest || (e.endedAt||0)>(latest.endedAt||0)) latest=e;
      });
      ST.archive=latest||null;
      if(latest && latest.golfers){
        // Serve the frozen golfer scores instead of the live feed.
        liveScores={};
        Object.keys(latest.golfers).forEach(function(k){ liveScores[k]=latest.golfers[k]; });
        ST.finalized=true;
        stopLiveRefresh();
      }
      draw();
    });

    DB.ref(BASE+"/livescores").once("value",function(sn){
      var raw=sn.val()||{};
      if(Object.keys(raw).length){
        for(var _k in raw){
          liveScores[_k]=raw[_k];
          // Ensure rounds is always an object
          if(!liveScores[_k].rounds) liveScores[_k].rounds={};
        }
        // Update localStorage with Firebase data (may be more recent than cache)
        if(!isFrozen()){
          try{ localStorage.setItem("sc_livescores_"+(GROUP_ID||""), JSON.stringify(liveScores)); }catch(e){}
        }
        _liveLastFetch=Date.now(); // mark as "have data" so leaderboard shows scores
        if(ST.page==="live") renderLiveInto();
        else draw();
      }
    });
    draw();
  }

  loadGroup();
}

loadData();
// Pull-to-refresh
(function(){
  var startY=0,pulling=false;
  document.addEventListener("touchstart",function(e){
    startY=e.touches[0].clientY;
    pulling=window.scrollY===0;
  },{passive:true});
  document.addEventListener("touchend",function(e){
    if(!pulling)return;
    var dy=e.changedTouches[0].clientY-startY;
    if(dy>60&&ST.page==="live"){
      fetchLiveScores();
    }
    pulling=false;
  },{passive:true});
})();
